    hearts: 3,
    runSpeed: 315,
    jumpPower: 760,
    gravity: 2200,
    maxFallSpeed: 1150,
    coyoteTime: 0.11,
    jumpBuffer: 0.14,
    startLevel: 1
  };

  function readNum(value, fallback) {
    var n = Number(value);
    return isFinite(n) ? n : fallback;
  }
  function mergeRules(rules, def) {
    var out = {};
    var key;
    for (key in def) out[key] = def[key];
    for (key in rules) {
      if (key in def) out[key] = readNum(rules[key], def[key]);
    }
    out.hearts = Math.max(1, Math.min(9, Math.round(out.hearts)));
    out.runSpeed = Math.max(160, Math.min(520, out.runSpeed));
    out.jumpPower = Math.max(440, Math.min(1050, out.jumpPower));
    out.gravity = Math.max(900, Math.min(3600, out.gravity));
    out.maxFallSpeed = Math.max(500, Math.min(1800, out.maxFallSpeed));
    out.coyoteTime = Math.max(0, Math.min(0.3, out.coyoteTime));
    out.jumpBuffer = Math.max(0.03, Math.min(0.3, out.jumpBuffer));
    out.startLevel = Math.max(1, Math.min(4, Math.round(out.startLevel)));
    return out;
  }
  var R = mergeRules(GAME.rules || {}, DEFAULTS);

  var canvas = document.getElementById('game');
  if (!canvas) {
    canvas = document.createElement('canvas');
    canvas.id = 'game';
    (document.body || document.documentElement).appendChild(canvas);

  function buildScenery(def) {
    var rng = mulberry32(def.seed * 7919 + 13);
    var grounds = def.ground.slice().sort(function (a, b) { return a.x - b.x; });
    var gaps = [];
    var i, j;
    for (i = 1; i < grounds.length; i++) {
      var gapStart = grounds[i - 1].x + grounds[i - 1].w;
      var gapEnd = grounds[i].x;
      if (gapEnd > gapStart + 2) gaps.push({ x: gapStart, w: gapEnd - gapStart });
    }
    var decor = [];
    var dirt = [];
    var spikeList = def.spikes || [];
    var mushList = def.mushrooms || [];
    for (i = 0; i < grounds.length; i++) {
      var seg = grounds[i];
      var a = Math.max(seg.x + 24, 8);
      var b = Math.min(seg.x + seg.w - 24, def.width - 8);
      if (b <= a) continue;
      var n = Math.max(1, Math.floor((b - a) / 68));
      for (j = 0; j < n; j++) {
        var dx = a + ((j + 0.15 + rng() * 0.7) / n) * (b - a);
        var dy = GROUND_Y + 26 + rng() * 84;
        dirt.push({
          x: dx, y: dy,
          w: 5 + rng() * 22,
          h: 2 + rng() * 5,
          a: 0.08 + rng() * 0.14,
          tone: rng()
        });
      }
      var x = a + 28 + rng() * 54;
      while (x < b - 16) {
        var typeRoll = rng();
        var type = typeRoll < 0.38 ? 'grass' :
          typeRoll < 0.64 ? 'flower' :
          typeRoll < 0.78 ? 'fern' :
          typeRoll < 0.89 ? 'mushroom' : 'rock';
        var tooCloseSpike = false;
        for (j = 0; j < spikeList.length; j++) {
          if (Math.abs(x - spikeList[j].x) < spikeList[j].w / 2 + 34) { tooCloseSpike = true; break; }
        }
        for (j = 0; j < mushList.length; j++) {
          if (Math.abs(x - mushList[j].x) < 42) { tooCloseSpike = true; break; }
        }
        if (def.checkpoint && Math.abs(x - def.checkpoint.x) < 48) tooCloseSpike = true;
        var nearStart = Math.abs(x - def.startX) < 80;
        var nearSign = Math.abs(x - (def.startX + 152)) < 86;
        var nearGoal = Math.abs(x - def.goalX) < 92;
        if (!tooCloseSpike && !nearStart && !nearSign && !nearGoal && x > 20) {
          decor.push({
            type: type, x: x, y: GROUND_Y,
            scale: 0.72 + rng() * 0.7,
            phase: rng() * TAU,
            color: Math.floor(rng() * 4)

        }
        x += 48 + rng() * 96;
      }

        phase: rng() * TAU,
        speed: 0.3 + rng() * 0.7
      });

        size: 2.5 + rng() * 4,
        phase: rng() * TAU,
        speed: 0.25 + rng() * 0.5

  function surfaceAt(x, prevBottom, newBottom) {
    var best = null;
    var bestPlat = null;
    var half = PHYS.w / 2 - 2;
    var i;
    for (i = 0; i < level.ground.length; i++) {
      var g = level.ground[i];
      if (x + half < g.x || x - half > g.x + g.w) continue;
      if (prevBottom <= GROUND_Y + 3 && newBottom >= GROUND_Y) {
        if (best === null || GROUND_Y < best) { best = GROUND_Y; bestPlat = null; }
      }
    }
    for (i = 0; i < platforms.length; i++) {
      var p = platforms[i];
      if (x + half < p.x + 1 || x - half > p.x + p.w - 1) continue;
      var prevPlatY = p.y - (p.dy || 0);
      if (prevBottom <= Math.max(p.y, prevPlatY) + 5 && newBottom >= p.y - 2) {

      }
    }

    return best;

  /* ============================================================
   * 7. UPDATE
   * ============================================================ */
  function updateParticles(dt) {
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.age += dt;
      if (p.age >= p.life) { particles.splice(i, 1); continue; }
      p.vy += (p.gravity || 0) * dt;
      if (p.drag) {
        var d = Math.exp(-p.drag * dt);
        p.vx *= d;
        p.vy *= d;
      }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot += (p.vr || 0) * dt;
    }
    for (var j = afterimages.length - 1; j >= 0; j--) {
      afterimages[j].alpha -= dt * 3.4;
      if (afterimages[j].alpha <= 0) afterimages.splice(j, 1);
    }
  }
  function updateFloaters(dt) {
    for (var i = floaters.length - 1; i >= 0; i--) {
      var f = floaters[i];
      f.age += dt;
      f.y -= 36 * dt;
      if (f.age >= f.life) floaters.splice(i, 1);
    }
  }

  function update(dt) {
    animTime += dt;
    if (restartGuard > 0) restartGuard = Math.max(0, restartGuard - dt);
    if (shake > 0) shake = Math.max(0, shake - dt);
    if (flash > 0) flash = Math.max(0, flash - dt);
    if (introTimer > 0) introTimer = Math.max(0, introTimer - dt);
    if (hintTimer > 0) hintTimer = Math.max(0, hintTimer - dt);
    if (comboTimer > 0) {
      comboTimer = Math.max(0, comboTimer - dt);
      if (comboTimer <= 0) comboCount = 0;
    }
    updateParticles(dt);
    updateFloaters(dt);
    updateCamera(dt);

    if (phase === 'title') {
      hero.blink -= dt;
      if (hero.blink < -0.12) hero.blink = 2.5 + Math.random() * 4;
      return;
    }
    if (phase === 'won' || phase === 'lost') return;

    if (clearing) {
      clearTimer -= dt;
      if (clearTimer <= 0) {
        if (levelIndex < LEVELS.length - 1) {
          nextLevel();
        } else {
          finishRun();
        }
      }
      return;
    }

    if (dying) {
      dyingTimer -= dt;
      hero.vy = Math.min(hero.vy + R.gravity * 0.65 * dt, R.maxFallSpeed);
      hero.x += hero.vx * dt;
      hero.y += hero.vy * dt;
      if (dyingTimer <= 0) {
        if (hearts <= 0) loseRun();
        else respawnHero();
      }
      return;
    }

    if (phase !== 'playing') return;

    levelTime += dt;
    totalTime += dt;
    if (invuln > 0) invuln = Math.max(0, invuln - dt);
    if (jumpBuffer > 0) jumpBuffer = Math.max(0, jumpBuffer - dt);
    if (hero.spinTimer > 0) hero.spinTimer = Math.max(0, hero.spinTimer - dt);
    if (hero.dashCooldown > 0) hero.dashCooldown = Math.max(0, hero.dashCooldown - dt);

    // Update moving platforms
    for (var pi0 = 0; pi0 < platforms.length; pi0++) {
      var pl = platforms[pi0];
      if (pl.rangeX || pl.rangeY) {
        var prevPx = pl.x;
        var prevPy = pl.y;
        pl.x = pl.baseX + Math.sin(animTime * pl.speed + pl.phase) * pl.rangeX;
        pl.y = pl.baseY + Math.cos(animTime * pl.speed + pl.phase) * pl.rangeY;
        pl.dx = pl.x - prevPx;
        pl.dy = pl.y - prevPy;
      } else {
        pl.dx = 0;
        pl.dy = 0;
      }

    for (var mi = 0; mi < mushrooms.length; mi++) {
      if (mushrooms[mi].squash > 0) {

      if (keys['arrowright'] || keys['d'] || touchState.right) move += 1;

      }

    }

      } else if (hero.jumpsLeft > 0) {

    }

      hero.vx = hero.dir * (R.runSpeed * 2.15);
      hero.vy = Math.min(hero.vy, 0);
      if (Math.floor((hero.dashTimer * 60)) % 2 === 0) {
        afterimages.push({
          x: hero.x,
          y: hero.y + PHYS.h / 2,
          dir: hero.dir,
          run: hero.run,
          air: !hero.onGround,
          alpha: 0.52
        });
      }
    } else {
      var targetVx = move * R.runSpeed;
      var accel;
      if (hero.onGround) accel = move !== 0 ? 2800 : 3400;
      else accel = move !== 0 ? 1900 : 700;
      hero.vx = approach(hero.vx, targetVx, accel * dt);
      if (Math.abs(hero.vx) < 4 && move === 0) hero.vx = 0;
      if (move !== 0) hero.dir = move > 0 ? 1 : -1;

      if (!hero.onGround) hero.vy += R.gravity * dt;
      else hero.vy += R.gravity * 0.25 * dt;
      hero.vy = Math.min(hero.vy, R.maxFallSpeed);
    }

    var prevBottom = hero.y + PHYS.h / 2;
    hero.x += hero.vx * dt;
    hero.x = clamp(hero.x, PHYS.w / 2, level.width - PHYS.w / 2);
    hero.y += hero.vy * dt;
    var newBottom = hero.y + PHYS.h / 2;
    var wasGround = hero.onGround;
    var landing = null;
    if (hero.vy >= 0) {
      var surface = surfaceAt(hero.x, prevBottom, newBottom);
      if (surface !== null) {
        landing = surface;
        hero.y = surface - PHYS.h / 2;
        hero.vy = 0;
        hero.onGround = true;
        hero.coyote = R.coyoteTime;
        hero.jumpsLeft = 1;
        hero.spinTimer = 0;
        if (!wasGround) {
          var impact = clamp(prevBottom - hero.y + PHYS.h / 2, 0, 1000);
          if (impact > 2) spawnDust(hero.x, surface, impact > 80 ? 10 : 5, 'rgba(255,238,199,0.55)', impact > 80 ? 1 : 0.65);
          sfx.land();
        }
      }
    }
    if (landing === null) {
      hero.onGround = false;
      hero.ridingPlatform = null;
    }

    // Bouncy Mushrooms check
    for (var mIdx = 0; mIdx < mushrooms.length; mIdx++) {
      var m = mushrooms[mIdx];
      if (Math.abs(hero.x - m.x) <= m.w * 0.62 &&
          hero.vy >= -60 &&
          newBottom >= m.y - m.h - 4 &&
          prevBottom <= m.y + 8) {
        hero.y = m.y - m.h - PHYS.h / 2;
        hero.vy = m.bounceVy;
        hero.onGround = false;
        hero.ridingPlatform = null;
        hero.jumpsLeft = 1;
        hero.spinTimer = 0.45;
        m.squash = 1.0;
        sfx.bounce();
        spawnSparkles(m.x, m.y - m.h, 12, ['#ff8d70', '#ffe89e', '#ffffff']);
        addFloater(hero.x, hero.y - 40, '弹跳!', '#ffab82', 1.05);
        break;
      }
    }

    // Checkpoint check
    if (checkpoint && !checkpoint.reached) {
      if (Math.abs(hero.x - checkpoint.x) < 34 && Math.abs(hero.y - (checkpoint.y - PHYS.h / 2)) < 90) {
        checkpoint.reached = true;
        checkpoint.anim = 1.0;
        lastSafe.x = checkpoint.x;
        lastSafe.y = checkpoint.y - PHYS.h / 2;
        sfx.checkpoint();
        spawnSparkles(checkpoint.x, checkpoint.y - 42, 16, ['#8ef5a2', '#ffe680', '#ffffff']);
        addFloater(hero.x, hero.y - 42, '✓ 路标已保存!', '#98f7ab', 1.08);
      }
    }

    // Animations
    if (hero.onGround) {
      hero.run += dt * (2.5 + Math.abs(hero.vx) / R.runSpeed * 9.5);
    } else {
      hero.run += dt * 4;
    }
    hero.blink -= dt;
    if (hero.blink < -0.12) hero.blink = 2.8 + Math.random() * 4;

    // Keep a safe spot for respawning after a fall.
    saveTimer -= dt;
    if (saveTimer <= 0) {
      saveTimer = 0.18;
      if (hero.onGround && !hero.ridingPlatform && !nearSpike(hero.x, 66)) {
        lastSafe.x = hero.x;
        lastSafe.y = hero.y;
      }
    }

    if (hero.y - PHYS.h / 2 > VIEW_H + 80) {
      hurtHero();
      return;
    }

    // Goal flag: touch it to finish the level.
    if (hero.x > level.goalX - 28 && hero.x < level.goalX + 42 && hero.y + PHYS.h / 2 > 318) {
      startLevelClear();
      return;
    }

    // Patrolling Critters (Stomp or Hurt)
    var hb = heroBox();
    for (var cIdx = 0; cIdx < critters.length; cIdx++) {
      var cr2 = critters[cIdx];
      if (!cr2.alive) continue;
      var cb = {
        x1: cr2.x - cr2.r,
        x2: cr2.x + cr2.r,
        y1: cr2.y - cr2.r * 1.45,
        y2: cr2.y
      };
      if (rectsOverlap(hb, cb)) {
        var stomping = (hero.vy > 0 && prevBottom <= cr2.y - cr2.r * 0.55) || hero.dashTimer > 0;
        if (stomping) {
          cr2.alive = false;
          cr2.squashTimer = 0.45;
          hero.vy = -R.jumpPower * 0.82;
          hero.onGround = false;
          hero.jumpsLeft = 1;
          hero.spinTimer = 0.36;
          score += 3;
          crittersStomped++;
          comboCount++;
          comboTimer = 3.5;
          sfx.stomp();
          spawnSparkles(cr2.x, cr2.y - 14, 15, ['#ffe37d', '#ff964f', '#ffffff']);
          addFloater(hero.x, hero.y - 42, '+3 踩扁!', '#ffe066', 1.12);
          postState();
        } else if (invuln <= 0) {
          hurtHero();
          return;
        }
      }
    }

    // Spikes.
    if (invuln <= 0) {
      for (var si = 0; si < spikeRows.length; si++) {
        var sr = spikeRows[si];
        var sb = {
          x1: sr.x - sr.w / 2 + 5,
          x2: sr.x + sr.w / 2 - 5,
          y1: GROUND_Y - sr.h + 7,
          y2: GROUND_Y + 1
        };
        if (rectsOverlap(hb, sb)) { hurtHero(); return; }
      }
    }

    // Acorns & Golden Acorns.
    for (var pi = pickups.length - 1; pi >= 0; pi--) {
      var pk = pickups[pi];
      var dx = pk.x - hero.x;
      var dy = pk.y - hero.y;
      var rx = pk.gold ? 38 : 34;
      var ry = pk.gold ? 46 : 42;
      if ((dx * dx) / (rx * rx) + (dy * dy) / (ry * ry) <= 1) {
        pickups.splice(pi, 1);
        var pts = pk.gold ? 5 : 1;
        score += pts;
        if (pk.gold) goldenCollected++;
        comboCount++;
        comboTimer = 3.2;
        if (pk.gold) {
          spawnSparkles(pk.x, pk.y, 18, ['#ffe66d', '#fff9d6', '#ffae33', '#ffffff']);
          addFloater(hero.x, hero.y - 42, '+5 金橡果!', '#ffd84d', 1.18);
          sfx.goldCoin();
        } else {
          spawnSparkles(pk.x, pk.y, 10, ['#ffe49a', '#fff4c7', '#f3b45b']);
          addFloater(hero.x, hero.y - 38, '+1', '#fff4b8', 1.0);
          sfx.coin();
        }
        postState();
      }
    }
  }

  /* ============================================================
   * 8. LAYOUT
   * ============================================================ */
  function updateLayout() {
    var s = Math.min(cssW / VIEW_W, cssH / VIEW_H);
    var gw = VIEW_W * s;
    var gh = VIEW_H * s;
    var gx = (cssW - gw) / 2;
    var gy = (cssH - gh) / 2;
    var portrait = cssH > cssW * 1.08;
    var showTouch = true;
    var r = clamp(Math.min(cssW, cssH) * 0.062, 25, 38);
    var baseY;
    var leftEdge;
    if (portrait) {
      baseY = cssH - r - Math.max(18, cssH * 0.03);
      leftEdge = 16;
    } else {
      baseY = gy + gh - r - 16;
      leftEdge = gx + 18;
    }
    var rightEdge = portrait ? cssW - 16 : gx + gw - 18;
    var jumpR = r * 1.08;
    var dashR = r * 0.96;
    var jumpX = rightEdge - jumpR;
    var dashX = jumpX - jumpR - dashR - 12;
    var controls = [
      { action: 'left', x: leftEdge + r, y: baseY, r: r },
      { action: 'right', x: leftEdge + r * 3.15, y: baseY, r: r },
      { action: 'dash', x: dashX, y: baseY + 2, r: dashR },
      { action: 'jump', x: jumpX, y: baseY, r: jumpR }
    ];
    var hudScale = clamp(Math.min(cssW / 960, cssH / 540), 0.85, 1.22);
    var hudTop = portrait && gy > 80 ? 12 : gy + 10;
    var hudLeft = portrait ? 12 : gx + 14;
    var hudRight = portrait ? cssW - 12 : gx + gw - 14;
    var pillH = 38 * hudScale;
    var btnR = pillH / 2;
    var pause = {
      x: hudRight - pillH,
      y: hudTop,
      w: pillH,
      h: pillH,
      r: btnR
    };
    var mute = {
      x: pause.x - pillH - 6 * hudScale,
      y: hudTop,
      w: pillH,
      h: pillH,
      r: btnR
    };
    var acornW = 128 * hudScale;
    var acornRect = {
      x: mute.x - acornW - 8 * hudScale,
      y: hudTop,
      w: acornW,
      h: pillH
    };
    var levelW = Math.min(238 * hudScale, (hudRight - hudLeft) * 0.36);
    var levelRect = {
      x: hudLeft,
      y: hudTop,
      w: levelW,
      h: pillH
    };
    var progLeft = levelRect.x + levelRect.w + 10 * hudScale;
    var progRight = acornRect.x - 10 * hudScale;
    var progW = Math.max(120 * hudScale, progRight - progLeft);
    var progressRect = {
      x: (progLeft + progRight) / 2 - Math.min(progW, 270 * hudScale) / 2,
      y: hudTop,
      w: Math.min(progW, 270 * hudScale),
      h: pillH
    };
    layout = {
      game: { x: gx, y: gy, w: gw, h: gh },
      scale: s,
      portrait: portrait,
      showTouch: showTouch,
      controls: controls,
      pause: pause,
      mute: mute,
      acornRect: acornRect,
      levelRect: levelRect,
      progressRect: progressRect,
      hudTop: hudTop,
      hudLeft: hudLeft,
      hudRight: hudRight,
      hudScale: hudScale
    };
  }

  /* ============================================================
   * 9. INPUT
   * ============================================================ */
  var JUMP_KEYS = { ' ': 1, 'spacebar': 1, 'arrowup': 1, 'w': 1 };
  var DASH_KEYS = { 'shift': 1, 'k': 1, 'x': 1 };

  document.addEventListener('keydown', function (e) {
    var lower = (e.key || '').toLowerCase();
    if (lower === 'arrowup' || lower === 'arrowdown' || lower === 'arrowleft' ||
        lower === 'arrowright' || lower === ' ' || lower === 'spacebar') {
      e.preventDefault();
    }
    ensureAudio();

    if (lower === 'm') {
      muted = !muted;
      if (!muted) sfx.click();
      return;
    }
    if (e.metaKey || e.ctrlKey || e.altKey) return;

    if (paused) {
      if (lower === 'p' || lower === 'escape' || lower === ' ' || lower === 'enter') {
        paused = false;
        sfx.click();
      }
      return;
    }

    if (lower === 'p' || lower === 'escape') {
      if (phase === 'playing' && !clearing) {
        paused = !paused;
        sfx.click();
      }
      return;
    }

    if (phase === 'title') {
      beginNewRun();
      return;
    }
    if (phase === 'won') {
      if (restartGuard <= 0) beginNewRun();
      return;
    }
    if (phase === 'lost') {
      if (restartGuard <= 0) retryCurrentLevel();
      return;
    }

    if (phase === 'playing') {
      if (lower === 'r' && !clearing && !dying) {
        score = levelStartScore;
        setupLevel(levelIndex);
        phase = 'playing';
        sfx.click();
        return;
      }
      if (clearing || dying) return;
      if (lower === 'arrowleft' || lower === 'a') keys['arrowleft'] = true;
      if (lower === 'arrowright' || lower === 'd') keys['arrowright'] = true;
      if (DASH_KEYS[lower] && !e.repeat) {
        triggerDash();
      }
      if (JUMP_KEYS[lower]) {
        keys[lower] = true;
        if (!e.repeat) {
          jumpBuffer = R.jumpBuffer;
          if (hero.onGround) ensureAudio();
        }
      }
    }
  });

  document.addEventListener('keyup', function (e) {
    var lower = (e.key || '').toLowerCase();
    if (lower === 'arrowleft' || lower === 'a') keys['arrowleft'] = false;
    if (lower === 'arrowright' || lower === 'd') keys['arrowright'] = false;
    if (JUMP_KEYS[lower]) {
      keys[lower] = false;
      if (!jumpHeld()) cutJump();
    }
  });

  function pointerPos(e) {
    var rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }
  function hitButton(x, y) {
    for (var i = 0; i < layout.controls.length; i++) {
      var c = layout.controls[i];
      var dx = x - c.x;
      var dy = y - c.y;
      if (dx * dx + dy * dy <= (c.r + 8) * (c.r + 8)) {
        return c.action;
      }
    }
    return null;
  }
  function syncTouchState() {
    var left = false, right = false, jump = false, dash = false;
    for (var id in pointerActions) {
      if (pointerActions[id] === 'left') left = true;
      else if (pointerActions[id] === 'right') right = true;
      else if (pointerActions[id] === 'jump') jump = true;
      else if (pointerActions[id] === 'dash') dash = true;
    }
    if (touchState.jump && !jump) cutJump();
    touchState.left = left;
    touchState.right = right;
    touchState.jump = jump;
    touchState.dash = dash;
  }
  function inPauseButton(x, y) {
    var p = layout.pause;
    return x >= p.x && x <= p.x + p.w && y >= p.y && y <= p.y + p.h;
  }
  function inMuteButton(x, y) {
    var m = layout.mute;
    return m && x >= m.x && x <= m.x + m.w && y >= m.y && y <= m.y + m.h;
  }
  function resetInputs() {
    keys = Object.create(null);
    pointerActions = Object.create(null);
    touchState.left = touchState.right = touchState.jump = touchState.dash = false;
  }

  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  canvas.addEventListener('pointerdown', function (e) {
    ensureAudio();
    if (canvas.focus) canvas.focus();
    e.preventDefault();
    var pt = pointerPos(e);

    if (phase === 'title') {
      beginNewRun();
      return;
    }
    if (phase === 'won') {
      if (restartGuard <= 0) beginNewRun();
      return;
    }
    if (phase === 'lost') {
      if (restartGuard <= 0) retryCurrentLevel();
      return;
    }
    if (inMuteButton(pt.x, pt.y)) {
      muted = !muted;
      if (!muted) sfx.click();
      return;
    }
    if (paused) {
      paused = false;
      sfx.click();
      return;
    }
    if (phase !== 'playing' || clearing || dying) return;

    if (inPauseButton(pt.x, pt.y)) {
      paused = true;
      resetInputs();
      sfx.click();
      return;
    }

    var action = hitButton(pt.x, pt.y);
    if (action) {
      pointerActions[e.pointerId] = action;
      syncTouchState();
      if (action === 'jump') {
        jumpBuffer = R.jumpBuffer;
      } else if (action === 'dash') {
        triggerDash();
      }
      if (canvas.setPointerCapture) {
        try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
      }
      return;
    }
    // Tapping the right play area is a generous backup jump control on touch devices.
    if (isTouchDevice() && pt.y >= layout.game.y + 54 && pt.x > cssW * 0.52) {
      jumpBuffer = R.jumpBuffer;
      touchState.jump = true;
      pointerActions[e.pointerId] = 'jump';
      if (canvas.setPointerCapture) {
        try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
      }
    }
  }, { passive: false });

  canvas.addEventListener('pointermove', function (e) {
    if (pointerActions[e.pointerId] === undefined) return;
    if (phase !== 'playing' || clearing || dying) return;
    var pt = pointerPos(e);
    var action = hitButton(pt.x, pt.y);
    if (action && pointerActions[e.pointerId] !== action) {
      pointerActions[e.pointerId] = action;
      if (action === 'jump') jumpBuffer = R.jumpBuffer;
      else if (action === 'dash') triggerDash();
      syncTouchState();
    }
  }, { passive: true });

  function releasePointer(e) {
    if (pointerActions[e.pointerId] === undefined) return;
    delete pointerActions[e.pointerId];
    syncTouchState();
  }
  canvas.addEventListener('pointerup', releasePointer);
  canvas.addEventListener('pointercancel', releasePointer);
  window.addEventListener('pointerup', releasePointer);
  window.addEventListener('pointercancel', releasePointer);

  window.addEventListener('blur', function () {
    resetInputs();
    if (phase === 'playing' && !clearing) paused = true;
  });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      resetInputs();
      if (phase === 'playing' && !clearing) paused = true;
    }
  });

  /* ============================================================
   * 10. CHARACTER + PROP PAINTING
   * ============================================================ */
  function drawCharacter(g, key, size) {
    if (key === 'hero') {
      g.save();
      g.translate(0, size * 0.42);
      paintFox(g, size * 0.9, {
        t: 0.8, moving: false, air: false, blink: 0, idle: true, happy: true
      });
      g.restore();
    } else if (key === 'enemy') {
      g.save();
      g.translate(0, size * 0.34);
      drawSpikeRow(g, 0, 0, size * 0.82, 3, 86, THEMES[0], true);
      g.restore();
    } else if (key === 'pickup') {
      g.save();
      g.rotate(-0.12);
      paintAcorn(g, 0, 0, size * 0.55, 0.5);
      g.restore();
    } else if (key === 'flag') {
      g.save();
      var fh = size * 0.82;
      var top = -fh * 0.5;
      var base = fh * 0.44;
      g.strokeStyle = '#4d3324';
      g.lineWidth = size * 0.045;
      g.lineCap = 'round';
      g.beginPath();
      g.moveTo(-size * 0.16, base);
      g.lineTo(-size * 0.16, top);
      g.stroke();
      g.strokeStyle = '#c8945b';
      g.lineWidth = size * 0.022;
      g.beginPath();
      g.moveTo(-size * 0.168, base);
      g.lineTo(-size * 0.168, top + 2);
      g.stroke();
      g.fillStyle = '#f6d36e';
      g.strokeStyle = '#5a3c26';
      g.lineWidth = size * 0.014;
      g.beginPath();
      g.arc(-size * 0.16, top - 2, size * 0.033, 0, TAU);
      g.fill();
      g.stroke();
      var wave = Math.sin(animTime * 4.4) * size * 0.014;
      var flagLeft = -size * 0.14;
      var flagRight = size * 0.31;
      var flagTop = top + size * 0.075;
      g.beginPath();
      g.moveTo(flagLeft, flagTop);
      g.bezierCurveTo(flagLeft + size * 0.14, flagTop - size * 0.045 + wave,
        flagRight - size * 0.08, flagTop + size * 0.055
          + wave, flagRight, flagTop + size * 0.05 + wave);
      g.lineTo(flagRight - size * 0.025, flagTop + size * 0.25 + wave);
      g.bezierCurveTo(flagRight - size * 0.13, flagTop + size * 0.21,
        flagLeft + size * 0.1, flagTop + size * 0.24 - wave, flagLeft,
        flagTop + size * 0.255);
      g.closePath();
      var fg = g.createLinearGradient(flagLeft, flagTop, flagRight, flagTop + size * 0.25);
      fg.addColorStop(0, '#de6044');
      fg.addColorStop(1, '#b84337');
      g.fillStyle = fg;
      g.fill();
      g.strokeStyle = '#5a3225';
      g.lineWidth = size * 0.018;
      g.stroke();
      g.fillStyle = '#ffedc0';
      g.beginPath();
      g.ellipse(-size * 0.005, flagTop + size * 0.145, size * 0.04, size * 0.032, 0, 0, TAU);
      g.fill();
      for (var toe = 0; toe < 3; toe++) {
        g.beginPath();
        g.ellipse(-size * 0.045 + toe * size * 0.04, flagTop + size * 0.098,
          size * 0.016, size * 0.022, 0, 0, TAU);
        g.fill();
      }
      g.restore();
    }
  }

  function paintFox(g, size, p) {
    p = p || {};
    var s = size / 100;
    g.save();
    g.scale(s, s);
    g.lineJoin = 'round';
    g.lineCap = 'round';

    var dark = '#3d281e';
    var body = '#e86f3e';
    var bodyDark = '#c65130';
    var cream = '#ffe7c2';
    var creamDeep = '#f6cf9d';
    var ear = '#ef9a86';
    var scarf = '#c84a3b';
    var scarfDark = '#91352c';
    var t = p.t || 0;
    var run = p.run || 0;
    var moving = !!p.moving && !p.air;
    var air = !!p.air;
    var bob = air ? 0 : (moving ? -Math.abs(Math.sin(run * 2)) * 1.2 : Math.sin(t * 2) * 0.55);
    var lean = air ? (p.vy && p.vy < 0 ? -0.06 : 0.08) : (moving ? 0.035 : 0);
    var step = moving ? Math.sin(run * 2) : 0;
    var tailWag = Math.sin(t * 2.6) * 0.09 + (moving ? Math.sin(run * 2) * 0.06 : 0);

    g.translate(0, bob);

    /* tail */
    g.save();
    g.translate(-17, -31);
    g.rotate(-0.16 + tailWag + (air ? -0.08 : 0));
    var tail = new Path2D();
    tail.moveTo(2, 2);
    tail.bezierCurveTo(-18, 6, -41, -6, -43, -27);
    tail.bezierCurveTo(-45, -42, -30, -49, -21, -38);
    tail.bezierCurveTo(-13, -28, -6, -16, 4, -8);
    tail.closePath();
    g.fillStyle = body;
    g.fill(tail);
    g.save();
    g.clip(tail);
    g.fillStyle = cream;
    g.beginPath();
    g.ellipse(-37, -36, 13, 16, -0.34, 0, TAU);
    g.fill();
    g.fillStyle = creamDeep;
    g.beginPath();
    g.ellipse(-40, -32, 9, 10, -0.3, 0, TAU);
    g.fill();
    g.restore();
    g.strokeStyle = dark;
    g.lineWidth = 4.4;
    g.stroke(tail);
    g.restore();

    /* legs */
    var backLift = moving ? Math.max(0, step) * 5 : 0;
    var frontLift = moving ? Math.max(0, -step) * 5 : 0;
    var backX = -9 - (moving ? step * 5 : 0);
    var frontX = 9 + (moving ? step * 5 : 0);
    var backY = -backLift;
    var frontY = -frontLift;
    if (air) {
      backX = -17;
      backY = -5;
      frontX = 15;
      frontY = -9;
    }
    drawFoxLeg(g, -8, -19, backX, backY, bodyDark, '#5b3324', 8.5, dark);
    drawFoxLeg(g, 9, -20, frontX, frontY, body, '#5b3324', 8.5, dark);
    if (air) {

    /* body */

    g.fillStyle = body;

  function drawFoxLeg(g, x1, y1, x2, y2, color, paw, width, dark) {
    g.strokeStyle = dark;
    g.lineWidth = width + 4;
    g.beginPath();
    g.moveTo(x1, y1);
    g.quadraticCurveTo(x1 + (x2 - x1) * 0.4, y1 + (y2 - y1) * 0.55, x2, y2);
    g.stroke();
    g.strokeStyle = color;
    g.lineWidth = width;
    g.beginPath();
    g.moveTo(x1, y1);
    g.quadraticCurveTo(x1 + (x2 - x1) * 0.4, y1 + (y2 - y1) * 0.55, x2, y2);
    g.stroke();
    g.fillStyle = paw;
    g.beginPath();
    g.ellipse(x2 + 2.2, y2 - 0.5, 4.7, 3.1, 0.05, 0, TAU);
    g.fill();
  }

  function paintAcorn(g, x, y, size, t, gold) {
    var s = size / 100;
    g.save();
    g.translate(x, y);
    g.scale(s, s);
    g.rotate(-0.12);
    g.lineJoin = 'round';
    var dark = gold ? '#5b3912' : '#493021';
    // glow
    var glow = g.createRadialGradient(0, 4, 4, 0, 4, gold ? 76 : 58);
    glow.addColorStop(0, gold ? 'rgba(255,232,102,0.68)' : 'rgba(255,235,160,0.42)');
    glow.addColorStop(1, 'rgba(255,235,160,0)');
    g.fillStyle = glow;
    g.beginPath();
    g.arc(0, 4, gold ? 76 : 58, 0, TAU);
    g.fill();
    // leaf
    g.fillStyle = gold ? '#96d85a' : '#739e45';
    g.beginPath();
    g.ellipse(22, -40, 13, 6, -0.55, 0, TAU);
    g.fill();
    g.strokeStyle = '#4c7132';
    g.lineWidth = 2.4;
    g.stroke();
    // stem
    g.strokeStyle = dark;
    g.lineWidth = 5;
    g.beginPath();
    g.moveTo(6, -33);
    g.lineTo(10, -45);
    g.stroke();
    // body
    g.fillStyle = gold ? '#ffd347' : '#dd9c47';
    g.beginPath();
    g.moveTo(-30, -18);
    g.bezierCurveTo(-28, 8, -13, 34, 1, 35);
    g.bezierCurveTo(17, 34, 29, 8, 31, -18);
    g.closePath();
    g.fill();
    g.strokeStyle = dark;
    g.lineWidth = 4.5;
    g.stroke();
    // cap
    g.fillStyle = gold ? '#d48822' : '#8b5a32';

    g.ellipse(1, -22, 35, 15, 0, 0, TAU);
    g.fill();
    g.strokeStyle = dark;

    g.strokeStyle = '#c58c55';
    g.lineWidth = 2;

    g.arc(-22, -21, 7, 3.5, 5.7);
    g.stroke();
    g.beginPath();
    g.arc(23, -22, 6, 3.4, 5.8);

  function drawSpikeRow(g, cx, baseY, width, count, height, theme, closeup) {
    var i;
    var outline = theme.spikeDark || '#2f2137';
    var fill = theme.spike || '#694b72';
    var light = theme.spikeLight || '#c9a9df';
    var line = clamp(width * 0.035, 2.1, 7);
    // earthen base
    g.fillStyle = closeup ? '#6e513f' : rgba('#4a3329', 0.85);
    g.beginPath();
    g.ellipse(cx, baseY + 2, width * 0.53, Math.max(6, width * 0.075), 0, 0, TAU);
    g.fill();
    g.strokeStyle = outline;
    g.lineWidth = line * 0.65;
    g.stroke();
    // little brambles
    g.strokeStyle = closeup ? '#7a5847' : rgba('#5d3e30', 0.9);
    g.lineWidth = line * 0.7;
    g.beginPath();
    g.moveTo(cx - width * 0.45, baseY - 2);
    g.quadraticCurveTo(cx - width * 0.3, baseY - height * 0.42, cx - width * 0.18, baseY - height * 0.2);
    g.stroke();
    g.beginPath();
    g.moveTo(cx + width * 0.37, baseY - 2);
    g.quadraticCurveTo(cx + width * 0.3, baseY - height * 0.5, cx + width * 0.2, baseY - height * 0.22);
    g.stroke();

    for (i = 0; i < count; i++) {
      var slot = width / count;
      var sx = cx - width / 2 + slot * (i + 0.5);
      var halfBase = slot * 0.56;
      var h = height * (0.82 + ((i * 7) % 5) * 0.045);
      var tipY = baseY - h - 3;
      var grad = g.createLinearGradient(0, tipY, 0, baseY);
      grad.addColorStop(0, light);
      grad.addColorStop(0.22, fill);
      grad.addColorStop(1, theme.spikeDark || '#2f2137');
      g.fillStyle = grad;
      g.beginPath();
      g.moveTo(sx - halfBase, baseY - 2);
      g.quadraticCurveTo(sx - halfBase * 0.5, baseY - h * 0.44, sx, tipY);
      g.quadraticCurveTo(sx + halfBase * 0.5, baseY - h * 0.45, sx + halfBase, baseY - 2);
      g.closePath();
      g.fill();
      g.strokeStyle = outline;
      g.lineWidth = line;
      g.stroke();
      // highlight
      g.strokeStyle = closeup ? 'rgba(255,230,255,0.55)' : 'rgba(255,225,255,0.38)';
      g.lineWidth = Math.max(1, line * 0.34);
      g.beginPath();
      g.moveTo(sx - halfBase * 0.2, baseY - h * 0.18);
      g.lineTo(sx - 1, tipY + h * 0.18);
      g.stroke();
    }
    // little leaves at the base
    g.fillStyle = closeup ? '#68894a' : 'rgba(95,132,67,0.85)';
    for (i = 0; i < 3; i++) {
      var lx = cx - width * 0.4 + i * width * 0.37;
      g.beginPath();
      g.ellipse(lx, baseY - 1, width * 0.055, width * 0.025, i * 0.8, 0, TAU);
      g.fill();
    }
  }

  /* ============================================================
   * 11. WORLD DRAWING
   * ============================================================ */
  function setViewTransform(shakeX, shakeY) {
    ctx.setTransform(dpr * view.scale, 0, 0, dpr * view.scale,
      dpr * view.x + (shakeX || 0) * dpr, dpr * view.y + (shakeY || 0) * dpr);
  }
  function setScreenTransform() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function drawSky(theme) {
    var grad = ctx.createLinearGradient(0, 0, 0, VIEW_H);
    grad.addColorStop(0, theme.skyTop);
    grad.addColorStop(0.55, theme.skyMid);
    grad.addColorStop(1, theme.skyBottom);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);

    if (theme.stars > 0) {
      var rng = mulberry32(337);
      for (var i = 0; i < 34; i++) {
        var sx = rng() * VIEW_W;
        var sy = 16 + rng() * 190;
        var tw = 0.28 + 0.65 * (0.5 + 0.5 * Math.sin(animTime * 0.9 + i * 1.7));
        ctx.fillStyle = 'rgba(255,242,207,' + (theme.stars * 0.55 * tw) + ')';
        ctx.beginPath();
        ctx.arc(sx, sy, 0.7 + rng() * 1.2, 0, TAU);
        ctx.fill();
      }
    }

    // sun
    var sunX = VIEW_W * theme.sunX - cameraX * 0.025;
    var sunY = VIEW_H * theme.sunY;
    var sunR = theme.sunSize || 56;
    var glow = ctx.createRadialGradient(sunX, sunY, sunR * 0.25, sunX, sunY, sunR * 3.2);
    glow.addColorStop(0, rgba(theme.sun, 0.42));
    glow.addColorStop(0.45, rgba(theme.sun, 0.14));
    glow.addColorStop(1, rgba(theme.sun, 0));
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(sunX, sunY, sunR * 3.2, 0, TAU);
    ctx.fill();
    ctx.fillStyle = rgba(theme.sun, 0.88);
    ctx.beginPath();
    ctx.arc(sunX, sunY, sunR, 0, TAU);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.beginPath();
    ctx.arc(sunX - sunR * 0.25, sunY - sunR * 0.28, sunR * 0.45, 0, TAU);
    ctx.fill();
  }

  function drawCloud(x, y, scale, alpha) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = rgba('#fff9e7', 0.82);
    ctx.beginPath();
    ctx.ellipse(0, 0, 34, 16, 0, 0, TAU);
    ctx.ellipse(30, 2, 24, 12, 0, 0, TAU);
    ctx.ellipse(-30, 5, 22, 10, 0, 0, TAU);
    ctx.ellipse(9, -10, 23, 15, 0, 0, TAU);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.36)';
    ctx.beginPath();
    ctx.ellipse(4, -14, 15, 8, -0.15, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  function drawClouds(theme) {
    var rng = mulberry32(931);
    var i;
    for (i = 0; i < 5; i++) {
      var bx = rng() * 1100;
      var by = 64 + rng() * 150;
      var sc = 0.55 + rng() * 0.65;
      var speed = animTime * (2.5 + rng() * 2.5);
      var x = ((bx + speed - cameraX * 0.06) % 1250 + 1250) % 1250 - 145;
      drawCloud(x, by, sc, theme.cloudAlpha * (0.72 + rng() * 0.28));
    }
  }

  function drawBirds(theme) {
    var i;
    var color = theme.stars > 0 ? 'rgba(37,33,53,0.55)' : 'rgba(70,94,82,0.42)';
    for (i = 0; i < 3; i++) {
      var x = ((animTime * (9 + i * 2) + i * 230 - cameraX * 0.03) % 1200 + 1200) % 1200 - 120;
      var y = 100 + i * 25 + Math.sin(animTime * 0.6 + i) * 4;
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.7;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x - 8, y + 2);
      ctx.quadraticCurveTo(x - 3, y - 4, x, y);
      ctx.quadraticCurveTo(x + 3, y - 4, x + 8, y + 2);
      ctx.stroke();
    }
  }

  function drawHills(theme) {
    drawHillLayer(theme.hillFar, 0.1, 378, 58, 0.0042, 1.7, 0.9, theme);
    drawHillLayer(theme.hillMid, 0.2, 402, 48, 0.0056, 3.8, 1, theme);
    // tree line on the horizon
    drawTreeLine(theme, 0.32, 402, 1, 0.62);
    drawHillsNear(theme);
    drawTreeLine(theme, 0.50, 422, 0.72, 0.92);
    var fog = ctx.createLinearGradient(0, 300, 0, 445);
    fog.addColorStop(0, 'rgba(255,242,207,0)');
    fog.addColorStop(0.65, theme.fog);
    fog.addColorStop(1, 'rgba(255,236,198,0)');
    ctx.fillStyle = fog;
    ctx.fillRect(0, 300, VIEW_W, 150);
  }

  function drawHillLayer(color, parallax, baseY, amp, freq, seed, alpha, theme) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, VIEW_H);
    var minX = -12;
    for (var x = minX; x <= VIEW_W + 16; x += 12) {
      var wx = x + cameraX * parallax;
      var y = baseY - amp * (0.55 + 0.45 * Math.sin(wx * freq + seed)) -
        amp * 0.16 * Math.sin(wx * freq * 2.5 + seed * 2.1);
      ctx.lineTo(x, y);
    }
    ctx.lineTo(VIEW_W + 16, VIEW_H);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawHillsNear(theme) {
    var color = theme.hillNear;
    ctx.save();
    ctx.globalAlpha = 0.92;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, VIEW_H);
    for (var x = -12; x <= VIEW_W + 16; x += 14) {
      var wx = x + cameraX * 0.39;
      var y = 419 - 33 * Math.sin(wx * 0.008 + 2.2) - 12 * Math.sin(wx * 0.019 + 0.7);
      ctx.lineTo(x, y);
    }
    ctx.lineTo(VIEW_W + 16, VIEW_H);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawTreeLine(theme, parallax, baseY, scale, alpha) {
    var spacing = 150 * scale;
    var shift = (cameraX * parallax) % spacing;
    ctx.save();
    ctx.globalAlpha = alpha;
    for (var i = -1; i < VIEW_W / spacing + 2; i++) {
      var x = i * spacing - shift + 20;
      var h = (48 + ((i * 37) % 34)) * scale;
      var trunk = theme.treeFar;
      ctx.strokeStyle = trunk;
      ctx.lineWidth = 4 * scale;
      ctx.beginPath();
      ctx.moveTo(x, baseY);
      ctx.lineTo(x + 2 * scale, baseY - h * 0.52);
      ctx.stroke();
      ctx.fillStyle = i % 2 === 0 ? theme.treeFar : theme.treeNear;
      ctx.beginPath();
      ctx.arc(x + 2 * scale, baseY - h * 0.7, 18 * scale, 0, TAU);
      ctx.arc(x - 12 * scale, baseY - h * 0.6, 13 * scale, 0, TAU);
      ctx.arc(x + 16 * scale, baseY - h * 0.56, 12 * scale, 0, TAU);
      ctx.arc(x + 3 * scale, baseY - h * 0.86, 12 * scale, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawSkyScene() {
    var theme = level ? level.theme : THEMES[0];
    drawSky(theme);
    drawClouds(theme);
    drawBirds(theme);
    drawHills(theme);
    // soft haze band in front of the horizon
    var haze = ctx.createLinearGradient(0, 360, 0, 435);
    haze.addColorStop(0, 'rgba(255,241,207,0)');
    haze.addColorStop(0.72, theme.fog);
    haze.addColorStop(1, 'rgba(255,241,207,0)');
    ctx.fillStyle = haze;
    ctx.fillRect(0, 360, VIEW_W, 80);
  }

  function drawPitAbyss() {
    if (!level) return;
    var left = cameraX - 40;
    var right = cameraX + VIEW_W + 40;
    for (var i = 0; i < level.gaps.length; i++) {
      var gap = level.gaps[i];
      if (gap.x + gap.w < left || gap.x > right) continue;
      var grad = ctx.createLinearGradient(0, GROUND_Y, 0, VIEW_H + 30);
      grad.addColorStop(0, 'rgba(48,35,41,0.05)');
      grad.addColorStop(0.45, 'rgba(34,26,33,0.30)');
      grad.addColorStop(1, 'rgba(19,15,22,0.78)');
      ctx.fillStyle = grad;
      ctx.fillRect(gap.x, GROUND_Y, gap.w, VIEW_H - GROUND_Y + 30);
      // thin wisps rising from the dark
      ctx.strokeStyle = 'rgba(205,180,147,0.08)';
      ctx.lineWidth = 2;
      for (var k = 0; k < 3; k++) {
        var xx = gap.x + gap.w * (0.22 + k * 0.28);
        ctx.beginPath();
        ctx.moveTo(xx, VIEW_H - 20);
        ctx.bezierCurveTo(xx - 6, VIEW_H - 52, xx + 8, VIEW_H - 76, xx - 2, VIEW_H - 112);
        ctx.stroke();
      }
    }
  }

  function drawGroundSegments() {
    var theme = level.theme;
    var left = cameraX - 80;
    var right = cameraX + VIEW_W + 80;
    for (var i = 0; i < level.ground.length; i++) {
      var g = level.ground[i];
      if (g.x + g.w < left || g.x > right) continue;
      var top = GROUND_Y;
      // dirt body
      var grad = ctx.createLinearGradient(0, top, 0, VIEW_H + 50);
      grad.addColorStop(0, theme.dirt);
      grad.addColorStop(0.6, theme.dirtDark);
      grad.addColorStop(1, '#5b3c2a');
      ctx.fillStyle = grad;
      ctx.fillRect(g.x, top, g.w, VIEW_H - top + 50);

      // warm sunlit lip and grass band
      ctx.fillStyle = theme.grassDark;
      ctx.fillRect(g.x, top - 1, g.w, 21);
      ctx.fillStyle = theme.grass;
      ctx.fillRect(g.x, top - 1, g.w, 15);
      ctx.fillStyle = theme.grassLight;
      ctx.fillRect(g.x, top - 1, g.w, 4);

      // dark outline along the walkable top
      ctx.strokeStyle = 'rgba(54,71,36,0.75)';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(g.x, top);
      ctx.lineTo(g.x + g.w, top);
      ctx.stroke();

      // wavy grassy fringe hanging over the dirt
      var fringe = Math.floor(g.w / 19);
      ctx.fillStyle = theme.grass;
      for (var k = 0; k < fringe; k++) {
        var fx = g.x + k * 19 + (k % 3) * 3;
        var fh = 5 + (k * 17 % 8);
        ctx.beginPath();
        ctx.moveTo(fx, top + 13);
        ctx.quadraticCurveTo(fx + 7, top + 13 + fh, fx + 15, top + 12);
        ctx.fill();
      }

      // dirt texture marks
      for (var d = 0; d < level.dirtMarks.length; d++) {
        var m = level.dirtMarks[d];
        if (m.x < g.x || m.x > g.x + g.w) continue;
        if (m.x < left || m.x > right) continue;
        ctx.fillStyle = m.tone > 0.55 ? 'rgba(255,221,175,' + (m.a * 0.7) + ')' : 'rgba(64,40,31,' + m.a + ')';
        ctx.beginPath();
        ctx.ellipse(m.x, m.y, m.w, m.h, 0.1, 0, TAU);
        ctx.fill();
      }

      // cliff edges
      ctx.strokeStyle = 'rgba(73,49,35,0.7)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(g.x + 1, top + 4);
      ctx.bezierCurveTo(g.x + 6, top + 34, g.x - 3, top + 62, g.x + 5, top + 96);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(g.x + g.w - 1, top + 4);
      ctx.bezierCurveTo(g.x + g.w - 6, top + 34, g.x + g.w + 3, top + 62, g.x + g.w - 5, top + 96);
      ctx.stroke();

      // roots at the lip
      ctx.strokeStyle = rgba(theme.dirtLight, 0.45);
      ctx.lineWidth = 1.5;
      for (var r = 0; r < 3; r++) {
        var rx = g.x + 20 + r * (g.w / 4) + ((i * 13 + r * 19) % 22);
        if (rx > g.x + g.w - 14) continue;
        ctx.beginPath();
        ctx.moveTo(rx, top + 22);
        ctx.quadraticCurveTo(rx + 5, top + 38, rx - 2, top + 52);
        ctx.stroke();
      }
    }
  }

  function drawDecor() {
    var left = cameraX - 30;
    var right = cameraX + VIEW_W + 30;
    var theme = level.theme;
    for (var i = 0; i < level.decor.length; i++) {
      var d = level.decor[i];
      if (d.x < left || d.x > right) continue;
      drawDecorItem(d, theme);
    }
  }

  function drawDecorItem(d, theme) {
    ctx.save();
    ctx.translate(d.x, d.y);
    ctx.scale(d.scale, d.scale);
    var sway = Math.sin(animTime * 1.3 + d.phase) * 2.2;
    if (d.type === 'grass') {
      ctx.strokeStyle = theme.grassDark;
      ctx.lineWidth = 2.5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-5, 0);
      ctx.quadraticCurveTo(-9, -13, -13 + sway * 0.5, -20);
      ctx.moveTo(1, 0);
      ctx.quadraticCurveTo(1, -17, 5 + sway, -25);
      ctx.moveTo(7, 0);
      ctx.quadraticCurveTo(10, -12, 16 + sway * 0.4, -18);
      ctx.stroke();
      ctx.strokeStyle = theme.grassLight;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(1, -1);
      ctx.quadraticCurveTo(3, -15, 6 + sway, -23);
      ctx.stroke();
    } else if (d.type === 'flower') {
      var col = theme.flowers[d.color % theme.flowers.length];
      ctx.strokeStyle = theme.grassDark;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(-2, -13, sway * 0.25, -23);
      ctx.stroke();
      ctx.fillStyle = col;
      for (var petal = 0; petal < 5; petal++) {
        var a = petal / 5 * TAU + 0.3;
        ctx.beginPath();
        ctx.ellipse(Math.cos(a) * 5, -24 + Math.sin(a) * 4, 4, 3.2, a, 0, TAU);
        ctx.fill();
      }
      ctx.fillStyle = '#d99b3f';
      ctx.beginPath();
      ctx.arc(0, -24, 2.4, 0, TAU);
      ctx.fill();
    } else if (d.type === 'fern') {
      ctx.strokeStyle = theme.grassDark;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(-1, -12, -8, -20, -15 + sway, -25);
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(2, -10, 8, -17, 14 - sway, -20);
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(3, -13, 2, -24);
      ctx.stroke();
      ctx.fillStyle = theme.grass;
      for (var f = 0; f < 4; f++) {
        ctx.beginPath();
        ctx.ellipse(-8 - f * 2, -14 - f * 2.6, 4.5, 2, -0.6, 0, TAU);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(7 + f * 1.8, -10 - f * 2.2, 4, 2, 0.7, 0, TAU);
        ctx.fill();
      }
    } else if (d.type === 'mushroom') {
      ctx.fillStyle = '#f7e0b2';
      ctx.strokeStyle = '#6b4a35';
      ctx.lineWidth = 1.8;
      rrPath(ctx, -3, -13, 6, 13, 3);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#d86b57';
      ctx.beginPath();
      ctx.ellipse(0, -14, 12, 7, 0, Math.PI, TAU);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#ffe9c2';
      ctx.beginPath();
      ctx.arc(-4, -17, 1.7, 0, TAU);
      ctx.arc(4, -18, 1.3, 0, TAU);
      ctx.fill();
    } else if (d.type === 'rock') {
      ctx.fillStyle = theme.rock;
      ctx.strokeStyle = rgba(theme.dirtDark, 0.7);
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.ellipse(0, -4, 12, 7, -0.1, 0, TAU);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = theme.rockLight;
      ctx.beginPath();
      ctx.ellipse(-3, -6, 5, 2.4, -0.2, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }
