  function drawPlatforms() {
    var theme = level.theme;
    for (var i = 0; i < platforms.length; i++) {
      var p = platforms[i];
      if (p.x + p.w < cameraX - 30 || p.x > cameraX + VIEW_W + 30) continue;
      // shadow
      ctx.fillStyle = 'rgba(32,23,24,0.16)';
      ctx.beginPath();
      ctx.ellipse(p.x + p.w / 2, p.y + p.h + 24, p.w * 0.42, 7, 0, 0, TAU);
      ctx.fill();
      // floating dirt body
      var grad = ctx.createLinearGradient(0, p.y, 0, p.y + p.h);
      grad.addColorStop(0, theme.dirtLight);
      grad.addColorStop(1, theme.dirtDark);
      ctx.fillStyle = grad;
      ctx.strokeStyle = '#493125';
      ctx.lineWidth = 3;
      rrPath(ctx, p.x, p.y, p.w, p.h, 7);
      ctx.fill();
      ctx.stroke();
      // mossy top
      ctx.fillStyle = theme.grassDark;
      rrPath(ctx, p.x + 1, p.y - 1, p.w - 2, 8, 4);
      ctx.fill();
      ctx.fillStyle = theme.grass;
      rrPath(ctx, p.x + 2, p.y - 1, p.w - 4, 4, 2);
      ctx.fill();
      // tiny grass on top
      ctx.strokeStyle = theme.grassDark;
      ctx.lineWidth = 1.6;
      for (var g = 0; g < 4; g++) {
        var gx = p.x + 10 + g * (p.w - 20) / 3;
        ctx.beginPath();
        ctx.moveTo(gx, p.y - 1);
        ctx.lineTo(gx + (g % 2 ? 3 : -2), p.y - 7 - (g % 3) * 2);
        ctx.stroke();
      }
      // hanging vines
      ctx.strokeStyle = rgba(theme.grassDark, 0.95);
      ctx.lineWidth = 2.3;
      ctx.beginPath();
      ctx.moveTo(p.x + 14, p.y + p.h);
      ctx.bezierCurveTo(p.x + 8, p.y + p.h + 15, p.x + 20, p.y + p.h + 23, p.x + 15, p.y + p.h + 34);
      ctx.moveTo(p.x + p.w - 20, p.y + p.h);
      ctx.bezierCurveTo(p.x + p.w - 13, p.y + p.h + 13, p.x + p.w - 26, p.y + p.h + 24, p.x + p.w - 19, p.y + p.h + 29);
      ctx.stroke();
      ctx.fillStyle = theme.grass;
      for (var v = 0; v < 3; v++) {
        ctx.beginPath();
        ctx.ellipse(p.x + 13 + v * 2, p.y + p.h + 18 + v * 7, 3.5, 1.8, -0.5, 0, TAU);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(p.x + p.w - 20 + v * 1.5, p.y + p.h + 16 + v * 6, 3, 1.7, 0.5, 0, TAU);
        ctx.fill();
      }
    }
  }

  function drawGoal() {
    var x = level.goalX;
    if (x < cameraX - 180 || x > cameraX + VIEW_W + 120) return;
    var theme = level.theme;
    var baseY = GROUND_Y;
    var poleTop = baseY - 128;
    var wave = Math.sin(animTime * 4.4) * 3.5;
    var wave2 = Math.cos(animTime * 4.4 + 0.8) * 3;
    var glowA = 0.18 + Math.sin(animTime * 2.6) * 0.05;
    var baseGlow = ctx.createRadialGradient(x, baseY - 6, 2, x, baseY - 6, 76);
    baseGlow.addColorStop(0, 'rgba(255,220,121,' + (glowA + 0.18) + ')');
    baseGlow.addColorStop(1, 'rgba(255,220,121,0)');
    ctx.fillStyle = baseGlow;
    ctx.beginPath();
    ctx.arc(x, baseY - 6, 76, 0, TAU);
    ctx.fill();

    // stones
    ctx.fillStyle = 'rgba(56,42,35,0.24)';
    ctx.beginPath();
    ctx.ellipse(x + 5, baseY + 2, 38, 7, 0, 0, TAU);
    ctx.fill();
    // pole
    ctx.strokeStyle = '#4d3324';
    ctx.lineWidth = 9;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x, baseY);
    ctx.lineTo(x, poleTop);
    ctx.stroke();
    ctx.strokeStyle = '#c8945b';
    ctx.lineWidth = 4.5;
    ctx.beginPath();
    ctx.moveTo(x - 1, baseY);
    ctx.lineTo(x - 1, poleTop);
    ctx.stroke();
    // gold finial
    ctx.fillStyle = '#f6d36e';
    ctx.strokeStyle = '#5a3c26';
    ctx.lineWidth = 2.8;
    ctx.beginPath();
    ctx.arc(x, poleTop - 3, 7, 0, TAU);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#fff2b1';
    ctx.beginPath();
    ctx.arc(x - 2, poleTop - 5, 2.2, 0, TAU);
    ctx.fill();

    // cloth
    var left = x + 4;
    var right = x + 83;
    ctx.beginPath();
    ctx.moveTo(left, poleTop + 13);
    ctx.bezierCurveTo(left + 28, poleTop + 10 + wave, right - 22, poleTop + 22 + wave2, right, poleTop + 22 + wave);
    ctx.lineTo(right - 5, poleTop + 68 + wave);
    ctx.bezierCurveTo(right - 35, poleTop + 58 + wave2, left + 26, poleTop + 58 - wave, left, poleTop + 62);
    ctx.closePath();
    var clothGrad = ctx.createLinearGradient(left, poleTop, right, poleTop + 70);
    clothGrad.addColorStop(0, '#de6044');
    clothGrad.addColorStop(1, '#b84337');
    ctx.fillStyle = clothGrad;
    ctx.fill();
    ctx.strokeStyle = '#5a3225';
    ctx.lineWidth = 3.3;
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,230,168,0.55)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(left + 7, poleTop + 22);
    ctx.quadraticCurveTo(left + 30, poleTop + 25 + wave, right - 12, poleTop + 30 + wave);
    ctx.stroke();
    // paw emblem on flag
    var pawX = x + 43;
    var pawY = poleTop + 42;
    ctx.fillStyle = '#ffedc0';
    ctx.beginPath();
    ctx.ellipse(pawX, pawY + 2, 8, 6.5, 0, 0, TAU);
    ctx.fill();
    for (var toe = 0; toe < 3; toe++) {
      ctx.beginPath();
      ctx.ellipse(pawX - 9 + toe * 9, pawY - 8, 3.4, 4.2, 0, 0, TAU);
      ctx.fill();
    }
    // plaque
    ctx.fillStyle = '#8f603c';
    ctx.strokeStyle = '#4b3122';
    ctx.lineWidth = 2.5;
    rrPath(ctx, x - 34, baseY - 69, 68, 27, 5);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#fff0cc';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    setFont(ctx, 15, 'bold');
    ctx.fillText('终 点', x, baseY - 55);
    ctx.textAlign = 'left';

    // sparkles
    for (var i = 0; i < 4; i++) {
      var a = animTime * 1.2 + i * 1.7;
      var sx = x + Math.cos(a) * (42 + i * 12);
      var sy = poleTop + 30 + Math.sin(a * 1.7 + i) * 28;
      var alpha = 0.3 + 0.3 * Math.sin(animTime * 3 + i * 2);
      ctx.fillStyle = 'rgba(255,240,177,' + alpha + ')';
      ctx.beginPath();
      ctx.arc(sx, sy, 1.8, 0, TAU);
      ctx.fill();
    }
  }

  function drawAcorns() {
    for (var i = 0; i < pickups.length; i++) {
      var p = pickups[i];
      if (p.x < cameraX - 50 || p.x > cameraX + VIEW_W + 50) continue;
      var bob = Math.sin(animTime * 2.4 + p.phase) * 4.5;
      var r = p.gold ? 35 : 27;
      var glow = ctx.createRadialGradient(p.x, p.y + bob, 2, p.x, p.y + bob, r);
      glow.addColorStop(0, p.gold ? 'rgba(255,235,95,0.62)' : 'rgba(255,222,119,0.32)');
      glow.addColorStop(1, 'rgba(255,222,119,0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(p.x, p.y + bob, r, 0, TAU);
      ctx.fill();
      if (p.gold) {
        for (var k = 0; k < 4; k++) {
          var sa = animTime * 2.2 + k * (TAU / 4) + p.phase;
          var sx = p.x + Math.cos(sa) * 19;
          var sy = p.y + bob + Math.sin(sa) * 19;
          ctx.fillStyle = 'rgba(255,250,185,0.85)';
          ctx.beginPath();
          ctx.arc(sx, sy, 2, 0, TAU);
          ctx.fill();
        }
      }
      ctx.save();
      ctx.translate(p.x, p.y + bob);
      ctx.rotate(Math.sin(animTime * 1.7 + p.phase) * 0.08 - 0.1);
      paintAcorn(ctx, 0, 0, p.gold ? 31 : 25, animTime + p.phase, p.gold);
      ctx.restore();
    }
  }

  function drawMushrooms() {
    for (var i = 0; i < mushrooms.length; i++) {
      var m = mushrooms[i];
      if (m.x + m.w < cameraX - 40 || m.x - m.w > cameraX + VIEW_W + 40) continue;
      var sq = m.squash || 0;
      var sx = 1 + Math.sin(sq * Math.PI) * 0.28;
      var sy = 1 - Math.sin(sq * Math.PI) * 0.32;
      ctx.save();
      ctx.translate(m.x, m.y);
      ctx.scale(sx, sy);
      // shadow
      ctx.fillStyle = 'rgba(40,26,20,0.25)';
      ctx.beginPath();
      ctx.ellipse(0, 2, m.w * 0.45, 5, 0, 0, TAU);
      ctx.fill();
      // stem
      ctx.fillStyle = '#fae7c3';
      ctx.strokeStyle = '#5c3c28';
      ctx.lineWidth = 2.6;
      rrPath(ctx, -m.w * 0.2, -m.h * 0.72, m.w * 0.4, m.h * 0.72, 6);
      ctx.fill();
      ctx.stroke();
      // bouncy cap
      var capGrad = ctx.createLinearGradient(0, -m.h - 8, 0, -m.h * 0.4);
      capGrad.addColorStop(0, '#ff7759');
      capGrad.addColorStop(1, '#d64535');
      ctx.fillStyle = capGrad;
      ctx.beginPath();
      ctx.ellipse(0, -m.h * 0.68, m.w * 0.56, m.h * 0.44, 0, Math.PI, TAU);
      ctx.lineTo(m.w * 0.56, -m.h * 0.62);
      ctx.quadraticCurveTo(0, -m.h * 0.46, -m.w * 0.56, -m.h * 0.62);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      // cream spots
      ctx.fillStyle = '#fff3d4';
      ctx.beginPath();
      ctx.ellipse(-m.w * 0.22, -m.h * 0.85, 5.5, 3.6, -0.25, 0, TAU);
      ctx.ellipse(m.w * 0.2, -m.h * 0.83, 4.8, 3.2, 0.25, 0, TAU);
      ctx.ellipse(0, -m.h * 0.94, 4.2, 2.6, 0, 0, TAU);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawCheckpoint() {
    if (!checkpoint) return;
    var cp = checkpoint;
    if (cp.x < cameraX - 60 || cp.x > cameraX + VIEW_W + 60) return;
    ctx.save();
    ctx.translate(cp.x, cp.y);
    // base shadow
    ctx.fillStyle = 'rgba(42,28,20,0.24)';
    ctx.beginPath();
    ctx.ellipse(0, 2, 22, 5, 0, 0, TAU);
    ctx.fill();
    // wooden post
    ctx.strokeStyle = '#5a3a26';
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(0, -68);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, -58);
    ctx.lineTo(22, -58);
    ctx.stroke();
    // lantern glow when reached
    if (cp.reached) {
      var glowR = 36 + Math.sin(animTime * 4) * 5;
      var lg = ctx.createRadialGradient(20, -44, 2, 20, -44, glowR);
      lg.addColorStop(0, 'rgba(148,255,172,0.58)');
      lg.addColorStop(0.5, 'rgba(255,232,125,0.26)');
      lg.addColorStop(1, 'rgba(255,232,125,0)');
      ctx.fillStyle = lg;
      ctx.beginPath();
      ctx.arc(20, -44, glowR, 0, TAU);
      ctx.fill();
    }
    // lantern body
    var swing = Math.sin(animTime * 2.6) * 0.08 + (cp.anim || 0) * Math.sin(animTime * 18) * 0.22;
    ctx.save();
    ctx.translate(20, -56);
    ctx.rotate(swing);
    ctx.fillStyle = cp.reached ? '#9af7ab' : '#8a7968';
    ctx.strokeStyle = '#473022';
    ctx.lineWidth = 2.2;
    rrPath(ctx, -8, 4, 16, 18, 5);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#473022';
    ctx.fillRect(-10, 2, 20, 4);
    ctx.restore();
    ctx.restore();
  }

  function drawCritters() {
    for (var i = 0; i < critters.length; i++) {
      var cr = critters[i];
      if (!cr.alive && cr.squashTimer <= 0) continue;
      if (cr.x < cameraX - 50 || cr.x > cameraX + VIEW_W + 50) continue;
      ctx.save();
      ctx.translate(cr.x, cr.y);
      if (cr.dir < 0) ctx.scale(-1, 1);
      if (!cr.alive) {
        ctx.scale(1.35, 0.38);
        ctx.globalAlpha = clamp(cr.squashTimer / 0.45, 0, 1);
      }
      // shadow
      ctx.fillStyle = 'rgba(38,26,20,0.25)';
      ctx.beginPath();
      ctx.ellipse(0, 2, cr.r * 0.9, 4.5, 0, 0, TAU);
      ctx.fill();
      var waddle = cr.alive ? Math.sin(cr.step) * 2.2 : 0;
      // little feet
      ctx.fillStyle = '#4a3123';
      ctx.beginPath();
      ctx.ellipse(-7 + waddle, -2, 4.5, 2.8, 0, 0, TAU);
      ctx.ellipse(7 - waddle, -2, 4.5, 2.8, 0, 0, TAU);
      ctx.fill();
      // spiky shell / mushroom cap back
      ctx.fillStyle = '#924c6e';
      ctx.strokeStyle = '#432234';
      ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.arc(0, -cr.r * 0.62, cr.r * 0.92, Math.PI, TAU);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      // face / belly
      ctx.fillStyle = '#f2d9b6';
      ctx.beginPath();
      ctx.ellipse(3, -cr.r * 0.42, cr.r * 0.65, cr.r * 0.42, 0, 0, TAU);
      ctx.fill();
      ctx.stroke();
      // cute angry eye
      ctx.fillStyle = '#331c24';
      ctx.beginPath();
      ctx.arc(8, -cr.r * 0.5, 2.4, 0, TAU);
      ctx.fill();
      // spots on shell
      ctx.fillStyle = '#f7bdd8';
      ctx.beginPath();
      ctx.arc(-6, -cr.r * 0.95, 3, 0, TAU);
      ctx.arc(4, -cr.r * 1.05, 2.4, 0, TAU);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawAfterimages() {
    for (var i = 0; i < afterimages.length; i++) {
      var a = afterimages[i];
      if (a.x < cameraX - 60 || a.x > cameraX + VIEW_W + 60) continue;
      ctx.save();
      ctx.globalAlpha = a.alpha * 0.45;
      ctx.translate(a.x, a.y);
      if (a.dir < 0) ctx.scale(-1, 1);
      paintFox(ctx, 84, {
        t: animTime,
        run: a.run,
        moving: true,
        air: a.air,
        vy: 0,
        blink: 0
      });
      ctx.restore();
    }
  }

  function drawSpikes() {
    for (var i = 0; i < spikeRows.length; i++) {
      var s = spikeRows[i];
      if (s.x + s.w / 2 < cameraX - 40 || s.x - s.w / 2 > cameraX + VIEW_W + 40) continue;
      drawSpikeRow(ctx, s.x, GROUND_Y, s.w, s.count, s.h, level.theme, false);
    }
  }

  function drawMotes() {
    var i;
    var theme = level.theme;
    var count = theme.firefly > 0.6 ? level.motes.length : Math.floor(level.motes.length * 0.6);
    for (i = 0; i < count; i++) {
      var m = level.motes[i];
      if (m.x < cameraX - 20 || m.x > cameraX + VIEW_W + 20) continue;
      var bob = Math.sin(animTime * 0.7 + m.phase) * 12;
      var drift = Math.cos(animTime * 0.35 + m.phase) * 16;
      var x = m.x + drift;
      var y = m.y + bob;
      var alpha = 0.2 + 0.35 * (0.5 + 0.5 * Math.sin(animTime * 1.8 * m.speed + m.phase));
      var grd = ctx.createRadialGradient(x, y, 0.5, x, y, m.size * 6);
      grd.addColorStop(0, 'rgba(255,244,178,' + alpha + ')');
      grd.addColorStop(1, 'rgba(255,224,133,0)');
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.arc(x, y, m.size * 6, 0, TAU);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,251,208,' + (alpha + 0.1) + ')';
      ctx.beginPath();
      ctx.arc(x, y, m.size, 0, TAU);
      ctx.fill();
    }
    for (i = 0; i < level.leaves.length; i++) {
      var l = level.leaves[i];
      if (l.x < cameraX - 20 || l.x > cameraX + VIEW_W + 20) continue;
      var lx = l.x + Math.sin(animTime * l.speed + l.phase) * 24;
      var ly = l.y + ((animTime * 9 + l.phase * 30) % 90);
      ctx.save();
      ctx.translate(lx, ly);
      ctx.rotate(Math.sin(animTime * 1.3 + l.phase) * 1.4);
      ctx.fillStyle = rgba(theme.leaf, 0.45);
      ctx.beginPath();
      ctx.ellipse(0, 0, l.size, l.size * 0.42, 0.5, 0, TAU);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawHero() {
    if (!hero) return;
    if (dying) {
      // still draw a tumbling fox while the respawn timer runs
    } else if (invuln > 0 && Math.floor(invuln * 14) % 2 === 0) {
      return;
    }
    var footY = hero.y + PHYS.h / 2;
    // shadow on the surface below
    var shadowY = surfaceUnder(hero.x, footY);
    if (shadowY !== null) {
      var airGap = shadowY - footY;
      var sa = clamp(0.26 - airGap * 0.0012, 0.07, 0.26);
      ctx.fillStyle = 'rgba(43,30,24,' + sa + ')';
      ctx.beginPath();
      ctx.ellipse(hero.x, shadowY + 2, 24 - clamp(airGap * 0.035, 0, 15), 5.2, 0, 0, TAU);
      ctx.fill();
    }
    ctx.save();
    ctx.globalAlpha = dying ? 0.72 : 1;
    ctx.translate(hero.x, footY);
    if (hero.dir < 0) ctx.scale(-1, 1);
    if (dying) ctx.rotate(Math.sin(animTime * 12) * 0.16);
    paintFox(ctx, 84, {
      t: animTime,
      run: hero.run,
      moving: Math.abs(hero.vx) > 25 && hero.onGround,
      air: !hero.onGround,
      vy: hero.vy,
      blink: hero.blink < 0 && hero.blink > -0.12 ? 1 : 0,
      happy: phase === 'won' || clearing,
      sad: phase === 'lost'
    });
    ctx.restore();
  }

  function drawParticles() {
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      if (p.x < cameraX - 40 || p.x > cameraX + VIEW_W + 40) continue;
      var alpha = clamp(1 - p.age / p.life, 0, 1);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      if (p.kind === 'confetti') {
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      } else if (p.kind === 'spark') {
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        var q = p.size * 0.38;
        ctx.beginPath();
        ctx.moveTo(0, -p.size);
        ctx.lineTo(q, 0);
        ctx.lineTo(0, p.size);
        ctx.lineTo(-q, 0);
        ctx.closePath();
        ctx.fill();
      } else {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, TAU);
        ctx.fill();
      }
      ctx.restore();
    }
  }

  function drawFloaters() {
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (var i = 0; i < floaters.length; i++) {
      var f = floaters[i];
      var a = clamp(1 - f.age / f.life, 0, 1);
      ctx.globalAlpha = a;
      ctx.fillStyle = f.color;
      setFont(ctx, 17, 'bold');
      ctx.strokeStyle = 'rgba(63,38,24,0.55)';
      ctx.lineWidth = 3;
      ctx.strokeText(f.text, f.x, f.y);
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
  }

  /* ============================================================
   * 12. HUD + SCREEN OVERLAYS
   * ============================================================ */
  function drawHeart(g, x, y, r, fill) {
    g.save();
    g.translate(x, y);
    g.beginPath();
    g.moveTo(0, r * 0.38);
    g.bezierCurveTo(r * 1.12, -r * 0.55, r * 0.62, -r * 1.18, 0, -r * 0.35);
    g.bezierCurveTo(-r * 0.62, -r * 1.18, -r * 1.12, -r * 0.55, 0, r * 0.38);
    g.closePath();
    if (fill) {
      g.fillStyle = '#ef7460';
      g.fill();
      g.strokeStyle = 'rgba(64,35,28,0.65)';
      g.lineWidth = Math.max(1, r * 0.22);
      g.stroke();
      g.fillStyle = 'rgba(255,255,255,0.38)';
      g.beginPath();
      g.ellipse(-r * 0.35, -r * 0.52, r * 0.22, r * 0.14, -0.5, 0, TAU);
      g.fill();
    } else {
      g.fillStyle = 'rgba(255,239,206,0.12)';
      g.fill();
      g.strokeStyle = 'rgba(255,239,206,0.4)';
      g.lineWidth = Math.max(1, r * 0.17);
      g.stroke();
    }
    g.restore();
  }

  function drawTinyAcorn(g, x, y, s) {
    g.save();
    g.translate(x, y);
    g.scale(s / 22, s / 22);
    g.fillStyle = '#dfa04b';
    g.strokeStyle = '#563a26';
    g.lineWidth = 2.2;
    g.beginPath();
    g.ellipse(0, 2, 8, 10, 0, 0, TAU);
    g.fill();
    g.stroke();
    g.fillStyle = '#8d5a33';
    g.beginPath();
    g.ellipse(0, -5, 10, 5, 0, Math.PI, TAU);
    g.fill();
    g.stroke();
    g.strokeStyle = '#5b3a24';
    g.lineWidth = 2;
    g.beginPath();
    g.moveTo(1, -9);
    g.lineTo(3, -13);
    g.stroke();
    g.restore();
  }

  function drawHUD() {
    var u = layout.hudScale;
    var lr = layout.levelRect;
    var pr = layout.progressRect;
    var ar = layout.acornRect;
    var mute = layout.mute;
    var pause = layout.pause;
    var top = layout.hudTop;
    // level & hearts card
    fillRR(ctx, lr.x, lr.y, lr.w, lr.h, 12 * u,
      'rgba(42,30,26,0.68)', 'rgba(255,240,207,0.2)', 1.2);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(255,227,159,0.92)';
    setFont(ctx, 10.5 * u, '600');
    ctx.fillText('第 ' + (levelIndex + 1) + ' / ' + LEVELS.length + ' 关', lr.x + 11 * u, lr.y + 12 * u);
    ctx.fillStyle = '#fff2da';
    setFont(ctx, 13.5 * u, '700');
    ctx.fillText(level.name, lr.x + 11 * u, lr.y + 27 * u);
    var heartR = 6.8 * u;
    var hx = lr.x + lr.w - 11 * u - heartR - (R.hearts - 1) * heartR * 2.15;
    for (var i = 0; i < R.hearts; i++) {
      drawHeart(ctx, hx + i * heartR * 2.15, lr.y + lr.h / 2 + 1, heartR, i < hearts);
    }

    // center progress pill (fox position -> checkpoint -> goal flag)
    if (pr && pr.w >= 110 * u) {
      fillRR(ctx, pr.x, pr.y, pr.w, pr.h, 12 * u,
        'rgba(42,30,26,0.62)', 'rgba(255,240,207,0.18)', 1.1);
      var barX = pr.x + 14 * u;
      var barW = pr.w - 28 * u;
      var barY = pr.y + pr.h * 0.64;
      fillRR(ctx, barX, barY - 3 * u, barW, 6 * u, 3 * u, 'rgba(20,14,12,0.55)');
      var prog = clamp((hero.x - level.startX) / Math.max(1, level.goalX - level.startX), 0, 1);
      if (prog > 0) {
        fillRR(ctx, barX, barY - 3 * u, Math.max(6 * u, barW * prog), 6 * u, 3 * u, '#f2b84b');
      }
      if (checkpoint) {
        var cpProg = clamp((checkpoint.x - level.startX) / Math.max(1, level.goalX - level.startX), 0, 1);
        ctx.fillStyle = checkpoint.reached ? '#8ef5a2' : 'rgba(255,239,204,0.45)';
        ctx.beginPath();
        ctx.arc(barX + barW * cpProg, barY, 4 * u, 0, TAU);
        ctx.fill();
      }
      ctx.fillStyle = '#ff9852';
      ctx.beginPath();
      ctx.arc(barX + barW * prog, barY, 5 * u, 0, TAU);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,238,200,0.88)';
      setFont(ctx, 10.5 * u, '600');
      ctx.textAlign = 'center';
      ctx.fillText('路程 ' + Math.round(prog * 100) + '% · ' + formatTime(totalTime), pr.x + pr.w / 2, pr.y + 12 * u);
    }

    // acorn & golden acorn counter
    fillRR(ctx, ar.x, ar.y, ar.w, ar.h, 12 * u,
      'rgba(42,30,26,0.64)', 'rgba(255,240,207,0.18)', 1.1);
    drawTinyAcorn(ctx, ar.x + 15 * u, ar.y + ar.h / 2 + 1, 12 * u);
    ctx.fillStyle = '#fff2d5';
    setFont(ctx, 13.5 * u, '700');
    ctx.textAlign = 'left';
    ctx.fillText('× ' + score, ar.x + 26 * u, ar.y + ar.h / 2 + 1);
    if (goldenCollected > 0) {
      ctx.fillStyle = '#ffd84d';
      setFont(ctx, 11 * u, '700');
      ctx.textAlign = 'right';
      ctx.fillText('★' + goldenCollected, ar.x + ar.w - 10 * u, ar.y + ar.h / 2 + 1);
    }

    // mute button
    if (mute) {
      var mcx = mute.x + mute.w / 2;
      var mcy = mute.y + mute.h / 2;
      ctx.fillStyle = 'rgba(42,30,26,0.65)';
      ctx.strokeStyle = 'rgba(255,240,207,0.22)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.arc(mcx, mcy, mute.r, 0, TAU);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#fff1d3';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      setFont(ctx, 13 * u, '700');
      ctx.fillText(muted ? '🔇' : '🔊', mcx, mcy + 1);
    }

    // pause button
    var pcx = pause.x + pause.w / 2;
    var pcy = pause.y + pause.h / 2;
    ctx.fillStyle = 'rgba(42,30,26,0.65)';
    ctx.strokeStyle = 'rgba(255,240,207,0.22)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.arc(pcx, pcy, pause.r, 0, TAU);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#fff1d3';
    ctx.fillRect(pcx - pause.r * 0.28, pcy - pause.r * 0.36, pause.r * 0.18, pause.r * 0.72);
    ctx.fillRect(pcx + pause.r * 0.1, pcy - pause.r * 0.36, pause.r * 0.18, pause.r * 0.72);

    // control hint (first seconds)
    if (hintTimer > 0 && phase === 'playing' && !clearing) {
      var alpha = clamp(Math.min(hintTimer / 0.8, (6.2 - hintTimer) / 0.5 + 0.2), 0, 1);
      var text = layout.showTouch ? '左下移动 · 右下二段跳与冲刺' : '← → 移动 · 空格二段跳 · Shift 冲刺 · P 暂停';
      ctx.globalAlpha = alpha;
      setFont(ctx, 12.5 * u, '600');
      var w = ctx.measureText(text).width + 30 * u;
      var hx2 = layout.game.x + layout.game.w / 2;
      var hy = layout.portrait ? layout.game.y + 18 : top + 46 * u;
      fillRR(ctx, hx2 - w / 2, hy, w, 26 * u, 13 * u, 'rgba(35,26,23,0.54)');
      ctx.fillStyle = 'rgba(255,246,223,0.92)';
      ctx.textAlign = 'center';
      ctx.fillText(text, hx2, hy + 13 * u);
      ctx.textAlign = 'left';
      ctx.globalAlpha = 1;
    }
  }

  function drawLevelIntro() {
    if (phase !== 'playing' || clearing || introTimer <= 0) return;
    var u = layout.hudScale;
    var alpha = clamp(Math.min(1, introTimer / 0.45, (2.35 - introTimer) / 0.25 + 0.25), 0, 1);
    var cx = layout.game.x + layout.game.w / 2;
    var cy = layout.game.y + layout.game.h * 0.26;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    setFont(ctx, 15 * u, '600');
    ctx.fillStyle = 'rgba(255,232,167,0.95)';
    ctx.fillText('第 ' + (levelIndex + 1) + ' 关', cx, cy - 20 * u);
    setFont(ctx, 29 * u, '700');
    ctx.lineWidth = 5 * u;
    ctx.strokeStyle = 'rgba(45,29,22,0.58)';
    ctx.strokeText(level.name, cx, cy + 8 * u);
    ctx.fillStyle = '#fff5dc';
    ctx.fillText(level.name, cx, cy + 8 * u);
    setFont(ctx, 13 * u, '500');
    ctx.fillStyle = 'rgba(255,239,203,0.8)';
    ctx.fillText(level.subtitle, cx, cy + 35 * u);
    ctx.textAlign = 'left';
    ctx.restore();
  }

  function drawTouchControls() {
    if (!layout.showTouch || phase !== 'playing' || clearing || paused) return;
    for (var i = 0; i < layout.controls.length; i++) {
      var c = layout.controls[i];
      var active = c.action === 'jump' ? touchState.jump :
        c.action === 'dash' ? (touchState.dash || hero.dashTimer > 0) :
        c.action === 'left' ? touchState.left : touchState.right;
      var r = c.r;
      var cooling = c.action === 'dash' && hero.dashCooldown > 0 && hero.dashTimer <= 0;
      ctx.save();
      ctx.globalAlpha = active ? 0.92 : (cooling ? 0.42 : 0.62);
      ctx.fillStyle = active ? 'rgba(239,190,91,0.82)' : 'rgba(35,27,32,0.56)';
      ctx.strokeStyle = active ? 'rgba(255,244,194,0.95)' : 'rgba(255,240,213,0.48)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(c.x, c.y, r, 0, TAU);
      ctx.fill();
      ctx.stroke();
      if (cooling) {
        var frac = clamp(1 - hero.dashCooldown / 1.45, 0, 1);
        ctx.strokeStyle = '#ffae52';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(c.x, c.y, r, -Math.PI / 2, -Math.PI / 2 + TAU * frac);
        ctx.stroke();
      }
      ctx.globalAlpha = active ? 1 : 0.86;
      if (c.action === 'jump') {
        ctx.fillStyle = '#fff4d7';
        setFont(ctx, 16 * clamp(r / 36, 0.9, 1.3), '700');
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('跳', c.x, c.y + 2);
        ctx.strokeStyle = 'rgba(255,244,215,0.65)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(c.x - r * 0.25, c.y - r * 0.18);
        ctx.lineTo(c.x, c.y - r * 0.36);
        ctx.lineTo(c.x + r * 0.25, c.y - r * 0.18);
        ctx.stroke();
      } else if (c.action === 'dash') {
        ctx.fillStyle = '#ffe5b8';
        setFont(ctx, 15 * clamp(r / 34, 0.9, 1.25), '700');
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('冲', c.x, c.y + 1);
      } else {
        var dir = c.action === 'left' ? -1 : 1;
        ctx.fillStyle = '#fff3d2';
        ctx.beginPath();
        ctx.moveTo(c.x + dir * r * 0.34, c.y);
        ctx.lineTo(c.x - dir * r * 0.17, c.y - r * 0.34);
        ctx.lineTo(c.x - dir * r * 0.17, c.y + r * 0.34);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    }
  }

  function drawPauseOverlay() {
    if (!paused || phase !== 'playing') return;
    var W = cssW;
    var H = cssH;
    ctx.fillStyle = 'rgba(22,16,20,0.55)';
    ctx.fillRect(0, 0, W, H);
    var cw = Math.min(370, W - 32);
    var ch = Math.min(206, H - 40);
    var x = (W - cw) / 2;
    var y = (H - ch) / 2;
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.35)';
    ctx.shadowBlur = 22;
    ctx.shadowOffsetY = 8;
    fillRR(ctx, x, y, cw, ch, 22, '#f8ecd3', '#3d2b22', 2.5);
    ctx.restore();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    var u = clamp(cw / 370, 0.8, 1.15);
    ctx.fillStyle = '#38271f';
    setFont(ctx, 31 * u, '700');
    ctx.fillText('暂停中', W / 2, y + 50 * u);
    ctx.fillStyle = '#7b6452';
    setFont(ctx, 14 * u, '500');
    ctx.fillText('按 P / Esc 或点击屏幕继续', W / 2, y + 95 * u);
    fillRR(ctx, W / 2 - 74 * u, y + 124 * u, 148 * u, 46 * u, 23 * u, '#e8a846', '#493224', 2);
    ctx.fillStyle = '#3a281d';
    setFont(ctx, 17 * u, '700');
    ctx.fillText('继续冒险', W / 2, y + 148 * u);
    ctx.textAlign = 'left';
  }

  function drawLevelClearOverlay() {
    if (!clearing) return;
    var W = cssW;
    var H = cssH;
    var fade = clamp(clearTimer / 0.35, 0, 1);
    ctx.save();
    ctx.globalAlpha = 0.75 * fade;
    ctx.fillStyle = 'rgba(24,18,22,1)';
    ctx.fillRect(0, 0, W, H);
    ctx.restore();

    var cw = Math.min(450, W - 32);
    var ch = Math.min(238, H - 36);
    var x = (W - cw) / 2;
    var y = (H - ch) / 2;
    var u = clamp(cw / 450, 0.76, 1.1);
    ctx.save();
    ctx.globalAlpha = fade;
    ctx.shadowColor = 'rgba(0,0,0,0.35)';
    ctx.shadowBlur = 24;
    ctx.shadowOffsetY = 8;
    fillRR(ctx, x, y, cw, ch, 24, '#f9edd4', '#3b2a21', 2.5);
    ctx.restore();
    ctx.globalAlpha = fade;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    var cx = W / 2;
    // gold seal
    ctx.fillStyle = '#eab653';
    ctx.strokeStyle = '#4c3423';
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.arc(cx, y + 43 * u, 23 * u, 0, TAU);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#fff4d0';
    setFont(ctx, 19 * u, '700');
    ctx.fillText('✓', cx, y + 44 * u);
    ctx.fillStyle = '#37251d';
    setFont(ctx, 29 * u, '700');
    ctx.fillText('第 ' + (levelIndex + 1) + ' 关 完成', cx, y + 92 * u);
    ctx.fillStyle = '#7b614d';
    setFont(ctx, 15 * u, '500');
    ctx.fillText('收集了 ' + (score - levelStartScore) + ' 颗橡果 · 心之力量已恢复', cx, y + 126 * u);
    ctx.fillStyle = '#c45b3f';
    setFont(ctx, 15 * u, '700');
    if (levelIndex < LEVELS.length - 1) {
      ctx.fillText('下一关 · ' + LEVELS[levelIndex + 1].name, cx, y + 158 * u);
    } else {
      ctx.fillText('最后一关完成！', cx, y + 158 * u);
    }
    // progress dots
    var dotCount = LEVELS.length;
    var dotSpan = (dotCount - 1) * 18 * u;
    for (var i = 0; i < dotCount; i++) {
      ctx.beginPath();
      ctx.arc(cx - dotSpan / 2 + i * 18 * u, y + 190 * u, 5 * u, 0, TAU);
      ctx.fillStyle = i <= levelIndex ? '#e2a646' : 'rgba(72,49,35,0.18)';
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
  }

  function drawTitleArt(x, y, w, h, theme) {
    ctx.save();
    rrPath(ctx, x, y, w, h, 18);
    ctx.clip();
    var sky = ctx.createLinearGradient(0, y, 0, y + h);
    sky.addColorStop(0, '#8fcde0');
    sky.addColorStop(0.58, '#f4dfb5');
    sky.addColorStop(1, '#f7bf82');
    ctx.fillStyle = sky;
    ctx.fillRect(x, y, w, h);

    // sun
    var sunX = x + w * 0.77;
    var sunY = y + h * 0.21;
    var sg = ctx.createRadialGradient(sunX, sunY, 5, sunX, sunY, h * 0.29);
    sg.addColorStop(0, 'rgba(255,238,169,0.85)');
    sg.addColorStop(0.45, 'rgba(255,225,144,0.23)');
    sg.addColorStop(1, 'rgba(255,225,144,0)');
    ctx.fillStyle = sg;
    ctx.beginPath();
    ctx.arc(sunX, sunY, h * 0.29, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#ffe9a4';
    ctx.beginPath();
    ctx.arc(sunX, sunY, h * 0.1, 0, TAU);
    ctx.fill();

    // clouds
    ctx.fillStyle = 'rgba(255,251,234,0.7)';
    ctx.beginPath();
    ctx.ellipse(x + w * 0.24, y + h * 0.2, w * 0.14, h * 0.035, 0, 0, TAU);
    ctx.ellipse(x + w * 0.3, y + h * 0.18, w * 0.1, h * 0.04, 0, 0, TAU);
    ctx.ellipse(x + w * 0.58, y + h * 0.3, w * 0.12, h * 0.028, 0, 0, TAU);
    ctx.fill();

    // far hills
    ctx.fillStyle = '#b7d3ae';
    var hillBase = y + h * 0.69;
    ctx.beginPath();
    ctx.moveTo(x - 20, hillBase);
    for (var i = 0; i <= 20; i++) {
      var hx = x + (i / 20) * w;
      var hy = hillBase - Math.sin(i * 0.75 + 0.7) * h * 0.075;
      ctx.lineTo(hx, hy);
    }
    ctx.lineTo(x + w + 20, y + h);
    ctx.lineTo(x - 20, y + h);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#8bbf84';
    ctx.beginPath();
    ctx.moveTo(x - 20, y + h * 0.79);
    for (i = 0; i <= 20; i++) {
      hx = x + (i / 20) * w;
      hy = y + h * 0.79 - Math.sin(i * 0.58 + 2.3) * h * 0.05;
      ctx.lineTo(hx, hy);
    }
    ctx.lineTo(x + w + 20, y + h);
    ctx.lineTo(x - 20, y + h);
    ctx.closePath();
    ctx.fill();

    // grassy floor
    var gy = y + h * 0.82;
    ctx.fillStyle = '#7bae58';
    ctx.beginPath();
    ctx.moveTo(x - 20, y + h);
    ctx.lineTo(x - 20, gy);
    for (i = 0; i <= 18; i++) {
      hx = x + (i / 18) * w;
      hy = gy + Math.sin(i * 1.1) * 2;
      ctx.lineTo(hx, hy);
    }
    ctx.lineTo(x + w + 20, y + h);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#5d8e46';
    ctx.fillRect(x - 20, gy + h * 0.07, w + 40, h * 0.06);

    // a little flag on the right
    var fx = x + w * 0.77;
    var fBase = gy + h * 0.015;
    var fTop = y + h * 0.27;
    ctx.strokeStyle = '#59402b';
    ctx.lineWidth = Math.max(3, w * 0.009);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(fx, fBase);
    ctx.lineTo(fx, fTop);
    ctx.stroke();
    var wave = Math.sin(animTime * 3.2) * h * 0.008;
    ctx.fillStyle = '#dd6045';
    ctx.beginPath();
    ctx.moveTo(fx + 2, fTop + 2);
    ctx.quadraticCurveTo(fx + w * 0.16, fTop - 5 + wave, fx + w * 0.26, fTop + 10 + wave);
    ctx.lineTo(fx + w * 0.24, fTop + h * 0.14 + wave);
    ctx.quadraticCurveTo(fx + w * 0.12, fTop + h * 0.12 - wave, fx + 2, fTop + h * 0.16);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#5a3325';
    ctx.lineWidth = Math.max(1.5, w * 0.005);
    ctx.stroke();

    // acorns
    paintAcorn(ctx, x + w * 0.2, y + h * 0.74 + Math.sin(animTime * 2 + 1) * 3, Math.min(w, h) * 0.12, animTime);
    paintAcorn(ctx, x + w * 0.88, y + h * 0.78 + Math.sin(animTime * 2 + 2.5) * 3, Math.min(w, h) * 0.08, animTime);

    // fox
    var foxSize = Math.min(w * 0.52, h * 0.62);
    ctx.save();
    ctx.translate(x + w * 0.47, gy + 2);
    ctx.fillStyle = 'rgba(45,33,25,0.16)';
    ctx.beginPath();
    ctx.ellipse(2, 2, foxSize * 0.3, 5, 0, 0, TAU);
    ctx.fill();
    paintFox(ctx, foxSize, {
      t: animTime, moving: false, air: false,
      blink: Math.sin(animTime * 0.9) > 0.965 ? 1 : 0,
      happy: true
    });
    ctx.restore();

    // little foreground grass
    ctx.strokeStyle = '#4f7f3c';
    ctx.lineWidth = Math.max(1.4, w * 0.004);
    for (i = 0; i < 12; i++) {
      var gx = x + 14 + ((i * 71 + 23) % Math.max(20, w - 28));
      ctx.beginPath();
      ctx.moveTo(gx, y + h);
      ctx.quadraticCurveTo(gx - 4, y + h - h * 0.07, gx + 3, y + h - h * 0.12);
      ctx.stroke();
    }
    ctx.restore();
    // art border
    ctx.strokeStyle = 'rgba(77,53,37,0.28)';
    ctx.lineWidth = 1.5;
    rrPath(ctx, x, y, w, h, 18);
    ctx.stroke();
  }

  function drawTitleScreen() {
    if (phase !== 'title') return;
    var W = cssW;
    var H = cssH;
    ctx.fillStyle = 'rgba(19,15,16,0.46)';

    vg.addColorStop(0, 'rgba(17,14,18,0.24)');

    vg.addColorStop(1, 'rgba(17,14,18,0.42)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);

    var portrait = H > W * 1.04;
    var miniLandscape = !portrait && (H < 532 || W < 800);
    var cardW, cardH, cardX, cardY;
    if (portrait) {
      cardW = Math.min(W - 24, 440);
      cardH = Math.min(H - 32, 600);
      cardX = (W - cardW) / 2;
      cardY = (H - cardH) / 2;
    } else if (miniLandscape) {
      cardW = Math.min(W - 24, 860);
      cardH = Math.min(H - 20, 400);
      cardX = (W - cardW) / 2;
      cardY = (H - cardH) / 2;
    } else {

    var u = portrait ? clamp(cardW / 390, 0.82, 1.1) :
      miniLandscape ? clamp(Math.min(cardW / 860, cardH / 400), 0.66, 1.05) :

    var contentCx = cardX + cardW / 2;

      var y = artY + artH + 30 * u;
      // tag

      setFont(ctx, 12 * u, '600');

      fillRR(ctx, contentCx - tagW / 2, y - 12 * u, tagW, 25 * u, 12 * u, '#eadcc0');

      ctx.textAlign = 'center';
      var titleSize = fitFont(ctx, '小狐狸闯关', 45 * u, cardW - 34, '700');

      ctx.strokeStyle = 'rgba(255,255,255,0.5)';
      ctx.strokeText('小狐狸闯关', contentCx, y);
      ctx.fillStyle = titleColor;
      ctx.fillText('小狐狸闯关', contentCx, y);
      // warm underline
      ctx.strokeStyle = '#e3a53b';
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(contentCx - titleSize * 1.52, y + titleSize * 0.63);
      ctx.quadraticCurveTo(contentCx, y + titleSize * 0.73, contentCx + titleSize * 1.52, y + titleSize * 0.6);
      ctx.stroke();
      y += titleSize * 1.3;

      ctx.fillStyle = subColor;
      setFont(ctx, 13.5 * u, '500');
      ctx.fillText('跳过深坑与尖刺，踩扁森林刺刺怪，夺下终点旗', contentCx, y);
      y += 33 * u;

      // control rows
      var boxW = Math.min(cardW - 44, 320);

      fillRR(ctx, boxX, y, boxW, 68 * u, 12 * u, '#f1e4cc');
      ctx.textAlign = 'left';
      drawKeyCap(boxX + 16 * u, y + 17 * u, '←', 20 * u, u);
      drawKeyCap(boxX + 48 * u, y + 17 * u, '→', 20 * u, u);
      ctx.fillStyle = '#554334';
      setFont(ctx, 13 * u, '600');
      ctx.fillText('左右移动', boxX + 78 * u, y + 19 * u);
      drawKeyCap(boxX + 16 * u, y + 46 * u, '跳', 26 * u, u);
      ctx.fillStyle = '#554334';
      setFont(ctx, 13 * u, '600');
      ctx.fillText('二段跳 + 冲刺跨越断崖', boxX + 54 * u, y + 48 * u);
      y += 86 * u;

      ctx.textAlign = 'center';
      ctx.fillStyle = '#8b7058';
      setFont(ctx, 12 * u, '500');
      ctx.fillText('林间小径 · 蘑菇幽谷 · 浮云遗迹 · 落日悬崖', contentCx, y);
      y += 27 * u;

      drawStartButton(contentCx, y, Math.min(cardW - 80, 220) * u, 51 * u, u, portrait);
      y += 67 * u;
      ctx.fillStyle = '#9a8167';
      setFont(ctx, 11.5 * u, '500');
      ctx.fillText(layout.showTouch ? '点击屏幕开始 · 横屏游玩视野更开阔' : '按任意键 / 点击屏幕开始 · P 暂停', contentCx, y);
    } else if (miniLandscape) {
      var artX2 = cardX + 14;
      var artY2 = cardY + 14;
      var artW2 = Math.min(cardW * 0.34, 280);
      var artH2 = cardH - 28;
      drawTitleArt(artX2, artY2, artW2, artH2, THEMES[0]);

      var mcx = artX2 + artW2 + 32 * u;
      var mcw = cardX + cardW - 28 - mcx;
      var my = cardY + 42 * u;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';

      ctx.fillStyle = '#92755a';
      setFont(ctx, 11.5 * u, '600');
      ctx.fillText('森林冒险 · 4 个关卡 · 二段跳与冲刺', mcx, my);
      my += 33 * u;

      var mTitle = fitFont(ctx, '小狐狸闯关', 47 * u, mcw, '700');
      ctx.fillStyle = titleColor;
      ctx.fillText('小狐狸闯关', mcx, my);
      ctx.strokeStyle = '#e3a53b';
      ctx.lineWidth = 3.5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(mcx + 2, my + mTitle * 0.62);
      ctx.quadraticCurveTo(mcx + mcw * 0.24, my + mTitle * 0.74, mcx + mcw * 0.56, my + mTitle * 0.58);
      ctx.stroke();
      my += mTitle * 0.95 + 22 * u;

      var subSize = fitFont(ctx, '跳过深坑与尖刺，踩扁刺刺怪，收集金橡果抵达终点。', 13 * u, mcw, '500');
      ctx.fillStyle = subColor;
      ctx.fillText('跳过深坑与尖刺，踩扁刺刺怪，收集金橡果抵达终点。', mcx, my);
      my += subSize + 24 * u;

      if (layout.showTouch) {
        drawKeyCap(mcx, my, '←', 22 * u, u);
        drawKeyCap(mcx + 29 * u, my, '→', 22 * u, u);
        ctx.fillStyle = '#554334';
        setFont(ctx, 12 * u, '600');
        ctx.fillText('屏幕移动', mcx + 61 * u, my + 1);
        drawKeyCap(mcx + 134 * u, my, '跳/冲', 44 * u, u);
        ctx.fillStyle = '#554334';
        ctx.fillText('二段跳与冲刺', mcx + 186 * u, my + 1);
      } else {
        drawKeyCap(mcx, my, '←', 22 * u, u);
        drawKeyCap(mcx + 29 * u, my, '→', 22 * u, u);
        ctx.fillStyle = '#554334';
        setFont(ctx, 12 * u, '600');
        ctx.fillText('移动', mcx + 61 * u, my + 1);
        drawKeyCap(mcx + 121 * u, my, '空格', 48 * u, u);
        ctx.fillStyle = '#554334';
        ctx.fillText('跳跃', mcx + 180 * u, my + 1);
      }
      my += 33 * u;

      ctx.fillStyle = '#8b7058';
      setFont(ctx, 11 * u, '500');
      ctx.fillText('01 林间小径 · 02 蘑菇幽谷 · 03 浮云遗迹 · 04 落日悬崖', mcx, my);
      my += 25 * u;

      drawStartButton(mcx + mcw / 2, my, Math.min(206 * u, mcw), 44 * u, u, true);
      my += 44 * u;
      ctx.fillStyle = '#9a8167';
      setFont(ctx, 10.5 * u, '500');
      ctx.textAlign = 'center';
      ctx.fillText(layout.showTouch ? '点击屏幕开始冒险 · 横屏更开阔' : '按任意键 / 点击屏幕开始', mcx + mcw / 2, my + 22 * u);
      ctx.textAlign = 'left';
    } else {
      var leftX = cardX + 18;
      var leftY = cardY + 18;
      var leftW = cardW * 0.39 - 18;
      var leftH = cardH - 36;
      drawTitleArt(leftX, leftY, leftW, leftH, THEMES[0]);

      var cx = cardX + cardW * 0.43;
      var cw = cardW - (cx - cardX) - 42;
      var yy = cardY + 52;
      var tagText2 = '森林冒险 · 4 个关卡 · 二段跳与冲刺';
      setFont(ctx, 12 * u, '600');
      var tagW2 = ctx.measureText(tagText2).width + 26 * u;
      fillRR(ctx, cx, yy - 14 * u, tagW2, 27 * u, 13 * u, '#eadcc0');
      ctx.fillStyle = '#7c634a';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText(tagText2, cx + 13 * u, yy);

      yy += 56 * u;
      var titleSize2 = fitFont(ctx, '小狐狸闯关', 53 * u, cw, '700');
      ctx.fillStyle = titleColor;
      ctx.fillText('小狐狸闯关', cx, yy);
      ctx.strokeStyle = '#e3a53b';
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(cx + 4, yy + titleSize2 * 0.62);
      ctx.quadraticCurveTo(cx + cw * 0.28, yy + titleSize2 * 0.74, cx + cw * 0.56, yy + titleSize2 * 0.58);

      yy += titleSize2 * 1.44;

      ctx.fillStyle = subColor;
      setFont(ctx, 15.5 * u, '500');
      ctx.fillText('跳过深坑与尖刺，踩扁刺刺怪，收集金橡果抵达终点。', cx, yy);

      ctx.fillStyle = '#554334';
      setFont(ctx, 14 * u, '600');
      ctx.fillText('移动', cx + 74 * u, yy + 2 * u);

      setFont(ctx, 12 * u, '500');
      ctx.fillText('A / D 移动 · Shift / K 冲刺', cx + 122 * u, yy + 2 * u);
      yy += 37 * u;

      drawKeyCap(cx, yy, '空格', 56 * u, u);
      drawKeyCap(cx + 69 * u, yy, '↑', 25 * u, u);
      ctx.fillStyle = '#554334';
      setFont(ctx, 14 * u, '600');
      ctx.fillText('跳跃 / 二段跳', cx + 108 * u, yy + 2 * u);

      ctx.textAlign = 'left';

    // decorative little corner leaves
    ctx.strokeStyle = 'rgba(111,143,76,0.45)';

    ctx.beginPath();

    ctx.quadraticCurveTo(cardX + 8, cardY + cardH - 46, cardX + 26, cardY + cardH - 58);
    ctx.stroke();
  }

  function drawKeyCap(x, centerY, label, width, u) {
    var h = 25 * u;
    ctx.fillStyle = '#e7d8bf';
    ctx.strokeStyle = 'rgba(85,64,44,0.25)';
    ctx.lineWidth = 1;
    rrPath(ctx, x, centerY - h / 2, width, h, 6 * u);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#594534';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    setFont(ctx, 12.5 * u, '700');
    ctx.fillText(label, x + width / 2, centerY + 1);
    ctx.textAlign = 'left';
  }

  function drawStartButton(cx, y, w, h, u, compact, label) {
    var pulse = 0.5 + Math.sin(animTime * 2.5) * 0.5;
    ctx.save();
    ctx.shadowColor = 'rgba(139,82,34,0.32)';
    ctx.shadowBlur = 12 + pulse * 6;
    ctx.shadowOffsetY = 4;
    var grd = ctx.createLinearGradient(0, y, 0, y + h);
    grd.addColorStop(0, '#f6c65a');
    grd.addColorStop(1, '#e8a23d');
    fillRR(ctx, cx - w / 2, y, w, h, h / 2, grd, '#49301f', 2.2);
    ctx.restore();
    ctx.fillStyle = '#3b271b';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    setFont(ctx, (compact ? 17 : 18) * u, '700');
    ctx.fillText(label || '开始冒险  →', cx, y + h / 2 + 1);
    ctx.textAlign = 'left';
  }

  function drawResultScreen() {
    if (phase !== 'won' && phase !== 'lost') return;
    var won = phase === 'won';
    var W = cssW;
    var H = cssH;
    ctx.fillStyle = 'rgba(18,14,19,0.55)';
    ctx.fillRect(0, 0, W, H);
    var cw = Math.min(560, W - 32);
    var ch = Math.min(444, H - 34);
    var x = (W - cw) / 2;
    var y = (H - ch) / 2;
    var u = clamp(cw / 560, 0.74, 1.15);
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.42)';
    ctx.shadowBlur = 26;
    ctx.shadowOffsetY = 10;
    fillRR(ctx, x, y, cw, ch, 24, '#faf0dc', '#3c2a22', 2.5);
    ctx.restore();

    var artH = ch * 0.33;
    var artX = x + 12;
    var artY = y + 12;
    var artW = cw - 24;
    ctx.save();
    rrPath(ctx, artX, artY, artW, artH, 16);
    ctx.clip();
    var g = ctx.createLinearGradient(0, artY, 0, artY + artH);
    if (won) {
      g.addColorStop(0, '#f9d985');
      g.addColorStop(1, '#edb86a');
    } else {
      g.addColorStop(0, '#c7d8ca');
      g.addColorStop(1, '#e7c49e');
    }
    ctx.fillStyle = g;
    ctx.fillRect(artX, artY, artW, artH);
    // little confetti / rain
    var rng = mulberry32(won ? 44 : 71);
    for (var c = 0; c < 18; c++) {
      var px = artX + rng() * artW;
      var py = artY + rng() * artH * 0.72;
      ctx.fillStyle = won ? (c % 2 ? '#fff4c8' : '#e36b4d') : 'rgba(111,134,115,0.26)';
      ctx.save();
      ctx.translate(px, py);
      ctx.rotate(rng() * TAU);
      ctx.fillRect(-3, -1.5, 6, 3);
      ctx.restore();
    }
    var foxSize = Math.min(artH * 0.9, 138 * u);
    ctx.translate(W / 2, artY + artH - 8);
    ctx.fillStyle = 'rgba(55,39,27,0.13)';
    ctx.beginPath();
    ctx.ellipse(0, 2, foxSize * 0.32, 6, 0, 0, TAU);
    ctx.fill();
    paintFox(ctx, foxSize, {
      t: animTime, moving: false, air: false,
      blink: won ? (Math.sin(animTime * 0.8) > 0.96 ? 1 : 0) : 0,
      happy: won, sad: !won
    });
    ctx.restore();

    var baseY = artY + artH + 31 * u;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#3b281f';
    var resultTitle = won ? '四关全部通过！' : '小狐狸累坏了';
    var titleSize = fitFont(ctx, resultTitle, 33 * u, cw - 44, '700');
    ctx.fillText(resultTitle, W / 2, baseY);
    baseY += titleSize * 0.9;
    ctx.fillStyle = '#7a614c';
    setFont(ctx, 14 * u, '500');
    ctx.fillText(won ? '四面终点旗都找到了，狐狸尾巴都要摇上天啦。' : '别灰心，再试一次就能跳过那道深坑。', W / 2, baseY);
    baseY += 30 * u;
    ctx.fillStyle = won ? '#b5752b' : '#8b6b53';
    setFont(ctx, 13 * u, '600');
    if (won) {
      ctx.fillText('橡果 ' + winScore + ' 颗 · 金橡果 ★' + goldenCollected + ' · 踩怪 ' + crittersStomped + ' · 用时 ' + formatTime(winTime), W / 2, baseY);
    } else {
      ctx.fillText('第 ' + (levelIndex + 1) + ' 关 · ' + level.name + '   ·   橡果 ' + score + ' 颗', W / 2, baseY);
    }
    baseY += 36 * u;
    var btnW = Math.min(210, cw - 90);
    var btnH = 49 * u;
    var btnY = baseY;
    ctx.save();
    ctx.globalAlpha = restartGuard > 0 ? 0.65 : 1;
    drawStartButton(W / 2, btnY, btnW, btnH, u, true, won ? '再玩一次  ↻' : '再试一次  →');
    ctx.restore();
    ctx.fillStyle = '#997f65';
    setFont(ctx, 11.5 * u, '500');
    ctx.fillText(won ? '按任意键 / 点击屏幕再玩一次' : '按任意键 / 点击屏幕重试本关', W / 2, btnY + btnH + 24 * u);
    ctx.textAlign = 'left';
  }

  function drawTitleScreenSafe() {
    drawTitleScreen();
  }

  /* ============================================================
   * 13. MAIN RENDER
   * ============================================================ */
  function render() {
    setScreenTransform();
    ctx.fillStyle = '#17120f';
    ctx.fillRect(0, 0, cssW, cssH);
    // Background fill for letterboxing
    var bg = ctx.createLinearGradient(0, 0, 0, cssH);
    bg.addColorStop(0, '#211914');
    bg.addColorStop(1, '#120f11');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, cssW, cssH);

    // world viewport
    var shakeX = 0, shakeY = 0;
    if (shake > 0) {
      shakeX = Math.sin(animTime * 73) * shake * 9;
      shakeY = Math.cos(animTime * 89) * shake * 6;
    }
    setViewTransform(0, 0);
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, VIEW_W, VIEW_H);
    ctx.clip();
    drawSkyScene();

    ctx.save();
    ctx.translate(-cameraX + shakeX, shakeY);
    drawPitAbyss();
    drawMotes();
    drawGroundSegments();
    drawDecor();
    drawStartSign();
    drawCheckpoint();
    drawPlatforms();
    drawMushrooms();
    drawGoal();
    drawSpikes();
    drawCritters();
    drawAcorns();
    drawAfterimages();
    drawHero();
    drawParticles();
    drawFloaters();
    ctx.restore();

    // a light vignette inside the play area
    var vig = ctx.createRadialGradient(VIEW_W / 2, VIEW_H * 0.48, VIEW_H * 0.24, VIEW_W / 2, VIEW_H * 0.48, VIEW_W * 0.72);
    vig.addColorStop(0, 'rgba(34,22,17,0)');
    vig.addColorStop(1, 'rgba(34,22,17,0.2)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    ctx.restore();

    // damage / celebration colour wash
    if (flash > 0) {
      setViewTransform(0, 0);
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, 0, VIEW_W, VIEW_H);
      ctx.clip();
      ctx.fillStyle = 'rgba(210,73,51,' + (flash * 0.3) + ')';
      ctx.fillRect(0, 0, VIEW_W, VIEW_H);
      ctx.restore();
    }

    // HUD, touch controls and overlays live in CSS-pixel space.
    setScreenTransform();
    if (phase === 'playing' && !clearing && !paused) {
      drawHUD();
      drawTouchControls();
      drawLevelIntro();
    }
    if (phase === 'playing' && clearing) {
      drawHUD();
      drawLevelClearOverlay();
    }
    if (phase === 'playing' && paused) {
      drawHUD();
      drawPauseOverlay();
    }
    if (phase === 'title') {
      drawTitleScreenSafe();
    } else if (phase === 'won' || phase === 'lost') {
      drawResultScreen();
    }

    // subtle frame around the view
    if (view.x > 1 || view.y > 1) {
      ctx.strokeStyle = 'rgba(255,240,208,0.08)';
      ctx.lineWidth = 1;
      ctx.strokeRect(layout.game.x, layout.game.y, layout.game.w, layout.game.h);
    }
  }

  /* ============================================================
   * 14. LOOP / RESIZE / BOOT / INTROSPECTION
   * ============================================================ */
  function frame(now) {
    requestAnimationFrame(frame);
    if (!lastFrame) lastFrame = now;
    var raw = Math.max(0, (now - lastFrame) / 1000);
    lastFrame = now;
    var dt = Math.min(0.05, raw);
    fpsFrames++;
    fpsAccum += dt;
    if (fpsAccum >= 0.5) {
      fps = Math.round(fpsFrames / fpsAccum);
      fpsFrames = 0;
      fpsAccum = 0;
    }
    if (!paused) {
      // fixed-step updates keep collisions reliable on slow phones
      var steps = 0;
      var acc = Math.min(dt, 0.048);
      while (acc >= 1 / 120 && steps < 8) {
        update(1 / 120);
        acc -= 1 / 120;
        steps++;
      }
      if (steps === 0 && dt > 0) update(dt);
    }
    render();
  }

  function resize() {
    cssW = window.innerWidth || canvas.clientWidth || 960;
    cssH = window.innerHeight || canvas.clientHeight || 540;
    dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';
    var s = Math.min(cssW / VIEW_W, cssH / VIEW_H);
    view.scale = s;
    view.x = (cssW - VIEW_W * s) / 2;
    view.y = (cssH - VIEW_H * s) / 2;
    view.w = VIEW_W;
    view.h = VIEW_H;
    updateLayout();
  }

  window.__renderSlots = function (size) {
    size = size || 256;
    var out = {};
    ['hero', 'enemy', 'pickup', 'flag'].forEach(function (key) {
      var c = document.createElement('canvas');
      c.width = size;
      c.height = size;
      var g = c.getContext('2d');
      g.translate(size / 2, size / 2);
      drawCharacter(g, key, size * 0.86);
      out[key] = c.toDataURL('image/png');
    });
    return out;
  };

  var rendersPosted = false;
  function notifyRenders() {
    if (rendersPosted) return;
    rendersPosted = true;
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({
          source: 'dsh-game-studio',
          type: 'renders',
          renders: window.__renderSlots(256)
        }, '*');
      }
    } catch (e) {
      postError('character renders failed: ' + (e && e.message || e));
    }
  }

  function postState() {
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({
          source: 'dsh-game-studio',
          type: 'state',
          phase: phase,
          score: score
        }, '*');
      }
    } catch (e) {}
  }
  function postError(message) {
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({
          source: 'dsh-game-studio',
          type: 'error',
          message: String(message).slice(0, 300)
        }, '*');
      }
    } catch (e) {}
  }

  /* The studio's playtest autopilot calls this about ten times a second.
   * It drives the same jump buffer as the keyboard, so it never bypasses
   * the platforming rules; it only reads the next gap and thorn row. */
  function autoSupportSegment() {
    var left = hero.x - PHYS.w / 2 + 5;
    var right = hero.x + PHYS.w / 2 - 5;
    for (var i = 0; i < level.ground.length; i++) {
      var g = level.ground[i];
      if (right > g.x && left < g.x + g.w) return g;
    }
    return null;
  }
  function autoJumpIfNeeded() {
    var front = hero.x + PHYS.w / 2;
    var support = autoSupportSegment();
    if (!hero.onGround) {
      if (hero.vy > 40 && (!support || nearSpike(hero.x + 28, 36))) {
        if (hero.jumpsLeft > 0) triggerJump();
        else triggerDash();
      }
      return;
    }
    if (!support) {
      triggerJump();
      return;
    }
    var edge = support.x + support.w;
    if (edge - front < 64) {
      triggerJump();
      return;
    }
    for (var i = 0; i < spikeRows.length; i++) {
      var s = spikeRows[i];
      var distance = (s.x - s.w / 2) - front;
      if (distance >= -4 && distance < 78) {
        triggerJump();
        return;
      }
    }
    for (var c = 0; c < critters.length; c++) {
      var cr = critters[c];
      if (!cr.alive) continue;
      var cDist = (cr.x - cr.r) - front;
      if (cDist >= -6 && cDist < 72) {
        triggerJump();
        return;
      }
    }
  }
  window.__autoplay = function () {
    if (phase === 'title') {
      autopilot = true;
      beginNewRun();
      return;
    }
    if (phase === 'lost') {
      if (restartGuard <= 0) retryCurrentLevel();
      return;
    }
    if (phase === 'won') return;
    if (phase !== 'playing') return;
    autopilot = true;
    if (paused || clearing || dying) return;
    autoJumpIfNeeded();
  };

  window.__gameState = function () {
    function round(v) {
      if (typeof v !== 'number') return v;
      if (isNaN(v)) return 0;
      var r = Math.round(v * 100) / 100;
      return r === 0 ? 0 : r;
    }
    return {
      phase: phase,
      score: round(score),
      hearts: round(hearts),
      fps: round(fps),
      hero: { x: round(hero.x), y: round(hero.y) },
      heroOnScreen: hero.y > -80 && hero.y < VIEW_H + 160,
      pickups: pickups.map(function (p) { return { x: round(p.x), y: round(p.y) }; }),
      enemies: spikeRows.map(function (s) { return { x: round(s.x), y: round(GROUND_Y - s.h / 2) }; }),
      world: { w: round(level ? level.width : VIEW_W), h: VIEW_H },
      level: levelIndex + 1,
      levelName: level ? level.name : '',
      goal: level ? { x: level.goalX, y: GROUND_Y } : { x: 0, y: GROUND_Y },
      paused: paused,
      touching: layout.showTouch
    };
  };

  window.addEventListener('error', function (e) {
    postError(e && e.message ? e.message : 'Unknown error');
  });
  window.addEventListener('unhandledrejection', function (e) {
    var m = (e && e.reason && e.reason.message) ? e.reason.message : String(e && e.reason);
    postError(m);
  });

  window.addEventListener('resize', function () {
    resize();
  });
  window.addEventListener('orientationchange', function () {
    setTimeout(resize, 120);
  });

  // boot
  resize();
  prepareTitle();
  requestAnimationFrame(function () {
    notifyRenders();
  });
  requestAnimationFrame(frame);
})();
</script>
</body></html>
