  function eventPoint(e) {
    var rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  function screenToWorldPoint(pt) {
    if (pt.x < view.x || pt.x > view.x + view.w || pt.y < view.y || pt.y > view.y + view.h) return null;
    return {
      x: (pt.x - view.x) / fitScale,
      y: (pt.y - view.y) / fitScale
    };
  }

  function hitPadIndex(wx, wy) {
    var best = -1;
    var bestScore = 1e9;
    for (var i = 0; i < PADS.length; i++) {
      var p = PADS[i];
      var hasTower = !!p.tower;
      var inBase = dist(wx, wy, p.x, p.y) <= p.r + 9;
      var inTower = hasTower && Math.abs(wx - p.x) <= 42 && wy >= p.y - 156 && wy <= p.y + 36;
      var inEmpty = !hasTower && Math.abs(wx - p.x) <= 38 && wy >= p.y - 88 && wy <= p.y + 30;
      if (!inBase && !inTower && !inEmpty) continue;
      var anchorY = hasTower ? p.y - 55 : p.y - 8;
      var sc = Math.abs(wx - p.x) * 0.8 + Math.abs(wy - anchorY);
      if (sc < bestScore) {
        bestScore = sc;
        best = i;
      }
    }
    return best;
  }

  function identifyHover(pt) {
    if (pointInRect(pt.x, pt.y, uiRects.pause)) return 'pause';
    if (pointInRect(pt.x, pt.y, uiRects.mute)) return 'mute';
    if (pointInRect(pt.x, pt.y, uiRects.speed)) return 'speed';
    if (pointInRect(pt.x, pt.y, uiRects.close)) return 'close';
    if (pointInRect(pt.x, pt.y, uiRects.upgrade)) return 'upgrade';
    if (pointInRect(pt.x, pt.y, uiRects.waveBtn)) return 'wave';
    return '';
  }

  function updateHover(e) {
    var pt = eventPoint(e);
    pointer.x = pt.x;
    pointer.y = pt.y;
    pointer.inView = pt.x >= view.x && pt.x <= view.x + view.w && pt.y >= view.y && pt.y <= view.y + view.h;
    if (phase === 'title' || phase === 'won' || phase === 'lost' || paused) {
      hoverUI = '';
      hoverPad = -1;
      canvas.style.cursor = 'pointer';
      return;
    }
    hoverUI = identifyHover(pt);
    var wp = screenToWorldPoint(pt);
    hoverPad = wp ? hitPadIndex(wp.x, wp.y) : -1;
    canvas.style.cursor = (hoverUI || hoverPad >= 0) ? 'pointer' : 'default';
  }

  function toggleMute() {
    muted = !muted;
    if (!muted) {
      ensureAudio();
      sfx.click();
    }
    hoverUI = '';
  }

  function cycleSpeed() {
    speed = speed === 1 ? 2 : (speed === 2 ? 3 : 1);
    showToast('战斗速度 ×' + speed, 'info', 1.4);
    sfx.click();
  }

  function onPointerDown(e) {
    if (e.button != null && e.button > 0) return;
    ensureAudio();
    if (e.preventDefault) e.preventDefault();
    if (canvas.focus) canvas.focus();
    var pt = eventPoint(e);

    if (phase === 'title') {
      startGame();
      return;
    }
    if (phase === 'won' || phase === 'lost') {
      if (restartGuard <= 0) startGame();
      return;
    }
    if (paused) {
      paused = false;
      hoverUI = '';
      sfx.click();
      return;
    }

    if (pointInRect(pt.x, pt.y, uiRects.pause)) {
      paused = true;
      sfx.pause();
      return;
    }
    if (pointInRect(pt.x, pt.y, uiRects.mute)) {
      toggleMute();
      return;
    }
    if (pointInRect(pt.x, pt.y, uiRects.speed)) {
      cycleSpeed();
      return;
    }
    if (pointInRect(pt.x, pt.y, uiRects.close)) {
      selectedPad = -1;
      sfx.click();
      return;
    }
    if (pointInRect(pt.x, pt.y, uiRects.upgrade)) {
      upgradeSelectedTower();
      return;
    }
    if (pointInRect(pt.x, pt.y, uiRects.waveBtn)) {
      beginWave(true);
      return;
    }

    var wp = screenToWorldPoint(pt);
    if (!wp) {
      selectedPad = -1;
      return;
    }
    var idx = hitPadIndex(wp.x, wp.y);
    if (idx >= 0) {
      if (PADS[idx].tower) {
        selectedPad = idx;
        sfx.click();
      } else {
        selectedPad = -1;
        buildTowerAt(idx);
      }
    } else {
      selectedPad = -1;
    }
  }

  function onPointerMove(e) {
    updateHover(e);
  }

  function onPointerLeave() {
    hoverPad = -1;
    hoverUI = '';
    pointer.inView = false;
    canvas.style.cursor = 'default';
  }

  function onKeyDown(e) {
    ensureAudio();
    var k = (e.key || '').toLowerCase();
    if (k === 'm') {
      toggleMute();
      return;
    }
    if (k === 'p' || k === 'escape') {
      if (phase === 'playing') {
        paused = !paused;
        hoverUI = '';
        sfx.pause();
      }
      return;
    }
    if (phase === 'title') {
      if (k === 'enter' || k === ' ' || k === 'spacebar') {
        e.preventDefault();
        startGame();
      }
      return;
    }
    if (phase === 'won' || phase === 'lost') {
      if (restartGuard <= 0 && (k === 'enter' || k === ' ' || k === 'spacebar' || k === 'r')) {
        e.preventDefault();
        startGame();
      }
      return;
    }
    if (paused) {
      if (k === 'enter' || k === ' ' || k === 'spacebar') {
        e.preventDefault();
        paused = false;
      }
      return;
    }
    if (k === 'f') {
      cycleSpeed();
      return;
    }
    if (k === 'enter' || k === ' ' || k === 'spacebar') {
      e.preventDefault();
      if (mode === 'prep') beginWave(true);
      return;
    }
    if (k === 'arrowup' || k === 'arrowdown' || k === 'arrowleft' || k === 'arrowright') {
      e.preventDefault();
    }
  }

  /* ================================================================
   * 9. RENDER AND MAIN LOOP
   * ================================================================ */
  function render() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    drawScreenBackdrop(ctx);

    uiRects.pause = null;
    uiRects.mute = null;
    uiRects.speed = null;
    uiRects.waveBtn = null;
    uiRects.upgrade = null;
    uiRects.close = null;

    var radius = (view.x > 2 || view.y > 2) ? 18 : 2;
    var skx = 0, sky = 0;
    if (shake > 0) {
      var power = Math.min(1, shake);
      skx = (Math.sin(visualTime * 81.3) * 7 + Math.sin(visualTime * 37.1) * 3) * power;
      sky = (Math.cos(visualTime * 67.7) * 5 + Math.cos(visualTime * 31.9) * 2) * power;
    }

    ctx.save();
    roundRectPath(ctx, view.x, view.y, view.w, view.h, radius);
    ctx.clip();
    ctx.save();
    ctx.translate(view.x + skx, view.y + sky);
    ctx.scale(fitScale, fitScale);
    if (staticBg) ctx.drawImage(staticBg, 0, 0);
    if (phase === 'title') drawAttractWorld(ctx, titleTime);
    else drawBattleWorld(ctx, visualTime);
    ctx.restore();
    drawMapVignette(ctx);
    ctx.restore();

    drawMapFrame(ctx);

    if (phase === 'playing') {
      drawHUD(ctx);
      drawWaveStatus(ctx);
      drawTowerPanel(ctx);
      drawWaveBanner(ctx);
      drawToastMessage(ctx);
      if (paused) drawPauseOverlay(ctx);
    } else if (phase === 'title') {
      drawTitleOverlay(ctx);
    } else if (phase === 'won' || phase === 'lost') {
      drawEndOverlay(ctx);
    }
  }

  function resize() {
    var cssW = window.innerWidth || canvas.clientWidth || 390;
    var cssH = window.innerHeight || canvas.clientHeight || 844;
    dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.max(1, Math.round(cssW * dpr));
    canvas.height = Math.max(1, Math.round(cssH * dpr));
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';
    fitScale = Math.min(cssW / WORLD.w, cssH / WORLD.h);
    view.w = WORLD.w * fitScale;
    view.h = WORLD.h * fitScale;
    view.x = (cssW - view.w) / 2;
    view.y = (cssH - view.h) / 2;
    if (phase === 'title' || phase === 'won' || phase === 'lost' || paused) {
      hoverUI = '';
      hoverPad = -1;
    }
  }

  function frame(now) {
    requestAnimationFrame(frame);
    if (!lastFrame) lastFrame = now;
    var dt = (now - lastFrame) / 1000;
    lastFrame = now;
    if (!isFinite(dt) || dt < 0) dt = 0;
    dt = Math.min(0.05, dt);
    visualTime += dt;
    if (phase === 'title') titleTime += dt;
    if (restartGuard > 0) restartGuard = Math.max(0, restartGuard - dt);
    fpsFrames++;
    fpsAccum += dt;
    if (fpsAccum >= 0.5) {
      fps = fpsFrames / fpsAccum;
      fpsFrames = 0;
      fpsAccum = 0;
    }
    if (phase === 'playing' && !paused) {
      updateGame(dt * speed, dt);
    }
    render();
  }

  /* ================================================================
   * 10. INTROSPECTION + STUDIO HOOKS
   * ================================================================ */
  function emitPhase() {
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ source: 'dsh-game-studio', type: 'state', phase: phase, score: Math.round(score) }, '*');
      }
    } catch (e) { /* ignore */ }
  }

  function drawCharacter(g, key, size) {
    if (key === 'hero') {
      g.save();
      g.translate(0, size * 0.36);
      var k = size / 260;
      g.scale(k, k);
      drawTowerArt(g, 3, -Math.PI / 2 + 0.12, 0);
      g.restore();
    } else if (key === 'enemy') {
      g.save();
      g.translate(0, size * 0.21);
      var ks = size / 116;
      g.scale(ks, ks);
      drawSlimeArt(g, 'green', 0, Math.PI / 2, 0, 1);
      g.restore();
    } else if (key === 'pickup') {
      drawCoin(g, 0, 0, size * 0.31);
    }
  }

  function renderSlots(size) {
    size = size || 256;
    var out = {};
    var slots = ['hero', 'enemy', 'pickup'];
    for (var i = 0; i < slots.length; i++) {
      var slot = slots[i];
      var c = document.createElement('canvas');
      c.width = size;
      c.height = size;
      var g = c.getContext('2d');
      g.translate(size / 2, size / 2);
      drawCharacter(g, slot, size * 0.94);
      out[slot] = c.toDataURL('image/png');
    }
    return out;
  }
  window.__renderSlots = renderSlots;

  var rendersPosted = false;
  function postRenders() {
    if (rendersPosted) return;
    rendersPosted = true;
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ source: 'dsh-game-studio', type: 'renders', renders: renderSlots(256) }, '*');
      }
    } catch (e) { /* ignore */ }
  }

  window.__gameState = function () {
    var live = [];
    for (var i = 0; i < enemies.length; i++) {
      if (!enemies[i].dead) {
        live.push({
          x: Math.round(enemies[i].x * 100) / 100,
          y: Math.round(enemies[i].y * 100) / 100,
          kind: enemies[i].kind,
          hp: Math.round(enemies[i].hp)
        });
      }
    }
    return {
      phase: phase,
      mode: mode,
      score: Math.round(score),
      hearts: Math.round(gateHp),
      gateHp: Math.round(gateHp),
      gateMax: R.gateHp,
      gold: Math.round(gold),
      kills: kills,
      leaks: leaks,
      wave: currentWaveNumber(),
      waveCount: R.waveCount,
      prepTimer: Math.round(prepTimer * 10) / 10,
      fps: Math.round(fps),
      hero: { x: GATE.x, y: GATE.y },
      heroOnScreen: true,
      enemies: live,
      pickups: [],
      towers: PADS.map(function (p) {
        return p.tower ? { x: p.x, y: p.y, level: p.tower.level } : null;
      }),
      world: { w: WORLD.w, h: WORLD.h },
      view: { x: view.x, y: view.y, w: view.w, h: view.h }
    };
  };

  function postError(message) {
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ source: 'dsh-game-studio', type: 'error', message: String(message).slice(0, 300) }, '*');
      }
    } catch (e) { /* ignore */ }
  }
  window.addEventListener('error', function (e) {
    postError(e && e.message ? e.message : 'Unknown error');
  });
  window.addEventListener('unhandledrejection', function (e) {
    var m = (e && e.reason && e.reason.message) ? e.reason.message : String(e && e.reason);
    postError(m);
  });

  /* ================================================================
   * 11. BOOT
   * ================================================================ */
  canvas.addEventListener('pointerdown', onPointerDown);
  canvas.addEventListener('pointermove', onPointerMove);
  canvas.addEventListener('pointerleave', onPointerLeave);
  canvas.addEventListener('pointercancel', onPointerLeave);
  document.addEventListener('keydown', onKeyDown);
  window.addEventListener('resize', resize);

  buildStaticBackground();
  resize();
  emitPhase();
  setTimeout(postRenders, 200);
  requestAnimationFrame(frame);
})();

</script>
</body></html>
