  function drawTorchBracket(g, x, y) {
    g.save();
    g.translate(x, y);
    g.strokeStyle = '#4c3620';
    g.lineWidth = 3;
    g.beginPath();
    g.moveTo(0, 0);
    g.quadraticCurveTo(-2, 12, 7, 18);
    g.stroke();
    g.fillStyle = '#8d6637';
    g.beginPath();
    g.ellipse(8, 18, 7, 3.5, -0.2, 0, TAU);
    g.fill();
    g.restore();
  }

  function drawPadBase(g, pad) {
    g.save();
    g.translate(pad.x, pad.y);

    g.fillStyle = 'rgba(3,12,9,0.36)';
    g.beginPath();
    g.ellipse(2, 8, 48, 18, 0, 0, TAU);
    g.fill();

    /* dais */
    g.beginPath();
    g.ellipse(0, 1, 43, 18, 0, 0, TAU);
    var plate = g.createLinearGradient(0, -20, 0, 19);
    plate.addColorStop(0, '#72856c');
    plate.addColorStop(0.5, '#4b6152');
    plate.addColorStop(1, '#2c4036');
    g.fillStyle = plate;
    g.fill();
    g.strokeStyle = '#172d24';
    g.lineWidth = 2;
    g.stroke();

    /* stone ring blocks */
    for (var i = 0; i < 10; i++) {
      var a = i / 10 * TAU;
      var bx = Math.cos(a) * 38;
      var by = Math.sin(a) * 14;
      g.beginPath();
      g.ellipse(bx, by, 7, 3.4, a, 0, TAU);
      g.fillStyle = i % 2 ? '#617861' : '#536b58';
      g.fill();
      g.strokeStyle = 'rgba(19,41,31,0.46)';
      g.lineWidth = 0.9;
      g.stroke();
    }

    /* moss */
    var rng = seededRandom(1000 + pad.index * 73);
    for (var j = 0; j < 6; j++) {
      var ma = rng() * TAU;
      var mr = 27 + rng() * 12;
      g.beginPath();
      g.ellipse(Math.cos(ma) * mr, Math.sin(ma) * mr * 0.35, 5 + rng() * 5, 2 + rng() * 2.5, ma, 0, TAU);
      g.fillStyle = 'rgba(74,120,65,' + (0.24 + rng() * 0.24) + ')';
      g.fill();
    }

    /* inlaid moon rune */
    g.save();
    g.strokeStyle = 'rgba(235,207,145,0.6)';
    g.lineWidth = 1.2;
    g.beginPath();
    g.ellipse(0, 1, 23, 9, 0, 0, TAU);
    g.stroke();
    g.strokeStyle = 'rgba(182,218,182,0.25)';
    g.lineWidth = 1;
    g.beginPath();
    g.arc(0, -1, 13, 0.4, Math.PI * 1.7);
    g.stroke();
    for (var k = 0; k < 4; k++) {
      var angle = k * Math.PI / 2 + Math.PI / 4;
      var px = Math.cos(angle) * 22;
      var py = Math.sin(angle) * 8.5;
      drawStarPath(g, px, py, 2.8, 0.9, 4, angle);
      g.fillStyle = 'rgba(245,220,161,0.65)';
      g.fill();
    }
    g.restore();

    if (pad.tower === null && pad.index === 1) {
      /* one little welcome sprig, just for the closest pad to the trail */
      drawGrassTuft(g, 26, 10, 15, 404);
    }
    g.restore();
  }

  function drawWorldBase(g) {
    /* deep forest ground */
    var base = g.createLinearGradient(0, 0, WORLD.w, WORLD.h);
    base.addColorStop(0, '#0d2b26');
    base.addColorStop(0.3, '#0a241f');
    base.addColorStop(0.68, '#071c19');
    base.addColorStop(1, '#041210');
    g.fillStyle = base;
    g.fillRect(0, 0, WORLD.w, WORLD.h);

    /* moonlight from the top-right */
    var moon = g.createRadialGradient(548, 160, 12, 548, 160, 430);
    moon.addColorStop(0, 'rgba(171,217,176,0.16)');
    moon.addColorStop(0.38, 'rgba(101,166,135,0.08)');
    moon.addColorStop(1, 'rgba(62,120,98,0)');
    g.fillStyle = moon;
    g.fillRect(0, 0, WORLD.w, WORLD.h);

    /* broad painterly moss patches */
    var rng = seededRandom(182771);
    var i;
    for (i = 0; i < 34; i++) {
      var px = rng() * WORLD.w;
      var py = rng() * WORLD.h;
      var rx = 40 + rng() * 150;
      var ry = 20 + rng() * 70;
      g.beginPath();
      g.ellipse(px, py, rx, ry, rng() * 0.8 - 0.4, 0, TAU);
      g.fillStyle = i % 3 === 0 ? 'rgba(27,65,48,0.28)' : 'rgba(11,42,34,0.36)';
      g.fill();
    }

    /* distant tree silhouettes */
    var trees = [
      [20, 62, 116, 11], [176, 6, 88, 12], [380, -8, 78, 13], [568, 18, 102, 14],
      [706, 126, 112, 15], [-20, 370, 92, 16], [726, 330, 102, 17],
      [-26, 762, 96, 18], [736, 626, 106, 19], [-20, 1112, 102, 20],
      [726, 972, 104, 21], [-16, 1426, 112, 22], [730, 1344, 100, 23],
      [238, 1512, 118, 24], [508, 1544, 124, 25], [622, 380, 54, 26],
      [108, 886, 43, 27], [638, 1140, 42, 28], [442, 1480, 54, 29]
    ];
    for (i = 0; i < trees.length; i++) {
      drawCanopyTree(g, trees[i][0], trees[i][1], trees[i][2], trees[i][3]);
    }

    /* fog ribbons between trunks */
    g.save();
    g.globalCompositeOperation = 'screen';
    for (i = 0; i < 5; i++) {
      var fy = 240 + i * 270 + (i % 2) * 70;
      var fog = g.createLinearGradient(0, fy, WORLD.w, fy + 90);
      fog.addColorStop(0, 'rgba(93,154,120,0)');
      fog.addColorStop(0.5, 'rgba(93,154,120,0.018)');
      fog.addColorStop(1, 'rgba(93,154,120,0)');
      g.fillStyle = fog;
      g.beginPath();
      g.ellipse(WORLD.w / 2 + (i % 2 ? -80 : 90), fy, 300, 45, 0.12, 0, TAU);
      g.fill();
    }
    g.restore();

    /* light shafts */
    g.save();
    g.globalCompositeOperation = 'screen';
    g.translate(520, 150);
    g.rotate(0.43);
    for (i = 0; i < 4; i++) {
      var beam = g.createLinearGradient(0, 0, 0, 490);
      beam.addColorStop(0, 'rgba(207,230,181,0.07)');
      beam.addColorStop(0.6, 'rgba(166,216,166,0.028)');
      beam.addColorStop(1, 'rgba(166,216,166,0)');
      g.fillStyle = beam;
      g.beginPath();
      g.moveTo(-35 + i * 32, 0);
      g.lineTo(20 + i * 32, 0);
      g.lineTo(-56 + i * 42, 480);
      g.lineTo(-99 + i * 42, 480);
      g.closePath();
      g.fill();
    }
    g.restore();

    /* the path itself */
    g.lineCap = 'round';
    g.lineJoin = 'round';
    traceRoad(g);
    g.strokeStyle = 'rgba(2,8,6,0.5)';
    g.lineWidth = 150;
    g.stroke();

    traceRoad(g);
    g.strokeStyle = '#252b1d';
    g.lineWidth = 134;
    g.stroke();

    traceRoad(g);
    g.strokeStyle = '#4a412e';
    g.lineWidth = 120;
    g.stroke();

    traceRoad(g);
    var pathGrad = g.createLinearGradient(0, 200, 0, 1380);
    pathGrad.addColorStop(0, '#9b8865');
    pathGrad.addColorStop(0.35, '#b9a079');
    pathGrad.addColorStop(0.72, '#a98e64');
    pathGrad.addColorStop(1, '#8a7150');
    g.strokeStyle = pathGrad;
    g.lineWidth = 106;
    g.stroke();

    traceRoad(g);
    g.strokeStyle = 'rgba(203,184,143,0.18)';
    g.lineWidth = 74;
    g.stroke();

    traceRoad(g);
    g.strokeStyle = 'rgba(231,216,180,0.08)';
    g.lineWidth = 34;
    g.stroke();

    /* dark edge trim and tiny roots */
    g.save();
    var roadRng = seededRandom(447712);
    for (i = 0; i < 38; i++) {
      var s = roadRng() * ROAD.total;
      var pnt = ROAD.at(s);
      var side = roadRng() < 0.5 ? -1 : 1;
      var off = 58 + roadRng() * 8;
      var ex = pnt.x + pnt.nx * off * side;
      var ey = pnt.y + pnt.ny * off * side;
      g.strokeStyle = 'rgba(26,36,23,0.45)';
      g.lineWidth = 1.5 + roadRng() * 2;
      g.beginPath();
      g.moveTo(ex, ey);
      g.quadraticCurveTo(ex + pnt.nx * side * 12, ey - 4, ex + pnt.nx * side * 24, ey - 10);
      g.stroke();
    }
    g.restore();

    /* pebbles, footprints, leaves on the path */
    var pathRng = seededRandom(93518);
    for (i = 0; i < 150; i++) {
      var d = pathRng() * ROAD.total;
      var pt = ROAD.at(d);
      var lateral = (pathRng() - 0.5) * 86;
      var px2 = pt.x + pt.nx * lateral;
      var py2 = pt.y + pt.ny * lateral;
      if (nearAnyPad(px2, py2, -18)) continue;
      if (i % 5 === 0) {
        /* leaf */
        g.save();
        g.translate(px2, py2);
        g.rotate(pathRng() * TAU);
        g.fillStyle = pathRng() < 0.5 ? 'rgba(126,86,47,0.6)' : 'rgba(142,110,55,0.45)';
        leafPath(g, 0, 0, 4 + pathRng() * 5, 0);
        g.fill();
        g.restore();
      } else {
        g.beginPath();
        g.ellipse(px2, py2, 1.3 + pathRng() * 3.6, 0.8 + pathRng() * 2, pathRng() * TAU, 0, TAU);
        g.fillStyle = pathRng() < 0.55 ? 'rgba(92,77,53,0.52)' : 'rgba(207,187,146,0.44)';
        g.fill();
      }
    }
    /* faint footfalls */
    g.fillStyle = 'rgba(77,62,43,0.28)';
    for (i = 0; i < 30; i++) {
      var fd = 64 + i * 41;
      if (fd > ROAD.total - 60) break;
      var fp = ROAD.at(fd);
      var sideOff = (i % 2 ? 1 : -1) * (8 + (i % 3) * 3);
      g.beginPath();
      g.ellipse(fp.x + fp.nx * sideOff, fp.y + fp.ny * sideOff, 3.4, 1.8, fp.angle + 0.2, 0, TAU);
      g.fill();
    }

    /* grass tufts and flowers along the verge */
    var grassRng = seededRandom(886213);
    for (i = 0; i < 120; i++) {
      var gd = grassRng() * ROAD.total;
      var gp = ROAD.at(gd);
      var gside = grassRng() < 0.5 ? -1 : 1;
      var goff = 66 + grassRng() * 38;
      var gx = gp.x + gp.nx * goff * gside;
      var gy = gp.y + gp.ny * goff * gside;
      if (gx < 4 || gx > WORLD.w - 4) continue;
      if (nearAnyPad(gx, gy, 8)) continue;
      drawGrassTuft(g, gx, gy, 9 + grassRng() * 11, 200 + i);
      if (i % 11 === 0) {
        g.fillStyle = grassRng() < 0.5 ? 'rgba(218,196,129,0.75)' : 'rgba(180,213,162,0.55)';
        g.beginPath();
        g.arc(gx + 3, gy - 10, 1.8, 0, TAU);
        g.arc(gx - 2, gy - 13, 1.2, 0, TAU);
        g.fill();
      }
    }

    /* larger ferns around the glade */
    var fernSpots = [
      [48, 560, 36, 1], [122, 430, 22, 2], [646, 620, 32, 3], [586, 960, 24, 4],
      [168, 1220, 28, 5], [300, 1394, 34, 6], [468, 1418, 25, 7], [682, 290, 27, 8],
      [640, 748, 22, 9], [62, 1012, 25, 10]
    ];
    for (i = 0; i < fernSpots.length; i++) {
      if (nearAnyPad(fernSpots[i][0], fernSpots[i][1], 12)) continue;
      drawFern(g, fernSpots[i][0], fernSpots[i][1], fernSpots[i][2], fernSpots[i][3]);
    }

    /* scattered rocks */
    var rockRng = seededRandom(9217);
    for (i = 0; i < 22; i++) {
      var rx2 = 30 + rockRng() * (WORLD.w - 60);
      var ry2 = 80 + rockRng() * (WORLD.h - 100);
      if (distanceToRoad(rx2, ry2) < 90 || nearAnyPad(rx2, ry2, 38)) continue;
      g.save();
      g.translate(rx2, ry2);
      g.rotate(rockRng() * TAU);
      g.fillStyle = 'rgba(37,55,43,0.65)';
      g.beginPath();
      g.ellipse(1, 3, 9 + rockRng() * 10, 4 + rockRng() * 5, 0, 0, TAU);
      g.fill();
      g.fillStyle = rockRng() < 0.5 ? '#455c48' : '#516653';
      g.beginPath();
      g.ellipse(0, 0, 7 + rockRng() * 7, 3 + rockRng() * 4, 0, 0, TAU);
      g.fill();
      g.strokeStyle = 'rgba(173,194,156,0.12)';
      g.lineWidth = 1;
      g.beginPath();
      g.ellipse(-2, -1, 5, 2, 0, Math.PI * 1.05, Math.PI * 1.8);
      g.stroke();
      g.restore();
    }

    /* mushrooms and magic at the far ends */
    drawPortalStatic(g);
    drawMushroom(g, 323, 1348, 14, true, 99);
    drawMushroom(g, 349, 1362, 9, true, 100);
    drawMushroom(g, 290, 1388, 8, false, 101);

    drawGateStatic(g);

    /* build pads last, so the stone dais stays visible */
    for (i = 0; i < PADS.length; i++) drawPadBase(g, PADS[i]);

    /* foreground leaves and small twigs at the very bottom */
    var fgRng = seededRandom(51382);
    for (i = 0; i < 28; i++) {
      var lx = fgRng() * WORLD.w;
      var ly = 1400 + fgRng() * 150;
      if (nearAnyPad(lx, ly, 14)) continue;
      g.save();
      g.translate(lx, ly);
      g.rotate(fgRng() * TAU);
      g.fillStyle = fgRng() < 0.5 ? 'rgba(69,103,61,0.48)' : 'rgba(121,97,55,0.35)';
      leafPath(g, 0, 0, 7 + fgRng() * 11, 0);
      g.fill();
      g.restore();
    }

    /* dark painted vignette baked into the map */
    var vig = g.createRadialGradient(WORLD.w * 0.52, WORLD.h * 0.43, WORLD.w * 0.18, WORLD.w * 0.5, WORLD.h * 0.45, WORLD.h * 0.58);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(0.68, 'rgba(2,10,8,0.08)');
    vig.addColorStop(1, 'rgba(1,8,6,0.46)');
    g.fillStyle = vig;
    g.fillRect(0, 0, WORLD.w, WORLD.h);
  }

  function buildStaticBackground() {
    var c = document.createElement('canvas');
    c.width = WORLD.w;
    c.height = WORLD.h;
    var g = c.getContext('2d');
    drawWorldBase(g);
    staticBg = c;
  }

  /* ================================================================
   * 6. RUNNING THE DEFENCE
   * ================================================================ */
  function showToast(text, tone, life) {
    toast = {
      text: text,
      tone: tone || 'info',
      age: 0,
      life: life == null ? 2.6 : life
    };
  }

  function addGold(amount) {
    gold += Math.round(amount);
    goldFlash = 1;
    score += Math.max(0, Math.round(amount * 0.25));
    if (gold < 0) gold = 0;
  }

  function spawnQueueLane(kind, i) {
    if (kind === 'boss') return 0;
    var lanes = [-24, -12, 15, 3, 23, -5, 9, -19, 1, -9, 26, 13];
    return lanes[i % lanes.length] + rand(-1.8, 1.8);
  }

  function buildSchedule(def) {
    var q = [];
    var at = 0.5;
    var gi, i;
    for (gi = 0; gi < def.groups.length; gi++) {
      var group = def.groups[gi];
      for (i = 0; i < group.count; i++) {
        q.push({ at: at, kind: group.kind, lane: spawnQueueLane(group.kind, q.length) });
        at += group.gap;
      }
      at += group.kind === 'boss' ? 1.0 : 0.75;
    }
    return q;
  }

  function createEnemy(kind, opts) {
    opts = opts || {};
    var def = KINDS[kind] || KINDS.green;
    var hpMul = waveDef ? waveDef.hpMul : 1;
    var hp = opts.hp != null ? opts.hp : def.hp * hpMul * R.hpScale;
    hp = Math.max(1, Math.round(hp));
    var startDist = opts.dist != null ? opts.dist : 0;
    var lane = opts.lane != null ? opts.lane : 0;
    var p = ROAD.at(startDist);
    var e = {
      kind: kind,
      def: def,
      hp: hp,
      maxHp: hp,
      dist: startDist,
      lane: lane,
      speed: def.speed * (opts.speedMul || 1) * rand(0.89, 1.12),
      radius: def.radius,
      armor: def.armor || 0,
      reward: Math.max(1, Math.round(def.reward * R.goldScale)),
      gateDamage: def.gate || 1,
      x: p.x + p.nx * lane,
      y: p.y + p.ny * lane,
      angle: p.angle,
      wob: rand(0, TAU),
      age: 0,
      spawnAge: opts.spawnAge != null ? opts.spawnAge : 0,
      hitFlash: 0,
      dead: false,
      trailTimer: rand(0, 0.5),
      fromSplit: !!opts.fromSplit
    };
    enemies.push(e);
    if (!opts.quiet) {
      burst(e.x, e.y, [def.top, def.mid, def.glow], 5, 32, 3, 0.35);
    }
    if (kind === 'boss') {
      shake = Math.max(shake, 0.7);
      showToast('史莱姆王出现了！集中火力！', 'bad', 3.3);
      addRing(e.x, e.y - 18, 16, 92, 0.7, 'rgba(200,255,190,0.7)', 4);
    }
    return e;
  }

  function cleanDeadEnemies() {
    var kept = [];
    for (var i = 0; i < enemies.length; i++) {
      if (!enemies[i].dead) kept.push(enemies[i]);
    }
    enemies = kept;
  }

  function resetBattle() {
    gold = R.startingGold;
    gateHp = R.gateHp;
    kills = 0;
    leaks = 0;
    score = 0;
    waveIndex = 0;
    mode = 'prep';
    prepTimer = R.prepTime;
    waveTime = 0;
    waveDef = null;
    spawnQueue = [];
    spawnCursor = 0;
    waveCleared = 0;
    waveTotal = 0;
    wavePlanned = 0;
    enemies = [];
    arrows = [];
    particles = [];
    rings = [];
    floaters = [];
    selectedPad = -1;
    hoverPad = -1;
    banner = null;
    toast = null;
    shake = 0;
    gateFlash = 0;
    goldFlash = 0;
    restartGuard = 0.5;
    paused = false;
    speed = clamp(Math.round(R.gameSpeed), 1, 3);
    gameClock = 0;

    var i;
    for (i = 0; i < PADS.length; i++) {
      PADS[i].tower = null;
      PADS[i].glow = 0;
    }
    for (i = 0; i < R.starterTowers && i < PADS.length; i++) {
      PADS[i].tower = makeTower(R.starterTowerLevel);
      PADS[i].tower.age = 2 + i * 0.2;
    }
    showToast(R.starterTowers > 0 ? '先遣箭塔已就位 · 点击石台继续建塔' : '点击月光石台建造第一座箭塔', 'info', 3.6);
  }

  function startGame() {
    ensureAudio();
    phase = 'playing';
    resetBattle();
    emitPhase();
    tone(440, 0.12, 'sine', 0.025);
    tone(660, 0.18, 'sine', 0.022, 0.1);
    tone(880, 0.24, 'sine', 0.018, 0.21);
  }

  function endGame(won) {
    if (phase !== 'playing') return;
    if (won) score += 500 + gateHp * 40;
    phase = won ? 'won' : 'lost';
    paused = false;
    selectedPad = -1;
    hoverPad = -1;
    restartGuard = 0.7;
    banner = null;
    toast = null;
    if (won) {
      score += 300;
      sfx.win();
    } else {
      gateFlash = 1;
      shake = Math.max(shake, 0.8);
      sfx.lose();
    }
    emitPhase();
  }

  function beginWave(byPlayer) {
    if (phase !== 'playing' || mode !== 'prep') return;
    waveDef = getWaveDef(waveIndex);
    spawnQueue = buildSchedule(waveDef);
    spawnCursor = 0;
    waveTime = 0;
    waveCleared = 0;
    wavePlanned = spawnQueue.length;
    waveTotal = spawnQueue.length;
    mode = 'wave';
    banner = {
      age: 0,
      life: waveDef.boss ? 3.4 : 2.7,
      title: '第 ' + currentWaveNumber() + ' 波',
      name: waveDef.name,
      boss: !!waveDef.boss
    };
    if (byPlayer) {
      if (prepTimer > 0.1 && R.earlyBonus > 0) {
        addGold(R.earlyBonus);
        showToast('提前迎战 · +' + R.earlyBonus + ' 金币', 'good', 2.2);
        sfx.early();
      } else {
        sfx.click();
      }
    }
    prepTimer = 0;
    sfx.wave();
    ensureAudio();
    emitPhase();
  }

  function completeWave() {
    if (phase !== 'playing' || mode !== 'wave') return;
    var clearedNum = waveIndex + 1;
    var bonus = Math.max(0, Math.round(waveDef.bonus * R.goldScale));
    addGold(bonus);
    score += bonus * 2;
    goldFlash = 1;
    waveIndex++;
    spawnQueue = [];
    spawnCursor = 0;
    waveDef = null;
    banner = null;
    if (waveIndex >= R.waveCount) {
      endGame(true);
      return;
    }
    mode = 'prep';
    prepTimer = R.waveGap;
    tone(523, 0.14, 'sine', 0.022);
    tone(784, 0.24, 'sine', 0.022, 0.1);
    showToast('第 ' + clearedNum + ' 波守住了 · +' + bonus + ' 金币', 'good', 3.2);
  }

  function padAimPoint(pad, enemy) {
    return Math.atan2((enemy.y - enemy.radius * 0.55) - (pad.y - 68), enemy.x - pad.x);
  }

  function findTargets(pad, range, maximum) {
    var found = [];
    var i, e, d;
    for (i = 0; i < enemies.length; i++) {
      e = enemies[i];
      if (e.dead || e.hp <= 0) continue;
      d = dist(pad.x, pad.y, e.x, e.y);
      if (d <= range + e.radius * 0.25) found.push(e);
    }
    found.sort(function (a, b) { return b.dist - a.dist; });
    return found.slice(0, maximum || 1);
  }

  function fireArrow(pad, tower, target, power) {
    var stats = statsFor(tower.level);
    var crit = Math.random() < stats.crit;
    var dmg = stats.damage * (power || 1);
    if (crit) dmg *= 1.7;
    var sx = pad.x + Math.cos(tower.aim) * 18;
    var sy = pad.y - 84 + Math.sin(tower.aim) * 10;
    arrows.push({
      x: sx, y: sy,
      tx: target.x, ty: target.y - target.radius * 0.7,
      target: target,
      speed: 680,
      damage: dmg,
      crit: crit,
      angle: tower.aim,
      age: 0,
      life: 2.4
    });
    burst(sx, sy - 3, ['#ffe7b2', '#d7b26c'], 2, 26, 1.6, 0.2, true);
  }

  function updateEnemies(dt) {
    var i, e, p, lane;
    for (i = 0; i < enemies.length; i++) {
      e = enemies[i];
      if (e.dead) continue;
      e.age += dt;
      e.spawnAge += dt;
      e.wob += dt * (e.kind === 'boss' ? 2.4 : 4.6 + (e.kind === 'red' ? 2.2 : 0));
      if (e.hitFlash > 0) e.hitFlash = Math.max(0, e.hitFlash - dt * 4.8);
      e.trailTimer -= dt;
      e.dist += e.speed * dt;

      if (e.dist >= ROAD.total - 2) {
        leakEnemy(e);
        if (phase !== 'playing') break;
        continue;
      }
      p = ROAD.at(e.dist);
      lane = e.lane + Math.sin(e.wob * 0.34 + e.lane * 0.05) * (e.kind === 'boss' ? 1.2 : 2.4);
      e.x = p.x + p.nx * lane;
      e.y = p.y + p.ny * lane;
      e.angle = p.angle;

      if (e.trailTimer <= 0) {
        e.trailTimer = e.kind === 'boss' ? 0.18 : (e.kind === 'purple' ? 0.55 : 0.9);
        if (particles.length < 210) {
          particles.push({
            x: e.x + rand(-e.radius * 0.2, e.radius * 0.2),
            y: e.y + rand(-2, 4),
            vx: rand(-4, 4),
            vy: rand(-1, 4),
            age: 0,
            life: rand(0.6, 1.2),
            size: rand(1.4, 3.8),
            color: e.def.deep,
            gravity: 4,
            drag: 0.5,
            kind: 'goo'
          });
        }
      }
    }
  }

  function damageEnemy(e, amount, crit) {
    if (!e || e.dead || e.hp <= 0) return;
    var armor = e.armor || 0;
    var final = Math.max(1, Math.round(amount - armor * (crit ? 0.4 : 1)));
    e.hp -= final;
    e.hitFlash = Math.max(e.hitFlash, 0.24);
    burst(e.x, e.y - e.radius * 0.8, crit ? ['#fff3c5', '#ffd27c', '#ffffff'] : [e.def.top, '#fff0c7'], crit ? 8 : 4, crit ? 95 : 55, crit ? 2.8 : 2, 0.35, true);
    if (crit && floaters.length < 25) {
      floatText(e.x + rand(-8, 8), e.y - e.radius * 2.1, String(final), '#ffe6a2', 20);
    } else if (e.kind === 'boss' && Math.random() < 0.55 && floaters.length < 25) {
      floatText(e.x + rand(-16, 16), e.y - e.radius * 1.7, String(final), 'rgba(241,248,224,0.86)', 14);
    }
    sfx.hit();
    if (e.hp <= 0) killEnemy(e);
  }

  function killEnemy(e) {
    if (!e || e.dead) return;
    e.dead = true;
    kills++;
    var reward = e.reward;
    gold += reward;
    goldFlash = 1;
    waveCleared++;
    score += 12 + (e.kind === 'boss' ? 300 : 0);
    floatText(e.x + rand(-4, 4), e.y - e.radius * 1.7, '+' + reward, '#ffe4a0', e.kind === 'boss' ? 26 : 17);
    var colors = [e.def.top, e.def.mid, e.def.deep, '#f4f0cf'];
    burst(e.x, e.y - e.radius * 0.8, colors, e.kind === 'boss' ? 42 : 14, e.kind === 'boss' ? 190 : 110, e.kind === 'boss' ? 5 : 3.2, 0.72);
    addRing(e.x, e.y - 4, e.radius * 0.35, e.radius * (e.kind === 'boss' ? 4.2 : 2.2), 0.42, 'rgba(221,247,184,0.48)', e.kind === 'boss' ? 5 : 2.5);
    if (e.kind === 'purple') {
      var count = e.def.split || 2;
      for (var i = 0; i < count; i++) {
        createEnemy('spawn', {
          dist: Math.max(0, e.dist - 12 + i * 20),
          lane: e.lane + (i ? 18 : -18),
          fromSplit: true,
          quiet: true,
          hp: Math.max(1, Math.round(KINDS.spawn.hp * (waveDef ? waveDef.hpMul : 1) * R.hpScale * 0.75))
        });
      }
      burst(e.x, e.y, ['#d8a6ff', '#ffffff'], 10, 80, 2.4, 0.5);
    }
    if (e.kind === 'boss') {
      shake = Math.max(shake, 0.65);
      showToast('史莱姆王倒下了！', 'good', 3.5);
      addRing(e.x, e.y - 30, 20, 180, 1.0, 'rgba(255,231,168,0.68)', 7);
    }
    sfx.kill(e.kind === 'boss');
  }

  function leakEnemy(e) {
    e.dead = true;
    leaks++;
    gateHp = Math.max(0, gateHp - e.gateDamage);
    gateFlash = 1;
    shake = Math.max(shake, 0.52);
    score = Math.max(0, score - 18);
    burst(GATE.x + rand(-18, 18), GATE.y - 46, ['#df7b63', '#822f2d', '#f4d49a'], 12, 110, 3.2, 0.6);
    addRing(GATE.x, GATE.y - 42, 12, 92, 0.55, 'rgba(239,127,99,0.55)', 3);
    floatText(GATE.x, GATE.y - 86, '-' + e.gateDamage + ' 城门', '#ff9b82', 21);
    sfx.gate();
    if (gateHp <= 0) {
      endGame(false);
    } else {
      showToast('城门受到撞击！剩余耐久 ' + gateHp, 'bad', 1.7);
    }
  }

  function updateTowers(dt) {
    var pi, pad, tower, stats, targets, i, aim, delta;
    for (pi = 0; pi < PADS.length; pi++) {
      pad = PADS[pi];
      tower = pad.tower;
      if (!tower) continue;
      tower.age += dt;
      if (tower.cooldown > 0) tower.cooldown -= dt;
      if (tower.recoil > 0) tower.recoil = Math.max(0, tower.recoil - dt * 4.2);
      if (tower.flash > 0) tower.flash = Math.max(0, tower.flash - dt * 2.4);
      stats = statsFor(tower.level);
      targets = findTargets(pad, stats.range, stats.arrows);

      if (targets.length) {
        aim = padAimPoint(pad, targets[0]);
        delta = angleDelta(tower.aim, aim);
        tower.aim += delta * Math.min(1, dt * 14);
        if (tower.cooldown <= 0) {
          for (i = 0; i < targets.length; i++) {
            fireArrow(pad, tower, targets[i], i === 0 ? 1 : 0.66);
          }
          if (stats.arrows > 1 && targets.length === 1) {
            fireArrow(pad, tower, targets[0], 0.66);
          }
          tower.cooldown = stats.interval;
          tower.recoil = 1;
          sfx.fire();
        }
      } else {
        delta = angleDelta(tower.aim, -Math.PI / 2);
        tower.aim += delta * Math.min(1, dt * 1.6);
      }
    }
  }

  function updateArrows(dt) {
    var i, a, dx, dy, d, step, tx, ty;
    for (i = arrows.length - 1; i >= 0; i--) {
      a = arrows[i];
      a.age += dt;
      if (a.age > a.life) {
        arrows.splice(i, 1);
        continue;
      }
      if (a.target && (a.target.dead || a.target.hp <= 0)) a.target = null;
      if (a.target) {
        tx = a.target.x;
        ty = a.target.y - a.target.radius * 0.7;
        a.tx = tx;
        a.ty = ty;
      } else {
        tx = a.tx;
        ty = a.ty;
      }
      dx = tx - a.x;
      dy = ty - a.y;
      d = Math.sqrt(dx * dx + dy * dy);
      if (d < 1) {
        arrows.splice(i, 1);
        continue;
      }
      step = a.speed * dt;
      a.angle = Math.atan2(dy, dx);
      if (a.target && d <= step + 7 + a.target.radius * 0.45) {
        damageEnemy(a.target, a.damage, a.crit);
        arrows.splice(i, 1);
        continue;
      }
      if (!a.target && d <= step + 5) {
        burst(a.x, a.y, ['#efe2b8', '#9b8b68'], 4, 30, 1.8, 0.2, true);
        arrows.splice(i, 1);
        continue;
      }
      a.x += dx / d * step;
      a.y += dy / d * step;
    }
  }

  function updateParticles(dt) {
    var i, p;
    for (i = particles.length - 1; i >= 0; i--) {
      p = particles[i];
      p.age += dt;
      if (p.age >= p.life) {
        particles.splice(i, 1);
        continue;
      }
      p.vy += (p.gravity || 0) * dt;
      p.vx *= Math.exp(-(p.drag || 0) * dt);
      p.vy *= Math.exp(-(p.drag || 0) * 0.45 * dt);
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    }
    if (particles.length > 300) particles.splice(0, particles.length - 300);
    for (i = rings.length - 1; i >= 0; i--) {
      var r = rings[i];
      r.age += dt;
      if (r.age >= r.life) rings.splice(i, 1);
    }
    for (i = floaters.length - 1; i >= 0; i--) {
      var f = floaters[i];
      f.age += dt;
      f.y -= (f.rise || 30) * dt;
      if (f.age >= f.life) floaters.splice(i, 1);
    }
  }

  function burst(x, y, colors, count, power, size, gravity, glow) {
    if (!colors || !count) return;
    if (!Array.isArray(colors)) colors = [colors];
    if (particles.length > 280) return;
    for (var i = 0; i < count; i++) {
      var a = rand(0, TAU);
      var sp = rand(power * 0.22, power);
      particles.push({
        x: x + rand(-3, 3),
        y: y + rand(-3, 3),
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp * 0.72 - rand(4, 30),
        age: 0,
        life: rand(0.3, 0.85),
        size: rand(size * 0.5, size),
        color: colors[Math.floor(rand(0, colors.length))],
        gravity: gravity == null ? 90 : gravity * 120,
        drag: rand(1.2, 3.4),
        kind: glow ? 'spark' : 'dot'
      });
    }
  }

  function addRing(x, y, from, to, life, color, width) {
    rings.push({ x: x, y: y, from: from, to: to, age: 0, life: life, color: color, width: width || 2 });
  }

  function floatText(x, y, text, color, size) {
    floaters.push({
      x: x,
      y: y,
      text: text,
      color: color || '#fff0bf',
      size: size || 17,
      age: 0,
      life: 1.1,
      rise: 27
    });
  }

  function upgradeSelectedTower() {
    if (selectedPad < 0) return;
    var pad = PADS[selectedPad];
    var tower = pad.tower;
    if (!tower) return;
    if (tower.level >= 3) {
      showToast('这已经是满级的月神弓啦', 'info', 1.8);
      sfx.error();
      return;
    }
    var cost = towerUpgradeCost(tower.level);
    if (gold < cost) {
      showToast('金币不足 · 还差 ' + (cost - gold) + ' 金', 'bad', 2.1);
      sfx.error();
      goldFlash = 0.7;
      return;
    }
    gold -= cost;
    tower.level++;
    tower.flash = 1;
    tower.cooldown = Math.min(tower.cooldown, 0.2);
    goldFlash = 1;
    score += 20;
    addRing(pad.x, pad.y - 50, 12, 84, 0.65, 'rgba(252,224,150,0.72)', 3);
    burst(pad.x, pad.y - 62, ['#ffe7a8', '#b9edc8', '#ffffff'], 18, 95, 2.8, 0.4, true);
    floatText(pad.x, pad.y - 150, 'Lv.' + tower.level + ' ' + TOWER_LEVELS[tower.level - 1].name, '#ffe6a8', 19);
    showToast('升级成功 · ' + TOWER_LEVELS[tower.level - 1].name + '！', 'good', 2.0);
    sfx.upgrade();
  }

  function buildTowerAt(index) {
    if (phase !== 'playing') return;
    var pad = PADS[index];
    if (!pad || pad.tower) return;
    if (gold < R.buildCost) {
      showToast('金币不足 · 击退史莱姆可以获得金币', 'bad', 2.2);
      sfx.error();
      goldFlash = 0.7;
      return;
    }
    gold -= R.buildCost;
    goldFlash = 1;
    pad.tower = makeTower(1);
    pad.tower.age = 0;
    pad.glow = 1;
    addRing(pad.x, pad.y - 8, 8, 70, 0.55, 'rgba(237,213,156,0.7)', 3);
    burst(pad.x, pad.y - 22, ['#f2d89a', '#a5d49f', '#ffffff'], 16, 80, 2.5, 0.35, true);
    floatText(pad.x, pad.y - 126, '- ' + R.buildCost, '#f0d39b', 15);
    if (kills === 0 && !toast) {
      showToast('点击建成的箭塔，可以升级长弓', 'info', 2.5);
    }
    sfx.build();
  }

  function updateGame(dt, realDt) {
    if (banner) {
      banner.age += realDt;
      if (banner.age >= banner.life) banner = null;
    }
    if (toast) {
      toast.age += realDt;
      if (toast.age >= toast.life) toast = null;
    }
    if (shake > 0) shake = Math.max(0, shake - realDt * 1.9);
    if (gateFlash > 0) gateFlash = Math.max(0, gateFlash - realDt * 1.5);
    if (goldFlash > 0) goldFlash = Math.max(0, goldFlash - realDt * 2.8);
    if (phase !== 'playing' || paused) return;

    gameClock += dt;

    if (mode === 'prep') {
      prepTimer -= dt;
      if (prepTimer <= 0) {
        prepTimer = 0;
        beginWave(false);
      }
    }

    if (mode === 'wave') {
      waveTime += dt;
      while (spawnCursor < spawnQueue.length && spawnQueue[spawnCursor].at <= waveTime) {
        var entry = spawnQueue[spawnCursor];
        createEnemy(entry.kind, { lane: entry.lane });
        spawnCursor++;
      }
    }

    updateEnemies(dt);
    if (phase !== 'playing') return;
    cleanDeadEnemies();
    updateTowers(dt);
    updateArrows(dt);
    cleanDeadEnemies();
    updateParticles(dt);

    for (var pi = 0; pi < PADS.length; pi++) {
      if (PADS[pi].glow > 0) PADS[pi].glow = Math.max(0, PADS[pi].glow - dt * 2);
    }

    if (phase !== 'playing') return;
    if (mode === 'wave' && spawnCursor >= spawnQueue.length && enemies.length === 0) {
      completeWave();
    }
  }

  /* ================================================================
   * 7. DRAWING THE LIVING WORLD
   * ================================================================ */
  var FIREFLIES = [];
  var FALL_LEAVES = [];
  (function makeAmbient() {
    var rng = seededRandom(524111);
    var i;
    for (i = 0; i < 30; i++) {
      FIREFLIES.push({
        x: 16 + rng() * (WORLD.w - 32),
        y: 150 + rng() * (WORLD.h - 280),
        phase: rng() * TAU,
        speed: 0.22 + rng() * 0.5,
        drift: 10 + rng() * 26,
        size: 1.2 + rng() * 2.1,
        warm: rng() < 0.38
      });
    }
    for (i = 0; i < 11; i++) {
      FALL_LEAVES.push({
        x: rng() * WORLD.w,
        y: rng() * WORLD.h,
        speed: 7 + rng() * 14,
        sway: 0.4 + rng() * 0.9,
        drift: 12 + rng() * 22,
        size: 4 + rng() * 5,
        phase: rng() * TAU,
        warm: rng() < 0.5
      });
    }
  })();

  function drawAmbientWorld(g, t) {
    var i, f, a, x, y, alpha;
    g.save();
    for (i = 0; i < FIREFLIES.length; i++) {
      f = FIREFLIES[i];
      x = f.x + Math.sin(t * f.speed + f.phase) * f.drift;
      y = f.y + Math.cos(t * f.speed * 0.67 + f.phase * 1.7) * f.drift * 0.55;
      alpha = 0.22 + 0.5 * (0.5 + 0.5 * Math.sin(t * 1.7 + f.phase * 2.3));
      g.globalAlpha = alpha;
      g.fillStyle = f.warm ? 'rgba(248,210,126,0.18)' : 'rgba(170,240,197,0.18)';
      g.beginPath();
      g.arc(x, y, f.size * 4.2, 0, TAU);
      g.fill();
      g.fillStyle = f.warm ? '#ffe6a5' : '#c4f8d5';
      g.beginPath();
      g.arc(x, y, f.size, 0, TAU);
      g.fill();
    }
    g.globalAlpha = 1;
    for (i = 0; i < FALL_LEAVES.length; i++) {
      var l = FALL_LEAVES[i];
      y = (l.y + t * l.speed) % (WORLD.h + 80) - 40;
      x = l.x + Math.sin(t * l.sway + l.phase) * l.drift;
      g.save();
      g.translate(x, y);
      g.rotate(Math.sin(t * l.sway + l.phase) * 0.8 + l.phase);
      g.globalAlpha = 0.4;
      g.fillStyle = l.warm ? 'rgba(186,142,74,0.65)' : 'rgba(98,145,96,0.5)';
      leafPath(g, 0, 0, l.size, 0);
      g.fill();
      g.restore();
    }
    g.restore();
  }

  function drawPortalGlow(g, t) {
    var x = PORTAL.x + 2, y = PORTAL.y - 6;
    g.save();
    g.translate(x, y);
    g.globalCompositeOperation = 'lighter';
    var pulse = 0.5 + 0.5 * Math.sin(t * 1.8);
    var halo = g.createRadialGradient(0, -8, 2, 0, -8, 78);
    halo.addColorStop(0, 'rgba(159,249,205,' + (0.17 + pulse * 0.08) + ')');
    halo.addColorStop(0.46, 'rgba(71,200,155,0.08)');
    halo.addColorStop(1, 'rgba(41,160,129,0)');
    g.fillStyle = halo;
    g.beginPath();
    g.arc(0, -8, 78, 0, TAU);
    g.fill();

    g.strokeStyle = 'rgba(150,255,213,' + (0.32 + pulse * 0.15) + ')';
    g.lineWidth = 2.2;
    for (var i = 0; i < 3; i++) {
      var r = 30 + i * 11;
      g.beginPath();
      g.arc(0, -8, r, t * (0.7 + i * 0.16) + i * 1.9, t * (0.7 + i * 0.16) + i * 1.9 + 1.8);
      g.stroke();
    }
    var i2;
    for (i2 = 0; i2 < 7; i2++) {
      var a = t * 0.45 + i2 * TAU / 7;
      var rr = 18 + (i2 % 3) * 15 + Math.sin(t * 1.4 + i2) * 4;
      var px = Math.cos(a) * rr;
      var py = -10 + Math.sin(a) * rr * 1.05 - (t * 4 + i2 * 9) % 28;
      g.fillStyle = i2 % 2 ? 'rgba(201,255,219,0.72)' : 'rgba(137,239,214,0.55)';
      g.beginPath();
      g.arc(px, py, 1.5 + (i2 % 3) * 0.5, 0, TAU);
      g.fill();
    }
    g.restore();
  }

  function drawTorchFlame(g, x, y, t, phase) {
    var flick = 0.82 + 0.18 * Math.sin(t * 11 + phase) + 0.08 * Math.sin(t * 23 + phase * 2);
    g.save();
    g.translate(x, y);
    var glow = g.createRadialGradient(0, -5, 1, 0, -5, 56);
    glow.addColorStop(0, 'rgba(255,198,108,0.22)');
    glow.addColorStop(0.45, 'rgba(255,157,69,0.07)');
    glow.addColorStop(1, 'rgba(255,122,48,0)');
    g.fillStyle = glow;
    g.beginPath();
    g.arc(0, -5, 56, 0, TAU);
    g.fill();
    g.fillStyle = '#5b3a20';
    g.beginPath();
    g.ellipse(0, 2, 5.4, 2.2, 0, 0, TAU);
    g.fill();
    var fg = g.createLinearGradient(0, 2, 0, -26 * flick);
    fg.addColorStop(0, '#ffda7b');
    fg.addColorStop(0.45, '#ffb253');
    fg.addColorStop(0.8, '#f27f45');
    fg.addColorStop(1, 'rgba(245,104,60,0)');
    g.fillStyle = fg;
    g.beginPath();
    g.moveTo(0, 2);
    g.bezierCurveTo(-9, -3, -5, -13 * flick, 0, -24 * flick);
    g.bezierCurveTo(5, -13 * flick, 9, -3, 0, 2);
    g.fill();
    g.fillStyle = 'rgba(255,247,203,0.9)';
    g.beginPath();
    g.ellipse(0, -5 * flick, 2.1, 5.2 * flick, 0, 0, TAU);
    g.fill();
    g.restore();
  }

  function drawGateDynamic(g, t) {
    drawTorchFlame(g, GATE.x - 52, GATE.y - 51, t, 0.4);
    drawTorchFlame(g, GATE.x + 52, GATE.y - 51, t, 2.1);
    if (gateFlash > 0) {
      g.save();
      g.globalCompositeOperation = 'lighter';
      var fg = g.createRadialGradient(GATE.x, GATE.y - 52, 8, GATE.x, GATE.y - 52, 170);
      fg.addColorStop(0, 'rgba(255,107,73,' + (gateFlash * 0.22) + ')');
      fg.addColorStop(1, 'rgba(255,74,44,0)');
      g.fillStyle = fg;
      g.beginPath();
      g.arc(GATE.x, GATE.y - 52, 170, 0, TAU);
      g.fill();
      g.restore();
    }
  }

  function drawTowerRange(g, pad, level, alpha) {
    var st = statsFor(level);
    g.save();
    g.translate(pad.x, pad.y - 8);
    var rg = g.createRadialGradient(0, 0, st.range * 0.38, 0, 0, st.range);
    rg.addColorStop(0, 'rgba(245,219,162,0)');
    rg.addColorStop(0.76, 'rgba(228,214,167,0.025)');
    rg.addColorStop(1, 'rgba(241,211,142,0.1)');
    g.fillStyle = rg;
    g.beginPath();
    g.arc(0, 0, st.range, 0, TAU);
    g.fill();
    g.strokeStyle = 'rgba(245,219,162,' + (0.38 * alpha) + ')';
    g.lineWidth = 1.6;
    g.setLineDash([11, 9]);
    g.lineDashOffset = -visualTime * 16;
    g.beginPath();
    g.arc(0, 0, st.range, 0, TAU);
    g.stroke();
    g.setLineDash([]);
    g.restore();
  }

  function drawPadDynamic(g, pad, t) {
    var pulse = 0.5 + 0.5 * Math.sin(t * 2 + pad.index * 0.95);
    var hovered = hoverPad === pad.index;
    var selected = selectedPad === pad.index;

    if (selected || (hovered && pad.tower)) {
      g.save();
      g.translate(pad.x, pad.y);
      g.strokeStyle = 'rgba(249,218,153,' + (selected ? 0.8 : 0.38) + ')';
      g.lineWidth = selected ? 2.3 : 1.5;
      g.setLineDash([7, 7]);
      g.lineDashOffset = -t * 12;
      g.beginPath();
      g.ellipse(0, 2, 47, 19, 0, 0, TAU);
      g.stroke();
      g.setLineDash([]);
      g.fillStyle = 'rgba(255,225,162,0.06)';
      g.beginPath();
      g.ellipse(0, 2, 46, 18, 0, 0, TAU);
      g.fill();
      g.restore();
    }

    if (!pad.tower) {
      var canAfford = gold >= R.buildCost;
      var lift = Math.sin(t * 2.5 + pad.index) * 2.4;
      g.save();
      g.translate(pad.x, pad.y);
      g.globalAlpha = 0.34 + pulse * 0.24;
      g.strokeStyle = canAfford ? '#ecd49a' : 'rgba(198,141,112,0.8)';
      g.lineWidth = 1.4;
      g.beginPath();
      g.ellipse(0, 2, 45 + pulse * 2.5, 18 + pulse, 0, 0, TAU);
      g.stroke();
      g.globalAlpha = 1;

      if (hovered) {
        g.save();
        g.globalAlpha = 0.18;
        drawTowerArt(g, 1, -Math.PI / 2 + Math.sin(t * 0.8) * 0.08, t + pad.index);
        g.restore();
      }

      /* bobbing plus-rune */
      g.translate(0, -38 + lift);
      g.strokeStyle = canAfford ? 'rgba(244,218,158,0.82)' : 'rgba(188,142,120,0.65)';
      g.lineWidth = 2.2;
      g.beginPath();
      g.moveTo(-7, 0);
      g.lineTo(7, 0);
      g.moveTo(0, -7);
      g.lineTo(0, 7);
      g.stroke();
      g.strokeStyle = 'rgba(255,241,199,0.24)';
      g.lineWidth = 1;
      g.beginPath();
      g.arc(0, 0, 12, 0, TAU);
      g.stroke();
      g.restore();

      /* price tag */
      var tagW = 54, tagH = 22;
      var tagY = pad.y - 65 + lift;
      g.save();
      g.translate(pad.x - tagW / 2, tagY);
      fillRoundRect(g, 0, 0, tagW, tagH, 11, 'rgba(7,24,19,0.85)');
      strokeRoundRect(g, 0, 0, tagW, tagH, 11, canAfford ? 'rgba(235,204,139,0.5)' : 'rgba(180,117,95,0.4)', 1);
      drawCoin(g, 15, tagH / 2, 6.8);
      g.textAlign = 'left';
      g.textBaseline = 'middle';
      setFont(g, 'bold', 14, false);
      g.fillStyle = canAfford ? '#f4dfb1' : '#d69884';
      g.fillText(String(R.buildCost), 25, tagH / 2 + 0.5);
      g.restore();
    } else if (pad.glow > 0) {
      g.save();
      g.translate(pad.x, pad.y);
      g.globalCompositeOperation = 'lighter';
      g.strokeStyle = 'rgba(255,226,161,' + (pad.glow * 0.52) + ')';
      g.lineWidth = 3;
      g.beginPath();
      g.ellipse(0, 2, 48 + (1 - pad.glow) * 25, 20 + (1 - pad.glow) * 10, 0, 0, TAU);
      g.stroke();
      g.restore();
    }
  }

  function drawGameTower(g, pad, t) {
    var tower = pad.tower;
    if (!tower) return;
    var birth = clamp(tower.age / 0.52, 0, 1);
    var sc = 0.58 + 0.42 * easeOutCubic(birth);
    g.save();
    g.translate(pad.x, pad.y + tower.recoil * 2.2);
    g.scale(sc, sc);
    drawTowerArt(g, tower.level, tower.aim, t + pad.index * 1.7);
    g.restore();

    if (tower.flash > 0) {
      g.save();
      g.translate(pad.x, pad.y - 78);
      g.globalCompositeOperation = 'lighter';
      g.strokeStyle = 'rgba(255,231,167,' + (tower.flash * 0.55) + ')';
      g.lineWidth = 2.5;
      g.beginPath();
      g.arc(0, 0, 44 + (1 - tower.flash) * 35, 0, TAU);
      g.stroke();
      g.restore();
    }
  }

  function drawEnemyHealth(g, e) {
    if (e.hp >= e.maxHp && e.kind !== 'boss') return;
    var w = e.kind === 'boss' ? 104 : Math.max(30, e.radius * 2.15);
    var h = e.kind === 'boss' ? 7 : 4.5;
    var x = e.x - w / 2;
    var y = e.y - e.radius * 2.12 - (e.kind === 'boss' ? 24 : 8);
    fillRoundRect(g, x, y, w, h, h / 2, 'rgba(8,20,16,0.75)');
    var frac = clamp(e.hp / e.maxHp, 0, 1);
    var barG = g.createLinearGradient(x, y, x + w, y);
    if (frac > 0.55) {
      barG.addColorStop(0, '#8dca6e');
      barG.addColorStop(1, '#cde58d');
    } else if (frac > 0.25) {
      barG.addColorStop(0, '#e0b35d');
      barG.addColorStop(1, '#f3d78a');
    } else {
      barG.addColorStop(0, '#d9604f');
      barG.addColorStop(1, '#ef9276');
    }
    g.fillStyle = barG;
    if (frac > 0) {
      g.beginPath();
      var rr = Math.min(h / 2, frac * w / 2);
      g.moveTo(x + rr, y);
      g.lineTo(x + frac * w - rr, y);
      g.quadraticCurveTo(x + frac * w, y, x + frac * w, y + h / 2);
      g.quadraticCurveTo(x + frac * w, y + h, x + frac * w - rr, y + h);
      g.lineTo(x + rr, y + h);
      g.quadraticCurveTo(x, y + h, x, y + h / 2);
      g.quadraticCurveTo(x, y, x + rr, y);
      g.closePath();
      g.fill();
    }
    strokeRoundRect(g, x, y, w, h, h / 2, 'rgba(7,22,17,0.8)', 1);
    if (e.armor > 0) {
      g.fillStyle = 'rgba(227,240,231,0.75)';
      g.beginPath();
      g.moveTo(x - 7, y + h * 0.5);
      g.lineTo(x - 3.5, y + h * 0.5 - 4);
      g.lineTo(x, y + h * 0.5);
      g.lineTo(x - 3.5, y + h * 0.5 + 4);
      g.closePath();
      g.fill();
    }
  }

  function drawEnemyEntity(g, e, t) {
    var spawnScale = clamp(0.35 + 0.65 * easeOutCubic(e.spawnAge / 0.3), 0.35, 1);
    if (e.kind === 'boss') {
      g.save();
      g.translate(e.x, e.y - 8);
      var aura = g.createRadialGradient(0, 0, 6, 0, 0, e.radius * 2.3);
      aura.addColorStop(0, 'rgba(117,255,190,0.11)');
      aura.addColorStop(0.55, 'rgba(78,217,158,0.05)');
      aura.addColorStop(1, 'rgba(78,217,158,0)');
      g.fillStyle = aura;
      g.beginPath();
      g.arc(0, 0, e.radius * 2.3, 0, TAU);
      g.fill();
      g.restore();
    }
    g.save();
    g.translate(e.x, e.y);
    g.scale(spawnScale, spawnScale);
    drawSlimeArt(g, e.kind, e.wob + t * 0.15, e.angle, e.hitFlash, 1);
    g.restore();
    drawEnemyHealth(g, e);
  }

  function drawArrowEntity(g, a) {
    g.save();
    g.translate(a.x, a.y);
    g.rotate(a.angle);
    g.globalCompositeOperation = 'lighter';
    g.strokeStyle = a.crit ? 'rgba(255,226,143,0.32)' : 'rgba(255,224,156,0.17)';
    g.lineWidth = a.crit ? 7 : 5;
    g.beginPath();
    g.moveTo(-42, 0);
    g.lineTo(10, 0);
    g.stroke();
    g.fillStyle = a.crit ? 'rgba(255,232,157,0.6)' : 'rgba(255,222,152,0.32)';
    g.beginPath();
    g.arc(10, 0, a.crit ? 5 : 3.5, 0, TAU);
    g.fill();
    g.globalCompositeOperation = 'source-over';
    g.strokeStyle = a.crit ? 'rgba(255,235,172,0.9)' : 'rgba(244,227,180,0.68)';
    g.lineWidth = 1.9;
    g.beginPath();
    g.moveTo(-37, 0);
    g.lineTo(0, 0);
    g.stroke();
    g.strokeStyle = a.crit ? '#ffe7a1' : '#e8d29b';
    g.lineWidth = 2.3;
    g.beginPath();
    g.moveTo(-9, 0);
    g.lineTo(10, 0);
    g.stroke();
    g.fillStyle = a.crit ? '#fff0be' : '#d8bf88';
    g.beginPath();
    g.moveTo(16, 0);
    g.lineTo(8, -3.1);
    g.lineTo(8, 3.1);
    g.closePath();
    g.fill();
    g.strokeStyle = a.crit ? '#ffe6a2' : 'rgba(236,215,165,0.82)';
    g.lineWidth = 1.4;
    g.beginPath();
    g.moveTo(-9, 0);
    g.lineTo(-14, -4);
    g.moveTo(-9, 0);
    g.lineTo(-14, 4);
    g.stroke();
    if (a.crit) {
      g.fillStyle = 'rgba(255,250,220,0.9)';
      drawStarPath(g, 2, 0, 4, 1.2, 4, 0.2);
      g.fill();
    }
    g.restore();
  }

  function drawEffects(g) {
    var i, p, r, f;
    for (i = 0; i < rings.length; i++) {
      r = rings[i];
      var prog = clamp(r.age / r.life, 0, 1);
      var rad = lerp(r.from, r.to, easeOutCubic(prog));
      g.save();
      g.globalAlpha = (1 - prog) * 0.9;
      g.strokeStyle = r.color;
      g.lineWidth = r.width * (1 - prog * 0.5);
      g.beginPath();
      g.ellipse(r.x, r.y, rad, rad * 0.62, 0, 0, TAU);
      g.stroke();
      g.restore();
    }
    for (i = 0; i < particles.length; i++) {
      p = particles[i];
      var alpha = 1 - p.age / p.life;
      if (alpha <= 0) continue;
      g.save();
      g.globalAlpha = Math.min(1, alpha * 1.25);
      g.fillStyle = p.color;
      if (p.kind === 'spark') {
        g.strokeStyle = p.color;
        g.lineWidth = Math.max(1, p.size * 0.55);
        g.beginPath();
        g.moveTo(p.x, p.y);
        g.lineTo(p.x - p.vx * 0.035, p.y - p.vy * 0.035);
        g.stroke();
      } else if (p.kind === 'leaf') {
        g.translate(p.x, p.y);
        g.rotate(p.age * 4 + p.size);
        leafPath(g, 0, 0, p.size * 3, 0);
        g.fill();
      } else {
        g.beginPath();
        g.arc(p.x, p.y, p.size * (0.5 + alpha * 0.5), 0, TAU);
        g.fill();
      }
      g.restore();
    }
    for (i = 0; i < floaters.length; i++) {
      f = floaters[i];
      var fa = 1 - f.age / f.life;
      if (fa <= 0) continue;
      g.save();
      g.globalAlpha = Math.min(1, fa * 1.7);
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      setFont(g, 'bold', f.size, false);
      g.strokeStyle = 'rgba(7,20,14,0.8)';
      g.lineWidth = Math.max(2, f.size * 0.2);
      g.strokeText(f.text, f.x, f.y);
      g.fillStyle = f.color;
      g.fillText(f.text, f.x, f.y);
      g.restore();
    }
    g.globalAlpha = 1;
  }

  function drawBattleWorld(g, t) {
    drawAmbientWorld(g, t);
    drawPortalGlow(g, t);
    drawGateDynamic(g, t);

    if (hoverPad >= 0 && PADS[hoverPad] && !PADS[hoverPad].tower && !paused) {
      drawTowerRange(g, PADS[hoverPad], 1, 0.55);
    }
    if (selectedPad >= 0 && PADS[selectedPad] && PADS[selectedPad].tower) {
      drawTowerRange(g, PADS[selectedPad], PADS[selectedPad].tower.level, 1);
    } else if (hoverPad >= 0 && PADS[hoverPad] && PADS[hoverPad].tower) {
      drawTowerRange(g, PADS[hoverPad], PADS[hoverPad].tower.level, 0.7);
    }

    var pi;
    for (pi = 0; pi < PADS.length; pi++) drawPadDynamic(g, PADS[pi], t);

    for (pi = 0; pi < PADS.length; pi++) {
      if (PADS[pi].tower) drawGameTower(g, PADS[pi], t);
    }

    var sorted = [];
    for (pi = 0; pi < enemies.length; pi++) {
      if (!enemies[pi].dead) sorted.push(enemies[pi]);
    }
    sorted.sort(function (a, b) { return (a.y + a.radius) - (b.y + b.radius); });
    for (pi = 0; pi < sorted.length; pi++) drawEnemyEntity(g, sorted[pi], t);

    var ai;
    for (ai = 0; ai < arrows.length; ai++) drawArrowEntity(g, arrows[ai]);
    drawEffects(g);
  }

  function drawAttractWorld(g, t) {
    drawAmbientWorld(g, t);
    drawPortalGlow(g, t);
    drawGateDynamic(g, t);

    var previewTowers = [
      { pad: 0, level: 2, aim: 0.44 + Math.sin(t * 0.35) * 0.08 },
      { pad: 1, level: 3, aim: 2.25 + Math.sin(t * 0.28 + 1) * 0.07 },
      { pad: 6, level: 1, aim: 0.55 + Math.sin(t * 0.42 + 2) * 0.06 }
    ];
    var i;
    for (i = 0; i < previewTowers.length; i++) {
      var pv = previewTowers[i];
      var pad = PADS[pv.pad];
      g.save();
      g.translate(pad.x, pad.y);
      drawTowerArt(g, pv.level, pv.aim, t + pv.pad * 1.7);
      g.restore();
    }

    var kinds = ['green', 'blue', 'red'];
    for (i = 0; i < 3; i++) {
      var travel = ((t * 0.032 + i * 0.31) % 1);
      var d = 80 + travel * (ROAD.total - 180);
      var p = ROAD.at(d);
      var lane = i === 0 ? -13 : (i === 1 ? 13 : -2);
      var ex = p.x + p.nx * lane;
      var ey = p.y + p.ny * lane;
      g.save();
      g.translate(ex, ey);
      drawSlimeArt(g, kinds[i], t + i * 1.8, p.angle, 0, 1);
      g.restore();
    }

    g.save();
    g.globalCompositeOperation = 'lighter';
    for (i = 0; i < 8; i++) {
      var ang = t * 0.25 + i * TAU / 8;
      var px = 390 + Math.cos(ang) * (220 + i * 8);
      var py = 650 + Math.sin(ang * 0.7 + i) * 290;
      g.globalAlpha = 0.24 + 0.18 * Math.sin(t * 1.2 + i);
      g.fillStyle = i % 2 ? '#ffe1a0' : '#b8f0c2';
      g.beginPath();
      g.arc(px, py, 2, 0, TAU);
      g.fill();
    }
    g.restore();
  }

  /* ================================================================
   * 8. THE SCREEN — frame, HUD, cards and overlays
   * ================================================================ */
  function uiScale() {
    return clamp(view.w / 390, 0.78, 1.32);
  }

  function worldToScreen(x, y) {
    return { x: view.x + x * fitScale, y: view.y + y * fitScale };
  }

  function pointInRect(x, y, r) {
    return !!r && x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
  }

  function drawScreenBackdrop(g) {
    var sw = canvas.width / dpr;
    var sh = canvas.height / dpr;
    var bg = g.createLinearGradient(0, 0, sw, sh);
    bg.addColorStop(0, '#061714');
    bg.addColorStop(0.48, '#0b201b');
    bg.addColorStop(1, '#030d0b');
    g.fillStyle = bg;
    g.fillRect(0, 0, sw, sh);

    var leftBar = view.x;
    var rightBar = sw - (view.x + view.w);
    if (leftBar > 30 || rightBar > 30) {
      var moonX = sw - Math.max(0, rightBar) * 0.45;
      var moonY = sh * 0.22;
      var glow = g.createRadialGradient(moonX, moonY, 4, moonX, moonY, sh * 0.55);
      glow.addColorStop(0, 'rgba(178,223,182,0.09)');
      glow.addColorStop(0.5, 'rgba(102,160,128,0.03)');
      glow.addColorStop(1, 'rgba(80,136,106,0)');
      g.fillStyle = glow;
      g.fillRect(0, 0, sw, sh);

      /* silhouette branches reaching toward the little forest panel */
      g.save();
      g.strokeStyle = 'rgba(31,63,47,0.55)';
      g.lineCap = 'round';
      var branches = [
        [0, sh * 0.22, view.x * 0.8, sh * 0.34, 20],
        [sw, sh * 0.16, sw - rightBar * 0.8, sh * 0.29, 18],
        [0, sh * 0.78, view.x * 0.65, sh * 0.69, 14],
        [sw, sh * 0.8, sw - rightBar * 0.65, sh * 0.7, 15]
      ];
      var bi;
      for (bi = 0; bi < branches.length; bi++) {
        var br = branches[bi];
        g.lineWidth = br[4];
        g.beginPath();
        g.moveTo(br[0], br[1]);
        g.bezierCurveTo((br[0] + br[2]) / 2, br[1] - 30, br[2] + 20, br[3] + 18, br[2], br[3]);
        g.stroke();
        var li;
        for (li = 0; li < 4; li++) {
          var lt = 0.25 + li * 0.18;
          var lx = lerp(br[0], br[2], lt);
          var ly = lerp(br[1], br[3], lt) + Math.sin(lt * 6) * 16;
          g.save();
          g.translate(lx, ly);
          g.rotate((li % 2 ? 1 : -1) * (0.5 + li * 0.17));
          g.fillStyle = 'rgba(40,80,58,0.36)';
          leafPath(g, 0, 0, 18 + li * 4, 0);
          g.fill();
          g.restore();
        }
      }
      g.restore();

      g.save();
      g.globalAlpha = 0.5;
      g.fillStyle = '#d4bb82';
      setFont(g, 'normal', Math.max(10, sh * 0.017), true);
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      if (leftBar > 88) {
        var lx2 = view.x * 0.46;
        for (var ci = 0; ci < 4; ci++) {
          g.fillText('月影森林'[ci], lx2, sh * 0.42 + ci * sh * 0.045);
        }
      }
      if (rightBar > 88) {
        var rx2 = view.x + view.w + rightBar * 0.54;
        for (var cj = 0; cj < 4; cj++) {
          g.fillText('城门守卫'[cj], rx2, sh * 0.42 + cj * sh * 0.045);
        }
      }
      g.restore();

      var i;
      for (i = 0; i < 20; i++) {
        var sx = (i < 10) ? ((leftBar || 50) * ((i * 37 % 100) / 100)) :
          (view.x + view.w + (rightBar || 50) * (((i - 10) * 53 % 100) / 100));
        var sy = sh * ((i * 61 % 100) / 100);
        g.globalAlpha = 0.12 + 0.25 * (0.5 + 0.5 * Math.sin(visualTime * 1.1 + i));
        g.fillStyle = i % 3 ? '#cfe6b0' : '#f1cf8a';
        g.beginPath();
        g.arc(sx, sy, 1 + (i % 3) * 0.4, 0, TAU);
        g.fill();
      }
      g.globalAlpha = 1;
    }

    /* soft shadow behind the forest panel */
    if (view.x > 2 || view.y > 2) {
      g.save();
      g.shadowColor = 'rgba(0,0,0,0.62)';
      g.shadowBlur = 34;
      g.shadowOffsetY = 12;
      fillRoundRect(g, view.x, view.y, view.w, view.h, 18, '#06120f');
      g.restore();
    }
  }

  function drawMapVignette(g) {
    g.save();
    var v = g.createRadialGradient(view.x + view.w * 0.5, view.y + view.h * 0.44, view.w * 0.22, view.x + view.w * 0.5, view.y + view.h * 0.48, view.w * 0.95);
    v.addColorStop(0, 'rgba(0,0,0,0)');
    v.addColorStop(0.7, 'rgba(1,9,7,0.05)');
    v.addColorStop(1, 'rgba(1,8,6,0.34)');
    g.fillStyle = v;
    g.fillRect(view.x, view.y, view.w, view.h);
    var topShade = g.createLinearGradient(0, view.y, 0, view.y + 140);
    topShade.addColorStop(0, 'rgba(2,12,9,0.38)');
    topShade.addColorStop(1, 'rgba(2,12,9,0)');
    g.fillStyle = topShade;
    g.fillRect(view.x, view.y, view.w, 140);
    var bottomShade = g.createLinearGradient(0, view.y + view.h - 150, 0, view.y + view.h);
    bottomShade.addColorStop(0, 'rgba(2,10,8,0)');
    bottomShade.addColorStop(1, 'rgba(2,10,8,0.34)');
    g.fillStyle = bottomShade;
    g.fillRect(view.x, view.y + view.h - 150, view.w, 150);
    g.restore();
  }

  function drawMapFrame(g) {
    var sw = canvas.width / dpr;
    var sh = canvas.height / dpr;
    var wide = view.x > 2 || view.y > 2;
    g.save();
    g.strokeStyle = wide ? 'rgba(234,203,139,0.26)' : 'rgba(234,203,139,0.12)';
    g.lineWidth = 1.2;
    roundRectPath(g, view.x - 0.5, view.y - 0.5, view.w + 1, view.h + 1, wide ? 18 : 2);
    g.stroke();
    if (wide) {
      g.strokeStyle = 'rgba(112,159,126,0.12)';
      g.lineWidth = 3;
      roundRectPath(g, view.x + 4, view.y + 4, view.w - 8, view.h - 8, 15);
      g.stroke();
    }
    /* faint dust at the four corners of the screen */
    g.fillStyle = 'rgba(223,195,135,0.2)';
    var corners = [[28, sh - 30], [sw - 28, sh - 30]];
    for (var i = 0; i < corners.length; i++) {
      g.beginPath();
      g.arc(corners[i][0], corners[i][1], 1.4, 0, TAU);
      g.fill();
    }
    g.restore();
  }

  function drawGoldText(g, text, cx, cy, size, weight, serif, maxWidth, bright) {
    var fs = fitFont(g, text, weight || 'bold', size, maxWidth || 1000, 8, serif);
    var tw = g.measureText(text).width;
    var grd = g.createLinearGradient(0, cy - fs * 0.6, 0, cy + fs * 0.5);
    if (bright) {
      grd.addColorStop(0, '#fffbe9');
      grd.addColorStop(0.32, '#ffe8b3');
      grd.addColorStop(0.68, '#e6bd73');
      grd.addColorStop(1, '#fff1c9');
    } else {
      grd.addColorStop(0, '#fff1cc');
      grd.addColorStop(0.38, '#f0d18d');
      grd.addColorStop(0.72, '#c79750');
      grd.addColorStop(1, '#f4d99a');
    }
    g.save();
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.lineJoin = 'round';
    g.strokeStyle = 'rgba(9,27,21,0.88)';
    g.lineWidth = Math.max(3, fs * 0.1);
    g.strokeText(text, cx, cy);
    g.shadowColor = 'rgba(0,0,0,0.34)';
    g.shadowBlur = fs * 0.16;
    g.shadowOffsetY = fs * 0.06;
    g.fillStyle = grd;
    g.fillText(text, cx, cy);
    g.restore();
    return { size: fs, width: tw };
  }

  function drawDivider(g, cx, y, width, color) {
    g.save();
    var grd = g.createLinearGradient(cx - width / 2, y, cx + width / 2, y);
    grd.addColorStop(0, 'rgba(226,197,133,0)');
    grd.addColorStop(0.22, color || 'rgba(226,197,133,0.48)');
    grd.addColorStop(0.5, 'rgba(250,228,170,0.78)');
    grd.addColorStop(0.78, color || 'rgba(226,197,133,0.48)');
    grd.addColorStop(1, 'rgba(226,197,133,0)');
    g.strokeStyle = grd;
    g.lineWidth = 1.1;
    g.beginPath();
    g.moveTo(cx - width / 2, y);
    g.lineTo(cx + width / 2, y);
    g.stroke();
    g.fillStyle = 'rgba(247,223,168,0.85)';
    drawStarPath(g, cx, y, 4, 1.3, 4, Math.PI / 4);
    g.fill();
    g.restore();
  }

  function drawOrnateCard(g, x, y, w, h, radius, redAccent) {
    var grd = g.createLinearGradient(x, y, x, y + h);
    grd.addColorStop(0, 'rgba(13,38,31,0.96)');
    grd.addColorStop(0.24, 'rgba(10,30,25,0.95)');
    grd.addColorStop(0.72, 'rgba(7,23,19,0.96)');
    grd.addColorStop(1, 'rgba(4,16,13,0.97)');
    g.save();
    g.shadowColor = 'rgba(0,0,0,0.65)';
    g.shadowBlur = 28;
    g.shadowOffsetY = 10;
    fillRoundRect(g, x, y, w, h, radius, grd);
    g.restore();

    g.save();
    roundRectPath(g, x, y, w, h, radius);
    g.clip();
    var sheen = g.createLinearGradient(x, y, x + w * 0.8, y + h);
    sheen.addColorStop(0, 'rgba(255,255,220,0.055)');
    sheen.addColorStop(0.34, 'rgba(255,255,220,0.012)');
    sheen.addColorStop(1, 'rgba(255,255,220,0)');
    g.fillStyle = sheen;
    g.fillRect(x, y, w, h);
    g.strokeStyle = 'rgba(239,209,144,0.12)';
    g.lineWidth = 1;
    for (var i = 1; i < 5; i++) {
      g.beginPath();
      g.moveTo(x + w * 0.08, y + h * i / 5);
      g.lineTo(x + w * 0.92, y + h * i / 5);
      g.stroke();
    }
    g.restore();

    strokeRoundRect(g, x + 0.5, y + 0.5, w - 1, h - 1, radius, redAccent ? 'rgba(210,118,92,0.62)' : 'rgba(238,207,142,0.58)', 1.5);
    strokeRoundRect(g, x + 5, y + 5, w - 10, h - 10, Math.max(2, radius - 4), 'rgba(221,194,131,0.16)', 1);

    /* little corner flourishes */
    var corners = [
      [x + 13, y + 13, 1, 1],
      [x + w - 13, y + 13, -1, 1],
      [x + 13, y + h - 13, 1, -1],
      [x + w - 13, y + h - 13, -1, -1]
    ];
    g.save();
    g.strokeStyle = redAccent ? 'rgba(224,156,122,0.56)' : 'rgba(239,211,148,0.56)';
    g.lineWidth = 1.2;
    for (var ci = 0; ci < corners.length; ci++) {
      var c = corners[ci];
      g.beginPath();
      g.moveTo(c[0] + c[2] * 16, c[1]);
      g.lineTo(c[0] + c[2] * 5, c[1]);
      g.quadraticCurveTo(c[0], c[1], c[0], c[1] + c[3] * 5);
      g.lineTo(c[0], c[1] + c[3] * 16);
      g.stroke();
      g.beginPath();
      g.arc(c[0] + c[2] * 7, c[1] + c[3] * 7, 2, 0, TAU);
      g.fillStyle = redAccent ? 'rgba(231,167,131,0.65)' : 'rgba(243,216,154,0.68)';
      g.fill();
    }
    g.restore();
    drawDivider(g, x + w / 2, y + 9, w * 0.24, redAccent ? 'rgba(210,140,107,0.42)' : undefined);
    drawDivider(g, x + w / 2, y + h - 9, w * 0.24, redAccent ? 'rgba(210,140,107,0.42)' : undefined);
  }

  function drawWideButton(g, x, y, w, h, label, hovered) {
    var pulse = 0.5 + 0.5 * Math.sin(visualTime * 2.2);
    g.save();
    g.shadowColor = 'rgba(255,206,109,' + (0.12 + pulse * 0.12) + ')';
    g.shadowBlur = 16 + pulse * 8;
    var grd = g.createLinearGradient(0, y, 0, y + h);
    grd.addColorStop(0, hovered ? '#ffe9b2' : '#f5d997');
    grd.addColorStop(0.48, hovered ? '#ecc273' : '#e2b465');
    grd.addColorStop(1, '#b9813c');
    fillRoundRect(g, x, y, w, h, h / 2, grd);
    g.restore();
    strokeRoundRect(g, x, y, w, h, h / 2, 'rgba(63,42,20,0.8)', 1.4);
    g.save();
    roundRectPath(g, x, y, w, h, h / 2);
    g.clip();
    var sheen = g.createLinearGradient(0, y, 0, y + h * 0.5);
    sheen.addColorStop(0, 'rgba(255,255,230,0.55)');
    sheen.addColorStop(1, 'rgba(255,255,230,0)');
    g.fillStyle = sheen;
    g.fillRect(x, y, w, h * 0.55);
    g.restore();
    g.save();
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    setFont(g, 'bold', Math.min(h * 0.42, 21), true);
    g.fillStyle = '#233a2c';
    g.fillText(label, x + w / 2, y + h / 2 + 1);
    g.restore();
  }

  function drawHUD(g) {
    if (phase !== 'playing') return;
    var s = uiScale();
    var pad = 10 * s;
    var x = view.x + pad;
    var y = view.y + pad;
    var w = view.w - pad * 2;
    var h = 44 * s;

    var grd = g.createLinearGradient(x, y, x, y + h);
    grd.addColorStop(0, 'rgba(15,43,35,0.90)');
    grd.addColorStop(0.6, 'rgba(8,28,23,0.92)');
    grd.addColorStop(1, 'rgba(4,19,15,0.94)');
    g.save();
    g.shadowColor = 'rgba(0,0,0,0.4)';
    g.shadowBlur = 12;
    g.shadowOffsetY = 3;
    fillRoundRect(g, x, y, w, h, 13 * s, grd);
    g.restore();
    strokeRoundRect(g, x, y, w, h, 13 * s, 'rgba(238,207,145,0.34)', 1);
    g.strokeStyle = 'rgba(255,240,197,0.12)';
    g.lineWidth = 1;
    g.beginPath();
    g.moveTo(x + w * 0.12, y + 1.5);
    g.lineTo(x + w * 0.88, y + 1.5);
    g.stroke();

    var waveW = w * 0.35;
    var goldW = w * 0.27;
    var gateW = w * 0.38;
    var secX = [x, x + waveW, x + waveW + goldW];
    var secW = [waveW, goldW, gateW];
    g.strokeStyle = 'rgba(237,209,150,0.15)';
    for (var di = 0; di < 2; di++) {
      var dvx = x + waveW + (di === 1 ? goldW : 0);
      g.beginPath();
      g.moveTo(dvx, y + 8 * s);
      g.lineTo(dvx, y + h - 8 * s);
      g.stroke();
    }

    var centerY = y + h / 2;
    var labelY = y + 13.5 * s;
    var valueY = y + 29 * s;
    g.textBaseline = 'middle';
    g.textAlign = 'left';

    /* wave crest */
    g.save();
    g.translate(secX[0] + 17 * s, centerY);
    g.fillStyle = 'rgba(149,208,128,0.96)';
    g.beginPath();
    g.moveTo(-11 * s, 2 * s);
    g.bezierCurveTo(-12 * s, -9 * s, -5 * s, -15 * s, 0, -15 * s);
    g.bezierCurveTo(6 * s, -15 * s, 12 * s, -9 * s, 11 * s, 2 * s);
    g.quadraticCurveTo(5 * s, 9 * s, 0, 9 * s);
    g.quadraticCurveTo(-5 * s, 9 * s, -11 * s, 2 * s);
    g.closePath();
    g.fill();
    g.fillStyle = '#173324';
    g.beginPath();
    g.arc(-4.5 * s, -3 * s, 2.2 * s, 0, TAU);
    g.arc(4.5 * s, -3 * s, 2.2 * s, 0, TAU);
    g.fill();
    g.fillStyle = 'rgba(255,255,228,0.78)';
    g.beginPath();
    g.arc(-5.2 * s, -3.8 * s, 0.8 * s, 0, TAU);
    g.arc(3.8 * s, -3.8 * s, 0.8 * s, 0, TAU);
    g.fill();
    g.restore();

    setFont(g, 'normal', 8.7 * s, false);
    g.fillStyle = 'rgba(212,221,191,0.64)';
    g.fillText('波次', secX[0] + 32 * s, labelY);
    setFont(g, 'bold', 15.5 * s, false);
    g.fillStyle = '#f1e2be';
    g.fillText(currentWaveNumber() + ' / ' + R.waveCount, secX[0] + 32 * s, valueY + 1.5 * s);

    /* gold */
    drawCoin(g, secX[1] + 17 * s, centerY + 2 * s, 9.4 * s);
    setFont(g, 'normal', 8.7 * s, false);
    g.fillStyle = 'rgba(212,221,191,0.64)';
    g.fillText(hoverUI === 'gold' ? '金币' : '金币', secX[1] + 31 * s, labelY);
    setFont(g, 'bold', 16.5 * s, false);
    g.fillStyle = goldFlash > 0 ? '#fff7d5' : '#f7dca1';
    g.fillText(String(gold), secX[1] + 31 * s, valueY + 1.5 * s);

    /* gate */
    var gateLow = gateHp <= Math.max(1, Math.ceil(R.gateHp * 0.25));
    drawGateIcon(g, secX[2] + 17 * s, centerY + 3 * s, 10 * s, gateLow ? '#e69a83' : '#dbc99f');
    setFont(g, 'normal', 8.7 * s, false);
    g.fillStyle = 'rgba(212,221,191,0.64)';
    g.fillText('城门耐久', secX[2] + 31 * s, labelY);
    setFont(g, 'bold', 15.5 * s, false);
    g.fillStyle = gateFlash > 0 ? '#ffd4c0' : (gateLow ? '#f2a28c' : '#f1e2be');
    g.fillText(String(gateHp), secX[2] + 31 * s, valueY + 1.5 * s);
    setFont(g, 'normal', 9.5 * s, false);
    g.fillStyle = 'rgba(213,220,199,0.5)';
    g.fillText('/ ' + R.gateHp, secX[2] + 31 * s + g.measureText(String(gateHp)).width + 4 * s, valueY + 2 * s);

    /* wave pips */
    var rowY = y + h + 15 * s;
    var pipX = x + 4 * s;
    var step = 11.5 * s;
    for (var pi = 0; pi < R.waveCount; pi++) {
      var done = pi < waveIndex;
      var current = pi === waveIndex && phase === 'playing';
      var px = pipX + pi * step;
      g.save();
      g.translate(px, rowY);
      g.rotate(Math.PI / 4);
      if (done) {
        g.fillStyle = 'rgba(231,197,126,0.9)';
        g.fillRect(-3.4 * s, -3.4 * s, 6.8 * s, 6.8 * s);
      } else if (current) {
        g.globalAlpha = 0.55 + 0.28 * Math.sin(visualTime * 3);
        g.fillStyle = '#bde8a7';
        g.fillRect(-4.1 * s, -4.1 * s, 8.2 * s, 8.2 * s);
        g.globalAlpha = 0.26;
        g.fillRect(-6.2 * s, -6.2 * s, 12.4 * s, 12.4 * s);
      } else {
        g.strokeStyle = 'rgba(221,211,181,0.27)';
        g.lineWidth = 1;
        g.strokeRect(-3.2 * s, -3.2 * s, 6.4 * s, 6.4 * s);
      }
      g.restore();
    }

    /* little control buttons */
    var br = 12 * s;
    var gap = 7 * s;
    var right = x + w - 2 * s;
    var muteCX = right - br;
    var pauseCX = muteCX - br * 2 - gap;
    var speedCX = pauseCX - br * 2 - gap;
    drawHudButton(g, speedCX, rowY, br, 'speed', String(speed) + '×');
    drawHudButton(g, pauseCX, rowY, br, 'pause', null);
    drawHudButton(g, muteCX, rowY, br, 'mute', null);

    uiRects.speed = { x: speedCX - br, y: rowY - br, w: br * 2, h: br * 2 };
    uiRects.pause = { x: pauseCX - br, y: rowY - br, w: br * 2, h: br * 2 };
    uiRects.mute = { x: muteCX - br, y: rowY - br, w: br * 2, h: br * 2 };

    /* boss bar */
    var boss = null;
    for (var bi = 0; bi < enemies.length; bi++) {
      if (!enemies[bi].dead && enemies[bi].kind === 'boss') {
        boss = enemies[bi];
        break;
      }
    }
    if (boss) {
      var bw = Math.min(280 * s, w * 0.8);
      var bx = x + (w - bw) / 2;
      var by = rowY + 24 * s;
      var bh = 22 * s;
      fillRoundRect(g, bx, by, bw, bh, 8 * s, 'rgba(25,10,10,0.78)');
      strokeRoundRect(g, bx, by, bw, bh, 8 * s, 'rgba(222,135,105,0.44)', 1);
      setFont(g, 'bold', 9.5 * s, true);
      g.fillStyle = '#f3c69a';
      g.textAlign = 'left';
      g.fillText('史莱姆王', bx + 10 * s, by + 8 * s);
      g.textAlign = 'right';
      g.fillStyle = 'rgba(255,222,194,0.66)';
      setFont(g, 'normal', 8.5 * s, false);
      g.fillText(Math.ceil(boss.hp) + ' / ' + boss.maxHp, bx + bw - 10 * s, by + 8 * s);
      fillRoundRect(g, bx + 10 * s, by + bh - 7 * s, bw - 20 * s, 3.4 * s, 2 * s, 'rgba(0,0,0,0.35)');
      var bossFrac = clamp(boss.hp / boss.maxHp, 0, 1);
      var bg2 = g.createLinearGradient(bx, 0, bx + bw, 0);
      bg2.addColorStop(0, '#b84a45');
      bg2.addColorStop(0.6, '#e58c5e');
      bg2.addColorStop(1, '#f4bf85');
      g.fillStyle = bg2;
      if (bossFrac > 0) fillRoundRect(g, bx + 10 * s, by + bh - 7 * s, (bw - 20 * s) * bossFrac, 3.4 * s, 2 * s, bg2);
      g.textAlign = 'left';
    }
  }

  function drawHudButton(g, cx, cy, r, name, label) {
    var hover = hoverUI === name;
    g.save();
    g.fillStyle = hover ? 'rgba(73,111,84,0.9)' : 'rgba(13,37,29,0.78)';
    g.beginPath();
    g.arc(cx, cy, r, 0, TAU);
    g.fill();
    g.strokeStyle = hover ? 'rgba(249,224,162,0.65)' : 'rgba(227,199,137,0.26)';
    g.lineWidth = 1;
    g.stroke();
    if (name === 'speed') {
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      setFont(g, 'bold', r * 0.82, false);
      g.fillStyle = hover ? '#fff2c9' : 'rgba(245,228,188,0.88)';
      g.fillText(label, cx, cy + 0.5);
    } else if (name === 'pause') {
      drawPauseIcon(g, cx, cy, r * 0.68, true);
    } else {
      drawSoundIcon(g, cx, cy, r * 0.72, !muted);
    }
    g.restore();
  }

  function drawWaveStatus(g) {
    if (phase !== 'playing') return;
    var s = uiScale();
    var isPrep = mode === 'prep';
    var w = Math.min(view.w - 30 * s, 340 * s);
    var h = (isPrep ? 56 : 38) * s;
    var x = view.x + (view.w - w) / 2;
    var y = view.y + view.h - 18 * s - h;

    if (isPrep) {
      var hover = hoverUI === 'wave';
      var pulse = 0.5 + 0.5 * Math.sin(visualTime * 2.1);
      g.save();
      g.shadowColor = 'rgba(236,199,119,' + (0.08 + pulse * 0.08) + ')';
      g.shadowBlur = 14;
      var wg = g.createLinearGradient(0, y, 0, y + h);
      wg.addColorStop(0, hover ? 'rgba(42,76,55,0.92)' : 'rgba(25,56,43,0.9)');
      wg.addColorStop(1, 'rgba(7,26,20,0.94)');
      fillRoundRect(g, x, y, w, h, 15 * s, wg);
      g.restore();
      strokeRoundRect(g, x, y, w, h, 15 * s, hover ? 'rgba(251,226,167,0.78)' : 'rgba(238,206,140,0.45)', 1.2);
      g.strokeStyle = 'rgba(249,231,190,0.1)';
      g.beginPath();
      g.moveTo(x + w * 0.13, y + 1.5);
      g.lineTo(x + w * 0.87, y + 1.5);
      g.stroke();

      var r = 16 * s;
      var ccx = x + 30 * s;
      var ccy = y + h / 2;
      var prepMax = Math.max(0.2, waveIndex === 0 ? R.prepTime : R.waveGap);
      var ratio = clamp(prepTimer / prepMax, 0, 1);
      g.save();
      g.strokeStyle = 'rgba(226,207,164,0.18)';
      g.lineWidth = 2.4 * s;
      g.beginPath();
      g.arc(ccx, ccy, r, 0, TAU);
      g.stroke();
      g.strokeStyle = 'rgba(242,214,151,0.8)';
      g.lineWidth = 2.4 * s;
      g.beginPath();
      g.arc(ccx, ccy, r, -Math.PI / 2, -Math.PI / 2 + TAU * ratio);
      g.stroke();
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      setFont(g, 'bold', 12 * s, false);
      g.fillStyle = '#f7e8c6';
      g.fillText(String(Math.max(0, Math.ceil(prepTimer))), ccx, ccy + 0.5);
      g.restore();

      g.textAlign = 'left';
      g.textBaseline = 'middle';
      setFont(g, 'bold', 15 * s, true);
      g.fillStyle = '#f3e3bf';
      g.fillText('开始第 ' + currentWaveNumber() + ' 波', x + 54 * s, y + h * 0.37);
      var sub = R.earlyBonus > 0 ? '提前迎战额外 +' + R.earlyBonus + ' 金' : (prepTimer > 0 ? '倒计时结束后自动开始' : '整装待发');
      setFont(g, 'normal', 9.2 * s, false);
      g.fillStyle = 'rgba(209,220,190,0.68)';
      fitFont(g, sub, 'normal', 9.2 * s, w - 80 * s, 7, false);
      g.fillText(sub, x + 54 * s, y + h * 0.69);

      var acx = x + w - 25 * s;
      var acy = y + h / 2;
      g.fillStyle = 'rgba(247,222,166,0.8)';
      g.beginPath();
      g.moveTo(acx - 4 * s, acy - 7 * s);
      g.lineTo(acx + 5 * s, acy);
      g.lineTo(acx - 4 * s, acy + 7 * s);
      g.closePath();
      g.fill();
      uiRects.waveBtn = { x: x, y: y, w: w, h: h };
    } else {
      uiRects.waveBtn = null;
      var wg2 = g.createLinearGradient(0, y, 0, y + h);
      wg2.addColorStop(0, 'rgba(13,35,28,0.86)');
      wg2.addColorStop(1, 'rgba(5,20,16,0.9)');
      fillRoundRect(g, x, y, w, h, 12 * s, wg2);
      strokeRoundRect(g, x, y, w, h, 12 * s, 'rgba(226,196,131,0.3)', 1);
      var lives = 0;
      for (var ei = 0; ei < enemies.length; ei++) if (!enemies[ei].dead) lives++;
      var remaining = lives + Math.max(0, spawnQueue.length - spawnCursor);
      var defeatedNow = Math.max(0, waveCleared);
      var progress = defeatedNow + remaining > 0 ? defeatedNow / (defeatedNow + remaining) : 0;
      g.textBaseline = 'middle';
      g.textAlign = 'left';
      setFont(g, 'bold', 11.5 * s, false);
      g.fillStyle = '#f0e0b9';
      g.fillText('第 ' + currentWaveNumber() + ' / ' + R.waveCount + ' 波', x + 12 * s, y + h * 0.44);
      g.textAlign = 'center';
      setFont(g, 'normal', 9.2 * s, true);
      g.fillStyle = 'rgba(213,224,196,0.68)';
      g.fillText(waveDef ? waveDef.name : '月光之路', x + w / 2, y + h * 0.44);
      g.textAlign = 'right';
      setFont(g, 'bold', 10.5 * s, false);
      g.fillStyle = remaining <= 3 ? '#f0ba8f' : '#d8e2c6';
      g.fillText('剩余 ' + remaining + ' 只', x + w - 12 * s, y + h * 0.44);
      fillRoundRect(g, x + 12 * s, y + h - 8 * s, w - 24 * s, 2.7 * s, 1.5 * s, 'rgba(235,220,180,0.13)');
      if (progress > 0) {
        fillRoundRect(g, x + 12 * s, y + h - 8 * s, (w - 24 * s) * progress, 2.7 * s, 1.5 * s, 'rgba(238,206,133,0.75)');
      }
    }
  }

  function drawTowerPanel(g) {
    uiRects.upgrade = null;
    uiRects.close = null;
    if (phase !== 'playing' || paused || selectedPad < 0) return;
    var pad = PADS[selectedPad];
    if (!pad || !pad.tower) return;
    var s = uiScale();
    var tower = pad.tower;
    var st = statsFor(tower.level);
    var w = 188 * s;
    var h = 100 * s;
    var anchor = worldToScreen(pad.x, pad.y - 82);
    var x = anchor.x + 28 * s;
    var y = anchor.y - 16 * s;
    if (x + w > view.x + view.w - 8 * s) x = anchor.x - w - 28 * s;
    if (x < view.x + 8 * s) x = view.x + 8 * s;
    var topLimit = view.y + 92 * s;
    var bottomLimit = view.y + view.h - 90 * s;
    if (y < topLimit) y = topLimit;
    if (y + h > bottomLimit) y = bottomLimit - h;
    if (y < topLimit) y = topLimit;

    g.save();
    g.shadowColor = 'rgba(0,0,0,0.45)';
    g.shadowBlur = 12;
    g.shadowOffsetY = 4;
    fillRoundRect(g, x, y, w, h, 10 * s, 'rgba(9,29,23,0.95)');
    g.restore();
    strokeRoundRect(g, x, y, w, h, 10 * s, 'rgba(239,208,143,0.48)', 1);

    g.textAlign = 'left';
    g.textBaseline = 'middle';
    setFont(g, 'normal', 8.5 * s, false);
    g.fillStyle = 'rgba(211,216,190,0.55)';
    g.fillText('月影箭塔', x + 11 * s, y + 12 * s);
    setFont(g, 'bold', 13.5 * s, true);
    g.fillStyle = '#f2e2ba';
    g.fillText('Lv.' + tower.level + ' · ' + TOWER_LEVELS[tower.level - 1].name, x + 11 * s, y + 27 * s);

    g.textAlign = 'right';
