  /* ---- The winding road. A little smoothing keeps the slimes' path and the

  var ROAD_WAYPOINTS = [
    { x: 10, y: 265 },

  ];

  function smoothPolyline(points, steps) {
    var out = [];
    var n = points.length;
    var i, s, t, t2, t3, p0, p1, p2, p3, x, y;
    for (i = 0; i < n - 1; i++) {
      p0 = points[Math.max(0, i - 1)];
      p1 = points[i];
      p2 = points[i + 1];
      p3 = points[Math.min(n - 1, i + 2)];
      for (s = 0; s < steps; s++) {
        t = s / steps;
        t2 = t * t;
        t3 = t2 * t;
        x = 0.5 * ((2 * p1.x) + (-p0.x + p2.x) * t +
          (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 +
          (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3);
        y = 0.5 * ((2 * p1.y) + (-p0.y + p2.y) * t +
          (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 +
          (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3);
        if (!out.length || dist(out[out.length - 1].x, out[out.length - 1].y, x, y) > 0.4) {
          out.push({ x: x, y: y });
        }
      }
    }
    out.push({ x: points[n - 1].x, y: points[n - 1].y });
    return out;
  }

  function buildRoad(points) {
    var pts = smoothPolyline(points, 16);
    var segs = [];
    var total = 0;
    var i, dx, dy, len;
    for (i = 0; i < pts.length - 1; i++) {
      dx = pts[i + 1].x - pts[i].x;
      dy = pts[i + 1].y - pts[i].y;
      len = Math.sqrt(dx * dx + dy * dy);
      if (len < 0.01) continue;
      segs.push({
        ax: pts[i].x, ay: pts[i].y,
        bx: pts[i + 1].x, by: pts[i + 1].y,
        dx: dx, dy: dy, len: len,
        nx: -dy / len, ny: dx / len,
        angle: Math.atan2(dy, dx),
        start: total
      });
      total += len;
    }
    function at(distance) {
      var d = clamp(distance, 0, total), j, sg, t;
      for (j = 0; j < segs.length; j++) {
        sg = segs[j];
        if (d <= sg.start + sg.len || j === segs.length - 1) {
          t = clamp((d - sg.start) / sg.len, 0, 1);
          return {
            x: sg.ax + sg.dx * t,
            y: sg.ay + sg.dy * t,
            nx: sg.nx,
            ny: sg.ny,
            angle: sg.angle
          };
        }
      }
      return { x: pts[0].x, y: pts[0].y, nx: 0, ny: 1, angle: 0 };
    }
    return { pts: pts, segs: segs, total: total, at: at };
  }

  var audio = null;

  function ensureAudio() {
    if (!audio) {
      try {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (AC) audio = new AC();
      } catch (e) { audio = null; }
    }
    if (audio && audio.state === 'suspended') {
      var p = audio.resume();
      if (p && p.catch) p.catch(function () {});
    }
  }

  function tone(freq, dur, type, vol, delay, slideTo) {
    if (!audio || muted) return;
    try {
      var t0 = audio.currentTime + (delay || 0);
      var osc = audio.createOscillator();
      var gain = audio.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, t0);
      if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(32, slideTo), t0 + dur);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol || 0.045), t0 + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(gain);
      gain.connect(audio.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.03);
    } catch (e) { /* never break the game for sound */ }
  }

    g.moveTo(-27, -54);
    g.lineTo(-23, -5);
    g.moveTo(27, -54);
    g.lineTo(23, -5);
    g.stroke();
    g.strokeStyle = 'rgba(214,170,103,0.28)';
    g.lineWidth = 2.2;
    g.beginPath();
    g.moveTo(-25, -52);
    g.lineTo(-21.5, -8);
    g.moveTo(25, -52);
    g.lineTo(21.5, -8);
    g.stroke();

    /* pagoda roof */
    var rimY = -108 - roofLift;
    var apexY = -170 - roofLift * 2;
    g.save();
    g.translate(0, breath * 0.4);
    g.beginPath();
    g.moveTo(-43, rimY);
    g.quadraticCurveTo(-37, rimY - 27, 0, apexY);
    g.quadraticCurveTo(37, rimY - 27, 43, rimY);
    g.quadraticCurveTo(25, rimY + 7, 0, rimY + 8);
    g.quadraticCurveTo(-25, rimY + 7, -43, rimY);
    g.closePath();
    var roofG = g.createLinearGradient(0, apexY, 0, rimY);
    roofG.addColorStop(0, lv === 3 ? '#4c8a6b' : '#3f775a');
    roofG.addColorStop(0.5, lv === 3 ? '#2f6d55' : '#285642');
    roofG.addColorStop(1, '#16362e');
    g.fillStyle = roofG;
    g.fill();
    g.strokeStyle = lv >= 2 ? 'rgba(249,220,158,0.82)' : 'rgba(141,157,111,0.55)';
    g.lineWidth = lv >= 2 ? 2.2 : 1.5;
    g.stroke();

    /* shingle seams */
    g.strokeStyle = 'rgba(7,29,23,0.42)';
    g.lineWidth = 1.5;
    g.beginPath();
    g.moveTo(-28, rimY - 23);
    g.quadraticCurveTo(0, rimY - 34, 28, rimY - 23);
    g.moveTo(-17, rimY - 43);
    g.quadraticCurveTo(0, rimY - 55, 17, rimY - 43);
    g.stroke();
    g.strokeStyle = 'rgba(196,223,176,0.12)';
    g.lineWidth = 1.2;
    g.beginPath();
    g.moveTo(-38, rimY - 2);
    g.quadraticCurveTo(-18, rimY - 12, 0, rimY - 14);
    g.quadraticCurveTo(18, rimY - 12, 38, rimY - 2);
    g.stroke();
    g.restore();

    /* final finial */
    g.save();
    g.translate(0, apexY);
    g.strokeStyle = '#c99b51';
    g.lineWidth = 2;
    g.beginPath();
    g.moveTo(0, 2);
    g.lineTo(0, -12);
    g.stroke();
    var fin = g.createRadialGradient(-2, -15, 0.5, 0, -14, 6);
    fin.addColorStop(0, '#fff0bb');
    fin.addColorStop(0.55, '#e9bd6e');
    fin.addColorStop(1, '#9b672b');
    g.fillStyle = fin;
    g.beginPath();
    g.arc(0, -14, 5.2, 0, TAU);
    g.fill();
    g.strokeStyle = 'rgba(98,59,22,0.8)';
    g.lineWidth = 1;
    g.stroke();
    g.strokeStyle = '#d7ae68';
    g.lineWidth = 1.8;
    g.beginPath();
    g.arc(3, -20, 5.4, Math.PI * 0.25, Math.PI * 1.25);
    g.stroke();
    g.restore();

    /* pennant */
    var wind = Math.sin(t * 3.1) * 5;
    g.strokeStyle = '#5d4327';
    g.lineWidth = 1.4;
    g.beginPath();
    g.moveTo(0, apexY - 14);
    g.quadraticCurveTo(9, apexY - 26, 21, apexY - 23 + wind * 0.1);
    g.stroke();
    g.beginPath();
    g.moveTo(7, apexY - 22);
    g.quadraticCurveTo(20, apexY - 30 + wind, 33, apexY - 23 + wind * 0.5);
    g.quadraticCurveTo(23, apexY - 15 + wind * 0.2, 7, apexY - 9);
    g.closePath();
    g.fillStyle = lv === 3 ? '#e5c07a' : (lv === 2 ? '#7fb28a' : '#638d75');
    g.fill();
    g.strokeStyle = 'rgba(29,59,47,0.7)';
    g.lineWidth = 0.8;
    g.stroke();

    /* lower wooden cabin */
    g.beginPath();
    g.moveTo(-21, -58);
    g.lineTo(21, -58);
    g.lineTo(17, -4);
    g.quadraticCurveTo(0, 4, -17, -4);
    g.closePath();
    var woodG = g.createLinearGradient(-22, -58, 22, -4);
    woodG.addColorStop(0, '#6b5031');
    woodG.addColorStop(0.45, '#4e3926');
    woodG.addColorStop(1, '#2d2218');
    g.fillStyle = woodG;
    g.fill();
    g.strokeStyle = '#1b1811';
    g.lineWidth = 1.8;
    g.stroke();

    /* plank lines */
    g.strokeStyle = 'rgba(25,20,13,0.35)';
    g.lineWidth = 1;
    for (i = 0; i < 3; i++) {
      var py = -47 + i * 13;
      g.beginPath();
      g.moveTo(-19 + i * 0.7, py);
      g.quadraticCurveTo(0, py + 3, 19 - i * 0.7, py);
      g.stroke();
    }

    /* little arched window with warm light */
    g.beginPath();
    g.moveTo(-7, -20);
    g.lineTo(-7, -30);
    g.quadraticCurveTo(0, -39, 7, -30);
    g.lineTo(7, -20);
    g.closePath();
    var winG = g.createLinearGradient(0, -38, 0, -19);
    winG.addColorStop(0, lv === 3 ? '#f7e4a5' : '#dfb56f');
    winG.addColorStop(1, '#8b572b');
    g.fillStyle = winG;
    g.fill();
    g.strokeStyle = '#2a1c10';
    g.lineWidth = 1.5;
    g.stroke();
    g.strokeStyle = 'rgba(44,28,14,0.8)';
    g.lineWidth = 1;
    g.beginPath();
    g.moveTo(0, -34);
    g.lineTo(0, -20);
    g.moveTo(-7, -26);
    g.lineTo(7, -26);
    g.stroke();

    /* balcony */
    g.beginPath();
    g.ellipse(0, -58, 34, 12, 0, 0, TAU);
    var balG = g.createLinearGradient(0, -70, 0, -48);
    balG.addColorStop(0, '#8a6a45');
    balG.addColorStop(1, '#3e2b1c');
    g.fillStyle = balG;
    g.fill();
    g.strokeStyle = '#20160e';
    g.lineWidth = 2;
    g.stroke();
    g.strokeStyle = '#2a1c12';
    g.lineWidth = 2;
    g.beginPath();
    g.moveTo(-32, -62);
    g.quadraticCurveTo(0, -50, 32, -62);
    g.stroke();
    g.strokeStyle = 'rgba(237,198,126,0.58)';
    g.lineWidth = 1.2;
    g.beginPath();
    g.moveTo(-26, -62);
    g.quadraticCurveTo(0, -53, 26, -62);
    g.stroke();

    /* railing posts */
    g.strokeStyle = '#4b3622';
    g.lineWidth = 2.2;
    for (i = -2; i <= 2; i++) {
      g.beginPath();
      g.moveTo(i * 13, -57);
      g.lineTo(i * 14, -68);
      g.stroke();
    }
    g.strokeStyle = lv >= 2 ? 'rgba(228,189,117,0.62)' : 'rgba(147,127,84,0.4)';
    g.lineWidth = 1.4;
    g.beginPath();
    g.moveTo(-27, -69);
    g.quadraticCurveTo(0, -63, 27, -69);
    g.stroke();

    /* archer */
    drawArcher(g, aim, lv, t);

    /* level decorations */
    if (lv >= 2) {
      /* small pennants on the balcony */
      var sway = Math.sin(t * 2.7 + 1) * 2;
      g.strokeStyle = '#6c4d2c';
      g.lineWidth = 1.3;
      g.beginPath();
      g.moveTo(-33, -65);
      g.lineTo(-36, -88);
      g.moveTo(33, -65);
      g.lineTo(36, -88);
      g.stroke();
      g.fillStyle = '#7fa888';
      g.beginPath();
      g.moveTo(-35.5, -85);
      g.quadraticCurveTo(-47 + sway, -81, -49 + sway, -70);
      g.quadraticCurveTo(-41, -72, -35.5, -74);
      g.closePath();
      g.fill();
      g.beginPath();
      g.moveTo(35.5, -85);
      g.quadraticCurveTo(47 + sway, -81, 49 + sway, -70);
      g.quadraticCurveTo(41, -72, 35.5, -74);
      g.closePath();
      g.fill();
    }

    if (lv >= 2) {
      /* hanging lanterns */
      g.save();
      g.translate(-27, -45);
      g.fillStyle = 'rgba(255,211,115,0.25)';
      g.beginPath();
      g.arc(0, 0, 12, 0, TAU);
      g.fill();
      g.fillStyle = '#ffda8d';
      g.beginPath();
      g.arc(0, 0, 4.2, 0, TAU);
      g.fill();
      g.strokeStyle = '#8b5d2a';
      g.lineWidth = 1;
      g.stroke();
      g.restore();
      g.save();
      g.translate(27, -45);
      g.fillStyle = 'rgba(255,211,115,0.25)';
      g.beginPath();
      g.arc(0, 0, 12, 0, TAU);
      g.fill();
      g.fillStyle = '#ffda8d';
      g.beginPath();
      g.arc(0, 0, 4.2, 0, TAU);
      g.fill();
      g.strokeStyle = '#8b5d2a';
      g.lineWidth = 1;
      g.stroke();
      g.restore();
    }

    if (lv >= 3) {
      /* moon sigil and drifting motes */
      g.save();
      g.strokeStyle = 'rgba(171,244,211,0.85)';
      g.lineWidth = 1.2;
      g.beginPath();
      g.arc(0, -34, 17, 0.2, Math.PI * 1.7);
      g.stroke();
      g.fillStyle = 'rgba(211,255,228,0.8)';
      drawStarPath(g, 14, -47, 3, 1, 4, t * 0.5);
      g.fill();
      for (i = 0; i < 3; i++) {
        var ang = t * 0.75 + i * TAU / 3;
        var px = Math.cos(ang) * 31;
        var py2 = -56 + Math.sin(ang) * 13;
        g.fillStyle = 'rgba(197,255,220,' + (0.25 + 0.5 * (0.5 + 0.5 * Math.sin(t * 2 + i))) + ')';
        g.beginPath();
        g.arc(px, py2, 1.7, 0, TAU);
        g.fill();
      }
      g.restore();
    }

    /* tiny carved level marks */
    for (i = 0; i < lv; i++) {
      g.fillStyle = i < lv ? 'rgba(255,224,160,0.86)' : 'rgba(255,255,255,0.1)';
      drawStarPath(g, -10 + i * 10, -52, 2.5, 0.9, 4, 0);
      g.fill();
    }

    g.restore();
  }

  function slimeBodyPath(g, r) {
    g.beginPath();
    g.moveTo(-r * 1.08, -r * 0.17);
    g.bezierCurveTo(-r * 1.22, -r * 1.02, -r * 0.62, -r * 1.72, 0, -r * 1.72);
    g.bezierCurveTo(r * 0.62, -r * 1.72, r * 1.22, -r * 1.02, r * 1.08, -r * 0.17);
    g.quadraticCurveTo(r * 0.66, r * 0.34, 0, r * 0.32);
    g.quadraticCurveTo(-r * 0.66, r * 0.34, -r * 1.08, -r * 0.17);
    g.closePath();
  }

  function drawSlimeArt(g, kind, t, facing, hitFlash, grow) {
    var def = KINDS[kind] || KINDS.green;
    var isSpawn = !!def.small;
    var r = def.radius * (grow == null ? 1 : grow) * (isSpawn ? 1.5 : 1);
    var wob = Math.sin(t * 5.3 + (facing || 0) * 0.3);
    var sq = 1 + wob * 0.045;
    var st = 1 - wob * 0.035;
    var hop = Math.abs(Math.sin(t * 4.2)) * 2.2;
    var eyeShift = clamp(Math.cos(facing || Math.PI / 2) * 1.3, -1.3, 1.3);

    g.save();
    g.scale(sq, st);
    g.translate(0, -hop);

    /* shadow */
    g.save();
    g.globalAlpha *= 0.75;
    g.fillStyle = 'rgba(3,13,9,0.33)';
    g.beginPath();
    g.ellipse(0, 2 + hop / st, r * 0.92, r * 0.26, 0, 0, TAU);
    g.fill();
    g.restore();

    /* body */
    slimeBodyPath(g, r);
    var body = g.createLinearGradient(0, -r * 1.8, 0, r * 0.3);
    body.addColorStop(0, def.top);
    body.addColorStop(0.38, def.mid);
    body.addColorStop(0.78, def.deep);
    body.addColorStop(1, def.rim);
    g.fillStyle = body;
    g.fill();
    g.strokeStyle = 'rgba(8,33,24,0.7)';
    g.lineWidth = Math.max(1.2, r * 0.075);
    g.stroke();

    /* translucent inner glow */
    g.save();
    slimeBodyPath(g, r);
    g.clip();
    g.globalCompositeOperation = 'screen';
    var glow = g.createRadialGradient(-r * 0.3, -r * 0.8, r * 0.1, 0, -r * 0.4, r * 1.4);
    glow.addColorStop(0, 'rgba(255,255,230,0.56)');
    glow.addColorStop(0.45, def.glow);
    glow.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = glow;
    g.fillRect(-r * 1.5, -r * 2, r * 3, r * 2.5);
    g.restore();

    /* bottom shine / reflection */
    g.save();
    slimeBodyPath(g, r);
    g.clip();
    g.fillStyle = 'rgba(238,255,221,0.13)';
    g.beginPath();
    g.ellipse(-r * 0.42, -r * 0.48, r * 0.14, r * 0.42, -0.5, 0, TAU);
    g.fill();
    g.fillStyle = 'rgba(6,40,29,0.16)';
    g.beginPath();
    g.ellipse(r * 0.45, -r * 0.12, r * 0.38, r * 0.13, -0.2, 0, TAU);
    g.fill();
    g.restore();

    /* face */
    var eyeY = -r * 1.02;
    var eyeX = r * 0.31;
    g.fillStyle = def.eye;
    g.beginPath();
    g.ellipse(-eyeX + eyeShift, eyeY, r * 0.11, r * 0.16, 0, 0, TAU);
    g.ellipse(eyeX + eyeShift, eyeY, r * 0.11, r * 0.16, 0, 0, TAU);
    g.fill();
    g.fillStyle = 'rgba(255,255,244,0.92)';
    g.beginPath();
    g.arc(-eyeX + eyeShift - r * 0.035, eyeY - r * 0.05, r * 0.037, 0, TAU);
    g.arc(eyeX + eyeShift - r * 0.035, eyeY - r * 0.05, r * 0.037, 0, TAU);
    g.fill();

    /* mouth */
    g.strokeStyle = def.eye;
    g.lineWidth = Math.max(1, r * 0.06);
    g.lineCap = 'round';
    g.beginPath();
    if (def.boss) {
      g.moveTo(-r * 0.27, -r * 0.69);
      g.quadraticCurveTo(-r * 0.1, -r * 0.52, 0, -r * 0.62);
      g.quadraticCurveTo(r * 0.13, -r * 0.52, r * 0.28, -r * 0.69);
    } else {
      g.moveTo(-r * 0.13, -r * 0.72);
      g.quadraticCurveTo(0, -r * 0.64, r * 0.13, -r * 0.72);
    }
    g.stroke();

    /* rosy cheeks */
    g.fillStyle = def.boss ? 'rgba(242,123,99,0.3)' : 'rgba(243,137,121,0.25)';
    g.beginPath();
    g.ellipse(-r * 0.56, -r * 0.78, r * 0.1, r * 0.055, 0.1, 0, TAU);
    g.ellipse(r * 0.56, -r * 0.78, r * 0.1, r * 0.055, -0.1, 0, TAU);
    g.fill();

    /* kind details */
    if (def.leaf) {
      g.save();
      g.translate(r * 0.2, -r * 1.68);
      g.rotate(-0.45 + Math.sin(t * 1.6) * 0.12);
      g.fillStyle = '#357c48';
      leafPath(g, 0, 0, r * 0.62, 0.25);
      g.fill();
      g.strokeStyle = 'rgba(16,76,42,0.65)';
      g.lineWidth = 1;
      g.stroke();
      g.strokeStyle = 'rgba(172,229,148,0.5)';
      g.lineWidth = 0.9;
      g.beginPath();
      g.moveTo(-r * 0.08, -r * 0.1);
      g.quadraticCurveTo(r * 0.12, -r * 0.33, r * 0.3, -r * 0.42);
      g.stroke();
      g.restore();
    }

    if (def.spikes) {
      g.fillStyle = def.deep;
      g.strokeStyle = 'rgba(91,37,35,0.7)';
      g.lineWidth = 0.8;
      var spikes = [[-0.55, -1.42, 0.17], [0.02, -1.66, 0.22], [0.53, -1.38, 0.15]];
      var s;
      for (s = 0; s < spikes.length; s++) {
        var sx0 = spikes[s][0] * r;
        var sy0 = spikes[s][1] * r;
        g.beginPath();
        g.moveTo(sx0 - r * spikes[s][2] * 0.45, sy0 + r * 0.3);
        g.lineTo(sx0, sy0 - r * spikes[s][2]);
        g.lineTo(sx0 + r * spikes[s][2] * 0.55, sy0 + r * 0.28);
        g.closePath();
        g.fill();
        g.stroke();
      }
    }

    if (def.armor) {
      g.save();
      g.strokeStyle = '#d9e9ef';
      g.lineWidth = r * 0.18;
      g.beginPath();
      g.arc(0, -r * 0.95, r * 0.76, Math.PI * 1.16, Math.PI * 1.84);
      g.stroke();
      g.strokeStyle = '#345270';
      g.lineWidth = r * 0.06;
      g.stroke();
      g.fillStyle = '#d6e6e7';
      var rivet;
      for (rivet = -1; rivet <= 1; rivet++) {
        g.beginPath();
        g.arc(rivet * r * 0.42, -r * 1.55 + Math.abs(rivet) * r * 0.15, r * 0.07, 0, TAU);
        g.fill();
      }
      g.restore();
    }

    if (def.sparkle) {
      var i;
      for (i = 0; i < 3; i++) {
        var a = t * 0.9 + i * 2.1;
        var px = Math.cos(a) * r * 0.8;
        var py = -r * 0.75 + Math.sin(a * 1.3) * r * 0.7;
        drawStarPath(g, px, py, r * 0.11, r * 0.025, 4, a);
        g.fillStyle = 'rgba(255,230,255,0.8)';
        g.fill();
      }
    }

    if (def.crown) {
      g.save();
      g.translate(0, -r * 1.74);
      g.fillStyle = '#e6bd66';
      g.strokeStyle = '#7d4d20';
      g.lineWidth = 1.3;
      g.beginPath();
      g.moveTo(-r * 0.48, 0);
      g.lineTo(-r * 0.57, -r * 0.38);
      g.lineTo(-r * 0.22, -r * 0.17);
      g.lineTo(0, -r * 0.5);
      g.lineTo(r * 0.22, -r * 0.17);
      g.lineTo(r * 0.57, -r * 0.38);
      g.lineTo(r * 0.48, 0);
      g.closePath();
      g.fill();
      g.stroke();
      g.fillStyle = '#b63d49';
      g.beginPath();
      g.arc(0, -r * 0.17, r * 0.08, 0, TAU);
      g.fill();
      g.fillStyle = 'rgba(255,249,213,0.8)';
      g.beginPath();
      g.arc(-r * 0.42, -r * 0.1, r * 0.035, 0, TAU);
      g.arc(r * 0.42, -r * 0.1, r * 0.035, 0, TAU);
      g.fill();
      g.restore();

      /* angry brows */
      g.strokeStyle = '#12332b';
      g.lineWidth = Math.max(1.2, r * 0.055);
      g.beginPath();
      g.moveTo(-r * 0.52, -r * 1.25);
      g.lineTo(-r * 0.2, -r * 1.15);
      g.moveTo(r * 0.52, -r * 1.25);
      g.lineTo(r * 0.2, -r * 1.15);
      g.stroke();
    }

    /* hit flash */
    if (hitFlash && hitFlash > 0) {
      slimeBodyPath(g, r);
      g.fillStyle = 'rgba(255,255,238,' + (hitFlash * 0.55) + ')';
      g.fill();
    }

    g.restore();
  }

  function drawGateIcon(g, x, y, s, color) {
    g.save();
    g.translate(x, y);
    g.fillStyle = color;
    g.beginPath();
    g.moveTo(-s * 0.85, s * 0.75);
    g.lineTo(-s * 0.85, -s * 0.2);
    g.lineTo(-s * 0.58, -s * 0.2);
    g.lineTo(-s * 0.58, -s * 0.58);
    g.lineTo(-s * 0.24, -s * 0.58);
    g.lineTo(-s * 0.24, -s * 0.2);
    g.lineTo(0, -s * 0.2);
    g.lineTo(0, -s * 0.86);
    g.lineTo(s * 0.24, -s * 0.86);
    g.lineTo(s * 0.24, -s * 0.2);
    g.lineTo(s * 0.58, -s * 0.2);
    g.lineTo(s * 0.58, -s * 0.58);
    g.lineTo(s * 0.85, -s * 0.58);
    g.lineTo(s * 0.85, s * 0.75);
    g.closePath();
    g.fill();
    g.fillStyle = 'rgba(9,26,21,0.78)';
    g.beginPath();
    g.moveTo(-s * 0.22, s * 0.75);
    g.lineTo(-s * 0.22, s * 0.18);
    g.quadraticCurveTo(0, -s * 0.1, s * 0.22, s * 0.18);
    g.lineTo(s * 0.22, s * 0.75);
    g.closePath();
    g.fill();
    g.restore();
  }

  function drawPauseIcon(g, x, y, s, playing) {
    g.fillStyle = '#f5e4bd';
    if (playing) {
      g.fillRect(x - s * 0.34, y - s * 0.45, s * 0.24, s * 0.9);
      g.fillRect(x + s * 0.1, y - s * 0.45, s * 0.24, s * 0.9);
    } else {
      g.beginPath();
      g.moveTo(x - s * 0.28, y - s * 0.5);
      g.lineTo(x + s * 0.48, y);
      g.lineTo(x - s * 0.28, y + s * 0.5);
      g.closePath();
      g.fill();
    }
  }

  function drawSoundIcon(g, x, y, s, on) {
    g.fillStyle = '#f5e4bd';
    g.beginPath();
    g.moveTo(x - s * 0.5, y - s * 0.18);
    g.lineTo(x - s * 0.22, y - s * 0.18);
    g.lineTo(x + s * 0.08, y - s * 0.48);
    g.lineTo(x + s * 0.08, y + s * 0.48);
    g.lineTo(x - s * 0.22, y + s * 0.18);
    g.lineTo(x - s * 0.5, y + s * 0.18);
    g.closePath();
    g.fill();
    if (on) {
      g.strokeStyle = '#f5e4bd';
      g.lineWidth = Math.max(1.2, s * 0.09);
      g.lineCap = 'round';
      g.beginPath();
      g.arc(x + s * 0.08, y, s * 0.3, -0.85, 0.85);
      g.stroke();
      g.beginPath();
      g.arc(x + s * 0.08, y, s * 0.52, -0.75, 0.75);
      g.stroke();
    } else {
      g.strokeStyle = '#e48f75';
      g.lineWidth = Math.max(1.3, s * 0.1);
      g.beginPath();
      g.moveTo(x + s * 0.25, y - s * 0.22);
      g.lineTo(x + s * 0.55, y + s * 0.22);
      g.moveTo(x + s * 0.55, y - s * 0.22);
      g.lineTo(x + s * 0.25, y + s * 0.22);
      g.stroke();
    }
  }

   * 5. THE PAINTED WORLD

  function distanceToRoad(x, y) {
    var best = 1e9;
    for (var i = 0; i < ROAD.segs.length; i++) {
      var s = ROAD.segs[i];
      var vx = s.bx - s.ax, vy = s.by - s.ay;
      var wx = x - s.ax, wy = y - s.ay;
      var t = clamp((wx * vx + wy * vy) / (vx * vx + vy * vy), 0, 1);
      var dx = x - (s.ax + vx * t);
      var dy = y - (s.ay + vy * t);
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d < best) best = d;
    }
    return best;
  }
  function nearAnyPad(x, y, extra) {
    var e = extra || 0;
    for (var i = 0; i < PADS.length; i++) {
      if (dist(x, y, PADS[i].x, PADS[i].y) < PADS[i].r + e) return true;
    }
    return false;
  }
  function traceRoad(g) {
    g.beginPath();
    g.moveTo(ROAD.pts[0].x, ROAD.pts[0].y);
    for (var i = 1; i < ROAD.pts.length; i++) g.lineTo(ROAD.pts[i].x, ROAD.pts[i].y);
  }

  function drawCanopyTree(g, x, y, r, seed) {
    var rng = seededRandom(seed);
    var i, a, rr, px, py;
    g.save();
    g.fillStyle = 'rgba(3,13,10,0.38)';
    g.beginPath();
    g.ellipse(x + 9, y + r * 0.25, r * 0.9, r * 0.36, 0.12, 0, TAU);
    g.fill();

    /* trunk peeking out from under the leaves */
    g.strokeStyle = '#1d2b20';
    g.lineWidth = Math.max(4, r * 0.11);
    g.lineCap = 'round';
    g.beginPath();
    g.moveTo(x, y + r * 0.2);
    g.quadraticCurveTo(x - r * 0.13, y + r * 0.55, x - r * 0.27, y + r * 0.9);
    g.stroke();
    g.strokeStyle = '#3e4d34';
    g.lineWidth = Math.max(1.2, r * 0.025);
    g.beginPath();
    g.moveTo(x - r * 0.02, y + r * 0.3);
    g.quadraticCurveTo(x - r * 0.15, y + r * 0.58, x - r * 0.25, y + r * 0.86);
    g.stroke();

    /* outer canopy clusters */
    var blobs = [
      [0, -0.04, 0.58], [-0.48, 0.12, 0.48], [0.48, 0.12, 0.48],
      [-0.24, -0.42, 0.48], [0.28, -0.4, 0.45], [0.02, 0.45, 0.42],
      [-0.56, -0.26, 0.34], [0.58, -0.24, 0.34]
    ];
    for (i = 0; i < blobs.length; i++) {
      var b = blobs[i];
      px = x + b[0] * r + (rng() - 0.5) * r * 0.08;
      py = y + b[1] * r + (rng() - 0.5) * r * 0.06;
      rr = r * b[2] * (0.9 + rng() * 0.16);
      g.beginPath();
      g.arc(px, py, rr, 0, TAU);
      g.fillStyle = i < 3 ? '#1d4a38' : '#173d31';
      g.fill();
    }
    /* midtone clumps */
    for (i = 0; i < 8; i++) {
      var m = blobs[i];
      px = x + m[0] * r + (rng() - 0.5) * r * 0.17;
      py = y + (m[1] - 0.06) * r + (rng() - 0.5) * r * 0.12;
      rr = r * m[2] * (0.56 + rng() * 0.15);
      g.beginPath();
      g.arc(px, py, rr, 0, TAU);
      g.fillStyle = i % 2 ? '#2b5a43' : '#315f46';
      g.fill();
    }
    /* moonlit leaf edges */
    g.strokeStyle = 'rgba(155,188,136,0.2)';
    g.lineWidth = Math.max(1, r * 0.012);
    for (i = 0; i < 15; i++) {
      a = rng() * TAU;
      rr = r * (0.25 + rng() * 0.55);
      px = x + Math.cos(a) * rr;
      py = y + Math.sin(a) * rr * 0.8;
      g.beginPath();
      g.arc(px, py, r * (0.06 + rng() * 0.08), a + 0.5, a + 2.2);
      g.stroke();
    }
    /* a few tiny highlights */
    for (i = 0; i < 7; i++) {
      px = x + (rng() - 0.35) * r * 0.9;
      py = y + (rng() - 0.65) * r * 0.8;
      ellipse(g, px, py, r * 0.045, r * 0.02, 'rgba(213,229,164,0.38)');
    }
    g.restore();
  }

  function drawFern(g, x, y, size, seed) {
    var rng = seededRandom(seed);
    g.save();
    g.translate(x, y);
    var i;
    for (i = 0; i < 6; i++) {
      var a = -2.8 + i * 0.62 + (rng() - 0.5) * 0.25;
      var len = size * (0.62 + rng() * 0.4);
      g.save();
      g.rotate(a);
      g.strokeStyle = i % 2 ? '#365f41' : '#2b5139';
      g.lineWidth = Math.max(1, size * 0.045);
      g.beginPath();
      g.moveTo(0, 0);
      g.quadraticCurveTo(len * 0.35, -len * 0.25, len, -len * 0.25);
      g.stroke();
      for (var j = 1; j <= 4; j++) {
        var t = j / 5;
        var px = len * t;
        var py = -len * 0.25 * Math.sin(t * Math.PI);
        g.strokeStyle = 'rgba(90,138,88,0.8)';
        g.lineWidth = Math.max(0.7, size * 0.025);
        g.beginPath();
        g.moveTo(px, py);
        g.quadraticCurveTo(px + len * 0.06, py - len * 0.16, px + len * 0.14, py - len * 0.13);
        g.moveTo(px, py);
        g.quadraticCurveTo(px + len * 0.03, py + len * 0.12, px + len * 0.12, py + len * 0.14);
        g.stroke();
      }
      g.restore();
    }
    g.restore();
  }

  function drawGrassTuft(g, x, y, size, seed) {
    var rng = seededRandom(seed);
    g.save();
    g.translate(x, y);
    g.strokeStyle = '#2c5b3d';
    g.lineCap = 'round';
    var i;
    for (i = 0; i < 4; i++) {
      var bend = (rng() - 0.5) * size * 0.6;
      g.lineWidth = Math.max(0.8, size * 0.055);
      g.beginPath();
      g.moveTo((i - 1.5) * size * 0.13, 0);
      g.quadraticCurveTo(bend * 0.3, -size * 0.4, bend, -size * (0.55 + rng() * 0.45));
      g.stroke();
    }
    g.strokeStyle = 'rgba(142,176,114,0.45)';
    g.lineWidth = Math.max(0.6, size * 0.03);
    g.beginPath();
    g.moveTo(-size * 0.1, 0);
    g.quadraticCurveTo(-size * 0.18, -size * 0.4, -size * 0.3, -size * 0.62);
    g.stroke();
    g.restore();
  }

  function drawMushroom(g, x, y, size, glow, seed) {
    var rng = seededRandom(seed);
    g.save();
    g.translate(x, y);
    g.strokeStyle = '#cfc3a1';
    g.lineWidth = Math.max(1, size * 0.16);
    g.beginPath();
    g.moveTo(0, 0);
    g.lineTo((rng() - 0.5) * size * 0.2, -size * 0.7);
    g.stroke();
    if (glow) {
      var ga = g.createRadialGradient(0, -size * 0.8, 0, 0, -size * 0.8, size * 1.4);
      ga.addColorStop(0, 'rgba(121,244,210,0.28)');
      ga.addColorStop(1, 'rgba(121,244,210,0)');
      g.fillStyle = ga;
      g.beginPath();
      g.arc(0, -size * 0.8, size * 1.4, 0, TAU);
      g.fill();
    }
    g.fillStyle = glow ? '#7be4c1' : '#b96b54';
    g.beginPath();
    g.ellipse(0, -size * 0.82, size * 0.52, size * 0.3, 0, Math.PI, TAU);
    g.fill();
    g.strokeStyle = 'rgba(30,58,43,0.45)';
    g.lineWidth = Math.max(0.6, size * 0.06);
    g.beginPath();
    g.ellipse(0, -size * 0.82, size * 0.52, size * 0.3, 0, Math.PI, TAU);
    g.stroke();
    g.fillStyle = 'rgba(248,242,201,0.7)';
    g.beginPath();
    g.arc(-size * 0.22, -size * 0.94, size * 0.07, 0, TAU);
    g.arc(size * 0.16, -size * 0.9, size * 0.05, 0, TAU);
    g.fill();
    g.restore();
  }

  function drawGateTower(g, x, y, side) {

    g.beginPath();
    g.moveTo(-31, 12);
