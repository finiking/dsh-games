  while (iR < SIZE && landKind(iR, j, map) === 'water' && hasRoad(idAt(iR, j))) iR++;

    landKind(iL, j, map) === 'land' && landKind(iR, j, map) === 'land' &&

    waterDist((iL + iR) / 2, j, map) < -0.4;

  let jU = j - 1;
  while (jU >= 0 && landKind(i, jU, map) === 'water' && hasRoad(idAt(i, jU))) jU--;
  let jD = j + 1;
  while (jD < SIZE && landKind(i, jD, map) === 'water' && hasRoad(idAt(i, jD))) jD++;

    landKind(i, jU, map) === 'land' && landKind(i, jD, map) === 'land' &&

function waterRoadCluster(city, startId) {

  const queue = [startId];
  while (queue.length) {
    const cur = queue.shift();
    for (const next of adjacent(cur)) {
      if (seen.has(next)) continue;
      if (city.tiles[next]?.type === 'road' && landKind(...coord(next), city.map) === 'water') {
        seen.add(next);
        queue.push(next);
      }
    }
  }
  return [...seen];
}

    const lk = landKind(...coord(id), map);

function reachableRoads(graph,start,radius) {

  let edge=[...found];
  for(let step=0;step<radius && edge.length;step++) {
    const next=[];
    for(const id of edge) for(const road of graph.get(id) ?? []) {
      if(found.has(road)) continue;
      found.add(road);
      next.push(road);
    }
    edge=next;
  }
  return found;
}

    const radius = type === 'park' ? 3 : LANDMARKS[type].radius;

    const out = [];
    for (let j = Math.max(0, cz - radius); j <= Math.min(SIZE - 1, cz + radius); j++) {
      for (let i = Math.max(0, cx - radius); i <= Math.min(SIZE - 1, cx + radius); i++) {

  const covered = new Set(roads);

  return [...covered];

function tick(city,current) {

  let utilities=Math.min(current.supply.water-current.waterUse,current.supply.sewer-current.sewerUse);
  const start=Math.floor(hash(city.day,7)*MAX_TILE);
  for(let offset=0;offset<MAX_TILE && changed.length<4;offset++) {
    const id=(start+offset)%MAX_TILE;
    const tile=city.tiles[id];
    if(!tile || !ZONES.includes(tile.type) || tile.level>=3 || growthBlock(current,id,tile)) continue;
    const nextLoad=tile.level===0 && tile.type==='industry'?2:1;
    if(power<nextLoad || utilities<nextLoad) continue;
    const [i,j]=coord(id);
    const nearAmenity=(tile.type==='homes' || tile.type==='shops') && city.tiles.some((near,index)=>{
      if(!near || !['park','wheel','expo','tower'].includes(near.type)) return false;

function buildMap(city, stats, layer, root, rotors) {
  const map=city.map;
  const stops=new Set(city.lines.flatMap(line=>[line.from,line.to]));
  const pool = new Map();
  const occupied = city.tiles;
  for(let j=-8;j<SIZE+8;j++) for(let i=-8;i<SIZE+8;i++) {
    const inGrid=i>=0&&i<SIZE&&j>=0&&j<SIZE;
    const id = idAt(i,j);
    const tile = inGrid ? occupied[id] : null;
    const x=world(i), z=world(j), y=elevation(i,j,map), seed=i*173+j*227;
    const bank = waterDist(i,j,map);
    if(!tile) {
      const woods = landKind(i,j,map) === 'hill' || j < 3 || j > 36 || (i < 6 && j < 22) || i > 43;
      const grove = Math.sin(i*.42 + j*.29) * Math.cos(j*.27 - i*.12);
      const chance = woods ? .78 : .12 + .12*Math.max(0,grove);
      if(bank>.63 && hash(i,j)<chance) {
        const count = woods ? (hash(j,i)>.52 ? 3 : 2) : 1;
        for(let k=0;k<count;k++) {
          const dx=(hash(seed,k+41)-.5)*2.4, dz=(hash(seed,k+51)-.5)*2.4;
          tree(pool,x+dx,elevation(i+dx/TILE,j+dz/TILE,map),z+dz,.55+hash(seed,k+61)*(woods ? 1.02:.71),seed+k*13,woods && hash(seed,k)<.8);
        }
      } else if (bank > .2 && bank < 1.2 && hash(seed,1) < .49) {
        add(pool,'rock',0x9c9b85,x,y-.10,z,.48+hash(seed,19)*.95,.44,.53,hash(seed,20)*5);
      } else if (woods && y>4 && hash(seed,4)<.41) {
        add(pool,'rock',0x939784,x,y,z,1.4,1.0,1.3,hash(seed,1)*3);
      }
      continue;
    }
    if(tile.type==='road') {
      road(pool,city,stats,layer,id,i,j,x,z);
      if(stops.has(id)) stopMarker(pool,x,z);
      continue;
    }
    if(tile.type === 'park') { park(pool,x,z,id); continue; }
    if(tile.type === 'power') { turbine(pool,x,z,rotors); continue; }
    if(Object.hasOwn(FACILITIES,tile.type)) { serviceBuilding(pool,tile.type,x,z,rotors); continue; }
    const cover = layer==='power' ? stats.powered.has(id)
      : layer==='water' ? stats.watered.has(id)&&stats.sewage.has(id)
      : stats.coverage[layer]?.has(id);
    const highlight=layer==='zones' ? zoneColors[tile.type]
      : cover===undefined ? null : cover ? 0x78b9e8 : 0xe78b62;
    const lot = highlight ?? (tile.type==='homes' ? 0xa2ad77 : tile.type==='shops' ? 0xb4b5a2 : 0xb3a891);
    box(pool,lot,x,.063,z,3.13,.075,3.13,0,'detail');
    if(tile.level===0) {
      box(pool,zoneColors[tile.type],x,.113,z,2.8,.035,2.8,0,'detail');
      for(const s of [-1,1]) {
        box(pool,lot,x+s*1.17,.139,z,.045,.023,2.42,0,'detail');
        box(pool,lot,x,.139,z+s*1.17,2.42,.023,.045,0,'detail');
      }
      continue;
    }
    if(tile.type==='homes') home(pool,x,z,tile.level,id);
    if(tile.type==='shops') commerce(pool,x,z,tile.level,id);
    if(tile.type==='industry') factory(pool,x,z,tile.level,id);
  }
  batch(pool,root);
}

function makeTraffic(scene) {
  const group=new THREE.Group();

    const bus=n>=56;

    const body=new THREE.Mesh(shape.box,material);
    body.position.y=bus?.19:.09;

    cabin.scale.set(bus?.42:.26,.12,bus?.79:.29);

    return {node,bus,route:[],key:'',phase:0};

}

function makeBoats(scene) {
  const group = new THREE.Group();
  scene.add(group);
  const cabinLit = new THREE.MeshLambertMaterial({color:0xfef3c7,emissive:0xffd579,emissiveIntensity:0});
  const boats = Array.from({length:7},(_,n)=>{
    const ferry = n % 2 === 0;
    const node = new THREE.Group();
    const hullMat = new THREE.MeshLambertMaterial({color:ferry ? 0x3b6e8c : 0x6e473b});
    const hull = new THREE.Mesh(shape.box, hullMat);
    hull.position.y = .12;
    hull.scale.set(ferry ? .86 : 1.02, .24, ferry ? 2.15 : 2.85);
    node.add(hull);
    const deck = new THREE.Mesh(shape.box, cabinLit);
    deck.position.set(0, .32, ferry ? 0 : -.55);
    deck.scale.set(ferry ? .66 : .72, .24, ferry ? 1.32 : .82);
    node.add(deck);
    if (!ferry) {
      const cargoMat = new THREE.MeshLambertMaterial({color:n%3===0?0xd97742:0x528872});
      const cargo = new THREE.Mesh(shape.box, cargoMat);
      cargo.position.set(0, .32, .45);
      cargo.scale.set(.74, .28, 1.05);
      node.add(cargo);
    }
    group.add(node);
    return {node, ferry, progress: (n / 7) * (SIZE + 8) - 4, dir: n % 2 === 0 ? 1 : -1, offset: (n % 3 - 1) * .85};
  });
  return {boats, cabinLit};
}

function setFleet(fleet,traffic) {
  const total=traffic.trips.reduce((sum,trip)=>sum+trip.vehicles,0);
  const busPaths=traffic.buses.filter(bus=>bus.path.length>1);
  const carCount=Math.min(56,Math.ceil(total/5));
  for(const [index,vehicle] of fleet.entries()) {
    let path;
    if(vehicle.bus) path=busPaths[index-56]?.path;
    else if(index<carCount) {
      let weight=total*(index+.5)/carCount;
      path=traffic.trips.find(trip=>(weight-=trip.vehicles)<=0)?.path;
    }
    vehicle.node.visible=Boolean(path);
    if(!path) { vehicle.route=[]; vehicle.key=''; continue; }
    const key=path.join(',');
    if(key===vehicle.key) continue;
    vehicle.key=key;
    vehicle.route=path;
    vehicle.phase=hash(index,4)*(path.length-1)*2;
  }
}

let audioCtx = null;
let soundEnabled = true;
function playTone(kind) {
  if (!soundEnabled) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    if (kind === 'build') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(340, now);
      osc.frequency.exponentialRampToValueAtTime(520, now + 0.08);
      gain.gain.setValueAtTime(0.06, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
      osc.start(now); osc.stop(now + 0.09);
    } else if (kind === 'clear') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(210, now);
      osc.frequency.exponentialRampToValueAtTime(110, now + 0.09);
      gain.gain.setValueAtTime(0.05, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
      osc.start(now); osc.stop(now + 0.1);
    } else if (kind === 'milestone') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(440, now);
      osc.frequency.setValueAtTime(554.37, now + 0.08);
      osc.frequency.setValueAtTime(659.25, now + 0.16);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
      osc.start(now); osc.stop(now + 0.32);
    } else if (kind === 'error') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(190, now);
      gain.gain.setValueAtTime(0.05, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
      osc.start(now); osc.stop(now + 0.12);
    }
  } catch {}
}

        :layer==='water'?stats.watered.has(id)&&stats.sewage.has(id)
        :layer==='metro'?stats.coverage.metro.has(id)||stats.coverage.pier.has(id)

function drawMap() {

  mapContext.drawImage(mapBase,0,0);
  mapContext.save();
  mapContext.translate((i+.5)/SIZE*map.width,(j+.5)/SIZE*map.height);
  mapContext.rotate(-angle);
  mapContext.strokeStyle='#f8dfb5';
  mapContext.fillStyle='#f7ce8d';
  mapContext.lineWidth=1.3;
  const w=52/zoom, h=32/zoom;

  mapContext.moveTo(0,-h-4);
  mapContext.lineTo(-3,-h);
  mapContext.lineTo(3,-h);
  mapContext.fill();

}

  if(active.id==='inspect') { inspect(to); return; }
  if(active.id==='bus') {
    if(busStart===null) {
      if(!stats.graph.has(to)) { playTone('error'); toast('请在连通城外的道路上设站。',true); return; }
      busStart=to;
      playTone('build');
      set('tool-hint','起点 '+pointName(to)+'。点击另一段道路设置终点。');
      return;
    }
    const error=addBus(city,stats,busStart,to);
    if(error) { playTone('error'); toast(error,true); return; }
    busStart=null;
    set('tool-hint',active.hint);
    playTone('build');
    refresh();
    persist();
    const line=stats.traffic.buses.at(-1);
    toast('开通 '+line.id+' 路 · '+line.riders+' 人搭乘');
    return;
  }
  const p=proposal(from,to);
  if(!build(city,active.id,p)) {
    playTone('error');
    if(city.cash<p.cost) toast('资金不足，需要 '+money(p.cost),true);
    else if(p.reason) toast(p.reason,true);
    else if(['road','avenue'].includes(active.id) && p.invalid.length) toast('路线受阻，请避开建筑和保护坡地。',true);
    else if(p.invalid.length) toast('部分地块不可施工，请选择可用地块。',true);
    return;
  }
  playTone(active.id === 'clear' ? 'clear' : 'build');
  toast(active.name+' · '+p.valid.length+' 格 · −'+money(p.cost));
  refresh();
  persist();
}

function eventPoint(e) { return {x:e.clientX,y:e.clientY}; }
function picked(e) { return view.pick(e.clientX,e.clientY)?.id??null; }
function pinchMetrics() {
  const [a,b]=pointers.values();
  return {x:(a.x+b.x)/2,y:(a.y+b.y)/2,distance:Math.max(1,Math.hypot(a.x-b.x,a.y-b.y))};
}
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('pointerdown',e=>{
  if(e.button>2) return;
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId,eventPoint(e));
  if(pointers.size>=2) {
    pinch=pinchMetrics();
    gesture=null;
    delete canvas.dataset.pan;
    refreshPreview(null);
    return;
  }
  const id=picked(e);
  const mode=e.button===2 || e.altKey || panLock ? 'pan' : e.button===1 ? 'rotate' : active.id==='inspect'?'inspect':'build';
  gesture={pointer:e.pointerId,id,mode,x:e.clientX,y:e.clientY,distance:0};
  if(mode==='pan' || mode==='rotate') canvas.dataset.pan='';
  refreshPreview(id);
});
canvas.addEventListener('pointermove',e=>{
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId,eventPoint(e));
  if (pointers.size>=2) {
    const next=pinchMetrics();
    if(pinch) {
      view.panScreen(next.x-pinch.x,next.y-pinch.y);
      view.zoomAt(next.distance/pinch.distance,next.x,next.y);
    }
    pinch=next;
    return;
  }
  if (gesture?.pointer===e.pointerId) {
    const dx=e.clientX-gesture.x, dy=e.clientY-gesture.y;
    gesture.x=e.clientX; gesture.y=e.clientY;
    gesture.distance+=Math.hypot(dx,dy);
    if(gesture.mode==='inspect' && gesture.distance>6) gesture.mode='pan';
    if(gesture.mode==='pan') {
      canvas.dataset.pan='';
      view.panScreen(dx,dy);
      return;
    }
    if(gesture.mode==='rotate') { view.rotate(-dx*.008); return; }
  }
  const id=picked(e);
  if(hover!==id) refreshPreview(id);
});
function endPointer(e, cancelled) {
  pointers.delete(e.pointerId);
  if(pointers.size<2) pinch=null;
  if(gesture?.pointer!==e.pointerId) return;
  const old=gesture;
  gesture=null;
  delete canvas.dataset.pan;
  const id=cancelled?null:picked(e);
  if (id!==null && (old.mode==='build' || old.mode==='inspect') && old.id!==null) commit(old.id,id);
  refreshPreview(id);
}
canvas.addEventListener('pointerup',e=>endPointer(e,false));
canvas.addEventListener('pointercancel',e=>endPointer(e,true));
canvas.addEventListener('lostpointercapture',e=>endPointer(e,true));
canvas.addEventListener('pointerleave',()=>{ if(!gesture) refreshPreview(null); });
canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  view.zoomAt(Math.exp(Math.max(-120,Math.min(120,-e.deltaY))*.0032),e.clientX,e.clientY);
  refreshPreview(picked(e));
},{passive:false});

  $('import-json-btn').addEventListener('click', () => {
    const raw = $('save-json-box').value.trim();
    if (!raw) { toast('请先在文本框中粘贴存档 JSON', true); return; }
    const imported = importCityJson(raw);
    if (!imported) { toast('存档 JSON 格式无效或已损坏', true); return; }
    enterScenario(imported);
    toast('成功导入城市存档：' + MAPS[imported.map].name + '！');
  });
  $('import-file-btn').addEventListener('click', () => $('save-json-file').click());
  $('save-json-file').addEventListener('change', async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const text = await file.text();
    const imported = importCityJson(text);
    if (!imported) { toast('所选 JSON 文件不是有效的天际线存档', true); return; }
    enterScenario(imported);
    toast('成功从文件导入城市存档：' + MAPS[imported.map].name + '！');
  });
}
$('settings-button').addEventListener('click', openSaveCenterDialog);

function setLayer(next) {
  layer=next;
  for(const btn of layerButtons) btn.setAttribute('aria-pressed',btn.dataset.layer===layer);
  $('layer-menu').hidden=true;
  $('layer-button').setAttribute('aria-expanded','false');
  $('view-tag').innerHTML='<span></span>' + {
    normal:MAPS[city.map].region+' <b>/</b> '+MAPS[city.map].english,
    zones:'住宅 · 商业 · 工业 <b>/</b> 土地分区',
    power:'蓝色 已供电 · 橘红 待供电',
    water:'蓝色 水务已覆盖 · 橘红 待接通',
    waste:'蓝色 有清运 · 橘红 无清运',
    school:'蓝色 有教育覆盖 · 橘红 无覆盖',
    clinic:'蓝色 有医疗覆盖 · 橘红 无覆盖',
    fire:'蓝色 有消防覆盖 · 橘红 无覆盖',
    metro:'蓝色 轨交/航运已覆盖 · 橘红 未覆盖',
    traffic:'蓝色 畅通 · 琥珀 繁忙 · 红色 拥堵',
  }[layer];
  rebuild();
}
$('layer-button').addEventListener('click',()=>{
  $('layer-menu').hidden=!$('layer-menu').hidden;
  $('layer-button').setAttribute('aria-expanded',!$('layer-menu').hidden);
});
for(const btn of layerButtons) btn.addEventListener('click',()=>setLayer(btn.dataset.layer));
for(const btn of speedButtons) btn.addEventListener('click',()=>setSpeed(Number(btn.dataset.speed)));
$('close-inspector').addEventListener('click',()=>{ closeInspector(); refreshPreview(hover); });
$('home-camera').addEventListener('click',()=>view.reset());
$('rotate-camera').addEventListener('click',()=>view.rotate(Math.PI/4));
$('zoom-in').addEventListener('click',()=>view.zoomBy(1.28));
$('zoom-out').addEventListener('click',()=>view.zoomBy(1/1.28));

window.addEventListener('keydown',e=>{
  if(dialog.open || e.target instanceof HTMLInputElement || e.metaKey || e.ctrlKey || e.altKey) return;
  if(e.key===' ' && !['BUTTON','CANVAS'].includes(e.target.tagName)) {
    e.preventDefault();
    if(!e.repeat) setSpeed(speed?0:previousSpeed);
  }
  if(e.key.toLowerCase()==='l' && !e.repeat) { cycleLighting(); return; }
  if(e.key==='Escape') { selectTool('inspect'); closeInspector(); return; }
  const tool=TOOLS.find(item=>item.key===e.key);
  if(tool && !e.repeat) selectTool(tool.id);
  if(['w','a','s','d','q','e','arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase())) {
    e.preventDefault(); keys.add(e.key.toLowerCase());
  }
});
window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
window.addEventListener('blur',()=>keys.clear());
window.addEventListener('pagehide',persist);
document.addEventListener('visibilitychange',()=>{ if(document.hidden) persist(); });

function stepSimulation(dt) {
  const has = (a,b) => Number(keys.has(a)||keys.has(b));
  const dx=has('d','arrowright')-has('a','arrowleft'), dy=has('s','arrowdown')-has('w','arrowup');
  if(dx||dy) view.panScreen(-dx*dt*460,-dy*dt*460);
  if(keys.has('q') || keys.has('e')) view.rotate((Number(keys.has('e'))-Number(keys.has('q')))*dt*1.05);
  const rate=dialog.open?0:speed;
  elapsed+=dt*speeds[rate];
  while(elapsed>=1.15) {
    elapsed-=1.15;
    const changed=tick(city,stats);
    if(changed.length) {
      stats=survey(city);
      rebuild();
      refreshPreview(hover);
    }
    const progress=progressNotice();
    updateHUD();
    if(changed.length || progress || city.day%30===0) persist();
  }
  view.frame(dt,rate);
  drawMap();
  const cw = canvas.clientWidth, ch = canvas.clientHeight;
  for(const label of labels) {
    const {x,y,visible}=view.project(world(Number(label.dataset.i)),.7,world(Number(label.dataset.j)));
    const inLeftHUD = x < 276 && (y < 395 || y > ch - 185);
    const inRightHUD = x > cw - 245 && (y < 175 || y > ch - 235);
    const inBottomDock = y > ch - 165 && x > cw * 0.22 && x < cw * 0.78;
    const inToast = $('toast').classList.contains('show') && y < 142 && Math.abs(x - cw * 0.5) < 165;
    label.hidden=!visible || y<96 || y>ch-154 || inLeftHUD || inRightHUD || inBottomDock || inToast;
    label.style.transform='translate('+Math.round(x)+'px,'+Math.round(y)+'px) translate(-50%,-50%)';
  }
}

let autoplayStep = 0;
let smoothFps = 60;
window.__gameState = function() {
  return {
    phase: city.result ?? 'playing',
    score: stats.population,
    hearts: Math.max(1, Math.round(stats.traffic.flow * 10)),
    fps: Math.round(smoothFps),
    hero: { x: view.focus.i, y: view.focus.j },
    pickups: [],
    enemies: [],
    world: { w: SIZE, h: SIZE, size: SIZE },
    heroOnScreen: true,
  };
};

window.__autoplay = function() {
  if (speed < 3) setSpeed(3);
  autoplayStep++;
  if (autoplayStep % 2 !== 1) return;
  const stepIdx = Math.floor(autoplayStep / 2);
  const plans = [
    ['road', idAt(20, 15), idAt(34, 15)],
    ['expo', idAt(25, 21), idAt(25, 21)],
    ['tower', idAt(28, 21), idAt(28, 21)],
    ['metro', idAt(28, 22), idAt(28, 22)],
    ['homes', idAt(21, 16), idAt(23, 16)],
    ['homes', idAt(30, 16), idAt(33, 16)],
    ['shops', idAt(25, 16), idAt(28, 16)],
    ['waste', idAt(35, 18), idAt(35, 18)],
    ['school', idAt(26, 22), idAt(26, 22)],
    ['avenue', idAt(20, 24), idAt(34, 24)],
  ];
  const item = plans[stepIdx % plans.length];
  if (item) {
    const [toolId, from, to] = item;
    const savedStage = city.stage;
    city.stage = 3;
    const p = plan(city, toolId, footprint(toolId, from, to));
    const ok = build(city, toolId, p);
    city.stage = savedStage;
    if (ok) {
      for (const id of p.valid) {
        const t = city.tiles[id];
        if (t && ZONES.includes(t.type) && t.level === 0) t.level = 2;
      }
      refresh();
    }
  }
  for (let k = 0; k < 2; k++) {
    const changed = tick(city, stats);
    if (changed.length) stats = survey(city);
  }
  advance(city, stats);
  rebuild();
  updateHUD();
  if (stepIdx === 6) cycleLighting(true);
};

window.advanceTime = function(ms) {
  const step = 1 / 60;
  const total = Math.max(1, Math.round(ms / (1000 / 60)));
  for (let i = 0; i < total; i++) {
    stepSimulation(step);
  }
};

window.render_game_to_text = function() {
  return JSON.stringify({
    phase: city.result ?? 'playing',
    score: stats.population,
    population: stats.population,
    cash: city.cash,
    net: stats.net,
    day: city.day,
    stage: city.stage,
    map: city.map,
    mode: city.mode,
    timeMode: view.timeMode,
    flow: Math.round(stats.traffic.flow * 100),
    power: { load: stats.load, capacity: stats.power },
  });
};

function render(now) {
  const rawDt = (now - (lastTime || now)) / 1000;
  if (rawDt > 0.001 && rawDt < 0.5) smoothFps = smoothFps * 0.9 + (1 / rawDt) * 0.1;
  const dt=Math.min(.085,rawDt);
  lastTime=now;
  stepSimulation(dt);
  requestAnimationFrame(render);
}

advance(city,stats);
updateScenarioIdentity();
setSpeed(1);
selectTool('inspect');
setLayer('normal');
updateHUD();
persist();
requestAnimationFrame(now=>{
  render(now);
  $('boot').hidden=true;
});

})();
})();
</script>
</body></html>
