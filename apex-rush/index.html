  function drawEndScreen() {
    if (!winner) return;
    var fade = clamp(endTimer / 0.42, 0, 1);
    ctx.save();
    ctx.globalAlpha = fade;
    ctx.fillStyle = 'rgba(3,13,15,0.62)';
    ctx.fillRect(0, 0, cssW, cssH);

    var cardW = Math.min(cssW - 28, 402);
    var cardH = Math.min(cssH - 54, 502);
    var cx = (cssW - cardW) / 2;
    var cy = (cssH - cardH) / 2;
    var u = clamp(Math.min(cardW / 380, cardH / 470), 0.72, 1.18);

    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.5)';
    ctx.shadowBlur = 30;
    ctx.shadowOffsetY = 10;
    var card = ctx.createLinearGradient(cx, cy, cx, cy + cardH);
    card.addColorStop(0, 'rgba(19,41,40,0.98)');
    card.addColorStop(0.55, 'rgba(10,27,28,0.98)');
    card.addColorStop(1, 'rgba(7,20,22,0.98)');
    roundRectPath(ctx, cx, cy, cardW, cardH, 24 * u);
    ctx.fillStyle = card;
    ctx.fill();
    ctx.restore();
    ctx.save();
    roundRectPath(ctx, cx + 0.5, cy + 0.5, cardW - 1, cardH - 1, 24 * u);
    ctx.strokeStyle = winner.isPlayer ? 'rgba(255,218,135,0.45)' : 'rgba(255,137,107,0.3)';
    ctx.lineWidth = 1.3;
    ctx.stroke();
    ctx.restore();

    // checkered header band
    var bandH = 20 * u;
    for (var c = 0; c < 22; c++) {
      ctx.fillStyle = c % 2 ? 'rgba(255,233,187,0.88)' : 'rgba(9,22,23,0.94)';
      ctx.fillRect(cx + (c / 22) * cardW, cy, cardW / 22 + 0.4, bandH * 0.52);
      ctx.fillStyle = c % 2 ? 'rgba(9,22,23,0.94)' : 'rgba(255,233,187,0.88)';
      ctx.fillRect(cx + (c / 22) * cardW, cy + bandH * 0.52, cardW / 22 + 0.4, bandH * 0.48);
    }

    var top = cy + 40 * u;
    drawSpaced(ctx, winner.isPlayer ? 'RACE COMPLETE' : 'RACE OVER', cssW / 2, top, 8.2 * u, winner.isPlayer ? 'rgba(255,211,106,0.8)' : 'rgba(255,150,128,0.8)', 2 * u);

    var titleText = winner.isPlayer ? '冠军！' : '第 ' + playerRank + ' 名';
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '800 ' + 50 * u + 'px ' + UI_FONT;
    ctx.lineWidth = 5 * u;
    ctx.strokeStyle = 'rgba(4,12,13,0.68)';
    ctx.strokeText(titleText, cssW / 2, top + 52 * u);
    var tg = ctx.createLinearGradient(cssW / 2 - 120 * u, top + 20 * u, cssW / 2 + 120 * u, top + 85 * u);
    if (winner.isPlayer) {
      tg.addColorStop(0, '#fff7db');
      tg.addColorStop(0.45, '#ffd36a');
      tg.addColorStop(1, '#ff8d48');
    } else {
      tg.addColorStop(0, '#fff1e8');
      tg.addColorStop(0.45, '#ff9d83');
      tg.addColorStop(1, '#e85a4a');
    }
    ctx.fillStyle = tg;
    ctx.shadowColor = winner.isPlayer ? 'rgba(255,185,82,0.35)' : 'rgba(255,107,61,0.28)';
    ctx.shadowBlur = 24 * u;
    ctx.fillText(titleText, cssW / 2, top + 52 * u);
    ctx.restore();

    drawText(ctx, winner.isPlayer ? '你率先冲过终点，拿走落日湾的冠军。' : winner.name + ' 率先冲过终点。',
      cssW / 2, top + 91 * u, 10.8 * u, 'rgba(247,239,218,0.68)', 'center', '500');

    // rank medal
    var medalY = top + 137 * u;
    ctx.save();
    ctx.beginPath();
    ctx.arc(cssW / 2, medalY, 31 * u, 0, TAU);
    ctx.fillStyle = winner.isPlayer ? 'rgba(255,211,106,0.16)' : 'rgba(255,130,101,0.12)';
    ctx.fill();
    ctx.strokeStyle = winner.isPlayer ? 'rgba(255,211,106,0.48)' : 'rgba(255,130,101,0.35)';
    ctx.lineWidth = 1.3 * u;
    ctx.stroke();
    ctx.font = '800 ' + 24 * u + 'px ' + NUM_FONT;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = winner.isPlayer ? '#ffd36a' : '#ff9f89';
    ctx.fillText('P' + playerRank, cssW / 2, medalY + 1 * u);
    ctx.restore();
    drawText(ctx, winner.isPlayer ? '你冲过了终点' : '比赛在对手冲线时结束',
      cssW / 2, medalY + 47 * u, 8.6 * u, 'rgba(247,239,218,0.42)', 'center', '500');

    // stats strip
    var statsY = medalY + 74 * u;
    var statW = (cardW - 54 * u) / 3;
    var statX = cx + 27 * u;
    drawStat(statX, statsY, statW, winner.isPlayer ? '用时' : '比赛用时', formatTime(raceElapsed));
    drawStat(statX + statW, statsY, statW, '最快圈', player && player.bestLap ? formatLap(player.bestLap) : '—');
    drawStat(statX + statW * 2, statsY, statW, '完赛圈数', player ? Math.min(LAPS, player.lap) + '/' + LAPS : '1/' + LAPS);

    // finishing order
    var order = updateStandings();
    var listY = statsY + 48 * u;
    for (var i = 0; i < order.length; i++) {
      var car = order[i];
      var rowY = listY + i * 22 * u;
      var isP = car.isPlayer;
      if (isP) {
        ctx.fillStyle = 'rgba(255,211,106,0.075)';
        roundRectPath(ctx, cx + 22 * u, rowY - 10 * u, cardW - 44 * u, 19 * u, 8 * u);
        ctx.fill();
      }
      drawText(ctx, String(i + 1), cx + 32 * u, rowY, 9.2 * u, isP ? '#ffd36a' : 'rgba(247,239,218,0.42)', 'left', '800');
      ctx.save();
      ctx.fillStyle = car.style.main;
      ctx.beginPath();
      ctx.arc(cx + 53 * u, rowY - 1 * u, 3 * u, 0, TAU);
      ctx.fill();
      ctx.restore();
      drawText(ctx, isP ? '你' : car.name, cx + 63 * u, rowY, 9.2 * u, isP ? '#ffe7ad' : 'rgba(247,239,218,0.68)', 'left', '600');
      var timeText = car.finished ? formatTime(car.finishTime) : (car.lap !== undefined ? car.lap + ' 圈' : '');
      drawText(ctx, timeText, cx + cardW - 30 * u, rowY, 8.6 * u, isP ? 'rgba(255,228,163,0.8)' : 'rgba(247,239,218,0.38)', 'right', '500');
    }

    var promptY = cy + cardH - 34 * u;
    var rowBottom = listY + Math.max(0, order.length - 1) * 22 * u;
    var tipY = Math.max(rowBottom + 34 * u, promptY - 51 * u);
    if (tipY < promptY - 18 * u) {
      ctx.save();
      var lineW = cardW - 84 * u;
      var line = ctx.createLinearGradient(cx + 42 * u, 0, cx + cardW - 42 * u, 0);
      line.addColorStop(0, 'rgba(255,222,160,0)');
      line.addColorStop(0.5, 'rgba(255,222,160,0.16)');
      line.addColorStop(1, 'rgba(255,222,160,0)');
      ctx.strokeStyle = line;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(cx + 42 * u, tipY - 15 * u);
      ctx.lineTo(cx + 42 * u + lineW, tipY - 15 * u);
      ctx.stroke();
      ctx.fillStyle = winner.isPlayer ? 'rgba(255,227,164,0.52)' : 'rgba(247,239,218,0.4)';
      ctx.beginPath();
      ctx.arc(cssW / 2, tipY - 15 * u, 2.2 * u, 0, TAU);
      ctx.fill();
      ctx.restore();
      drawText(ctx, winner.isPlayer ? '漂亮！下一场试试更晚的刹车点。' : '小提示：入弯前松油，弯心再补油。',
        cssW / 2, tipY, 8.6 * u, winner.isPlayer ? 'rgba(255,235,186,0.6)' : 'rgba(247,239,218,0.4)', 'center', '500');
    }

    var promptAlpha = restartGuard <= 0 ? 1 : 0.4;
    ctx.save();
    ctx.globalAlpha = promptAlpha;
    var pgrad = ctx.createLinearGradient(cx + 28 * u, 0, cx + cardW - 28 * u, 0);
    pgrad.addColorStop(0, 'rgba(255,180,84,0.12)');
    pgrad.addColorStop(0.5, 'rgba(255,180,84,0.2)');
    pgrad.addColorStop(1, 'rgba(255,180,84,0.12)');
    roundRectPath(ctx, cx + 28 * u, promptY - 16 * u, cardW - 56 * u, 30 * u, 15 * u);
    ctx.fillStyle = pgrad;
    ctx.fill();
    drawText(ctx, '点击 / 按 ENTER 再来一局', cssW / 2, promptY, 10 * u, '#ffe4a1', 'center', '700');
    ctx.restore();

    ctx.restore();
    drawConfetti();
  }

  function drawStat(x, y, w, label, value) {
    var u = clamp(Math.min((cssW - 28) / 380, (cssH - 54) / 470), 0.72, 1.18);
    drawText(ctx, label, x + w / 2, y, 8.1 * u, 'rgba(247,239,218,0.4)', 'center', '500');
    drawText(ctx, value, x + w / 2, y + 17 * u, 13.8 * u, '#f2ead7', 'center', '700');
  }

  function drawConfetti() {
    for (var i = 0; i < screenConfetti.length; i++) {
      var c = screenConfetti[i];
      ctx.save();
      ctx.translate(c.x, c.y);
      ctx.rotate(c.rot);
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = c.color;
      ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
      ctx.restore();
    }
  }

  function drawImpactVignette() {
    if (impactFlash <= 0) return;
    var g = ctx.createRadialGradient(cssW / 2, cssH / 2, cssH * 0.22, cssW / 2, cssH / 2, cssH * 0.7);
    g.addColorStop(0, 'rgba(255,100,58,0)');
    g.addColorStop(1, 'rgba(255,90,58,' + (impactFlash * 0.28) + ')');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, cssW, cssH);
  }

  function render() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    screenBackdrop();

    var shakeX = 0, shakeY = 0;
    if (shake > 0) {
      var mag = shake * 12 * ui;
      shakeX = (Math.random() - 0.5) * mag;
      shakeY = (Math.random() - 0.5) * mag;
    }
    ctx.save();
    ctx.translate(ox + shakeX, oy + shakeY);
    ctx.scale(fitScale, fitScale);
    if (sceneCanvas) ctx.drawImage(sceneCanvas, 0, 0, WORLD.w, WORLD.h);
    drawWorldDynamic(ctx);
    ctx.restore();

    if (phase === 'title') {
      drawTitle();
      return;
    }

    if (phase === 'playing') {
      drawHUD();
      if (raceMode === 'countdown' || (raceMode === 'racing' && goFlash > 0)) drawCountdownOverlay();
      if (isTouchLikely) drawTouchControls();
      drawImpactVignette();
    } else {
      drawEndScreen();
    }
  }

  /* ---------------------------------------------------------------
   * 16. HOST HOOKS + BOOT
   * --------------------------------------------------------------- */
  function renderSlots(size) {
    size = size || 256;
    var out = {};
    var list = ['hero', 'enemy', 'pickup', 'background'];
    for (var i = 0; i < list.length; i++) {
      var key = list[i];
      var c = document.createElement('canvas');
      c.width = size;
      c.height = size;
      var g = c.getContext('2d');
      if (key === 'background') {
        drawCharacter(g, key, size);
      } else {
        g.translate(size / 2, size / 2);
        drawCharacter(g, key, size * 0.82);
      }
      out[key] = c.toDataURL('image/png');
    }
    return out;
  }
  window.__renderSlots = renderSlots;

  function postRenders() {
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({
          source: 'dsh-game-studio',
          type: 'renders',
          renders: renderSlots(256)
        }, '*');
      }
    } catch (e) {
      postError('character renders failed: ' + (e && e.message || e));
    }
  }

  window.__gameState = function () {
    function round(v) {
      if (typeof v !== 'number' || isNaN(v)) return 0;
      var r = Math.round(v * 100) / 100;
      return r === 0 ? 0 : r;
    }
    var hero = player || { x: WORLD.w / 2, y: WORLD.h / 2 };
    return {
      phase: phase,
      time: round(raceElapsed),
      score: round(player ? player.lap * 1000 + (player.s / TRACK_LENGTH) * 1000 : 0),
      hearts: 3,
      fps: round(fps),
      hero: { x: round(hero.x), y: round(hero.y) },
      heroOnScreen: true,
      pickups: [],
      enemies: aiCars.map(function (c) {
        return { x: round(c.x), y: round(c.y) };
      }),
      world: { w: WORLD.w, h: WORLD.h },
      lap: player ? Math.min(LAPS, player.lap + 1) : 1,
      laps: LAPS,
      position: playerRank,
      racers: racers.length,
      raceMode: raceMode,
      countdown: round(countdown)
    };
  };

  window.addEventListener('error', function (e) {
    postError(e && e.message ? e.message : 'Unknown error');
  });
  window.addEventListener('unhandledrejection', function (e) {
    var m = (e && e.reason && e.reason.message) ? e.reason.message : String(e && e.reason);
    postError(m);
  });

  function frame(now) {
    requestAnimationFrame(frame);
    if (!lastFrame) lastFrame = now;
    var dt = Math.min(0.05, Math.max(0, (now - lastFrame) / 1000));
    lastFrame = now;
    fpsFrames++;
    fpsAcc += dt;
    if (fpsAcc >= 0.5) {
      fps = Math.round(fpsFrames / fpsAcc);
      fpsFrames = 0;
      fpsAcc = 0;
    }
    update(dt);
    render();
  }

  function boot() {
    resize();
    buildScene();
    initMotes();
    resetRacers();
    updateStandings();
    window.addEventListener('resize', resize);
    requestAnimationFrame(frame);
    requestAnimationFrame(function () {
      requestAnimationFrame(postRenders);
    });
  }

  boot();
})();
</script>
</body></html>
