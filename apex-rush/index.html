<script>/* 弯道狂飙 — a top-down 3-lap circuit racer built for Game Studio.

  function buildTrack(points, subdivisions) {
    var raw = [], i, j, t, p0, p1, p2, p3, x, y;
    var n = points.length;
    for (i = 0; i < n; i++) {
      p0 = points[(i - 1 + n) % n];
      p1 = points[i];
      p2 = points[(i + 1) % n];
      p3 = points[(i + 2) % n];
      for (j = 0; j < subdivisions; j++) {
        t = j / subdivisions;
        x = 0.5 * ((2 * p1.x) + (-p0.x + p2.x) * t +
          (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t * t +
          (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t * t * t);
        y = 0.5 * ((2 * p1.y) + (-p0.y + p2.y) * t +
          (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t * t +
          (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t * t * t);
        raw.push({ x: x, y: y });
      }
    }
    raw.push({ x: raw[0].x, y: raw[0].y });

    var cum = [0], total = 0;
    for (i = 1; i < raw.length; i++) {
      total += Math.hypot(raw[i].x - raw[i - 1].x, raw[i].y - raw[i - 1].y);
      cum.push(total);
    }
    var count = Math.max(320, Math.round(total / 3));
    var step = total / count;
    var samples = [];
    var k = 0;
    for (i = 0; i < count; i++) {
      var d = i * step;
      while (k < cum.length - 2 && cum[k + 1] < d) k++;
      var seg = Math.max(1e-6, cum[k + 1] - cum[k]);
      var tt = (d - cum[k]) / seg;
      samples.push({
        x: lerp(raw[k].x, raw[k + 1].x, tt),
        y: lerp(raw[k].y, raw[k + 1].y, tt)
      });
    }
    for (i = 0; i < count; i++) {
      var a = samples[(i - 1 + count) % count];
      var b = samples[(i + 1) % count];
      var tx = b.x - a.x, ty = b.y - a.y;
      var len = Math.max(0.0001, Math.hypot(tx, ty));
      samples[i].tx = tx / len;
      samples[i].ty = ty / len;
      samples[i].nx = -samples[i].ty;
      samples[i].ny = samples[i].tx;
      samples[i].angle = Math.atan2(samples[i].ty, samples[i].tx);
    }
    var aheadN = Math.max(4, Math.round(105 / step));
    for (i = 0; i < count; i++) {
      var ahead = samples[(i + aheadN) % count];
      var nearB = samples[(i - 6 + count) % count];
      var nearF = samples[(i + 6) % count];
      var corner = angleDiff(ahead.angle, samples[i].angle);
      samples[i].turn = corner;
      samples[i].curve = Math.abs(corner);
      samples[i].localTurn = angleDiff(nearF.angle, nearB.angle);
    }

    var length = count * step;
    var track = {
      samples: samples,
      step: step,
      length: length,
      count: count
    };

    track.at = function (s) {
      s = mod(s, length);
      var f = s / step;
      var idx = Math.floor(f) % count;
      var frac = f - Math.floor(f);
      var a = samples[idx];
      var b = samples[(idx + 1) % count];
      var da = angleDiff(b.angle, a.angle);
      var ang = a.angle + da * frac;
      return {
        x: lerp(a.x, b.x, frac),
        y: lerp(a.y, b.y, frac),
        tx: lerp(a.tx, b.tx, frac),
        ty: lerp(a.ty, b.ty, frac),
        nx: lerp(a.nx, b.nx, frac),
        ny: lerp(a.ny, b.ny, frac),
        angle: ang,
        curve: a.curve,
        turn: a.turn
      };
    };

    track.nearest = function (x, y, hint) {
      var bestD = Infinity, best = 0;
      var center = (hint == null) ? 0 : hint;
      for (var d = -40; d <= 40; d++) {
        var idx = mod(center + d, count);
        var px = samples[idx].x - x, py = samples[idx].y - y;
        var dd = px * px + py * py;
        if (dd < bestD) { bestD = dd; best = idx; }
      }
      if (bestD > 240 * 240) {
        for (i = 0; i < count; i++) {
          var qx = samples[i].x - x, qy = samples[i].y - y;
          var qd = qx * qx + qy * qy;
          if (qd < bestD) { bestD = qd; best = i; }
        }
      }
      var p = samples[best];
      var q = samples[(best + 1) % count];
      var vx = q.x - p.x, vy = q.y - p.y;
      var vlen2 = Math.max(0.000001, vx * vx + vy * vy);
      var proj = ((x - p.x) * vx + (y - p.y) * vy) / vlen2;
      proj = clamp(proj, 0, 0.9999);
      var sx = p.x + vx * proj;
      var sy = p.y + vy * proj;
      var s = (best + proj) * step;
      if (s >= length) s -= length;
      return {
        index: best,
        s: s,
        lateral: (x - sx) * p.nx + (y - sy) * p.ny,
        x: sx,
        y: sy
      };
    };

    return track;
  }

  function carForward(car) {
    return car.vx * Math.cos(car.angle) + car.vy * Math.sin(car.angle);

  function stepCar(car, ctrl, dt) {
    var speed = carForward(car);
    var lateralSpeed = -car.vx * Math.sin(car.angle) + car.vy * Math.cos(car.angle);
    var absSpeed = Math.abs(speed);
    var steerFactor = clamp((absSpeed + 25) / 160, 0, 1) * (1 - 0.36 * clamp(absSpeed / car.maxSpeed, 0, 1));
    var steerDir = speed < -4 ? -1 : 1;
    car.angle += ctrl.steer * car.turnRate * steerFactor * steerDir * dt;
    var fx = Math.cos(car.angle), fy = Math.sin(car.angle);

    if (ctrl.brake > 0) {
      if (speed > 0) {
        speed -= car.brakePower * ctrl.brake * dt;
        if (speed < 0) speed = 0;
      } else {
        speed -= 118 * ctrl.brake * dt;
        if (speed < -102) speed = -102;
      }
    } else if (ctrl.throttle > 0) {
      var ratio = clamp(Math.max(0, speed) / car.maxSpeed, 0, 1);
      speed += car.accel * ctrl.throttle * (1 - 0.56 * ratio) * dt;
      if (speed > car.maxSpeed) speed += (car.maxSpeed - speed) * Math.min(1, dt * 7);
    } else {
      speed -= speed * 0.55 * dt;
    }

    if (ctrl.throttle <= 0 && ctrl.brake <= 0) {
      speed -= speed * 0.22 * dt;
    }
    speed -= Math.abs(ctrl.steer) * Math.abs(speed) * 0.075 * dt;
    lateralSpeed *= Math.exp(-car.grip * dt);
    lateralSpeed += Math.sin(car.angle - car.angle) * 0;

    car.vx = fx * speed - fy * lateralSpeed;
    car.vy = fy * speed + fx * lateralSpeed;
    car.x += car.vx * dt;
    car.y += car.vy * dt;
    car.fwd = speed;
    car.throttle = ctrl.throttle;
    car.brake = ctrl.brake;
    car.steerInput = ctrl.steer;
  }

      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, t0);
      if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(24, slide), t0 + dur);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol || 0.06), t0 + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(gain);
      gain.connect(master || audio.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.04);
    } catch (e) {}
  }

      osc.type = 'sawtooth';
      sub.type = 'triangle';

      sub.frequency.value = 31;
      filter.type = 'lowpass';
      filter.frequency.value = 440;

      osc.connect(filter);
      sub.connect(filter);
      filter.connect(gain);

  }

    isTouchLikely = true;
    var p = pointerToScreen(e);
    p.id = e.pointerId;
    touchPointers.set(e.pointerId, p);
    refreshTouchState();
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  }
  function removeTouchPointer(e) {
    touchPointers.delete(e.pointerId);
    refreshTouchState();
  }

  canvas.addEventListener('pointerdown', function (e) {
    ensureAudio();
    if (canvas.focus) canvas.focus();
    e.preventDefault();
    if (phase === 'title') {
      if (e.pointerType === 'touch' || e.pointerType === 'pen') addTouchPointer(e);
      if (raceMode !== 'countdown') startRace();
      return;
    }
    if (phase === 'won' || phase === 'lost') {
      if (restartGuard <= 0) {
        if (e.pointerType === 'touch' || e.pointerType === 'pen') addTouchPointer(e);
        startRace();
      }
      return;
    }
    if (phase === 'playing' && (e.pointerType === 'touch' || e.pointerType === 'pen' || isTouchLikely)) {
      addTouchPointer(e);
    }
  }, { passive: false });
  canvas.addEventListener('pointermove', function (e) {
    if (!touchPointers.has(e.pointerId)) return;
    var p = pointerToScreen(e);
    p.id = e.pointerId;
    touchPointers.set(e.pointerId, p);
    refreshTouchState();
    e.preventDefault();
  }, { passive: false });
  canvas.addEventListener('pointerup', function (e) {
    if (touchPointers.has(e.pointerId)) {
      removeTouchPointer(e);
      e.preventDefault();
    }
  });
  canvas.addEventListener('pointercancel', function (e) {
    if (touchPointers.has(e.pointerId)) removeTouchPointer(e);
  });
  function clearInputs() {
    keys = Object.create(null);
    touchPointers.clear();
    refreshTouchState();
  }
  window.addEventListener('blur', clearInputs);
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) clearInputs();
  });

  function touchLayout() {
    var r = 42 * ui;
    var by = cssH - 66 * ui;
    return {
      radius: r,
      leftX: 58 * ui,
      rightX: cssW - 58 * ui,
      y: by,
      brakeW: 92 * ui,
      brakeH: 42 * ui,
      brakeTop: cssH - 92 * ui,
      brakeY: cssH - 46 * ui
    };
  }

  function playerControls() {
    var layout = touchLayout();
    var touchActive = isTouchLikely && touchState.active;
    var steer = 0;
    if (keys['arrowleft'] || keys['a'] || touchState.left) steer -= 1;
    if (keys['arrowright'] || keys['d'] || touchState.right) steer += 1;
    var brake = !!(keys['arrowdown'] || keys['s'] || touchState.brake);
    var boost = !!(keys['arrowup'] || keys['w']);
    var speed = player ? player.fwd : 0;
    var autoTarget = player ? player.maxSpeed * 0.845 : 350;
    var target = autoTarget;
    var throttle = 0;
    var mode = 'cruise';
    if (boost) {
      target = player.maxSpeed;
      mode = 'boost';
    } else if (touchActive && !touchState.brake) {
      target = player.maxSpeed * 0.965;
      mode = 'boost';
    }
    if (brake) {
      throttle = 0;
      mode = 'brake';
    } else {
      if (speed < target - 5) throttle = boost || (touchActive && !touchState.brake) ? 1 : 0.52;
      else if (speed < target + 12) throttle = 0.08;
      else throttle = 0;
    }
    return { steer: steer, throttle: throttle, brake: brake ? 1 : 0, mode: mode };
  }

  /* ---------------------------------------------------------------
   * 9. AI
   * --------------------------------------------------------------- */
  function blockedAhead(car) {
    var best = null, bestGap = Infinity;
    for (var i = 0; i < racers.length; i++) {
      var o = racers[i];
      if (o === car || o.finished) continue;
      var gap = (o.lap - car.lap) * TRACK_LENGTH + (o.s - car.s);
      if (gap > 0 && gap < 96) {
        var latGap = Math.abs(o.lateral - car.lateral);
        if (latGap < 43 && gap < bestGap) {
          bestGap = gap;
          best = o;
        }
      }
    }
    return best ? { car: best, gap: bestGap } : null;
  }

  function updateAI(car, dt) {
    if (car.finished) return;
    var speed = Math.max(0, car.fwd);
    var block = blockedAhead(car);
    var lookDist = 54 + speed * 0.22;
    var look = track.at(car.s + lookDist);
    var upcoming = track.at(car.s + 40 + speed * 0.16);
    var curve = Math.max(look.curve, upcoming.curve * 0.8);
    var cornerTarget = car.maxSpeed * (1 - clamp(curve * 0.40, 0, 0.46));
    cornerTarget = Math.max(166, cornerTarget);
    var targetSpeed = cornerTarget * clamp(car.skill, 0.82, 1.03);

    if (block) {
      var otherLane = block.car.lateral;
      var passLane = otherLane > 0 ? -44 : 44;
      if (car.lateral > otherLane + 20) passLane = 44;
      if (car.lateral < otherLane - 20) passLane = -44;
      car.laneTarget = clamp(passLane, -45, 45);
      if (block.gap < 54) targetSpeed = Math.min(targetSpeed, Math.max(140, block.car.fwd - 8));
    } else {
      var apex = clamp(look.turn * 32, -19, 19);
      car.laneTarget = clamp(car.bias + apex, -42, 42);
    }
    car.lane += (car.laneTarget - car.lane) * Math.min(1, dt * 2.15);
    var desired = track.at(car.s + lookDist);
    var tx = desired.x + desired.nx * car.lane;
    var ty = desired.y + desired.ny * car.lane;
    var want = Math.atan2(ty - car.y, tx - car.x);
    var err = angleDiff(want, car.angle);

    if (car.recover > 0) {
      car.recover -= dt;
      var recoverCtrl = {
        steer: -car.steer * 0.7,
        throttle: 0,
        brake: 1
      };
      car.steer += (recoverCtrl.steer - car.steer) * Math.min(1, dt * 8);
      stepCar(car, { steer: car.steer, throttle: 0, brake: 1 }, dt);
      return;
    }

    car.stuckTimer = (Math.abs(speed) < 36) ? car.stuckTimer + dt : 0;
    if (car.stuckTimer > 1.25) {
      car.recover = 0.72;
      car.stuckTimer = 0;
      return;
    }

    var steerTarget = clamp(err * 2.15, -1, 1);
    if (Math.abs(err) > 0.85) targetSpeed *= 0.84;
    var throttle = 0, brake = 0;
    if (speed < targetSpeed - 8) throttle = 1;
    else if (speed > targetSpeed + 22) brake = 0.95;
    else throttle = 0.16;
    if (block && block.gap < 34 && speed > targetSpeed + 30) brake = 1;
    car.steer += (steerTarget - car.steer) * Math.min(1, dt * 9);
    stepCar(car, { steer: car.steer, throttle: throttle, brake: brake }, dt);
    car.autoMode = brake ? 'brake' : (throttle > 0.7 ? 'boost' : 'cruise');
  }

  /* ---------------------------------------------------------------
   * 10. COLLISIONS + LAP LOGIC
   * --------------------------------------------------------------- */
  function spawnSparks(x, y, nx, ny, power) {
    var n = 5 + Math.round(clamp(power / 110, 0, 7));
    for (var i = 0; i < n; i++) {
      var a = Math.random() * TAU;
      var sp = 50 + Math.random() * (80 + power);
      particles.push({
        kind: 'spark',
        x: x,
        y: y,
        vx: Math.cos(a) * sp - nx * 40,
        vy: Math.sin(a) * sp - ny * 40,
        life: 0.22 + Math.random() * 0.35,
        max: 0.55,
        size: 1.4 + Math.random() * 2.4,
        color: Math.random() < 0.55 ? '#ffe8a3' : (Math.random() < 0.5 ? '#ff9a3d' : '#ff5a3c')
      });
    }
  }
  function spawnSmoke(x, y, tint, power) {
    particles.push({
      kind: 'smoke',
      x: x,
      y: y,
      vx: (Math.random() - 0.5) * 26,
      vy: (Math.random() - 0.5) * 26,
      life: 0.55 + Math.random() * 0.55,
      max: 1.1,
      size: 6 + Math.random() * 7 + (power || 0) * 0.02,
      color: tint || 'rgba(210,205,190,0.32)'
    });
  }

  function collideWall(car, dt) {
    if (car.wallCooldown > 0) car.wallCooldown = Math.max(0, car.wallCooldown - dt);
    var near = track.nearest(car.x, car.y, car.sampleIndex);
    car.sampleIndex = near.index;
    car.lateral = near.lateral;
    car.wallContact = false;
    var limit = ROAD_HALF - CAR_RADIUS;
    var over = Math.abs(near.lateral) - limit;
    if (over <= 0) return;

    var sample = track.samples[near.index];
    var sign = near.lateral > 0 ? 1 : -1;
    var nx = sample.nx * sign;
    var ny = sample.ny * sign;
    car.x -= nx * (over + 0.35);
    car.y -= ny * (over + 0.35);
    car.wallContact = true;

    var outV = car.vx * nx + car.vy * ny;
    if (outV > 0) {
      car.vx -= nx * outV * 1.16;
      car.vy -= ny * outV * 1.16;
      // Arcade wall-slide: turn the car along the barrier so it can get out
      // of the wall instead of wedging nose-first while throttle is held.
      var tangentAngle = Math.atan2(sample.ty, sample.tx);
      var heading = Math.abs(car.fwd) > 18 ? Math.atan2(car.vy, car.vx) : car.angle;
      if (Math.cos(heading - tangentAngle) < 0) tangentAngle += Math.PI;
      var align = clamp((outV / 150) * dt * 10, 0.05, 0.34);
      if (Math.abs(car.fwd) < 55 && car.throttle > 0.05) align = Math.max(align, 0.13);
      car.angle += angleDiff(tangentAngle, car.angle) * align;
      if (car.wallCooldown <= 0 && outV > 26) {
        var loss = WALL_RETAIN;
        car.vx *= loss;
        car.vy *= loss;
        car.wallCooldown = 0.28;
        var impact = outV;
        spawnSparks(car.x + nx * CAR_RADIUS, car.y + ny * CAR_RADIUS, nx, ny, impact);
        spawnSmoke(car.x - nx * 10, car.y - ny * 10, 'rgba(255,209,145,0.22)', 12);
        if (car.isPlayer) {
          shake = Math.max(shake, clamp(0.35 + impact / 620, 0.35, 1));
          impactFlash = Math.max(impactFlash, clamp(impact / 360, 0.2, 0.8));
          sfx.crash(impact);
        }
      }
    }
    var scrape = 1 - Math.min(0.18, 2.2 * dt);
    car.vx *= scrape;
    car.vy *= scrape;
  }

  function collideCars() {
    for (var i = 0; i < racers.length; i++) {
      for (var j = i + 1; j < racers.length; j++) {
        var a = racers[i], b = racers[j];
        if (a.finished || b.finished) continue;
        var dx = b.x - a.x, dy = b.y - a.y;
        var d2 = dx * dx + dy * dy;
        if (d2 > COLLIDE_DIST * COLLIDE_DIST || d2 < 0.0001) continue;
        var d = Math.sqrt(d2);
        var nx = dx / d, ny = dy / d;
        var overlap = COLLIDE_DIST - d;
        a.x -= nx * overlap * 0.52;
        a.y -= ny * overlap * 0.52;
        b.x += nx * overlap * 0.52;
        b.y += ny * overlap * 0.52;
        var rel = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
        if (rel < 0) {
          var imp = -(1.2 * rel) * 0.5;
          a.vx -= nx * imp;
          a.vy -= ny * imp;
          b.vx += nx * imp;
          b.vy += ny * imp;
        }
        a.vx *= 0.972;
        a.vy *= 0.972;
        b.vx *= 0.972;
        b.vy *= 0.972;
        if (Math.abs(rel) > 50 && a.bumpCooldown <= 0 && b.bumpCooldown <= 0) {
          a.bumpCooldown = 0.32;
          b.bumpCooldown = 0.32;
          spawnSparks((a.x + b.x) / 2, (a.y + b.y) / 2, nx, ny, Math.abs(rel));
          if (a.isPlayer || b.isPlayer) {
            shake = Math.max(shake, 0.26);
            sfx.bump();
          }
        }
      }
    }
  }

  function crossingDelta(prev, next) {
    var L = TRACK_LENGTH;
    if (prev > L * 0.72 && next < L * 0.28) return 1;
    if (prev < L * 0.28 && next > L * 0.72) return -1;
    return 0;
  }

  function onLapCross(car, forward) {
    if (!forward) {
      car.lap = Math.max(0, car.lap - 1);
      return;
    }
    car.lap += 1;
    var lapTime = raceElapsed - car.lapStart;
    car.lapStart = raceElapsed;
    if (lapTime > 0.8) {
      car.lastLap = lapTime;
      if (!car.bestLap || lapTime < car.bestLap) car.bestLap = lapTime;
    }
    if (car.isPlayer) {
      lastLap = lapTime;
      if (car.lap < LAPS) {
        var isFinal = car.lap >= LAPS - 1;
        lapNotice = {
          main: isFinal ? '最后一圈！' : '第 ' + (car.lap + 1) + ' 圈',
          sub: isFinal ? '把线走好，终点就在前面' : '保持节奏，继续追击',
          life: 1.75,
          max: 1.75,
          color: isFinal ? '#ffd36a' : '#f7efda'
        };
        sfx.lap();
      }
    }
    if (car.lap >= LAPS && !car.finished) {
      car.finished = true;
      car.finishTime = raceElapsed;
      car.finishPlace = finishOrder.length + 1;
      finishOrder.push(car);
      car.vx *= 0.25;
      car.vy *= 0.25;
    }
  }

  function updateTrackState(car) {
    var prevS = car.s;
    var near = track.nearest(car.x, car.y, car.sampleIndex);
    var sample = track.samples[near.index];
    car.sampleIndex = near.index;
    car.lateral = near.lateral;
    var forward = car.vx * sample.tx + car.vy * sample.ty;
    var cross = crossingDelta(prevS, near.s);
    car.s = near.s;
    car.fwd = forward;
    if (cross > 0 && forward > -5) onLapCross(car, true);
    else if (cross < 0 && forward < 5) onLapCross(car, false);
  }

  function updateStandings() {
    var order = racers.slice().sort(function (a, b) {
      if (a.finished && b.finished) return a.finishTime - b.finishTime;
      if (a.finished) return -1;
      if (b.finished) return 1;
      var ad = a.lap * TRACK_LENGTH + a.s;
      var bd = b.lap * TRACK_LENGTH + b.s;
      return bd - ad;
    });
    for (var i = 0; i < order.length; i++) {
      if (order[i].isPlayer) playerRank = i + 1;
    }
    return order;
  }

  /* ---------------------------------------------------------------
   * 11. EFFECTS + UPDATE LOOP
   * --------------------------------------------------------------- */
  function spawnConfetti() {
    var colors = ['#ffd36a', '#ff6b3d', '#5ed4ff', '#7ce0b0', '#fff6da', '#b77bff'];
    for (var i = 0; i < 100; i++) {
      screenConfetti.push({
        x: Math.random() * cssW,
        y: -20 - Math.random() * cssH * 0.35,
        vx: (Math.random() - 0.5) * 130,
        vy: 80 + Math.random() * 180,
        rot: Math.random() * TAU,
        vr: (Math.random() - 0.5) * 7,
        w: 4 + Math.random() * 7,
        h: 8 + Math.random() * 9,
        color: colors[Math.floor(Math.random() * colors.length)]
      });
    }
  }

  function addSkid(car, dt) {
    var speed = Math.abs(car.fwd);
    var slip = Math.abs(car.steerInput || 0);
    var sliding = speed > 175 && (slip > 0.5 || car.wallContact);
    if (!sliding) {
      car.skidL = null;
      car.skidR = null;
      car.skidClock = 0;
      return;
    }
    car.skidClock -= dt;
    if (car.skidClock > 0) return;
    car.skidClock = 0.045;
    var fx = Math.cos(car.angle), fy = Math.sin(car.angle);
    var rx = -fy, ry = fx;
    var back = -17;
    var lx = car.x + fx * back + rx * 12;
    var ly = car.y + fy * back + ry * 12;
    var rxp = car.x + fx * back - rx * 12;
    var ryp = car.y + fy * back - ry * 12;
    if (car.skidL) {
      skids.push({ x1: car.skidL.x, y1: car.skidL.y, x2: lx, y2: ly, life: 3.6, max: 3.6, w: 3.6 });
      skids.push({ x1: car.skidR.x, y1: car.skidR.y, x2: rxp, y2: ryp, life: 3.6, max: 3.6, w: 3.6 });
    }
    car.skidL = { x: lx, y: ly };
    car.skidR = { x: rxp, y: ryp };
    if (skids.length > 340) skids.splice(0, skids.length - 340);
    if (Math.random() < 0.32) {
      spawnSmoke(lx, ly, 'rgba(205,201,188,0.28)', 1);
      spawnSmoke(rxp, ryp, 'rgba(205,201,188,0.24)', 1);
    }
  }

  function updateCountdown(dt) {
    countdown -= dt;
    var stage = Math.ceil(countdown);
    if (stage > 0 && stage !== countdownStage) {
      countdownStage = stage;
      sfx.beep(false);
    }
    if (countdown <= 0) {
      countdown = 0;
      countdownStage = 0;
      raceMode = 'racing';
      goFlash = 0.9;
      for (var i = 0; i < racers.length; i++) racers[i].lapStart = 0;
      sfx.go();
      return;
    }
    if (Math.random() < dt * 9) {
      for (var c = 0; c < racers.length; c++) {
        var car = racers[c];
        var fx = Math.cos(car.angle), fy = Math.sin(car.angle);
        spawnSmoke(car.x - fx * 26, car.y - fy * 26, 'rgba(205,203,194,0.16)', 1);
      }
    }
  }

  function updateRace(dt) {
    raceElapsed += dt;
    if (goFlash > 0) goFlash = Math.max(0, goFlash - dt);

    var pctrl = playerControls();
    player.autoMode = pctrl.mode;
    var steerTarget = clamp(pctrl.steer, -1, 1);
    player.steer += (steerTarget - player.steer) * Math.min(1, dt * 10);
    stepCar(player, { steer: player.steer, throttle: pctrl.throttle, brake: pctrl.brake }, dt);

    for (var i = 0; i < aiCars.length; i++) updateAI(aiCars[i], dt);

    collideCars();
    for (i = 0; i < racers.length; i++) {
      if (racers[i].bumpCooldown > 0) racers[i].bumpCooldown -= dt;
      collideWall(racers[i], dt);
    }
    for (i = 0; i < racers.length; i++) updateTrackState(racers[i]);

    for (i = 0; i < racers.length; i++) addSkid(racers[i], dt);

    updateStandings();

    if (finishOrder.length > 0) {
      endRace(finishOrder[0]);
      return;
    }

    var ratio = clamp(Math.abs(player.fwd) / player.maxSpeed, 0, 1);
    updateEngine(ratio);
  }

  function updateScreenConfetti(dt) {
    for (var i = screenConfetti.length - 1; i >= 0; i--) {
      var c = screenConfetti[i];
      c.x += c.vx * dt;
      c.y += c.vy * dt;
      c.vy += 38 * dt;
      c.rot += c.vr * dt;
      if (c.y > cssH + 40) screenConfetti.splice(i, 1);
    }
  }

  function updateParticles(dt) {
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.life -= dt;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      var drag = p.kind === 'spark' ? 3.2 : 1.3;
      p.vx *= Math.exp(-drag * dt);
      p.vy *= Math.exp(-drag * dt);
      if (p.kind === 'smoke') p.size += 15 * dt;
    }
  }

  function updateSkids(dt) {
    for (var i = skids.length - 1; i >= 0; i--) {
      skids[i].life -= dt;
      if (skids[i].life <= 0) skids.splice(i, 1);
    }
  }

  function initMotes() {
    motes = [];
    var rnd = seeded(7312);
    for (var i = 0; i < 34; i++) {
      motes.push({
        x: rnd() * WORLD.w,
        y: rnd() * WORLD.h,
        r: 0.8 + rnd() * 1.8,
        a: 0.1 + rnd() * 0.3,
        speed: 2 + rnd() * 7,
        phase: rnd() * TAU
      });
    }
  }
  function updateMotes(dt) {
    for (var i = 0; i < motes.length; i++) {
      var m = motes[i];
      m.x += Math.cos(timeGlobal * 0.3 + m.phase) * m.speed * dt;
      m.y -= m.speed * 0.5 * dt;
      if (m.y < -10) { m.y = WORLD.h + 10; m.x = Math.random() * WORLD.w; }
      if (m.x < -10) m.x = WORLD.w + 10;
      if (m.x > WORLD.w + 10) m.x = -10;
    }
  }

  function update(dt) {
    timeGlobal += dt;
    if (restartGuard > 0) restartGuard = Math.max(0, restartGuard - dt);
    if (shake > 0) shake = Math.max(0, shake - dt * 2.7);
    if (impactFlash > 0) impactFlash = Math.max(0, impactFlash - dt * 2.2);
    if (lapNotice) {
      lapNotice.life -= dt;
      if (lapNotice.life <= 0) lapNotice = null;
    }
    updateMotes(dt);
    updateParticles(dt);
    updateSkids(dt);
    updateScreenConfetti(dt);

    if (phase === 'title') return;

    if (phase === 'won' || phase === 'lost') {
      endTimer += dt;
      if (raceMode === 'finished' && winner) updateEngine(0);
      return;
    }

    if (phase === 'playing') {
      if (raceMode === 'countdown') {
        updateCountdown(dt);
        updateEngine(0.16 + Math.sin(timeGlobal * 14) * 0.025);
        return;
      }
      if (raceMode === 'racing') updateRace(dt);
    }
  }

  /* ---------------------------------------------------------------
   * 12. DRAW — STATIC WORLD
   * --------------------------------------------------------------- */
  var sceneCanvas = null;

  function traceOffset(g, offset, close) {
    var n = track.samples.length;
    g.beginPath();
    for (var i = 0; i < n; i++) {
      var p = track.samples[i];
      var x = p.x + p.nx * offset;
      var y = p.y + p.ny * offset;
      if (i === 0) g.moveTo(x, y);
      else g.lineTo(x, y);
    }
    if (close !== false) g.closePath();
  }

  function makeGrainPattern(g, seed) {
    var c = document.createElement('canvas');
    c.width = 128;
    c.height = 128;
    var t = c.getContext('2d');
    var rnd = seeded(seed);
    for (var i = 0; i < 1200; i++) {
      var v = 150 + Math.floor(rnd() * 80);
      t.fillStyle = 'rgba(' + v + ',' + v + ',' + v + ',' + (0.02 + rnd() * 0.06) + ')';
      t.fillRect(rnd() * 128, rnd() * 128, 1 + rnd() * 2, 1 + rnd() * 2);
    }
    for (i = 0; i < 80; i++) {
      t.strokeStyle = 'rgba(230,235,230,' + (0.015 + rnd() * 0.03) + ')';
      t.lineWidth = 0.7;
      t.beginPath();
      var x = rnd() * 128, y = rnd() * 128;
      t.moveTo(x, y);
      t.lineTo(x + rnd() * 12 - 6, y + rnd() * 12 - 6);
      t.stroke();
    }
    return g.createPattern(c, 'repeat');
  }

  function drawTerrain(g) {
    var bg = g.createLinearGradient(0, 0, WORLD.w, WORLD.h);
    bg.addColorStop(0, '#204b3d');
    bg.addColorStop(0.48, '#173e35');
    bg.addColorStop(1, '#0e2c2b');
    g.fillStyle = bg;
    g.fillRect(0, 0, WORLD.w, WORLD.h);

    var sun = g.createRadialGradient(WORLD.w * 0.88, 60, 10, WORLD.w * 0.88, 120, 760);
    sun.addColorStop(0, 'rgba(255,199,120,0.22)');
    sun.addColorStop(0.35, 'rgba(255,183,108,0.08)');
    sun.addColorStop(1, 'rgba(255,180,100,0)');
    g.fillStyle = sun;
    g.fillRect(0, 0, WORLD.w, WORLD.h);

    var rnd = seeded(992011);
    for (var i = 0; i < 20; i++) {
      var x = rnd() * WORLD.w;
      var y = rnd() * WORLD.h;
      var r = 52 + rnd() * 130;
      var tone = rnd() < 0.5 ? '38,88,66' : '14,58,55';
      var grad = g.createRadialGradient(x, y, 0, x, y, r);
      grad.addColorStop(0, 'rgba(' + tone + ',0.29)');
      grad.addColorStop(1, 'rgba(' + tone + ',0)');
      g.fillStyle = grad;
      g.beginPath();
      g.arc(x, y, r, 0, TAU);
      g.fill();
    }

    g.save();
    g.globalAlpha = 0.035;
    g.fillStyle = '#f6d491';
    for (i = -8; i < 14; i++) {
      var xx = i * 86;
      g.beginPath();
      g.moveTo(xx, 0);
      g.lineTo(xx + 38, 0);
      g.lineTo(xx + 300, WORLD.h);
      g.lineTo(xx + 262, WORLD.h);
      g.closePath();
      g.fill();
    }
    g.restore();

    for (i = 0; i < 440; i++) {
      x = rnd() * WORLD.w;
      y = rnd() * WORLD.h;
      if (!clearOfTrack(x, y, 18)) continue;
      var h = 2 + rnd() * 5;
      g.strokeStyle = rnd() < 0.45 ? 'rgba(81,137,102,0.34)' : 'rgba(33,85,69,0.4)';
      g.lineWidth = 1 + rnd();
      g.beginPath();
      g.moveTo(x, y);
      g.quadraticCurveTo(x + (rnd() - 0.5) * 5, y - h * 0.5, x + (rnd() - 0.5) * 8, y - h);
      g.stroke();
    }
    for (i = 0; i < 80; i++) {
      x = rnd() * WORLD.w;
      y = rnd() * WORLD.h;
      if (!clearOfTrack(x, y, 20)) continue;
      if (rnd() < 0.25) {
        g.fillStyle = rnd() < 0.5 ? 'rgba(255,213,132,0.6)' : 'rgba(255,173,147,0.6)';
        g.beginPath();
        g.arc(x, y, 1 + rnd() * 1.6, 0, TAU);
        g.fill();
      } else {
        g.fillStyle = 'rgba(150,163,124,0.23)';
        g.beginPath();
        g.ellipse(x, y, 2 + rnd() * 4, 1 + rnd() * 2, rnd() * 3, 0, TAU);
        g.fill();
      }
    }

    // soft sandy shore patches around the outside of the circuit
    var patches = [
      { x: 96, y: 260, rx: 76, ry: 55 },
      { x: 664, y: 1120, rx: 70, ry: 52 },
      { x: 78, y: 1010, rx: 44, ry: 108 },
      { x: 350, y: 1210, rx: 210, ry: 36 }
    ];
    for (i = 0; i < patches.length; i++) {
      var pt = patches[i];
      if (distanceToTrack(pt.x, pt.y) < ROAD_HALF + 20) continue;
      var sg = g.createRadialGradient(pt.x, pt.y, 4, pt.x, pt.y, Math.max(pt.rx, pt.ry));
      sg.addColorStop(0, 'rgba(200,177,122,0.34)');
      sg.addColorStop(0.65, 'rgba(182,159,108,0.18)');
      sg.addColorStop(1, 'rgba(182,159,108,0)');
      g.fillStyle = sg;
      g.beginPath();
      g.ellipse(pt.x, pt.y, pt.rx, pt.ry, 0, 0, TAU);
      g.fill();
    }
  }

  function drawTrack(g) {
    g.save();
    g.lineJoin = 'round';
    g.lineCap = 'round';

    g.save();
    g.translate(4, 10);
    traceOffset(g, 0, true);
    g.strokeStyle = 'rgba(4,16,14,0.34)';
    g.lineWidth = ROAD_HALF * 2 + 54;
    g.stroke();
    g.restore();

    traceOffset(g, 0, true);
    g.strokeStyle = '#6d6752';
    g.lineWidth = ROAD_HALF * 2 + 44;
    g.stroke();

    traceOffset(g, 0, true);
    g.strokeStyle = '#2b3035';
    g.lineWidth = ROAD_HALF * 2;
    g.stroke();

    var asphaltGrad = g.createLinearGradient(0, 180, 0, 1160);
    asphaltGrad.addColorStop(0, '#3a4047');
    asphaltGrad.addColorStop(0.45, '#30363c');
    asphaltGrad.addColorStop(1, '#252a30');
    traceOffset(g, 0, true);
    g.strokeStyle = asphaltGrad;
    g.lineWidth = ROAD_HALF * 2 - 4;
    g.stroke();

    traceOffset(g, 0, true);
    g.strokeStyle = makeGrainPattern(g, 41);
    g.globalAlpha = 0.52;
    g.lineWidth = ROAD_HALF * 2 - 9;
    g.stroke();
    g.globalAlpha = 1;

    // darker rubbered-in racing line
    traceOffset(g, 0, true);
    g.strokeStyle = 'rgba(10,13,15,0.11)';
    g.lineWidth = 30;
    g.stroke();

    for (var side = -1; side <= 1; side += 2) {
      traceOffset(g, side * (ROAD_HALF - 11), true);
      g.strokeStyle = 'rgba(248,241,223,0.88)';
      g.lineWidth = 3.2;
      g.stroke();

      traceOffset(g, side * (ROAD_HALF - 3), true);
      g.strokeStyle = '#f2e7ce';
      g.lineWidth = 12;
      g.stroke();
      g.strokeStyle = '#e2553b';
      g.lineWidth = 10;
      g.setLineDash([17, 17]);
      g.stroke();
      g.setLineDash([]);

      traceOffset(g, side * (ROAD_HALF + 4), true);
      g.strokeStyle = 'rgba(9,17,18,0.92)';
      g.lineWidth = 8;
      g.stroke();
      g.strokeStyle = 'rgba(250,234,196,0.22)';
      g.lineWidth = 1.5;
      g.stroke();

      for (var i = 10; i < track.count; i += 22) {
        var p = track.samples[i];
        var bx = p.x + p.nx * side * (ROAD_HALF + 12);
        var by = p.y + p.ny * side * (ROAD_HALF + 12);
        g.save();
        g.translate(bx, by);
        g.rotate(p.angle);
        g.fillStyle = 'rgba(220,207,173,0.58)';
        g.fillRect(-3.5, -2, 7, 4);
        g.fillStyle = 'rgba(31,32,28,0.7)';
        g.fillRect(-3.5, -2, 4, 2);
        g.restore();
      }
    }

    // tire stacks on the outside of the bigger corners
    for (var j = 0; j < track.count; j += 10) {
      var sp = track.samples[j];
      if (Math.abs(sp.localTurn) < 0.22) continue;
      var outside = sp.localTurn > 0 ? -1 : 1;
      var tx = sp.x + sp.nx * outside * (ROAD_HALF + 17);
      var ty = sp.y + sp.ny * outside * (ROAD_HALF + 17);
      g.save();
      g.translate(tx, ty);
      g.rotate(sp.angle);
      g.fillStyle = 'rgba(4,14,13,0.28)';
      g.beginPath();
      g.ellipse(2, 4, 8, 5, 0, 0, TAU);
      g.fill();
      g.fillStyle = '#1a1d1d';
      g.beginPath();
      g.arc(0, 0, 6.5, 0, TAU);
      g.fill();
      g.fillStyle = '#343736';
      g.beginPath();
      g.arc(0, 0, 4.1, 0, TAU);
      g.fill();
      g.fillStyle = sp.localTurn > 0 ? '#e4553b' : '#f1e3c6';
      g.beginPath();
      g.arc(-1.1, -1.2, 1.8, 0, TAU);
      g.fill();
      g.restore();
    }

    // rubber marks in the tight corners
    g.save();
    for (var q = 0; q < track.count; q += 8) {
      var sq = track.samples[q];
      if (Math.abs(sq.localTurn) < 0.17) continue;
      for (var lane = -1; lane <= 1; lane++) {
        var off = lane * 15 + Math.sin(q * 0.19) * 4;
        var mx = sq.x + sq.nx * off;
        var my = sq.y + sq.ny * off;
        g.fillStyle = 'rgba(9,11,12,0.075)';
        g.beginPath();
        g.ellipse(mx, my, 17, 2.5, sq.angle, 0, TAU);
        g.fill();
      }
    }
    g.restore();

    drawStartArea(g);
    drawRoadArrows(g);
    drawRoadLettering(g);
    g.restore();
  }

  function drawStartArea(g) {
    var p = track.at(0);
    g.save();
    g.translate(p.x, p.y);
    g.rotate(p.angle);

    // pit wall / painted start strip
    g.fillStyle = 'rgba(248,240,218,0.28)';
    g.fillRect(-23, -ROAD_HALF - 4, 46, ROAD_HALF * 2 + 8);
    var cols = 18;
    var cw = (ROAD_HALF * 2) / cols;
    for (var row = 0; row < 3; row++) {
      for (var c = 0; c < cols; c++) {
        g.fillStyle = (row + c) % 2 === 0 ? '#f7f0dd' : '#151b1e';
        g.fillRect(-19 + row * 13, -ROAD_HALF + c * cw, 13, cw + 0.4);
      }
    }
    g.strokeStyle = 'rgba(255,215,132,0.65)';
    g.lineWidth = 1.5;
    g.strokeRect(-20, -ROAD_HALF, 40, ROAD_HALF * 2);
    g.restore();

    // starting grid boxes
    var grid = [
      { s: 30, lane: 35 },
      { s: 58, lane: -35 },
      { s: 88, lane: 35 },
      { s: 118, lane: -35 }
    ];
    for (var i = 0; i < grid.length; i++) {
      var gs = track.at(grid[i].s);
      var lx = gs.x + gs.nx * grid[i].lane;
      var ly = gs.y + gs.ny * grid[i].lane;
      g.save();
      g.translate(lx, ly);
      g.rotate(gs.angle);
      g.strokeStyle = 'rgba(255,244,216,0.34)';
      g.lineWidth = 2;
      g.beginPath();
      g.moveTo(-23, -22);
      g.lineTo(-23, 22);
      g.lineTo(19, 22);
      g.stroke();
      g.restore();
    }

    // start gantry posts + bunting
    g.save();
    g.lineCap = 'round';
    g.strokeStyle = 'rgba(46,38,30,0.45)';
    g.lineWidth = 7;
    g.beginPath();
    g.moveTo(START_LEFT.x + 3, START_LEFT.y + 6);
    g.lineTo(START_RIGHT.x + 3, START_RIGHT.y + 6);
    g.stroke();
    g.strokeStyle = '#f4e3bb';
    g.lineWidth = 2.2;
    g.beginPath();
    g.moveTo(START_LEFT.x, START_LEFT.y);
    g.lineTo(START_RIGHT.x, START_RIGHT.y);
    g.stroke();
    for (var f = 0.08; f < 1; f += 0.11) {
      var fx = lerp(START_LEFT.x, START_RIGHT.x, f);
      var fy = lerp(START_LEFT.y, START_RIGHT.y, f);
      g.fillStyle = f % 0.2 < 0.1 ? '#ff6b3d' : '#f6e6c4';
      g.beginPath();
      g.moveTo(fx, fy);
      g.lineTo(fx - 4, fy + 12);
      g.lineTo(fx + 5, fy + 11);
      g.closePath();
      g.fill();
    }
    g.restore();

    for (var k = 0; k < 2; k++) {
      var sx = k === 0 ? START_LEFT.x : START_RIGHT.x;
      var sy = k === 0 ? START_LEFT.y : START_RIGHT.y;
      g.save();
      g.translate(sx, sy);
      g.rotate(p.angle);
      g.fillStyle = 'rgba(3,12,12,0.32)';
      g.beginPath();
      g.ellipse(4, 8, 18, 9, 0, 0, TAU);
      g.fill();
      g.fillStyle = '#2b3032';
      g.beginPath();
      g.arc(0, 0, 12, 0, TAU);
      g.fill();
      g.fillStyle = '#ffcf6a';
      g.beginPath();
      g.arc(0, 0, 3.2, 0, TAU);
      g.fill();
      g.restore();
    }

    // light tower signs next to the line
    drawSideSign(g, p.x - p.nx * (ROAD_HALF + 36) - p.tx * 40,
      p.y - p.ny * (ROAD_HALF + 36) - p.ty * 40, p.angle + 0.22, 'SUNSET', 'BAY GP', '#ffd36a');
    drawSideSign(g, p.x + p.nx * (ROAD_HALF + 36) + p.tx * 38,
      p.y + p.ny * (ROAD_HALF + 36) + p.ty * 38, p.angle + Math.PI + 0.12, '3', 'LAPS', '#5ed4ff');
  }

  function drawSideSign(g, x, y, angle, l1, l2, color) {
    if (x < 20 || x > WORLD.w - 20 || y < 20 || y > WORLD.h - 20) return;
    g.save();
    g.translate(x, y);
    g.rotate(angle);
    g.fillStyle = 'rgba(3,12,12,0.28)';
    g.fillRect(-31, -15, 66, 32);
    g.fillStyle = '#182323';
    g.fillRect(-32, -17, 64, 30);
    g.strokeStyle = 'rgba(255,235,190,0.42)';
    g.lineWidth = 1.5;
    g.strokeRect(-32, -17, 64, 30);
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillStyle = color;
    g.font = '800 12px ' + UI_FONT;
    g.fillText(l1, 0, -6);
    g.fillStyle = 'rgba(247,239,218,0.8)';
    g.font = '700 8px ' + UI_FONT;
    g.fillText(l2, 0, 8);
    g.fillStyle = '#3b423f';
    g.fillRect(-25, 13, 4, 18);
    g.fillRect(21, 13, 4, 18);
    g.restore();
  }

  function drawRoadArrows(g) {
    var spots = [250, 700, 1350, 1900, 2350, 2820];
    for (var i = 0; i < spots.length; i++) {
      var s = mod(spots[i], TRACK_LENGTH);
      var p = track.at(s);
      if (Math.abs(p.curve) > 0.34) continue;
      g.save();
      g.translate(p.x, p.y);
      g.rotate(p.angle);
      g.globalAlpha = 0.20;
      g.fillStyle = '#fff7df';
      for (var k = 0; k < 2; k++) {
        g.beginPath();
        g.moveTo(-46 + k * 18, -20);
        g.lineTo(-17 + k * 18, 0);
        g.lineTo(-46 + k * 18, 20);
        g.lineTo(-33 + k * 18, 0);
        g.closePath();
        g.fill();
      }
      g.restore();
    }
  }

  function drawRoadLettering(g) {
    var p = track.at(TRACK_LENGTH * 0.41);
    g.save();
    g.translate(p.x, p.y);
    g.rotate(p.angle);
    g.globalAlpha = 0.13;
    g.fillStyle = '#f8f1de';
    g.font = '800 36px ' + NUM_FONT;
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText('SUNSET BAY', 0, 0);
    g.restore();
  }

  function drawLagoon(g) {
    var cx = 396, cy = 617;
    function pondPath(scale) {
      g.beginPath();
      g.moveTo(cx - 118 * scale, cy - 7 * scale);
      g.bezierCurveTo(cx - 118 * scale, cy - 74 * scale, cx - 70 * scale, cy - 117 * scale, cx + 2 * scale, cy - 113 * scale);
      g.bezierCurveTo(cx + 78 * scale, cy - 109 * scale, cx + 123 * scale, cy - 66 * scale, cx + 121 * scale, cy + 8 * scale);
      g.bezierCurveTo(cx + 119 * scale, cy + 82 * scale, cx + 67 * scale, cy + 119 * scale, cx - 3 * scale, cy + 112 * scale);
      g.bezierCurveTo(cx - 72 * scale, cy + 107 * scale, cx - 118 * scale, cy + 67 * scale, cx - 118 * scale, cy - 7 * scale);
      g.closePath();
    }

    g.save();
    g.fillStyle = 'rgba(3,16,14,0.24)';
    g.beginPath();
    g.ellipse(cx + 8, cy + 10, 143, 126, 0.06, 0, TAU);
    g.fill();
    pondPath(1.11);
    g.fillStyle = '#c6ad74';
    g.fill();
    pondPath(1.04);
    g.fillStyle = '#a9915f';
    g.fill();
    pondPath(1.0);
    var water = g.createLinearGradient(cx - 100, cy - 100, cx + 100, cy + 100);
    water.addColorStop(0, '#247d83');
    water.addColorStop(0.38, '#1e6874');
    water.addColorStop(1, '#14505f');
    g.fillStyle = water;
    g.fill();
    g.strokeStyle = 'rgba(141,225,217,0.36)';
    g.lineWidth = 2;
    g.stroke();

    g.globalAlpha = 0.28;
    for (var i = 0; i < 9; i++) {
      var wy = cy - 75 + i * 18;
      g.strokeStyle = 'rgba(207,247,237,0.6)';
      g.lineWidth = 1.2;
      g.beginPath();
      g.moveTo(cx - 80 + (i % 3) * 24, wy);
      g.quadraticCurveTo(cx - 40 + (i % 2) * 12, wy - 4, cx + 14 + (i % 4) * 14, wy + 1);
      g.stroke();
    }
    g.globalAlpha = 1;

    // little dock
    g.save();
    g.translate(cx + 76, cy + 47);
    g.rotate(-0.15);
    g.fillStyle = 'rgba(20,22,18,0.22)';
    g.fillRect(-4, 6, 74, 16);
    g.fillStyle = '#775a3b';
    g.fillRect(0, 0, 64, 12);
    for (var d = 0; d < 7; d++) {
      g.strokeStyle = 'rgba(34,28,22,0.5)';
      g.lineWidth = 1;
      g.beginPath();
      g.moveTo(4 + d * 9, 0);
      g.lineTo(4 + d * 9, 12);
      g.stroke();
    }
    g.fillStyle = '#edf1e4';
    g.beginPath();
    g.moveTo(29, -1);
    g.lineTo(29, -23);
    g.lineTo(47, -12);
    g.closePath();
    g.fill();
    g.fillStyle = '#cc5639';
    g.beginPath();
    g.moveTo(29, -12);
    g.lineTo(29, -23);
    g.lineTo(39, -17);
    g.closePath();
    g.fill();
    g.fillStyle = '#2b2822';
    g.fillRect(25, -1, 12, 3);
    g.restore();

    // buoys
    for (var b = 0; b < 3; b++) {
      var bx = cx - 86 + b * 53;
      var by = cy + 74 + (b % 2) * 15;
      g.fillStyle = 'rgba(6,20,22,0.3)';
      g.beginPath();
      g.ellipse(bx + 2, by + 2, 5, 3, 0, 0, TAU);
      g.fill();
      g.fillStyle = b === 1 ? '#ffd36a' : '#f4ecdc';
      g.beginPath();
      g.arc(bx, by, 3.2, 0, TAU);
      g.fill();
    }
    g.restore();
  }

  function drawPalm(g, x, y, scale, angle, tone) {
    g.save();
    g.translate(x, y);
    g.rotate(angle || 0);
    g.fillStyle = 'rgba(4,18,14,0.27)';
    g.beginPath();
    g.ellipse(18 * scale, 26 * scale, 46 * scale, 17 * scale, 0.35, 0, TAU);
    g.fill();
    g.fillStyle = '#75563b';
    g.beginPath();
    g.arc(0, 0, 5.5 * scale, 0, TAU);
    g.fill();
    var fronds = 7;
    for (var i = 0; i < fronds; i++) {
      var a = (i / fronds) * TAU + (tone || 0) * 0.4;
      var len = (38 + ((i * 17) % 17)) * scale;
      var midX = Math.cos(a - 0.18) * len * 0.55;
      var midY = Math.sin(a - 0.18) * len * 0.55;
      var ex = Math.cos(a) * len;
      var ey = Math.sin(a) * len;
      g.strokeStyle = 'rgba(7,28,20,0.24)';
      g.lineWidth = 12 * scale;
      g.lineCap = 'round';
      g.beginPath();
      g.moveTo(0, 3 * scale);
      g.quadraticCurveTo(midX + 4 * scale, midY + 5 * scale, ex + 6 * scale, ey + 7 * scale);
      g.stroke();
      g.strokeStyle = i % 2 ? '#2a6b49' : '#337b51';
      g.lineWidth = 8 * scale;
      g.beginPath();
      g.moveTo(0, 0);
      g.quadraticCurveTo(midX, midY, ex, ey);
      g.stroke();
      g.strokeStyle = 'rgba(149,191,108,0.32)';
      g.lineWidth = 2.5 * scale;
      g.beginPath();
      g.moveTo(0, 0);
      g.quadraticCurveTo(midX, midY - 2 * scale, ex, ey);
      g.stroke();
    }
    g.fillStyle = '#5d452e';
    g.beginPath();
    g.arc(0, 0, 5 * scale, 0, TAU);
    g.fill();
    g.fillStyle = '#8c6a43';
    g.beginPath();
    g.arc(-1.5 * scale, -1.5 * scale, 2.3 * scale, 0, TAU);
    g.fill();
    g.restore();
  }

  function drawBush(g, x, y, s, tint) {
    g.save();
    g.translate(x, y);
    g.fillStyle = 'rgba(4,18,14,0.22)';
    g.beginPath();
    g.ellipse(8 * s, 10 * s, 28 * s, 12 * s, 0.2, 0, TAU);
    g.fill();
    var cols = tint ? ['#2c6447', '#397b55', '#528f5d'] : ['#275c43', '#35704d', '#4b8354'];
    for (var i = 0; i < 7; i++) {
      var a = i * 2.1;
      var r = (i % 3) * 5 * s;
      g.fillStyle = cols[i % 3];
      g.beginPath();
      g.arc(Math.cos(a) * r, Math.sin(a) * r, (7 + (i % 4) * 2) * s, 0, TAU);
      g.fill();
    }
    g.restore();
  }

  function drawRock(g, x, y, s) {
    g.save();
    g.translate(x, y);
    g.fillStyle = 'rgba(3,15,14,0.22)';
    g.beginPath();
    g.ellipse(5 * s, 6 * s, 16 * s, 8 * s, 0.25, 0, TAU);
    g.fill();
    g.fillStyle = '#6f766c';
    g.beginPath();
    g.ellipse(0, 0, 11 * s, 7 * s, -0.3, 0, TAU);
    g.fill();
    g.fillStyle = '#9a9e8e';
    g.beginPath();
    g.ellipse(-2 * s, -2 * s, 6 * s, 3.2 * s, -0.3, 0, TAU);
    g.fill();
    g.restore();
  }

  function drawUmbrella(g, x, y, s, color) {
    g.save();
    g.translate(x, y);
    g.fillStyle = 'rgba(4,18,14,0.25)';
    g.beginPath();
    g.ellipse(10 * s, 12 * s, 25 * s, 9 * s, 0.3, 0, TAU);
    g.fill();
    g.fillStyle = color;
    g.beginPath();
    g.arc(0, 0, 18 * s, 0, TAU);
    g.fill();
    g.fillStyle = 'rgba(255,249,225,0.72)';
    for (var i = 0; i < 6; i++) {
      var a = i / 6 * TAU;
      g.beginPath();
      g.moveTo(0, 0);
      g.arc(0, 0, 17 * s, a, a + 0.24);
      g.closePath();
      g.fill();
    }
    g.fillStyle = '#725a3c';
    g.beginPath();
    g.arc(0, 0, 2.5 * s, 0, TAU);
    g.fill();
    g.restore();
  }

  function drawGrandstand(g) {
    var x = 350, y = 882, w = 230, h = 78, angle = -0.055;
    g.save();
    g.translate(x, y);
    g.rotate(angle);
    g.fillStyle = 'rgba(3,14,13,0.28)';
    g.fillRect(-w / 2 + 8, -h / 2 + 11, w, h);
    g.fillStyle = '#394547';
    g.fillRect(-w / 2, -h / 2, w, h);
    g.strokeStyle = 'rgba(240,228,199,0.35)';
    g.lineWidth = 2;
    g.strokeRect(-w / 2, -h / 2, w, h);
    for (var row = 0; row < 5; row++) {
      var ry = -h / 2 + 10 + row * 13;
      g.fillStyle = row % 2 ? '#2c373a' : '#313d3f';
      g.fillRect(-w / 2 + 8, ry, w - 16, 10);
      for (var s = 0; s < 21; s++) {
        var colors = ['#ffd36a', '#ff6b3d', '#5ed4ff', '#f7efda', '#7ce0b0'];
        g.fillStyle = colors[(s + row * 2) % colors.length];
        g.globalAlpha = 0.62 + ((s * 7 + row) % 4) * 0.08;
        g.beginPath();
        g.arc(-w / 2 + 16 + s * 9.6, ry + 4, 1.8, 0, TAU);
        g.fill();
      }
    }
    g.globalAlpha = 1;
    g.fillStyle = 'rgba(247,239,218,0.7)';
    g.font = '700 8px ' + UI_FONT;
    g.textAlign = 'center';
    g.fillText('SUNSET BAY GRAND STAND', 0, -h / 2 - 6);
    g.fillStyle = '#202a2b';
    g.fillRect(-w / 2 - 5, -h / 2, 5, h);
    g.fillRect(w / 2, -h / 2, 5, h);
    g.restore();
  }

  function drawInfield(g) {
    drawLagoon(g);

    // billboard above the lagoon
    g.save();
    g.translate(374, 432);
    g.fillStyle = 'rgba(3,14,13,0.25)';
    g.fillRect(-78, -18, 165, 43);
    g.fillStyle = '#202b2b';
    g.fillRect(-80, -24, 160, 37);
    g.strokeStyle = 'rgba(255,209,139,0.48)';
    g.lineWidth = 1.4;
    g.strokeRect(-80, -24, 160, 37);
    g.fillStyle = '#ffd36a';
    g.font = '800 15px ' + UI_FONT;
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText('SUNSET BAY  ·  APEX RUSH', 0, -5.5);
    g.fillStyle = 'rgba(247,239,218,0.55)';
    g.font = '600 7px ' + UI_FONT;
    g.fillText('3 LAPS   /   4 CARS   /   NO MERCY', 0, 6);
    g.fillStyle = '#555d55';
    g.fillRect(-55, 13, 4, 16);
    g.fillRect(51, 13, 4, 16);
    g.restore();

    drawGrandstand(g);

    // palm clusters in the infield
    var infieldPalms = [
      { x: 240, y: 440, s: 0.82, a: 0.4 },

      { x: 562, y: 780, s: 0.9, a: 0.2 },
      { x: 250, y: 770, s: 0.72, a: 2.2 },
      { x: 494, y: 970, s: 0.62, a: 1.0 },
      { x: 220, y: 960, s: 0.8, a: 2.5 }
    ];
    for (var i = 0; i < infieldPalms.length; i++) {
      var p = infieldPalms[i];
      if (clearOfTrack(p.x, p.y, 34)) drawPalm(g, p.x, p.y, p.s, p.a, i);
    }
    drawBush(g, 306, 380, 0.85, true);
    drawBush(g, 510, 540, 0.8, false);
    drawBush(g, 280, 730, 0.7, true);
    drawBush(g, 548, 900, 0.75, false);
    drawRock(g, 586, 356, 1.15);
    drawRock(g, 226, 565, 0.9);
  }

  function drawOutfield(g) {
    var palms = [
      { x: 76, y: 214, s: 1.05, a: 0.4 },
      { x: 626, y: 188, s: 0.92, a: 1.4 },
      { x: 52, y: 350, s: 0.8, a: 2.2 },
      { x: 40, y: 804, s: 0.9, a: 0.6 },
      { x: 644, y: 1182, s: 0.88, a: 1.9 },
      { x: 112, y: 1224, s: 1.02, a: 2.9 },
      { x: 574, y: 1226, s: 0.7, a: 0.9 },
      { x: 690, y: 1018, s: 0.74, a: 2.4 }
    ];
    for (var i = 0; i < palms.length; i++) {
      var p = palms[i];
      if (clearOfTrack(p.x, p.y, 36)) drawPalm(g, p.x, p.y, p.s, p.a, i);
    }
    var bushes = [
      { x: 118, y: 158, s: 0.8, t: true },
      { x: 670, y: 286, s: 0.7, t: false },
      { x: 56, y: 612, s: 0.74, t: true },
      { x: 60, y: 1102, s: 0.68, t: false },
      { x: 426, y: 1220, s: 0.8, t: true },
      { x: 520, y: 1210, s: 0.62, t: false }
    ];
    for (i = 0; i < bushes.length; i++) {
      if (clearOfTrack(bushes[i].x, bushes[i].y, 28)) drawBush(g, bushes[i].x, bushes[i].y, bushes[i].s, bushes[i].t);
    }
    drawRock(g, 680, 1148, 1.2);
    drawRock(g, 132, 1180, 0.8);
    drawRock(g, 56, 1110, 0.7);
    drawUmbrella(g, 300, 1206, 0.9, '#e45b3f');
    drawUmbrella(g, 462, 1206, 0.72, '#3aa5a0');
    drawUmbrella(g, 600, 208, 0.7, '#ffd36a');
    drawUmbrella(g, 90, 270, 0.66, '#5ed4ff');

    // rustic trackside bunting at the top
    g.save();
    g.strokeStyle = 'rgba(35,29,24,0.5)';
    g.lineWidth = 3;
    g.beginPath();
    g.moveTo(192, 188);
    g.quadraticCurveTo(360, 214, 530, 176);
    g.stroke();
    for (var f = 0.04; f < 1; f += 0.065) {
      var bx = lerp(192, 530, f);
      var by = 188 + Math.sin(f * Math.PI) * 26 + Math.sin(f * 9) * 2;
      g.fillStyle = f < 0.34 ? '#ff6b3d' : (f < 0.68 ? '#ffd36a' : '#f7efda');
      g.beginPath();
      g.moveTo(bx - 4, by);
      g.lineTo(bx + 4, by);
      g.lineTo(bx, by + 10);
      g.closePath();
      g.fill();
    }
    g.restore();

    // little spectator flags along the start straight
    var spots = [
      { x: 555, y: 1004, c: '#ff6b3d' },
      { x: 486, y: 952, c: '#5ed4ff' }
    ];
    for (i = 0; i < spots.length; i++) {
      if (!clearOfTrack(spots[i].x, spots[i].y, 18)) continue;
      g.save();
      g.translate(spots[i].x, spots[i].y);
      g.strokeStyle = '#3d4038';
      g.lineWidth = 2;
      g.beginPath();
      g.moveTo(0, 0);
      g.lineTo(0, 24);
      g.stroke();
      g.fillStyle = spots[i].c;
      g.beginPath();
      g.moveTo(0, 0);
      g.lineTo(17, 5);
      g.lineTo(0, 12);
      g.closePath();
      g.fill();
      g.restore();
    }
  }

  function drawStaticVignette(g) {
    var v = g.createRadialGradient(WORLD.w / 2, WORLD.h * 0.48, WORLD.h * 0.18, WORLD.w / 2, WORLD.h * 0.5, WORLD.h * 0.72);
    v.addColorStop(0, 'rgba(5,17,17,0)');
    v.addColorStop(0.72, 'rgba(5,17,17,0.06)');
    v.addColorStop(1, 'rgba(4,14,14,0.42)');
    g.fillStyle = v;
    g.fillRect(0, 0, WORLD.w, WORLD.h);
    var top = g.createLinearGradient(0, 0, 0, 200);
    top.addColorStop(0, 'rgba(4,14,15,0.42)');
    top.addColorStop(1, 'rgba(4,14,15,0)');
    g.fillStyle = top;
    g.fillRect(0, 0, WORLD.w, 200);
    var bot = g.createLinearGradient(0, WORLD.h - 160, 0, WORLD.h);
    bot.addColorStop(0, 'rgba(4,14,15,0)');
    bot.addColorStop(1, 'rgba(4,14,15,0.34)');
    g.fillStyle = bot;
    g.fillRect(0, WORLD.h - 160, WORLD.w, 160);
  }

  function buildScene() {
    var SCALE = 2;
    var cv = document.createElement('canvas');
    cv.width = Math.round(WORLD.w * SCALE);
    cv.height = Math.round(WORLD.h * SCALE);
    var g = cv.getContext('2d');
    g.scale(SCALE, SCALE);
    g.lineJoin = 'round';
    g.lineCap = 'round';
    drawTerrain(g);
    drawTrack(g);
    drawInfield(g);
    drawOutfield(g);
    drawStaticVignette(g);
    sceneCanvas = cv;
  }

  /* ---------------------------------------------------------------
   * 13. DRAW — CARS + CHARACTERS
   * --------------------------------------------------------------- */
  function drawCarBody(g, style, opts) {
    opts = opts || {};
    var steer = opts.steer || 0;
    var detail = !!opts.detail;

    // shadow
    g.save();
    g.fillStyle = 'rgba(3,10,10,0.3)';
    g.beginPath();
    g.ellipse(2, 6, 33, 16, 0, 0, TAU);
    g.fill();
    g.restore();

    // rear wing
    g.fillStyle = '#171c1e';
    roundRectPath(g, -31, -17, 7, 34, 3);
    g.fill();
    g.fillStyle = style.accent;
    g.fillRect(-30, -15, 2, 30);

    // wheels
    function wheel(x, y, front) {
      g.save();
      g.translate(x, y);
      if (front && steer) g.rotate(steer * 0.38);
      g.fillStyle = '#111416';
      roundRectPath(g, -7, -4, 14, 8, 3);
      g.fill();
      g.fillStyle = '#555b5b';
      g.fillRect(-4, -1.4, 8, 2.8);
      g.restore();
    }
    wheel(18, -17, true);
    wheel(18, 17, true);
    wheel(-17, -17, false);
    wheel(-17, 17, false);

    // front wing
    g.fillStyle = '#1b2021';
    roundRectPath(g, 25, -18, 9, 36, 4);
    g.fill();
    g.fillStyle = style.accent;
    g.beginPath();
    g.moveTo(30, -16);
    g.lineTo(30, 16);
    g.strokeStyle = 'rgba(10,14,15,0.5)';
    g.lineWidth = 1;
    g.stroke();

    // chassis
    var bodyGrad = g.createLinearGradient(-28, -18, 31, 18);
    bodyGrad.addColorStop(0, style.dark);
    bodyGrad.addColorStop(0.32, style.main);
    bodyGrad.addColorStop(0.72, style.main);
    bodyGrad.addColorStop(1, style.light);
    g.fillStyle = bodyGrad;
    g.beginPath();
    g.moveTo(31, 0);
    g.bezierCurveTo(27, -8, 22, -12, 13, -14);
    g.lineTo(-10, -15);
    g.quadraticCurveTo(-24, -14, -28, -8);
    g.lineTo(-30, 0);
    g.lineTo(-28, 8);
    g.quadraticCurveTo(-24, 14, -10, 15);
    g.lineTo(13, 14);
    g.bezierCurveTo(22, 12, 27, 8, 31, 0);
    g.closePath();
    g.fill();
    g.strokeStyle = 'rgba(13,18,18,0.85)';
    g.lineWidth = 1.8;
    g.stroke();

    // side pods
    g.fillStyle = style.dark;
    g.beginPath();
    g.ellipse(2, -12, 14, 4.6, -0.03, 0, TAU);
    g.ellipse(2, 12, 14, 4.6, 0.03, 0, TAU);
    g.fill();

    // livery stripe
    g.fillStyle = style.accent;
    g.globalAlpha = 0.85;
    g.beginPath();
    g.moveTo(27, -2.2);
    g.lineTo(-20, -4);
    g.lineTo(-25, -1.5);
    g.lineTo(-20, 2.4);
    g.lineTo(27, 2.2);
    g.closePath();
    g.fill();
    g.globalAlpha = 1;

    // cockpit
    g.fillStyle = style.glass;
    g.beginPath();
    g.ellipse(-1, 0, 10.7, 7.4, 0, 0, TAU);
    g.fill();
    g.strokeStyle = 'rgba(255,255,255,0.16)';
    g.lineWidth = 1.2;
    g.stroke();
    g.fillStyle = style.accent;
    g.beginPath();
    g.ellipse(-5, 0, 4.1, 4.1, 0, 0, TAU);
    g.fill();
    g.fillStyle = 'rgba(18,20,20,0.65)';
    g.beginPath();
    g.arc(-5, 0, 2.1, 0, TAU);
    g.fill();

    // nose highlight
    g.fillStyle = 'rgba(255,255,255,0.35)';
    g.beginPath();
    g.ellipse(23, -3.5, 7, 1.7, -0.1, 0, TAU);
    g.fill();

    // tail lights
    g.fillStyle = '#ff5d4a';
    g.beginPath();
    g.arc(-27, -8.5, 1.8, 0, TAU);
    g.arc(-27, 8.5, 1.8, 0, TAU);
    g.fill();

    if (detail) {
      g.fillStyle = 'rgba(255,255,255,0.15)';
      g.beginPath();
      g.ellipse(5, -9.5, 16, 1.5, 0, 0, TAU);
      g.fill();
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.fillStyle = style.accent;
      g.font = '800 8px ' + NUM_FONT;
      g.fillText(style.number, 11, 8.5);
    }
  }

  function drawCharacter(g, slot, size) {
    g.save();
    if (slot === 'hero' || slot === 'enemy') {
      var style = slot === 'hero' ? CAR_STYLES[0] : CAR_STYLES[1];
      g.scale(size / 78, size / 78);
      drawCarBody(g, style, { detail: true });
    } else if (slot === 'pickup') {
      drawFlagCharacter(g, size);
    } else if (slot === 'background') {
      drawMiniTrack(g, size);
    }
    g.restore();
  }

  function drawFlagCharacter(g, size) {
    g.save();
    g.translate(-size * 0.06, size * 0.08);
    g.rotate(-0.18);
    g.fillStyle = 'rgba(4,16,14,0.25)';
    g.beginPath();
    g.ellipse(size * 0.06, size * 0.36, size * 0.26, size * 0.06, 0, 0, TAU);
    g.fill();
    g.strokeStyle = '#40382e';
    g.lineWidth = size * 0.032;
    g.beginPath();
    g.moveTo(-size * 0.15, size * 0.34);
    g.lineTo(-size * 0.15, -size * 0.34);
    g.stroke();
    var left = -size * 0.15;
    var top = -size * 0.34;
    var w = size * 0.54;
    var h = size * 0.36;
    g.fillStyle = '#f8efd7';
    g.beginPath();
    g.moveTo(left, top);
    g.quadraticCurveTo(left + w * 0.28, top - size * 0.035, left + w, top + size * 0.03);
    g.lineTo(left + w, top + h);
    g.quadraticCurveTo(left + w * 0.3, top + h - size * 0.035, left, top + h);
    g.closePath();
    g.fill();
    var cols = 5, rows = 4;
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        if ((r + c) % 2) continue;
        g.fillStyle = '#151d1e';
        var x = left + (w / cols) * c;
        var y = top + (h / rows) * r + Math.sin(c * 0.8) * size * 0.012;
        g.fillRect(x, y, w / cols, h / rows);
      }
    }
    g.strokeStyle = 'rgba(20,25,24,0.55)';
    g.lineWidth = size * 0.012;
    g.beginPath();
    g.moveTo(left, top);
    g.quadraticCurveTo(left + w * 0.28, top - size * 0.035, left + w, top + size * 0.03);
    g.stroke();
    g.fillStyle = '#c34f38';
    g.beginPath();
    g.arc(-size * 0.15, -size * 0.34, size * 0.035, 0, TAU);
    g.fill();
    g.restore();
  }

  function drawMiniTrack(g, size) {
    g.save();
    var scale = size / Math.max(WORLD.w, WORLD.h);
    var back = g.createLinearGradient(0, 0, size, size);
    back.addColorStop(0, '#0b2826');
    back.addColorStop(1, '#061719');
    g.fillStyle = back;
    g.fillRect(0, 0, size, size);
    g.globalAlpha = 0.15;
    g.strokeStyle = 'rgba(255,211,106,0.35)';
    g.lineWidth = 1;
    for (var i = 0; i < 7; i++) {
      g.beginPath();
      g.moveTo(-20, size * 0.2 + i * 35);
      g.lineTo(size + 20, size * 0.05 + i * 35);
      g.stroke();
    }
    g.globalAlpha = 1;
    var ox = (size - WORLD.w * scale) / 2;
    var oy = (size - WORLD.h * scale) / 2;
    g.translate(ox, oy);
    g.scale(scale, scale);
    g.fillStyle = '#123d36';
    g.fillRect(0, 0, WORLD.w, WORLD.h);
    g.fillStyle = '#1e5a49';
    g.beginPath();
    g.ellipse(380, 630, 140, 110, 0, 0, TAU);
    g.fill();
    g.lineCap = 'round';
    g.lineJoin = 'round';
    traceOffset(g, 0, true);
    g.strokeStyle = '#6d6752';
    g.lineWidth = ROAD_HALF * 2 + 32;
    g.stroke();
    traceOffset(g, 0, true);
    g.strokeStyle = '#333940';
    g.lineWidth = ROAD_HALF * 2;
    g.stroke();
    traceOffset(g, 0, true);
    g.strokeStyle = '#e2553b';
    g.lineWidth = 4;
    g.setLineDash([12, 12]);
    g.stroke();
    g.setLineDash([]);
    g.fillStyle = '#f7efda';
    var fp = track.samples[0];
    g.save();
    g.translate(fp.x, fp.y);
    g.rotate(fp.angle);
    for (var c = 0; c < 6; c++) {
      g.fillStyle = c % 2 ? '#f7efda' : '#151b1e';
      g.fillRect(-6, -ROAD_HALF + c * 14, 12, 14);
    }
    g.restore();
    g.restore();
  }

  /* ---------------------------------------------------------------
   * 14. DRAW — WORLD (DYNAMIC)
   * --------------------------------------------------------------- */
  function drawSkids(g) {
    for (var i = 0; i < skids.length; i++) {
      var s = skids[i];
      g.globalAlpha = clamp(s.life / s.max, 0, 1) * 0.38;
      g.strokeStyle = '#101415';
      g.lineWidth = s.w;
      g.lineCap = 'round';
      g.beginPath();
      g.moveTo(s.x1, s.y1);
      g.lineTo(s.x2, s.y2);
      g.stroke();
    }
    g.globalAlpha = 1;
  }

  function drawParticles(g, front) {
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      var isFront = p.kind === 'spark';
      if (isFront !== front) continue;
      var lifeT = clamp(p.life / p.max, 0, 1);
      if (p.kind === 'spark') {
        g.globalAlpha = lifeT;
        g.strokeStyle = p.color;
        g.lineWidth = p.size * 0.6;
        g.beginPath();
        g.moveTo(p.x, p.y);
        g.lineTo(p.x - p.vx * 0.025, p.y - p.vy * 0.025);
        g.stroke();
      } else {
        g.globalAlpha = lifeT * 0.54;
        g.fillStyle = p.color;
        g.beginPath();
        g.arc(p.x, p.y, p.size * (1.7 - lifeT * 0.7), 0, TAU);
        g.fill();
      }
    }
    g.globalAlpha = 1;
  }

  function drawMotes(g) {
    for (var i = 0; i < motes.length; i++) {
      var m = motes[i];
      g.globalAlpha = m.a * (0.55 + 0.45 * Math.sin(timeGlobal * 1.8 + m.phase));
      g.fillStyle = i % 5 === 0 ? '#ffe4a1' : '#d9efd0';
      g.beginPath();
      g.arc(m.x, m.y, m.r, 0, TAU);
      g.fill();
    }
    g.globalAlpha = 1;
  }

  function drawWaterGlints(g) {
    g.save();
    g.beginPath();
    g.ellipse(396, 617, 113, 107, 0, 0, TAU);
    g.clip();
    for (var i = 0; i < 8; i++) {
      var x = 310 + ((i * 37 + timeGlobal * (7 + i * 1.6)) % 190);
      var y = 548 + ((i * 31 + timeGlobal * 5) % 145);
      g.globalAlpha = 0.16 + 0.1 * Math.sin(timeGlobal * 2 + i);
      g.strokeStyle = '#dffbf1';
      g.lineWidth = 1.2;
      g.beginPath();
      g.moveTo(x - 7, y);
      g.quadraticCurveTo(x, y - 2, x + 7, y);
      g.stroke();
    }
    g.restore();
    g.globalAlpha = 1;
  }

  function drawStartLights(g) {
    var lit = (raceMode === 'countdown') ? Math.ceil(countdown) : 0;
    var colors = ['#ff4f3e', '#ffb13d', '#70e696'];
    for (var k = 0; k < 2; k++) {
      var base = k === 0 ? START_LEFT : START_RIGHT;
      for (var i = 0; i < 3; i++) {
        var on = raceMode === 'racing' ? true : (i < (4 - lit));
        var col = raceMode === 'racing' ? colors[2] : (on ? colors[0] : 'rgba(20,24,24,0.9)');
        g.save();
        g.globalAlpha = on || raceMode === 'racing' ? 0.9 : 0.35;
        g.fillStyle = 'rgba(4,12,12,0.38)';
        g.beginPath();
        g.arc(base.x + (i - 1) * 6.6, base.y - 19, 5.6, 0, TAU);
        g.fill();
        g.fillStyle = col;
        g.beginPath();
        g.arc(base.x + (i - 1) * 6.6, base.y - 20, 3.1, 0, TAU);
        g.fill();
        g.restore();
      }
    }
  }

  function drawCar(g, car) {
    var speed = Math.abs(car.fwd);
    if (speed > 210 && !car.finished) {
      g.save();
      g.globalAlpha = clamp((speed - 210) / 500, 0.08, 0.28);
      g.strokeStyle = car.style.light;
      g.lineWidth = 2;
      for (var i = 0; i < 3; i++) {
        var off = (i - 1) * 9;
        g.beginPath();
        g.moveTo(car.x - Math.cos(car.angle) * (28 + i * 7) - Math.sin(car.angle) * off,
          car.y - Math.sin(car.angle) * (28 + i * 7) + Math.cos(car.angle) * off);
        g.lineTo(car.x - Math.cos(car.angle) * (52 + i * 12) - Math.sin(car.angle) * off,
          car.y - Math.sin(car.angle) * (52 + i * 12) + Math.cos(car.angle) * off);
        g.stroke();
      }
      g.restore();
    }

    g.save();
    g.translate(car.x, car.y);
    g.rotate(car.angle);
    if (car.isPlayer) {
      g.globalAlpha = 0.44 + 0.12 * Math.sin(timeGlobal * 5);
      g.strokeStyle = '#ffd36a';
      g.lineWidth = 2.2;
      g.beginPath();
      g.ellipse(-1, 0, 37, 22, 0, 0, TAU);
      g.stroke();
      g.globalAlpha = 1;
    }
    drawCarBody(g, car.style, {
      steer: car.steer || 0,
      detail: false
    });
    g.restore();
  }

  function drawCarTag(g, car) {
    var label = car.isPlayer ? '你' : car.name;
    g.save();
    g.font = '700 15px ' + UI_FONT;
    var w = g.measureText(label).width + 21;
    var h = 19;
    var x = car.x - w / 2;
    var y = car.y - 45;
    g.shadowColor = 'rgba(0,0,0,0.35)';
    g.shadowBlur = 5;
    g.shadowOffsetY = 2;
    fillRound(g, x, y, w, h, h / 2, car.isPlayer ? 'rgba(39,29,16,0.9)' : 'rgba(8,22,22,0.78)');
    g.shadowColor = 'transparent';
    g.strokeStyle = car.isPlayer ? 'rgba(255,211,106,0.7)' : 'rgba(222,238,225,0.22)';
    g.lineWidth = 1;
    g.beginPath();
    g.arc(x + 8.5, y + h / 2, 3, 0, TAU);
    g.fillStyle = car.style.main;
    g.fill();
    g.stroke();
    g.fillStyle = car.isPlayer ? '#ffe6a9' : 'rgba(242,245,233,0.9)';
    g.textAlign = 'left';
    g.textBaseline = 'middle';
    g.fillText(label, x + 15, y + h / 2 + 0.5);
    g.beginPath();
    g.moveTo(car.x - 4, y + h + 2);
    g.lineTo(car.x + 4, y + h + 2);
    g.lineTo(car.x, y + h + 7);
    g.closePath();
    g.fillStyle = car.isPlayer ? 'rgba(255,211,106,0.65)' : 'rgba(222,238,225,0.2)';
    g.fill();
    g.restore();
  }

  function drawWorldDynamic(g) {
    drawSkids(g);
    drawWaterGlints(g);
    drawStartLights(g);
    drawMotes(g);
    drawParticles(g, false);

    var ordered = racers.slice().sort(function (a, b) { return a.y - b.y; });
    for (var i = 0; i < ordered.length; i++) drawCar(g, ordered[i]);
    if (phase !== 'title') {
      for (i = 0; i < ordered.length; i++) drawCarTag(g, ordered[i]);
    }
    drawParticles(g, true);
  }

  function screenBackdrop() {
    var bg = ctx.createLinearGradient(0, 0, 0, cssH);
    bg.addColorStop(0, '#08191c');
    bg.addColorStop(0.55, '#0b2021');
    bg.addColorStop(1, '#071618');

    ctx.fillRect(0, 0, cssW, cssH);
    ctx.save();
    ctx.globalAlpha = 0.25;
    for (var i = 0; i < 6; i++) {
      ctx.strokeStyle = i % 2 ? 'rgba(255,198,110,0.12)' : 'rgba(94,212,255,0.09)';

      ctx.beginPath();

      ctx.lineTo(cssW + 50, i * 150 - 30);

  function glassPanel(x, y, w, h, r, accent) {
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.4)';
    ctx.shadowBlur = 16 * ui;
    ctx.shadowOffsetY = 5 * ui;
    var grad = ctx.createLinearGradient(x, y, x, y + h);
    grad.addColorStop(0, 'rgba(14,32,33,0.9)');
    grad.addColorStop(1, 'rgba(7,19,21,0.86)');
    roundRectPath(ctx, x, y, w, h, r);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.restore();
    ctx.save();
    roundRectPath(ctx, x + 0.5, y + 0.5, w - 1, h - 1, r);
    ctx.strokeStyle = accent || 'rgba(255,222,160,0.22)';
    ctx.lineWidth = 1.1;
    ctx.stroke();
    ctx.restore();
  }

    if (!player) return;
    var m = 14 * ui;
    var h = 52 * ui;
    var wPos = 82 * ui;
    var wLap = 126 * ui;
    var wTime = 98 * ui;

    ctx.textBaseline = 'alphabetic';
    ctx.font = '800 ' + 29 * ui + 'px ' + NUM_FONT;

    ctx.textAlign = 'left';

    var barY = y + 42 * ui;

    roundRectPath(ctx, barX, barY, Math.max(2 * ui, barW * frac), 4 * ui, 2 * ui);

    drawText(ctx, formatTime(raceElapsed), timeX + 11 * ui, y + 32 * ui, 15.5 * ui, '#f7efda', 'left', '700');

    drawSpeedPill();

    if (lapNotice) {
      var t = lapNotice.life / lapNotice.max;
      var alpha = t > 0.78 ? (1 - t) / 0.22 : clamp(t / 0.3, 0, 1);
      var scale = t > 0.78 ? lerp(0.85, 1, easeOutCubic((1 - t) / 0.22)) : 1;
      ctx.save();

      ctx.translate(cssW / 2, cssH * 0.205);
      ctx.scale(scale, scale);
      var w = Math.min(cssW - 60 * ui, 260 * ui);

      grd.addColorStop(0, 'rgba(8,22,23,0)');
      grd.addColorStop(0.18, 'rgba(8,22,23,0.75)');
      grd.addColorStop(0.82, 'rgba(8,22,23,0.75)');
      grd.addColorStop(1, 'rgba(8,22,23,0)');
      ctx.fillStyle = grd;
      ctx.fillRect(-w / 2, -24 * ui, w, 48 * ui);
      drawText(ctx, lapNotice.main, 0, -2 * ui, 23 * ui, lapNotice.color, 'center', '800');
      drawText(ctx, lapNotice.sub, 0, 17 * ui, 9.5 * ui, 'rgba(247,239,218,0.54)', 'center', '500');
      ctx.restore();

  function drawSpeedPill() {
    var speed = player ? Math.abs(player.fwd) * 0.56 : 0;
    var kmh = Math.round(speed);
    var w = 132 * ui;
    var h = 54 * ui;
    var y = cssH - (isTouchLikely ? 146 : 65) * ui;
    var x = (cssW - w) / 2;
    glassPanel(x, y, w, h, 16 * ui, 'rgba(255,220,158,0.22)');
    ctx.save();
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.font = '800 ' + 27 * ui + 'px ' + NUM_FONT;
    ctx.fillStyle = '#f7efda';
    ctx.fillText(String(kmh).padStart(3, ' '), x + w - 34 * ui, y + 25 * ui);
    ctx.textAlign = 'left';
    ctx.font = '600 ' + 9 * ui + 'px ' + UI_FONT;
    ctx.fillStyle = 'rgba(247,239,218,0.5)';
    ctx.fillText('km/h', x + w - 30 * ui, y + 29 * ui);
    ctx.restore();
    var mode = player ? player.autoMode : 'cruise';
    var modeLabel = mode === 'brake' ? '刹车' : (mode === 'boost' ? '全油门' : '自动巡航');
    var modeColor = mode === 'brake' ? '#ff9c83' : (mode === 'boost' ? '#ffd36a' : 'rgba(247,239,218,0.52)');
    drawText(ctx, modeLabel, x + 12 * ui, y + 13 * ui, 8.8 * ui, modeColor, 'left', '700');
    var ratio = player ? clamp(Math.abs(player.fwd) / player.maxSpeed, 0, 1) : 0;
    var bx = x + 12 * ui, by = y + h - 10 * ui, bw = w - 24 * ui;
    roundRectPath(ctx, bx, by, bw, 3.5 * ui, 2 * ui);
    ctx.fillStyle = 'rgba(247,239,218,0.14)';
    ctx.fill();
    roundRectPath(ctx, bx, by, Math.max(2 * ui, bw * ratio), 3.5 * ui, 2 * ui);
    ctx.fillStyle = ratio > 0.82 ? '#ff6b3d' : '#7ce0b0';
    ctx.fill();
  }

  function drawTouchControls() {
    if (!isTouchLikely) return;
    var l = touchLayout();
    var controls = [
      { x: l.leftX, y: l.y, kind: 'left', glyph: '‹' },
      { x: l.rightX, y: l.y, kind: 'right', glyph: '›' }
    ];
    for (var i = 0; i < controls.length; i++) {
      var c = controls[i];
      var active = touchState[c.kind] || (c.kind === 'left' && keys['arrowleft']) || (c.kind === 'right' && keys['arrowright']);
      ctx.save();
      ctx.beginPath();
      ctx.arc(c.x, c.y, l.radius, 0, TAU);
      ctx.fillStyle = active ? 'rgba(255,211,106,0.26)' : 'rgba(8,22,23,0.52)';
      ctx.fill();
      ctx.strokeStyle = active ? 'rgba(255,211,106,0.8)' : 'rgba(247,239,218,0.27)';
      ctx.lineWidth = 1.4;
      ctx.stroke();
      ctx.fillStyle = active ? '#ffe5a0' : 'rgba(247,239,218,0.75)';
      ctx.font = '300 ' + 47 * ui + 'px ' + UI_FONT;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(c.glyph, c.x, c.y - 3 * ui);
      ctx.restore();
    }
    ctx.save();
    var bw = l.brakeW, bh = l.brakeH;
    var bx = cssW / 2 - bw / 2, by = cssH - 46 * ui - bh / 2;
    roundRectPath(ctx, bx, by, bw, bh, bh / 2);
    ctx.fillStyle = touchState.brake ? 'rgba(255,107,61,0.34)' : 'rgba(8,22,23,0.5)';
    ctx.fill();
    ctx.strokeStyle = touchState.brake ? 'rgba(255,140,103,0.8)' : 'rgba(247,239,218,0.23)';
    ctx.lineWidth = 1.2;
    ctx.stroke();
    drawText(ctx, '刹车', cssW / 2, by + bh / 2, 11 * ui, touchState.brake ? '#ffb7a2' : 'rgba(247,239,218,0.7)', 'center', '700');
    ctx.restore();
  }

  function drawCountdownOverlay() {
    ctx.save();
    var vignette = ctx.createRadialGradient(cssW / 2, cssH * 0.42, cssH * 0.12, cssW / 2, cssH * 0.42, cssH * 0.55);
    vignette.addColorStop(0, 'rgba(4,13,14,0.02)');
    vignette.addColorStop(1, 'rgba(4,13,14,0.4)');
    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, cssW, cssH);

    var label = countdown > 0 ? String(Math.ceil(countdown)) : 'GO!';
    var isGo = countdown <= 0;
    var t = countdownStage > 0 ? (1 - (countdown - Math.floor(countdown))) : 1;
    var scale = 1;
    if (isGo) {
      scale = 1 + (1 - clamp(goFlash / 0.9, 0, 1)) * 0.65;
    } else {
      var local = countdown - (Math.ceil(countdown) - 1);
      scale = 1.18 - Math.min(local, 0.3) * 0.6;
      if (local > 0.75) scale *= 1.02;
    }
    var cy = cssH * 0.41;
    ctx.save();
    ctx.translate(cssW / 2, cy);
    ctx.scale(scale, scale);
    ctx.globalAlpha = isGo ? clamp(goFlash / 0.9, 0, 1) : 1;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '800 ' + (isGo ? 90 : 112) * ui + 'px ' + NUM_FONT;
    ctx.lineWidth = 6 * ui;
    ctx.strokeStyle = 'rgba(6,17,17,0.7)';
    ctx.strokeText(label, 0, 0);
    var grd = ctx.createLinearGradient(0, -70 * ui, 0, 70 * ui);
    if (isGo) {
      grd.addColorStop(0, '#f6ffd9');
      grd.addColorStop(0.4, '#ffd36a');
      grd.addColorStop(1, '#ff7a3d');
    } else {
      grd.addColorStop(0, '#fff8e5');
      grd.addColorStop(0.5, '#ffd36a');
      grd.addColorStop(1, '#ff7a48');
    }
    ctx.fillStyle = grd;
    ctx.shadowColor = isGo ? 'rgba(124,224,176,0.55)' : 'rgba(255,145,70,0.4)';
    ctx.shadowBlur = 30 * ui;
    ctx.fillText(label, 0, 0);
    ctx.restore();

    // countdown start lights
    var lightY = cy - 110 * ui;
    for (var i = 0; i < 3; i++) {
      var lit = isGo || i < (4 - countdownStage);
      ctx.save();
      ctx.beginPath();
      ctx.arc(cssW / 2 + (i - 1) * 32 * ui, lightY, 8.5 * ui, 0, TAU);
      ctx.fillStyle = lit ? (isGo ? '#7ce0b0' : '#ff5142') : 'rgba(247,239,218,0.18)';
      ctx.shadowColor = lit ? (isGo ? '#7ce0b0' : '#ff5142') : 'transparent';
      ctx.shadowBlur = lit ? 16 * ui : 0;
      ctx.fill();
      ctx.restore();
    }
    if (!isGo) {
      drawText(ctx, '准备发车', cssW / 2, cy + 92 * ui, 12 * ui, 'rgba(247,239,218,0.65)', 'center', '600');
      drawText(ctx, '落日湾赛道  ·  3 圈决胜', cssW / 2, cy + 112 * ui, 9.5 * ui, 'rgba(247,239,218,0.38)', 'center', '500');
    }
    ctx.restore();
  }

  function drawTitle() {
    var u = ui;
    var touchHints = isTouchLikely;
    ctx.save();
    var grad = ctx.createLinearGradient(0, 0, 0, cssH);
    grad.addColorStop(0, 'rgba(4,15,17,0.8)');
    grad.addColorStop(0.32, 'rgba(4,15,17,0.34)');
    grad.addColorStop(0.66, 'rgba(4,15,17,0.18)');
    grad.addColorStop(1, 'rgba(4,15,17,0.82)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, cssW, cssH);

    // diagonal accent bands
    ctx.save();
    ctx.globalAlpha = 0.16;
    ctx.strokeStyle = '#ffd36a';
    ctx.lineWidth = 2 * u;
    for (var beam = 0; beam < 5; beam++) {

    tg.addColorStop(0.68, '#ffae56');
    tg.addColorStop(1, '#ff5e3a');

    ctx.shadowColor = 'rgba(255,120,62,0.34)';

    ctx.fillText(TITLE, 0, 0);

    drawSpaced(ctx, 'A P E X   R U S H', cssW / 2, titleY + 55 * u, 12 * u, 'rgba(247,239,218,0.7)', 2.2 * u);

    var badgeY = titleY + 91 * u;
    drawBadge(cssW / 2 - 98 * u, badgeY, 58 * u, 22 * u, '3 圈');
    drawBadge(cssW / 2 - 28 * u, badgeY, 62 * u, 22 * u, '4 辆车');
    drawBadge(cssW / 2 + 46 * u, badgeY, 52 * u, 22 * u, '撞墙减速');

    // opponents
    var opponentY = badgeY + 43 * u;
    drawText(ctx, '对手', cssW / 2 - 104 * u, opponentY, 9 * u, 'rgba(247,239,218,0.45)', 'left', '600');
    for (var i = 0; i < Math.min(AI_COUNT, 3); i++) {
      var cx = cssW / 2 - 66 * u + i * 55 * u;
      ctx.save();
      ctx.fillStyle = CAR_STYLES[i + 1].main;
      ctx.beginPath();
      ctx.arc(cx, opponentY - 1, 3.6 * u, 0, TAU);
      ctx.fill();
      ctx.restore();
      drawText(ctx, CAR_STYLES[i + 1].name, cx + 7 * u, opponentY, 10 * u, 'rgba(247,239,218,0.72)', 'left', '600');
    }

    // start button
    var promptY = cssH - 150 * u;
    var pulse = 0.5 + 0.5 * Math.sin(timeGlobal * 2.8);
    var bw = Math.min(cssW - 56 * u, 278 * u);
    var bh = 55 * u;
    var bx = (cssW - bw) / 2;
    ctx.save();
    ctx.shadowColor = 'rgba(255,155,71,0.24)';
    ctx.shadowBlur = (18 + pulse * 14) * u;
    var bgrad = ctx.createLinearGradient(bx, promptY, bx + bw, promptY + bh);
    bgrad.addColorStop(0, '#ffbe58');
    bgrad.addColorStop(0.45, '#ff8b47');
    bgrad.addColorStop(1, '#f45638');
    roundRectPath(ctx, bx, promptY, bw, bh, bh / 2);
    ctx.fillStyle = bgrad;
    ctx.fill();
    ctx.restore();
    ctx.save();
    roundRectPath(ctx, bx + 1, promptY + 1, bw - 2, bh - 2, bh / 2);
    ctx.strokeStyle = 'rgba(255,243,207,0.65)';
    ctx.lineWidth = 1.1 * u;
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    roundRectPath(ctx, bx + 14 * u, promptY + 6 * u, bw - 28 * u, 12 * u, 6 * u);
    ctx.fill();
    ctx.restore();
    drawText(ctx, '开始比赛', cssW / 2 - 11 * u, promptY + bh / 2, 19 * u, '#19201c', 'center', '800');
    ctx.save();
    ctx.fillStyle = 'rgba(25,32,28,0.85)';
    ctx.beginPath();
    ctx.moveTo(cssW / 2 + 70 * u, promptY + bh / 2 - 8 * u);
    ctx.lineTo(cssW / 2 + 82 * u, promptY + bh / 2);
    ctx.lineTo(cssW / 2 + 70 * u, promptY + bh / 2 + 8 * u);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    var hintY = promptY + bh + 19 * u;
    var hint = touchHints ? '轻触起跑  ·  按住左右转向  ·  中间刹车' : '按 ENTER 起跑  ·  ← → 转向  ·  ↑ 全油门  ·  ↓ 刹车';
    drawText(ctx, hint, cssW / 2, hintY, 10.5 * u, 'rgba(247,239,218,0.66)', 'center', '500');
    drawText(ctx, '自动巡航已开启 · 走好线，撞墙会损失速度', cssW / 2, hintY + 19 * u, 8.8 * u, 'rgba(247,239,218,0.35)', 'center', '500');
    drawSpaced(ctx, '3 LAPS  ·  COASTAL CIRCUIT  ·  4 CARS', cssW / 2, cssH - 22 * u, 7.4 * u, 'rgba(247,239,218,0.26)', 1.2 * u);
