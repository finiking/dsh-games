  /* main battle field */

    position:absolute;width:146px;height:146px;bottom:8px;border-radius:50%;

    position:relative;z-index:2;width:clamp(112px,16vh,142px);height:clamp(112px,16vh,142px);border-radius:50%;overflow:hidden;

  .sk-block-badge{

  }
  .sk-block-badge svg{width:11px;height:11px}
  @keyframes skBlockIn{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  .sk-unit-block,.sk-boss-copy{
    width:100%;min-width:0;height:86px;
    display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:3px;
    padding:6px 8px;border-radius:10px;
    background:linear-gradient(180deg, rgba(11,29,20,.82), rgba(6,17,12,.9));
    border:1px solid rgba(246,221,160,.22);
    box-shadow:0 4px 12px rgba(0,0,0,.32);z-index:3;

  .sk-unit-row{display:flex;align-items:center;justify-content:center;gap:5px;min-width:0;width:100%;height:20px}

    font-family:var(--serif);font-size:clamp(12px,1.5vw,15px);font-weight:700;

  }
  .sk-unit-tag{
    flex:0 0 auto;font-family:var(--mono);font-size:8px;letter-spacing:.06em;color:var(--gold-2);
    border:1px solid rgba(246,221,160,.28);border-radius:99px;padding:1px 5px;
  }
  .sk-hpbar{
    position:relative;width:100%;height:12px;border-radius:99px;padding:2px;flex:0 0 auto;

    overflow:hidden;
  }
  .sk-hpbar__fill{
    height:100%;border-radius:99px;background:linear-gradient(90deg,#6a9d65,#a9c77d 55%,#d6d894);

  .sk-hpbar.is-low .sk-hpbar__fill{background:linear-gradient(90deg,#8f382f,#cc6049 50%,#e2a260);animation:skLow 1.5s ease-in-out infinite}
  @keyframes skLow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.22)}}
  .sk-hptext{display:flex;align-items:center;justify-content:space-between;width:100%;height:13px;gap:4px;

  .sk-statuses{

  .sk-chip b{font-family:var(--mono);font-size:9.5px}
  .sk-chip--str{color:#f2c581;background:rgba(114,75,28,.32)}
  .sk-chip--thorn{color:#d9b3df;background:rgba(90,54,108,.28)}
  .sk-chip--bind{color:#b6d9da;background:rgba(40,91,95,.28)}
  .sk-chip--vuln{color:#ff9f80;background:rgba(136,45,30,.36)}
  .sk-chip--weak{color:#c7cf9d;background:rgba(79,91,46,.3)}
  .sk-chip--poison{color:#a8ef91;background:rgba(44,104,42,.36)}
  .sk-chip--calm{color:rgba(232,216,175,.68);background:rgba(20,44,31,.4);border-color:rgba(232,216,175,.25)}

  .sk-intent-wrap{
    display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
    gap:2px;height:44px;margin-top:0;z-index:3;width:100%;
  }
  .sk-intent-label{font-family:var(--serif);font-size:8px;letter-spacing:.2em;color:rgba(246,221,160,.6);text-transform:uppercase}
  .sk-intent{
    display:inline-flex;align-items:center;gap:5px;min-height:27px;max-width:100%;
    padding:2px 9px 2px 4px;border-radius:999px;
    background:linear-gradient(180deg,#f2e5c5,#dcc697);color:var(--ink);
    border:1.5px solid rgba(16,36,24,.88);
    box-shadow:0 3px 0 rgba(3,10,6,.38), 0 6px 14px rgba(0,0,0,.22);
    font-size:9.5px;line-height:1.15;transform:translateY(0);
  }
  .sk-intent__icon{
    width:20px;height:20px;flex:0 0 auto;display:grid;place-items:center;border-radius:50%;
    color:#f7ebd1;background:linear-gradient(160deg,#4b5040,#263328);
    border:1px solid rgba(16,36,24,.58);
  }
  .sk-intent__icon svg{width:13px;height:13px}
  .sk-intent__copy{min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:0;overflow:hidden}
  .sk-intent__copy b{font-family:var(--serif);font-size:10.5px;letter-spacing:.02em;line-height:1.15;color:#203024;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .sk-intent__copy small{font-family:var(--mono);font-size:8px;letter-spacing:.01em;color:#6c5530;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

  .sk-intent--danger .sk-intent__copy small{color:#9a4634}
  .sk-intent--guard .sk-intent__icon{background:linear-gradient(160deg,#4c7f86,#2e555c)}
  .sk-intent--buff .sk-intent__icon{background:linear-gradient(160deg,#8a714a,#5f4526)}
  .sk-intent.is-thinking{animation:skThink 1.4s ease-in-out infinite}
  @keyframes skThink{0%,100%{transform:translateY(0);opacity:.82}50%{transform:translateY(-3px);opacity:1}}
  .sk-boss-aura{
    position:absolute;left:8%;right:8%;top:10%;bottom:4%;border-radius:50%;
    background:radial-gradient(circle, rgba(226,187,96,.24), rgba(92,157,99,.08) 54%, transparent 72%);
    filter:blur(10px);animation:skAura 4.2s ease-in-out infinite;
  }
  .sk-boss-aura::after{
    content:"";position:absolute;inset:24%;border-radius:50%;
    border:1px solid rgba(246,221,160,.15);
    transform:rotate(-12deg) scaleX(1.2);
  }
  @keyframes skAura{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
  .sk-boss-crowns{
    position:absolute;top:0;left:50%;transform:translateX(-50%);
    display:flex;align-items:flex-end;justify-content:center;gap:-2px;z-index:3;height:26px;
    filter:drop-shadow(0 3px 3px rgba(0,0,0,.4));
  }
  .sk-boss-crowns .sk-crown{width:22px;height:22px;color:var(--gold);transform-origin:50% 100%}
  .sk-boss-crowns .sk-crown:nth-child(1){transform:rotate(-12deg) translateY(3px);width:18px;height:18px}
  .sk-boss-crowns .sk-crown:nth-child(2){transform:translateY(-2px);z-index:2}
  .sk-boss-crowns .sk-crown:nth-child(3){transform:rotate(12deg) translateY(3px);width:18px;height:18px}
  .sk-boss-art{
    position:relative;z-index:2;width:clamp(132px,20vh,178px);height:clamp(124px,19vh,166px);object-fit:contain;
    filter:drop-shadow(0 14px 16px rgba(0,0,0,.48));
    animation:skBob 3.8s ease-in-out infinite;
    transform-origin:50% 84%;
  }
  @keyframes skBob{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-5px) scale(1.012,1.018)}}
  .sk-boss[data-stage="2"] .sk-boss-aura{
    background:radial-gradient(circle,rgba(116,220,242,.36),rgba(138,112,216,.14) 53%,transparent 72%);
  }
  .sk-boss[data-stage="2"] .sk-boss-art{
    filter:drop-shadow(0 16px 18px rgba(0,0,0,.48)) drop-shadow(0 0 16px rgba(120,220,245,.28)) hue-rotate(38deg) saturate(1.15);
  }
  .sk-boss[data-stage="3"] .sk-boss-aura{
    background:radial-gradient(circle,rgba(245,180,95,.46),rgba(185,68,140,.22) 48%,transparent 74%);

  }
  .sk-boss[data-stage="3"] .sk-boss-art{
    filter:drop-shadow(0 16px 18px rgba(0,0,0,.48)) drop-shadow(0 0 22px rgba(240,140,90,.36)) hue-rotate(-24deg) saturate(1.22);

  .sk-boss.is-defeated .sk-boss-art{

  .sk-stage-seal{
    font-family:var(--serif);font-size:9.5px;font-weight:700;letter-spacing:.04em;color:var(--ink);
    background:linear-gradient(180deg,var(--gold-2),var(--gold));width:18px;height:18px;flex:0 0 auto;
    display:grid;place-items:center;border-radius:50%;border:1px solid rgba(16,36,24,.75);
    box-shadow:0 2px 0 rgba(3,10,6,.3);
  }
  .sk-boss-copy .sk-unit-name{color:#ffe9b7}

  /* energy / action bar */

    flex:0 0 auto;display:flex;align-items:center;gap:clamp(6px,1.4vw,18px);

    position:relative;width:14px;height:14px;border-radius:50%;

    transition:.24s;
  }

  }

    position:relative;display:flex;align-items:center;gap:6px;min-height:34px;padding:0 13px;
    border-radius:10px;color:#1b2a1c;font-family:var(--serif);font-weight:700;font-size:12.5px;
    letter-spacing:.04em;background:linear-gradient(180deg,#f5dfa4,#e3b662 60%,#c9943e);
    border:1.5px solid #1c2f22;box-shadow:0 3px 0 #0b1b12, 0 6px 12px rgba(0,0,0,.25);

  .sk-endturn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #0b1b12}

  .sk-endturn.is-pulse{animation:skPulse 2.2s ease-in-out infinite}
  @keyframes skPulse{0%,100%{box-shadow:0 3px 0 #0b1b12,0 0 0 rgba(244,211,130,0)}50%{box-shadow:0 3px 0 #0b1b12,0 0 0 5px rgba(244,211,130,.08)}}

  /* hand */
  .sk-hand{flex:0 0 auto;position:relative;min-height:0}

    display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 4px 2px;
    color:rgba(246,236,211,.56);font-size:9px;letter-spacing:.03em;

  }

    overflow:hidden;padding:2px 0 3px;width:100%;
  }
  .sk-hand-row{
    display:flex;align-items:flex-end;justify-content:center;gap:clamp(8px,1.4vw,12px);
    width:100%;min-width:0;height:218px;padding:6px 6px 8px;
  }
  .sk-hand-empty{
    width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;

    background:radial-gradient(ellipse at 50% 45%,rgba(78,121,83,.12),rgba(6,17,11,.16) 68%);

  .sk-card{
    --accent:var(--red);--accent-soft:var(--red-soft);

    display:flex;flex-direction:column;align-items:stretch;gap:4px;
    text-align:left;padding:7px 8px 7px;border-radius:12px;color:var(--ink);
    background:
      radial-gradient(ellipse at 24% 8%, rgba(255,255,255,.62), transparent 38%),
      linear-gradient(150deg,#f6eacf 0%,#ead7af 62%,#dec596 100%);
    border:1.7px solid #1b2b20;
    box-shadow:0 3px 0 #0c1d13, 0 9px 17px rgba(0,0,0,.32), inset 0 0 0 1px rgba(255,247,226,.4);
    transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s,filter .18s;
    transform-origin:50% 100%;overflow:hidden;isolation:isolate;

  .sk-card.type-attack{--accent:#b64e3c;--accent-soft:#edc1ae}

  .sk-card::before{
    content:"";position:absolute;inset:4px;border-radius:9px;pointer-events:none;
    border:1px solid rgba(58,60,37,.22);z-index:0;

  .sk-card::after{
    content:"";position:absolute;left:-40%;right:-40%;top:-30%;height:75%;
    background:linear-gradient(100deg,rgba(255,255,255,.34),rgba(255,255,255,0));
    transform:rotate(-14deg);pointer-events:none;opacity:.5;z-index:0;
  }
  .sk-card:hover:not(:disabled),.sk-card:focus-visible{
    transform:translateY(-10px) rotate(0deg) scale(1.02);z-index:5;
    box-shadow:0 4px 0 #0c1d13, 0 16px 22px rgba(0,0,0,.38), 0 0 0 2px rgba(246,221,160,.42);
    outline:none;
  }
  .sk-card:active:not(:disabled){transform:translateY(-6px) scale(.995)}
  .sk-card.is-selected{
    transform:translateY(-7px);
    box-shadow:0 4px 0 #0c1d13,0 14px 20px rgba(0,0,0,.4),0 0 0 2px var(--gold-2),0 0 18px rgba(246,221,160,.28);
  }
  .sk-card.is-unaffordable{filter:grayscale(.52) brightness(.78);opacity:.74;cursor:not-allowed}
  .sk-card.is-unaffordable:hover{transform:none;box-shadow:0 3px 0 #0c1d13,0 9px 17px rgba(0,0,0,.32)}
  .sk-card[disabled]{cursor:default}
  .sk-hand-row .sk-card[disabled]{filter:grayscale(.55) brightness(.75);opacity:.72}
  .sk-card-head{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:4px}
  .sk-cost{
    width:22px;height:22px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;
    background:radial-gradient(circle at 35% 25%,#fff0b5,#e9b95d 48%,#b97c2c);
    border:1.5px solid #1b2b20;color:#18271c;font-family:var(--mono);font-weight:800;font-size:11.5px;
    box-shadow:0 2px 0 rgba(20,31,22,.3),inset 0 1px 1px rgba(255,255,255,.4);
  }
  .sk-card-type{
    padding:1px 5px;border-radius:99px;border:1px solid var(--accent);color:var(--accent);
    background:var(--accent-soft);font-size:7.5px;line-height:1.4;font-weight:700;letter-spacing:.08em;
  }
  .sk-card-art{
    position:relative;z-index:1;height:50px;border-radius:7px;display:grid;place-items:center;
    border:1px solid rgba(27,43,32,.55);overflow:hidden;
    background:
      radial-gradient(circle at 70% 22%, rgba(255,255,255,.28), transparent 25%),
      linear-gradient(140deg,var(--accent-soft),#f0e2c2 75%);
  }
  .sk-card-art::before{
    content:"";position:absolute;inset:0;opacity:.28;
    background-image:radial-gradient(var(--accent) .65px, transparent .8px);
    background-size:5px 5px;
  }
  .sk-card-art::after{
    content:"";position:absolute;width:100px;height:100px;border-radius:50%;
    border:1px solid var(--accent);opacity:.2;right:-42px;top:-50px;
    box-shadow:0 0 0 12px rgba(255,255,255,.12),0 0 0 24px rgba(255,255,255,.08);
  }
  .sk-card-art svg{position:relative;z-index:1;width:33px;height:33px;color:var(--accent);filter:drop-shadow(0 1px 0 rgba(255,255,255,.45))}
  .sk-card.is-unaffordable .sk-card-art{filter:saturate(.55)}
  .sk-card-name{
    position:relative;z-index:1;text-align:center;font-family:var(--serif);font-weight:700;
    font-size:13.5px;letter-spacing:.02em;line-height:1.2;margin-top:0;
  }
  .sk-card-name::after{
    content:"";display:block;width:26px;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);
    margin:2px auto 0;opacity:.62;
  }
  .sk-card-desc{
    position:relative;z-index:1;font-size:9.5px;line-height:1.38;color:#3d4d41;
    display:block;text-align:center;flex:1;
  }
  .sk-card-desc b{color:var(--accent);font-family:var(--mono);font-size:10.5px;font-weight:800}
  .sk-card-desc .sk-exhaust{color:#7f6259;font-size:8.5px;border-bottom:1px dotted #9c796a}
  .sk-card-foot{
    position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:4px;
    padding-top:2px;border-top:1px solid rgba(52,58,37,.14);
    font-size:7.5px;letter-spacing:.06em;color:#8a7753;
  }
  .sk-rarity-dot{width:5px;height:5px;border-radius:50%;background:#a99268}
  .rarity-common .sk-rarity-dot{background:#6e8a5c}
  .rarity-uncommon .sk-rarity-dot{background:#4e7e95}
  .rarity-rare .sk-rarity-dot{background:#a16d2f;box-shadow:0 0 5px rgba(198,139,53,.7)}
  .sk-card-playhint{
    position:absolute;z-index:3;left:50%;bottom:4px;transform:translateX(-50%) translateY(4px);
    background:rgba(23,37,27,.9);color:#f7e8c4;border-radius:99px;padding:1px 6px;
    font-size:7.5px;letter-spacing:.06em;opacity:0;transition:.16s;pointer-events:none;white-space:nowrap;
  }
  .sk-card:not(:disabled):hover .sk-card-playhint{opacity:1;transform:translateX(-50%) translateY(0)}
  .sk-hand-row .sk-card:hover:not(:disabled),.sk-hand-row .sk-card:focus-visible{transform:translateY(-10px) rotate(0) scale(1.02)}
  .sk-hand-row .sk-card.is-selected{transform:translateY(-7px)}
  .sk-reward-relic{
    display:inline-flex;align-items:center;gap:8px;padding:7px 14px;margin-top:8px;border-radius:11px;
    background:linear-gradient(180deg, rgba(44,86,58,.9), rgba(22,49,33,.94));
    border:1.5px solid rgba(246,221,160,.55);color:#f7ebd0;font-size:10.5px;
    box-shadow:0 4px 14px rgba(0,0,0,.35);
  }
  .sk-reward-relic b{color:var(--gold-2);font-family:var(--serif);font-size:12px}

  /* announce, toast, FX */
  .sk-announce{
    position:absolute;z-index:24;left:50%;top:36%;transform:translate(-50%,-50%);
    width:min(88vw,460px);pointer-events:none;text-align:center;opacity:0;transition:opacity .28s,transform .28s;
  }
  .sk-announce.is-open{opacity:1;transform:translate(-50%,-50%)}
  .sk-announce__inner{
    padding:14px 23px 15px;border-radius:13px;color:var(--ink);
    background:
      radial-gradient(ellipse at 50% 0,rgba(255,255,255,.65),transparent 52%),
      linear-gradient(160deg,#f4e5c2,#deca9a);
    border:1.5px solid #1b2b20;box-shadow:0 5px 0 rgba(4,12,8,.5),0 18px 34px rgba(0,0,0,.36);
    transform:scale(.94);transition:transform .3s cubic-bezier(.2,.9,.2,1.1);
  }
  .sk-announce.is-open .sk-announce__inner{transform:scale(1)}
  .sk-announce .sk-overline{color:#8a6326;margin-bottom:5px}
  .sk-announce h3{margin:0;font-family:var(--serif);font-size:26px;letter-spacing:.08em;color:#1a2a1e}
  .sk-announce p{margin:5px 0 0;font-size:10px;line-height:1.5;color:#5a634e}
  .sk-toast{
    position:absolute;z-index:70;left:50%;bottom:clamp(16px,4vh,42px);transform:translate(-50%,10px);
    padding:7px 13px;border-radius:99px;background:rgba(17,32,22,.94);color:#f4e7c8;
    border:1px solid rgba(246,221,160,.28);font-size:11px;letter-spacing:.02em;
    box-shadow:0 8px 22px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:.2s;
    white-space:nowrap;max-width:86vw;overflow:hidden;text-overflow:ellipsis;
  }
  .sk-toast.is-open{opacity:1;transform:translate(-50%,0)}
  .sk-fx{position:absolute;inset:0;z-index:25;pointer-events:none;overflow:hidden}
  .sk-float{
    position:fixed;z-index:26;pointer-events:none;transform:translate(-50%,-50%);
    font-family:var(--serif);font-weight:800;font-size:clamp(19px,3vw,30px);
    letter-spacing:.02em;color:#ffe2a0;text-shadow:0 2px 0 #462d18,0 4px 12px rgba(0,0,0,.55);
    animation:skFloat .95s cubic-bezier(.17,.67,.23,1) forwards;
  }
  .sk-float--hurt{color:#ffb396;text-shadow:0 2px 0 #57251f,0 4px 12px rgba(0,0,0,.55)}
  .sk-float--heal{color:#b8e6a4;text-shadow:0 2px 0 #29472a,0 4px 12px rgba(0,0,0,.55)}
  .sk-float--guard{color:#b9e5e6;text-shadow:0 2px 0 #244b50,0 4px 12px rgba(0,0,0,.55)}
  .sk-float--small{font-family:var(--mono);font-size:clamp(13px,2vw,18px);font-weight:700}
  .sk-float--poison{color:#c8e5a9}
  @keyframes skFloat{
    0%{opacity:0;transform:translate(-50%,-10%) scale(.7)}
    16%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}
    70%{opacity:1}
    100%{opacity:0;transform:translate(-50%,-135%) scale(.92)}
  }
  .sk-screenflash{position:absolute;inset:0;z-index:23;pointer-events:none;opacity:0}
  .sk-screenflash.is-red{background:radial-gradient(ellipse at 30% 55%,rgba(166,63,48,.28),transparent 58%);animation:skFlash .36s ease-out}
  .sk-screenflash.is-gold{background:radial-gradient(ellipse at 70% 48%,rgba(243,207,121,.23),transparent 56%);animation:skFlash .32s ease-out}
  @keyframes skFlash{0%{opacity:0}24%{opacity:1}100%{opacity:0}}

  /* overlays */
  .sk-overlay{
    position:absolute;inset:0;z-index:40;display:none;align-items:center;justify-content:center;
    padding:max(18px,env(safe-area-inset-top)) clamp(14px,4vw,44px) max(18px,env(safe-area-inset-bottom));
    background:
      radial-gradient(ellipse at 50% 36%,rgba(87,139,101,.24),transparent 42%),
      radial-gradient(ellipse at 50% 50%,rgba(6,15,10,.32),rgba(4,11,7,.88) 78%);
    backdrop-filter:blur(7px) saturate(.8);-webkit-backdrop-filter:blur(7px) saturate(.8);
    overflow-y:auto;
  }
  .sk-overlay.is-open{display:flex;animation:skFade .28s ease-out both}
  .sk-overlay--title{cursor:pointer;background:
      radial-gradient(ellipse at 50% 25%,rgba(96,150,105,.24),transparent 45%),
      linear-gradient(180deg,rgba(5,14,9,.44),rgba(4,11,7,.92) 86%)}
  .sk-overlay--reward{cursor:default;background:
      radial-gradient(ellipse at 50% 35%,rgba(133,151,91,.18),transparent 48%),
      rgba(4,11,7,.88)}
  @keyframes skFade{from{opacity:0}to{opacity:1}}

  /* title */
  .sk-title{
    width:min(940px,100%);display:flex;flex-direction:column;align-items:center;
    text-align:center;padding:clamp(4px,3vh,28px) 0;
  }
  .sk-title-crest{display:flex;justify-content:center;gap:5px;margin-bottom:5px}
  .sk-title-crest .sk-crown{width:22px;height:22px;color:var(--gold);opacity:.9;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
  .sk-title-crest .sk-crown:nth-child(2){width:29px;height:29px;margin-top:-8px;color:var(--gold-2)}
  .sk-title .sk-overline{font-size:9px;letter-spacing:.34em;margin:0 0 8px;color:var(--gold)}
  .sk-logo{
    margin:0;display:flex;align-items:baseline;justify-content:center;gap:13px;flex-wrap:wrap;
    font-family:var(--serif);color:#f8ebcb;line-height:.95;letter-spacing:.03em;
    text-shadow:0 4px 0 rgba(0,0,0,.22),0 16px 32px rgba(0,0,0,.28);
  }
  .sk-logo span{font-size:clamp(46px,7.3vw,88px);font-weight:800}
  .sk-logo em{
    font-style:normal;color:var(--gold-2);font-size:clamp(26px,3.6vw,44px);font-weight:600;
    letter-spacing:.18em;position:relative;top:-3px;
  }
  .sk-tagline{
    margin:12px 0 0;font-size:clamp(11px,1.35vw,14px);line-height:1.72;letter-spacing:.06em;
    color:rgba(247,236,209,.7);
  }
  .sk-title-scene{
    position:relative;width:min(620px,94%);height:clamp(210px,29vh,292px);
    display:flex;align-items:flex-end;justify-content:center;margin:4px 0 0;
  }
  .sk-title-scene::after{
    content:"";position:absolute;left:13%;right:13%;bottom:0;height:37px;border-radius:50%;
    background:radial-gradient(ellipse at center,rgba(4,12,7,.68),transparent 70%);filter:blur(4px);
  }
  .sk-title-hero{
    position:absolute;z-index:3;left:14%;bottom:9px;height:56%;width:auto;max-width:32%;
    filter:drop-shadow(0 15px 13px rgba(0,0,0,.38));transform:rotate(-3deg);
  }
  .sk-title-boss-wrap{
    position:absolute;z-index:2;right:8%;bottom:0;height:100%;max-width:60%;
    display:flex;align-items:flex-end;justify-content:center;
  }
  .sk-title-boss-wrap::before{
    content:"";position:absolute;inset:12% 4% 1%;border-radius:50%;
    background:radial-gradient(circle,rgba(234,192,104,.27),rgba(86,150,93,.06) 56%,transparent 70%);
    filter:blur(10px);z-index:-1;
  }
  .sk-title-boss{
    height:96%;width:auto;max-width:100%;filter:drop-shadow(0 22px 18px rgba(0,0,0,.42));
    animation:skTitleBob 4.2s ease-in-out infinite;transform-origin:50% 88%;
  }
  @keyframes skTitleBob{0%,100%{transform:translateY(0) rotate(.3deg)}50%{transform:translateY(-8px) rotate(-1deg)}}
  .sk-title-vs{
    position:absolute;z-index:4;left:50%;bottom:35%;transform:translateX(-50%);
    width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
    color:var(--ink);background:linear-gradient(180deg,var(--gold-2),var(--gold));
    border:1.5px solid var(--ink);font-family:var(--serif);font-weight:800;font-size:11px;
    box-shadow:0 3px 0 rgba(4,12,7,.4);
  }
  .sk-title-crowns{position:absolute;z-index:3;right:24%;top:10%;display:flex;gap:0;filter:drop-shadow(0 3px 4px rgba(0,0,0,.4))}
  .sk-title-crowns .sk-crown{width:24px;height:24px;color:var(--gold);transform:rotate(-8deg)}
  .sk-title-crowns .sk-crown:nth-child(2){width:29px;height:29px;transform:translateY(-6px);color:var(--gold-2)}
  .sk-title-crowns .sk-crown:nth-child(3){transform:rotate(8deg)}
  .sk-features{display:flex;align-items:center;justify-content:center;gap:clamp(9px,2vw,25px);flex-wrap:wrap;margin-top:-2px}
  .sk-feature{
    display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;
    background:rgba(8,22,14,.38);border:1px solid rgba(246,221,160,.16);
    color:rgba(247,237,213,.72);font-size:10px;letter-spacing:.03em;
  }
  .sk-feature b{font-family:var(--serif);color:var(--gold-2);font-size:13px;font-weight:700}
  .sk-feature svg{width:13px;height:13px;color:var(--gold)}
  .sk-title-actions{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:clamp(12px,2.2vh,22px)}
  .sk-btn-primary{
    display:inline-flex;align-items:center;justify-content:center;gap:9px;
    min-height:47px;padding:0 26px;border-radius:11px;color:#1c2b1d;
    font-family:var(--serif);font-size:16px;font-weight:800;letter-spacing:.08em;
    background:linear-gradient(180deg,#f7e4ad,#e4b860 58%,#c48e38);
    border:1.5px solid #1c2d20;box-shadow:0 4px 0 #0b1c12,0 11px 22px rgba(0,0,0,.28);
    transition:transform .18s,filter .18s;
  }
  .sk-btn-primary:hover,.sk-btn-primary:focus-visible{transform:translateY(-2px);filter:brightness(1.05);outline:none}
  .sk-btn-primary:active{transform:translateY(2px);box-shadow:0 1px 0 #0b1c12}
  .sk-btn-primary svg{width:21px;height:21px}
  .sk-title-links{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:11px}
  .sk-text-btn{
    color:rgba(245,232,203,.55);font-size:10px;letter-spacing:.08em;border-bottom:1px solid rgba(246,221,160,.22);
    padding-bottom:1px;transition:color .18s,border-color .18s;
  }
  .sk-text-btn:hover,.sk-text-btn:focus-visible{color:var(--gold-2);border-color:var(--gold-2);outline:none}
  .sk-press{margin:13px 0 0;font-family:var(--mono);font-size:9px;color:rgba(246,236,211,.36);letter-spacing:.05em}

  /* reward */
  .sk-reward{
    width:min(820px,100%);display:flex;flex-direction:column;align-items:center;text-align:center;
    padding:6px 0;
  }
  .sk-reward .sk-overline{color:var(--gold);margin-bottom:5px;letter-spacing:.26em;font-size:9px}
  .sk-reward-token{
    width:74px;height:74px;margin:0 auto -1px;
    filter:drop-shadow(0 8px 14px rgba(0,0,0,.35));
    animation:skTokenIn .55s cubic-bezier(.16,.8,.25,1) both;
  }
  .sk-reward-token img{width:100%;height:100%;object-fit:contain}
  @keyframes skTokenIn{from{opacity:0;transform:translateY(9px) scale(.9)}to{opacity:1;transform:none}}
  .sk-reward h2{
    margin:0;font-family:var(--serif);font-size:clamp(31px,4.3vw,46px);letter-spacing:.12em;
    color:#f7e8c7;text-shadow:0 3px 0 rgba(0,0,0,.24);line-height:1.08;
  }
  .sk-reward-copy{
    margin:8px 0 0;color:rgba(246,236,210,.68);font-size:11px;line-height:1.7;letter-spacing:.04em;
  }
  .sk-reward-cards{
    display:flex;align-items:flex-end;justify-content:center;gap:clamp(8px,1.8vw,18px);
    width:100%;margin:clamp(14px,2.6vh,25px) 0 4px;padding:10px 2px;
  }
  .sk-reward-card{
    width:clamp(112px,18vw,168px);min-height:224px;cursor:pointer;
    transform:rotate(var(--tilt,0deg));
    animation:skRewardIn .46s cubic-bezier(.16,.8,.25,1) backwards;animation-delay:calc(var(--i) * 80ms);
  }
  .sk-reward-card:hover:not(:disabled){transform:translateY(-14px) rotate(0) scale(1.035)}
  .sk-reward-card.is-focused{box-shadow:0 4px 0 #0c1d13,0 16px 26px rgba(0,0,0,.4),0 0 0 2px var(--gold-2),0 0 28px rgba(246,221,160,.2)}
  @keyframes skRewardIn{from{opacity:0;transform:translateY(22px) scale(.94) rotate(var(--tilt,0deg))}to{opacity:1;transform:translateY(0) scale(1) rotate(var(--tilt,0deg))}}
  .sk-reward-card .sk-card-playhint{opacity:1;transform:translateX(-50%);bottom:8px;background:rgba(26,42,29,.92)}
  .sk-reward-foot{
    display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;
    color:rgba(246,236,211,.45);font-size:9px;letter-spacing:.04em;margin-top:3px;
  }
  .sk-reward-foot .sk-swatch{width:5px;height:5px;border-radius:50%;background:var(--gold);opacity:.7}
  .sk-reward-hint{margin-top:6px;font-family:var(--mono);font-size:9px;color:rgba(246,236,211,.35)}

  /* end screens */
  .sk-end{
    width:min(760px,100%);display:flex;flex-direction:column;align-items:center;text-align:center;padding:4px 0;
  }
  .sk-end-seal{
    width:74px;height:74px;border-radius:50%;display:grid;place-items:center;margin-bottom:11px;
    background:radial-gradient(circle at 35% 26%,#fff0b9,#e5b458 55%,#a46b26);
    border:2px solid #18281c;box-shadow:0 5px 0 rgba(3,10,6,.4),0 14px 28px rgba(0,0,0,.3);
    color:#1c2b1c;
  }
  .sk-end-seal svg{width:42px;height:42px}
  .sk-end--lost .sk-end-seal{background:radial-gradient(circle at 35% 26%,#aab4a2,#6f806c 55%,#42513f);color:#edf0dd}
  .sk-end h2{margin:0;font-family:var(--serif);font-size:clamp(34px,5vw,54px);letter-spacing:.12em;color:#f8e9c6;line-height:1.1;text-shadow:0 3px 0 rgba(0,0,0,.23)}
  .sk-end--lost h2{color:#e8bd9d;font-size:clamp(30px,4.4vw,46px)}
  .sk-end-copy{margin:9px 0 0;color:rgba(246,236,210,.64);font-size:11.5px;line-height:1.75;letter-spacing:.04em;max-width:530px}
  .sk-end-stats{
    display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;width:min(580px,100%);
    margin:clamp(15px,2.8vh,25px) 0 0;border:1px solid rgba(246,221,160,.17);border-radius:12px;overflow:hidden;
    background:rgba(8,22,14,.36);
  }
  .sk-stat{padding:10px 6px 11px;background:rgba(7,19,12,.26);display:flex;flex-direction:column;gap:3px}
  .sk-stat b{font-family:var(--mono);font-size:19px;color:var(--gold-2);font-weight:700}
  .sk-stat span{font-size:8px;letter-spacing:.12em;color:rgba(246,236,211,.48)}
  .sk-end-deck{width:min(580px,100%);margin-top:14px;text-align:left}
  .sk-end-deck__head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:7px}
  .sk-end-deck__head span{font-family:var(--serif);font-size:10px;letter-spacing:.1em;color:rgba(246,221,160,.72)}
  .sk-end-deck__head small{font-family:var(--mono);font-size:8px;color:rgba(246,236,211,.34)}
  .sk-deck-chips{display:flex;flex-wrap:wrap;gap:5px;max-height:98px;overflow-y:auto;padding-right:3px}
  .sk-deck-chip{display:inline-flex;align-items:center;gap:4px;border:1px solid rgba(246,221,160,.16);border-radius:6px;padding:3px 6px;background:rgba(10,26,17,.44);font-size:9px;color:rgba(246,236,211,.72)}
  .sk-deck-chip i{width:5px;height:5px;border-radius:50%;background:var(--red)}
  .sk-deck-chip.type-defense i{background:#69a9b0}.sk-deck-chip.type-skill i{background:#b093c7}
  .sk-deck-chip b{font-family:var(--mono);font-size:8px;color:rgba(246,233,201,.48)}
  .sk-end-actions{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:clamp(15px,2.7vh,24px)}
  .sk-btn-secondary{
    min-height:40px;padding:0 18px;border-radius:9px;border:1px solid rgba(246,221,160,.28);
    color:rgba(247,236,210,.78);font-family:var(--serif);font-size:12px;letter-spacing:.05em;
    background:rgba(8,22,14,.42);transition:.18s;

  /* ------------------------------------------------------------------ *
   * Asset loading + introspective renders
   * ------------------------------------------------------------------ */
  var artImages = {};
  var assetsSettled = 0;
  var assetsTotal = 0;
  ['hero', 'enemy', 'pickup', 'background'].forEach(function (key) {
    if (!ASSETS[key]) return;
    assetsTotal++;
    var img = new Image();
    img.onload = function () { assetsSettled++; imageSettled(); };
    img.onerror = function () { assetsSettled++; imageSettled(); };
    img.src = ASSETS[key];
    artImages[key] = img;
  });
  function imageSettled() {
    if (assetsSettled < assetsTotal) return;
    postRenders();
  }
  function renderSlots(size) {
    size = size || 256;
    var out = {};
    ['hero', 'enemy', 'pickup'].forEach(function (key) {
      var img = artImages[key];
      if (!img || !img.naturalWidth) return;
      var c = document.createElement('canvas');
      c.width = size; c.height = size;
      var g = c.getContext('2d');
      var margin = size * 0.055;
      var box = size - margin * 2;
      var scale = Math.min(box / img.naturalWidth, box / img.naturalHeight);
      var w = img.naturalWidth * scale;
      var h = img.naturalHeight * scale;
      g.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
      try { out[key] = c.toDataURL('image/png'); } catch (e) { /* ignore */ }
    });
    return out;
  }
  function postRenders() {
    try {
      if (window.parent && window.parent !== window) {

      }

  }

  /* ------------------------------------------------------------------ *

  function cardDef(id) { return CARD_LIB[id]; }
  function cardType(id) { return CARD_LIB[id] ? CARD_LIB[id].type : 'skill'; }
  function typeClass(type) { return 'type-' + type; }
  function maxEnergy() { return R.energyPerTurn; }
  function attackValue(base) {
    var d = Math.max(0, base + player.strength);
    if (enemy.vulnerable > 0) d = Math.round(d * 1.5);
    return Math.max(0, d);
  }
  function blockValue(base) { return Math.max(0, base); }
  function enemyAttackValue(base) {
    var d = Math.max(0, base + enemy.strength);
    if (enemy.weak > 0) d = Math.round(d * 0.75);
    d = Math.round(d * R.enemyDamageScale);
    return Math.max(0, d);
  }
  function cardDescription(def, rawStats) {
    var e = def.effects || {};
    var parts = [];
    if (e.shieldBash) {
      var gainBlk = rawStats ? e.block : blockValue(e.block);
      var bashDmg = rawStats ? gainBlk : attackValue(player.block + gainBlk);
      parts.push('获得 <b>' + gainBlk + '</b> 格挡，造成等同于当前格挡的 <b>' + bashDmg + '</b> 伤害。');
      return parts.join(' ');
    }
    if (e.damage) {
      var dmg = rawStats ? Math.max(0, e.damage) : attackValue(e.damage);
      if (e.hits > 1) parts.push('造成 <b>' + dmg + '</b> 伤害 ×<b>' + e.hits + '</b>。');
      else parts.push('造成 <b>' + dmg + '</b> 点伤害。');
    }
    if (e.poison) parts.push('施加 <b>' + e.poison + '</b> 层剧毒。');
    if (e.vulnerable) parts.push('施加 <b>' + e.vulnerable + '</b> 回合易伤。');
    if (e.weak) parts.push('施加 <b>' + e.weak + '</b> 层虚弱。');
    if (e.block) parts.push('获得 <b>' + (rawStats ? e.block : blockValue(e.block)) + '</b> 点格挡。');
    if (e.strength) parts.push('获得 <b>' + e.strength + '</b> 点力量。');
    if (e.thorns) parts.push('获得 <b>' + e.thorns + '</b> 点反伤。');
    if (e.heal) parts.push('回复 <b>' + e.heal + '</b> 点生命。');
    if (e.energy) parts.push('获得 <b>' + e.energy + '</b> 点能量。');

  }
  function cardHTML(id, opts) {
    opts = opts || {};
    var def = cardDef(id);
    if (!def) return '';
    var unaffordable = !opts.ignoreCost && def.cost > player.energy;
    var desc = cardDescription(def, opts.rawStats);
    var extraClass = [];
    if (opts.className) extraClass.push(opts.className);

    return '<button class="sk-card ' + typeClass(def.type) + ' rarity-' + def.rarity + ' ' + extraClass.join(' ') + '" type="button"' +

  function intentSummary(intent) {
    if (!intent) return { label: '静观其变', sub: '它还没有动作', cls: 'guard', icon: 'eye' };
    var parts = [];
    var cls = 'guard';
    var icon = intent.icon || 'eye';
    if (intent.damage) {
      var d = enemyAttackValue(intent.damage);
      if (intent.hits > 1) {
        parts.push('伤害 ' + d + '×' + intent.hits);
      } else {
        parts.push('伤害 ' + d);
      }
      cls = 'danger';
      icon = intent.icon || 'sword';
    }
    if (intent.block) parts.push('护甲 +' + intent.block);
    if (intent.strength) parts.push('狂暴 +' + intent.strength);
    if (intent.bind) parts.push('束缚 -1能');
    if (intent.heal) parts.push('回复 ' + intent.heal);
    if (!intent.damage) {
      cls = intent.strength ? 'buff' : 'guard';
    }
    return { label: intent.name, sub: parts.join(' · '), cls: cls, icon: icon };
  }

  function getHandPageSize() {
    var w = window.innerWidth || 390;

  function renderHand() {
    var hasHand = hand.length > 0;
    var pageSize = getHandPageSize();
    var totalPages = Math.max(1, Math.ceil(hand.length / pageSize));
    if (selected >= 0 && selected < hand.length) {
      handPage = Math.floor(selected / pageSize);
    }
    handPage = clamp(handPage, 0, totalPages - 1);

    if (els.handPages) {
      if (hasHand && totalPages > 1) {
        var phtml = '';
        for (var p = 0; p < totalPages; p++) {
          var sIdx = p * pageSize + 1;
          var eIdx = Math.min(hand.length, (p + 1) * pageSize);
          phtml += '<button type="button" class="sk-page-pill' + (p === handPage ? ' is-active' : '') + '" data-hand-page="' + p + '">' +
            '第' + (p + 1) + '页(' + sIdx + '-' + eIdx + ')</button>';
        }
        els.handPages.innerHTML = phtml;
        els.handPages.style.display = 'inline-flex';
      } else {
        els.handPages.innerHTML = '';
        els.handPages.style.display = 'none';
      }

    if (els.handNav) {
      els.handNav.style.display = (hasHand && totalPages > 1) ? 'inline-flex' : 'none';
    }

    if (!hasHand) {
      var title = '手牌已打空';
      var sub = '点击右侧「结束回合」迎接下一轮抽牌。';
      if (state === 'enemy') {
        title = '首领正在行动…';
        sub = '你的护甲将抵御即将到来的攻击。';
      } else if (state === 'victory' || state === 'reward') {
        title = '王冠碎裂';
        sub = '正在开启圣物祝福与战利品宝箱…';

        '<span class="sk-hand-empty__sigil">' + (state === 'enemy' ? ICONS.eye : ICONS.crown) + '</span>' +
        '<span>' + title + '</span><small>' + sub + '</small></div>';
      els.handCount.textContent = '0';
      return;
    }

    var start = handPage * pageSize;
    var end = Math.min(hand.length, start + pageSize);
    var html = '';
    for (var i = start; i < end; i++) {
      html += cardHTML(hand[i], {
        handIndex: i,
        selected: i === selected,
        disabled: !isPlayerTurn(),
        index: i - start
      });
    }
    els.hand.innerHTML = html;
    els.handCount.textContent = hand.length;
  }

  /* ------------------------------------------------------------------ *
   * Floating text, flashes, announcements
   * ------------------------------------------------------------------ */
  function anchorOf(el) {
    var r = el.getBoundingClientRect();
    return { x: r.left + r.width * 0.5, y: r.top + r.height * 0.45 };
  }
  function floatText(target, text, cls) {
    if (!target) return;
    var pos = anchorOf(target);
    var span = document.createElement('span');
    span.className = 'sk-float ' + (cls || '');
    span.textContent = text;
    span.style.left = (pos.x + (Math.random() * 20 - 10)) + 'px';
    span.style.top = pos.y + 'px';
    els.fx.appendChild(span);
    window.setTimeout(function () {
      if (span.parentNode) span.parentNode.removeChild(span);
    }, 1100);
  }
  function flash(kind) {
    els.flash.className = 'sk-screenflash' + (kind === 'gold' ? ' is-gold' : ' is-red');
    void els.flash.offsetWidth;
    els.flash.classList.add(kind === 'gold' ? 'is-gold' : 'is-red');
    window.setTimeout(function () { els.flash.className = 'sk-screenflash'; }, 380);
  }
  function shake(el, strength) {
    if (!el || !el.animate) return;
    try {
      el.animate([
        { transform: 'translateX(0)' },
        { transform: 'translateX(' + (-6 * strength) + 'px) rotate(-.7deg)' },
        { transform: 'translateX(' + (5 * strength) + 'px) rotate(.6deg)' },
        { transform: 'translateX(' + (-2 * strength) + 'px)' },
        { transform: 'translateX(0)' }
      ], { duration: 280, easing: 'ease-out' });
    } catch (e) { /* ignore */ }
  }
  function announce(overline, title, body, ms) {
    var inner = els.announceInner;
    inner.innerHTML = '<p class="sk-overline">' + escapeHTML(overline) + '</p><h3>' + escapeHTML(title) + '</h3>' + (body ? '<p>' + escapeHTML(body) + '</p>' : '');
    els.announce.classList.add('is-open');
    window.clearTimeout(announceTimer);
    announceTimer = window.setTimeout(function () { els.announce.classList.remove('is-open'); }, ms || 1800);
  }
  function toast(text) {
    els.toast.textContent = text;
    els.toast.classList.add('is-open');
    window.clearTimeout(toastTimer);
    toastTimer = window.setTimeout(function () { els.toast.classList.remove('is-open'); }, 1500);
  }

  function makeRewardOptions() {
    var pool = REWARD_POOL.slice();
    var picks = [];
    var count = Math.min(R.rewardChoices, pool.length);
    // Guarantee at least one of the 4 signature tactical cards so players always see the new cards in rewards!
    var sigPool = SIGNATURE_REWARDS.slice();
    if (sigPool.length) {
      var sigPick = sigPool[Math.floor(Math.random() * sigPool.length)];
      picks.push(sigPick);
      pool = pool.filter(function (id) { return id !== sigPick; });
    }
    while (picks.length < count && pool.length) {
      var weighted = [];
      pool.forEach(function (id) {
        var w = RARITY_WEIGHT[cardDef(id).rarity] || 1;
        for (var i = 0; i < Math.max(1, Math.round(w)); i++) weighted.push(id);
      });
      var pick = weighted[Math.floor(Math.random() * weighted.length)];
      picks.push(pick);
      pool = pool.filter(function (id) { return id !== pick; });
    }
    // Ensure at least one defense/skill option alongside attacks
    var hasDefOrSkill = picks.some(function (id) {
      var t = cardDef(id).type;
      return t === 'defense' || t === 'skill';
    });
    if (!hasDefOrSkill && picks.length >= 2) {
      var defCandidates = REWARD_POOL.filter(function (id) {
        return cardDef(id).type === 'defense' && picks.indexOf(id) < 0;
      });
      if (defCandidates.length) {
        picks[picks.length - 1] = defCandidates[Math.floor(Math.random() * defCandidates.length)];
      }
    }
    return shuffle(picks);
  }

    battleToken++;

    var stage = STAGES[currentStage];
    enemy = {
      hp: stage.hp, maxHp: stage.hp, block: 0, strength: 0,
      vulnerable: 0, weak: 0, poison: 0, intentIndex: 0, intent: null
    };
    enemy.intent = pickIntent(0);
    drawPile = shuffle(deck.slice());
    discardPile = [];
    exhaustPile = [];
    hand = [];
    handPage = 0;
    potionUsed = false;
    player.block = 0;
    player.strength = 0;
    player.thorns = 0;
    player.bound = 0;
    player.energy = 0;
    turn = 0;
    state = 'player';
    busy = false;
    phase = 'playing';
    selected = -1;
    els.bossPanel.classList.remove('is-defeated');
    startPlayerTurn(true);
    announce(stage.title, '第 ' + (currentStage + 1) + ' 战 · ' + stage.name, stage.blurb, 2200);
    postPhase();
  }

  function pickIntent(index) {
    var stage = STAGES[currentStage];
    return stage.pattern[index % stage.pattern.length];
  }

  function startPlayerTurn(initial) {
    if (phase !== 'playing' || state === 'reward' || state === 'end') return;
    battleToken++;
    state = 'player';
    busy = false;
    turn++;
    runStats.turns++;
    player.block = 0;
    player.thorns = 0;
    var penalty = player.bound;
    player.bound = 0;
    player.energy = Math.max(0, R.energyPerTurn - penalty);
    if (penalty > 0) toast('黏液束缚：本回合少 1 点能量');

    // Trigger Turn-1 Relic Blessings
    if (turn === 1) {
      var turn1Block = 0;
      if (hasRelic('moss_emblem')) {
        turn1Block += 4;
      }
      if (hasRelic('emerald_chalice')) {
        player.energy += 1;
        floatText(els.heroArt || els.portrait, '圣杯 +1 能量', 'sk-float--heal sk-float--small');
      }
      if (hasRelic('thorn_signet')) {
        turn1Block += 6;
        enemy.vulnerable += 2;
        floatText(els.bossArt, '王戒 易伤 +2', 'sk-float--hurt sk-float--small');
      }
      if (turn1Block > 0) {
        player.block += turn1Block;
        floatText(els.heroArt || els.portrait, '圣物 +' + turn1Block + ' 格挡', 'sk-float--guard sk-float--small');
      }
    }

    handPage = 0;
    drawCards(R.handSize);
    selected = firstPlayableIndex();
    if (selected >= 0) {
      handPage = Math.floor(selected / getHandPageSize());
    }
    renderAll();
    els.endTurn.classList.toggle('is-pulse', false);
    if (!initial && state === 'player') {
      if (turn === 1) toast('每回合抽 ' + R.handSize + ' 张牌');
    }
  }

  function drawCards(n) {
    for (var i = 0; i < n; i++) {
      if (!drawPile.length) {
        if (!discardPile.length) break;
        drawPile = shuffle(discardPile);
        discardPile = [];
      }
      hand.push(drawPile.pop());
    }
  }

  function firstPlayableIndex() {
    for (var i = 0; i < hand.length; i++) {
      if (cardDef(hand[i]).cost <= player.energy) return i;
    }
    return hand.length ? 0 : -1;
  }

  function discardHand() {
    discardPile = discardPile.concat(hand);
    hand = [];
    selected = -1;
    handPage = 0;
  }

  /* ------------------------------------------------------------------ *
   * Player actions (Cards + Emerald Potion)
   * ------------------------------------------------------------------ */
  function usePotion() {
    if (!isPlayerTurn()) return false;
    if (potionUsed) {
      toast('翡翠秘药本战已使用');
      return false;
    }
    potionUsed = true;
    var beforeHp = player.hp;
    player.hp = Math.min(player.maxHp, player.hp + R.potionHeal);
    var healed = player.hp - beforeHp;
    player.energy += R.potionEnergy;
    var beforeHand = hand.length;
    drawCards(R.potionDraw);
    var drawn = hand.length - beforeHand;
    Sound.heal();
    flash('gold');
    floatText(
      els.heroArt || els.portrait,
      '🧪 +' + (healed > 0 ? healed + 'HP ' : '') + '+' + R.potionEnergy + '能量' + (drawn > 0 ? ' +' + drawn + '牌' : ''),
      'sk-float--heal sk-float--small'
    );
    toast('饮用翡翠秘药：回复 ' + R.potionHeal + ' 生命，+1 能量，抽 1 张牌');
    if (selected < 0 || selected >= hand.length) selected = firstPlayableIndex();
    renderAll();
    return true;
  }

  function playSelected() {
    if (!isPlayerTurn()) return;
    if (selected < 0 || selected >= hand.length) selected = firstPlayableIndex();
    if (selected < 0) { toast('没有手牌了'); return; }
    playCard(selected);
  }

  function playCard(index) {
    if (!isPlayerTurn()) return;
    if (index < 0 || index >= hand.length) return;
    var id = hand[index];
    var def = cardDef(id);
    if (!def) return;
    if (def.cost > player.energy) {
      toast('能量不足：' + def.name + ' 需要 ' + def.cost + ' 点能量');
      shake(els.heroStatuses, .5);
      return;
    }
    var effects = def.effects || {};
    player.energy -= def.cost;
    hand.splice(index, 1);
    if (effects.exhaust) exhaustPile.push(id);
    else discardPile.push(id);
    runStats.cardsPlayed++;
    selected = firstPlayableIndex();
    var pageSize = getHandPageSize();
    var maxPage = Math.max(0, Math.ceil(hand.length / pageSize) - 1);
    if (handPage > maxPage) handPage = maxPage;
    renderAll();
    Sound.card();

    // Gain block first so Shield Bash (圣盾猛击) includes the newly gained block in its damage!
    if (effects.block) {
      player.block += blockValue(effects.block);
      floatText(els.heroArt || els.portrait, '+' + blockValue(effects.block) + ' 格挡', 'sk-float--guard sk-float--small');
      Sound.guard();
    }

    // Standard attack damage
    if (effects.damage) {
      var hits = effects.hits || 1;
      for (var h = 0; h < hits; h++) {
        if (enemy.hp <= 0) break;
        var dmg = attackValue(effects.damage);
        resolveDamageToEnemy(dmg);
        if (enemy.hp <= 0) break;
      }
    }

    // Shield Bash (圣盾猛击): deal damage equal to current Block!
    if (effects.shieldBash && enemy.hp > 0) {
      var bashDmg = attackValue(player.block);
      if (bashDmg > 0) {
        resolveDamageToEnemy(bashDmg);
      }
    }

    if (effects.poison && enemy.hp > 0) {
      enemy.poison += effects.poison;
      floatText(els.bossArt, '剧毒 +' + effects.poison, 'sk-float--poison sk-float--small');
    }
    if (effects.vulnerable && enemy.hp > 0) {
      enemy.vulnerable += effects.vulnerable;
      floatText(els.bossArt, '易伤 +' + effects.vulnerable, 'sk-float--hurt sk-float--small');
    }
    if (effects.weak && enemy.hp > 0) {
      enemy.weak += effects.weak;
      floatText(els.bossArt, '虚弱 +' + effects.weak, 'sk-float--guard sk-float--small');
    }
    if (effects.strength) {
      player.strength += effects.strength;
      floatText(els.heroArt || els.portrait, '力量 +' + effects.strength, 'sk-float--heal sk-float--small');
    }
    if (effects.thorns) {
      player.thorns += effects.thorns;
      floatText(els.heroArt || els.portrait, '反伤 ' + effects.thorns, 'sk-float--heal sk-float--small');
    }
    if (effects.heal) {
      var before = player.hp;
      player.hp = Math.min(player.maxHp, player.hp + effects.heal);
      if (player.hp > before) {
        floatText(els.heroArt || els.portrait, '+' + (player.hp - before), 'sk-float--heal');
        Sound.heal();
      }
    }
    if (effects.energy) {
      player.energy += effects.energy;
      floatText(els.heroArt || els.portrait, '+' + effects.energy + ' 能量', 'sk-float--guard sk-float--small');
    }
    if (effects.draw) {
      var beforeHand = hand.length;
      drawCards(effects.draw);
      if (hand.length > beforeHand) floatText(els.portrait, '+' + (hand.length - beforeHand) + ' 抽牌', 'sk-float--guard sk-float--small');
    }
    if (enemy.hp <= 0) {
      winBattle();
      return;
    }
    selected = firstPlayableIndex();
    renderAll();
    if (!isPlayerTurn()) return;
  }

  function resolveDamageToEnemy(amount) {
    if (amount <= 0) return;
    var blocked = Math.min(enemy.block, amount);
    enemy.block -= blocked;
    var hpLoss = amount - blocked;
    if (hpLoss > 0) {
      enemy.hp = Math.max(0, enemy.hp - hpLoss);
      runStats.damage += hpLoss;
      floatText(els.bossArt, '-' + hpLoss, hpLoss >= 14 ? '' : '');
      flash('gold');
      shake(els.bossArt, 1);
      Sound.hit();
    } else {
      floatText(els.bossArt, '格挡 ' + blocked, 'sk-float--guard sk-float--small');
      Sound.guard();
    }
    if (blocked > 0 && hpLoss > 0) {
      floatText(els.bossBlock, '护甲 -' + blocked, 'sk-float--guard sk-float--small');
    }
    renderBoss();
    renderActions();
  }

  function resolveDamageToPlayer(amount) {
    if (amount <= 0) return;
    var blocked = Math.min(player.block, amount);
    player.block -= blocked;
    var hpLoss = amount - blocked;
    if (hpLoss > 0) {
      player.hp = Math.max(0, player.hp - hpLoss);
      floatText(els.heroArt || els.portrait, '-' + hpLoss, 'sk-float--hurt');
      flash('red');
      shake(els.portrait, 1);
      Sound.hurt();
    } else {
      floatText(els.portrait, '格挡 ' + blocked, 'sk-float--guard');
      Sound.guard();
    }
    if (blocked > 0 && hpLoss > 0) {
      floatText(els.heroBlock, '护甲 -' + blocked, 'sk-float--guard sk-float--small');
    }
    renderHero();
    renderActions();
  }

  function endTurn() {
    if (!isPlayerTurn()) return;
    battleToken++;
    state = 'enemy';
    busy = true;
    selected = -1;
    discardHand();
    renderAll();
    var token = battleToken;
    later(function () { enemyTurnStart(token); }, 380);
  }

  function later(fn, ms) {
    var token = battleToken;
    window.setTimeout(function () {
      if (token !== battleToken) return;
      fn();
    }, ms);
  }

  function enemyTurnStart(token) {
    if (token !== battleToken || state !== 'enemy') return;
    // Enemy block wears off just before it acts; block it gained last turn
    // protected it through your whole turn.
    enemy.block = 0;
    renderBoss();
    if (enemy.poison > 0) {
      var p = enemy.poison;
      enemy.poison = Math.max(0, enemy.poison - 1);
      enemy.hp = Math.max(0, enemy.hp - p);
      runStats.damage += p;
      floatText(els.bossArt, '-' + p + ' 剧毒', 'sk-float--poison');
      flash('gold');
      Sound.hit();
      renderBoss();
      if (enemy.hp <= 0) { winBattle(); return; }
    }
    var action = enemy.intent;
    if (!action) { startPlayerTurn(false); return; }
    var info = intentSummary(action);
    els.intent.className = 'sk-intent sk-intent--' + info.cls + ' is-thinking';
    els.intent.innerHTML = '<span class="sk-intent__icon">' + (ICONS[info.icon] || ICONS.eye) + '</span><span class="sk-intent__copy"><b>' + escapeHTML(action.name) + '</b><small>正在发动…</small></span>';
    later(function () { resolveEnemyAction(action, token); }, 480);
  }

  function resolveEnemyAction(action, token) {
    if (token !== battleToken || state !== 'enemy') return;
    var hits = action.hits || 1;
    if (action.damage) {
      for (var i = 0; i < hits; i++) {
        var hit = enemyAttackValue(action.damage);
        resolveDamageToPlayer(hit);
        if (player.hp <= 0) break;
        if (player.thorns > 0 && enemy.hp > 0) {
          var reflect = player.thorns;
          enemy.hp = Math.max(0, enemy.hp - reflect);
          runStats.damage += reflect;
          floatText(els.bossArt, '反伤 -' + reflect, 'sk-float--heal sk-float--small');
          renderBoss();
          if (enemy.hp <= 0) break;
        }
      }
    }
    if (action.block) {
      enemy.block += action.block;
      floatText(els.bossArt, '+' + action.block + ' 护甲', 'sk-float--guard sk-float--small');
    }
    if (action.strength) {
      enemy.strength += action.strength;
      floatText(els.bossArt, '力量 +' + action.strength, 'sk-float--hurt sk-float--small');
    }
    if (action.heal && enemy.hp > 0) {
      var before = enemy.hp;
      enemy.hp = Math.min(enemy.maxHp, enemy.hp + action.heal);
      if (enemy.hp > before) floatText(els.bossArt, '+' + (enemy.hp - before), 'sk-float--heal');
    }
    if (action.bind && player.hp > 0) {
      player.bound += action.bind;
      floatText(els.portrait, '束缚', 'sk-float--guard sk-float--small');
    }
    // Durations tick after the boss acts
    if (enemy.vulnerable > 0) enemy.vulnerable--;
    if (enemy.weak > 0) enemy.weak--;
    renderHero();
    renderBoss();
    renderActions();
    Sound.guard();

    if (player.hp <= 0) {
      loseBattle();
      return;
    }
    if (enemy.hp <= 0) {
      winBattle();
      return;
    }
    enemy.intentIndex = (enemy.intentIndex + 1) % STAGES[currentStage].pattern.length;
    enemy.intent = pickIntent(enemy.intentIndex);
    later(function () {
      if (state !== 'enemy') return;
      startPlayerTurn(false);
    }, 680);
  }

  /* ------------------------------------------------------------------ *
   * Win / lose / reward + Relic Blessing Grants
   * ------------------------------------------------------------------ */
  function grantStageRelic(stageIndex) {
    lastGrantedRelicId = null;
    if (stageIndex === 0 && !hasRelic('emerald_chalice')) {
      relics.push('emerald_chalice');
      lastGrantedRelicId = 'emerald_chalice';
      // Emerald Chalice heals 12 HP immediately upon clearing Stage 1!
      player.hp = Math.min(player.maxHp, player.hp + 12);
    } else if (stageIndex === 1 && !hasRelic('thorn_signet')) {
      relics.push('thorn_signet');
      lastGrantedRelicId = 'thorn_signet';
    }
  }

  function winBattle() {
    if (state === 'victory' || state === 'reward' || phase === 'won') return;
    state = 'victory';
    busy = true;
    enemy.hp = 0;
    var stage = STAGES[currentStage];
    runStats.stages = Math.max(runStats.stages, currentStage + 1);
    grantStageRelic(currentStage);
    renderAll();
    var relicNote = lastGrantedRelicId ? '获得圣物【' + relicDef(lastGrantedRelicId).name + '】与战利品卡牌！' : '它退回黏液池，留下了一些战利品。';
    announce('王冠碎裂', stage.shortName + ' · 讨伐成功', relicNote, 1800);
    Sound.win();
    later(function () { showReward(); }, 980);
  }

  function loseBattle() {
    if (state === 'end') return;
    state = 'end';
    busy = true;
    player.hp = 0;
    runStats.deaths++;
    renderAll();
    announce('战斗结束', '你被黏液吞没了…', '已选入牌组的战利品与圣物会保留，可以从本战重新开始。', 1700);
    later(function () { showDefeat(); }, 980);
  }

  function chooseReward(index) {
    if (state !== 'reward') return;
    var id = rewardOptions[index];
    if (!id) return;
    var def = cardDef(id);
    if (!def) return;
    deck.push(id);
    lastRewardCardId = id;
    state = 'reward-picked';
    closeOverlay();
    Sound.pick();
    toast('《' + def.name + '》已加入牌组');
    if (currentStage < STAGES.length - 1) {
      player.maxHp += R.maxHpGain;
      player.hp = Math.min(player.maxHp, player.hp + R.healBetweenBattles);
      currentStage++;
      startBattle(currentStage);
      later(function () { toast('生命上限 +' + R.maxHpGain + ' · 回复 ' + R.healBetweenBattles + ' 生命'); }, 1400);
    } else {
      showVictory();
    }
  }

  function retryStage() {
    closeOverlay();
    closeModal();
    player.hp = player.maxHp;
    player.block = 0;
    player.thorns = 0;
    player.bound = 0;
    player.strength = 0;
    phase = 'playing';
    startBattle(currentStage);
    toast('重整旗鼓 · 生命已回满');
  }

  function newRun() {
    closeOverlay();
    closeModal();
    resetRun();
  }

  /* ------------------------------------------------------------------ *
   * Keyboard + pointer events
   * ------------------------------------------------------------------ */
  function startGame() {
    if (phase !== 'title') return;
    Sound.start();
    resetRun();
  }

  function scrollHand(dir) {
    var pageSize = getHandPageSize();
    var totalPages = Math.max(1, Math.ceil(hand.length / pageSize));
    if (totalPages > 1) {
      handPage = clamp(handPage + dir, 0, totalPages - 1);
      renderHand();
      return;
    }
    if (!els.handScroll) return;
    var card = els.hand ? els.hand.querySelector('.sk-card') : null;
    var step = card ? card.getBoundingClientRect().width + 10 : 128;
    if (els.handScroll.scrollBy) {
      try { els.handScroll.scrollBy({ left: dir * step, behavior: 'smooth' }); return; } catch (e) { /* fall through */ }
    }
    els.handScroll.scrollLeft += dir * step;
  }

  function handleAction(action) {
    switch (action) {
      case 'start':
        startGame();
        break;
      case 'potion':
        usePotion();
        break;
      case 'hand-prev':
        scrollHand(-1);
        break;
      case 'hand-next':
        scrollHand(1);
        break;
      case 'help':
        showHelp();
        break;
      case 'deck':
        showDeck();
        break;
      case 'mute':
        toggleMute();
        break;
      case 'close-modal':
        closeModal();
        break;
      case 'end-turn':
        endTurn();
        break;
      case 'retry-stage':
        retryStage();
        break;
      case 'new-run':
        newRun();
        break;
      default:
        break;
    }
  }

  document.addEventListener('click', function (e) {
    var target = e.target;
    if (!(target instanceof Element)) return;
    var pageEl = target.closest('[data-hand-page]');
    if (pageEl) {
      handPage = Number(pageEl.getAttribute('data-hand-page')) || 0;
      renderHand();
      return;
    }
    var relicEl = target.closest('[data-relic-id]');
    if (relicEl) {
      var rDef = relicDef(relicEl.getAttribute('data-relic-id'));
      if (rDef) toast(rDef.emoji + ' ' + rDef.name + '：' + rDef.desc);
      return;
    }
    var actionEl = target.closest('[data-action]');
    if (actionEl) {
      handleAction(actionEl.getAttribute('data-action'));
      return;
    }
    var rewardEl = target.closest('[data-reward-index]');
    if (rewardEl && state === 'reward') {
      chooseReward(Number(rewardEl.getAttribute('data-reward-index')));
      return;
    }
    var cardEl = target.closest('[data-hand-index]');
    if (cardEl && isPlayerTurn()) {
      playCard(Number(cardEl.getAttribute('data-hand-index')));
      return;
    }
  });

  document.addEventListener('keydown', function (e) {
    var key = (e.key || '').toLowerCase();
    var code = e.code || '';
    if (key === 'tab') return;
    if (modalOpen) {
      if (key === 'escape') { e.preventDefault(); closeModal(); }
      return;
    }
    if (phase === 'title') {
      if (key === 'h' || key === '?' || key === 'escape') {
        if (key !== 'escape') showHelp();
        return;
      }
      if (['enter', ' ', 'spacebar', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].indexOf(key) >= 0) {
        e.preventDefault();
        startGame();
      }
      return;
    }
    if (overlayMode === 'reward') {
      if (key === 'arrowleft' || key === 'arrowup') {
        e.preventDefault();
        rewardFocus = (rewardFocus - 1 + rewardOptions.length) % rewardOptions.length;
        bindRewardFocus();
      } else if (key === 'arrowright' || key === 'arrowdown') {
        e.preventDefault();
        rewardFocus = (rewardFocus + 1) % rewardOptions.length;
        bindRewardFocus();
      } else if (key === 'enter' || key === ' ' || key === 'spacebar') {
        e.preventDefault();
        chooseReward(rewardFocus);
      } else if (/^[1-9]$/.test(key)) {
        var idx = Number(key) - 1;
        if (idx < rewardOptions.length) chooseReward(idx);
      }
      return;
    }
    if (phase === 'won' || phase === 'lost') {
      if (key === 'enter' || key === ' ' || key === 'spacebar') {
        e.preventDefault();
        if (phase === 'won') newRun();
        else retryStage();
      }
      return;
    }
    if (state === 'player') {
      if (key === 'q' || code === 'KeyQ') {
        e.preventDefault();
        usePotion();
        return;
      }
      if (key === 'arrowleft') {
        e.preventDefault();
        if (hand.length) {
          selected = (selected - 1 + hand.length) % hand.length;
          handPage = Math.floor(selected / getHandPageSize());
          renderHand();
        }
      } else if (key === 'arrowright') {
        e.preventDefault();
        if (hand.length) {
          selected = (selected + 1) % hand.length;
          handPage = Math.floor(selected / getHandPageSize());
          renderHand();
        }
      } else if (key === 'arrowup') {
        e.preventDefault();
        playSelected();
      } else if (key === 'arrowdown' || key === 'e' || key === 'end') {
        e.preventDefault();
        endTurn();
      } else if (key === 'enter' || key === ' ' || key === 'spacebar') {
        e.preventDefault();
        playSelected();
      } else if (/^[1-5]$/.test(key)) {
        e.preventDefault();
        var n = Number(key) - 1;
        if (n < hand.length) playCard(n);
      } else if (key === 'h' || key === '?') {
        e.preventDefault();
        showHelp();
      }
      return;
    }
    if (key === 'm') {
      toggleMute();
    }
  });

  window.addEventListener('resize', function () {
    if (phase === 'playing') renderHand();
  });

  /* ------------------------------------------------------------------ *
   * Introspection + Studio Contracts (__gameState & __autoplay)
   * ------------------------------------------------------------------ */
  function postPhase() {
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ source: 'dsh-game-studio', type: 'state', phase: phase, score: runScore(), stage: currentStage + 1, turn: turn }, '*');
      }
    } catch (e) { /* ignore */ }
  }
  function postError(message) {
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ source: 'dsh-game-studio', type: 'error', message: String(message).slice(0, 300) }, '*');
      }
    } catch (e) { /* ignore */ }
  }
  function runScore() {
    return Math.round(runStats.damage + runStats.stages * 80 + Math.max(0, runStats.turns));
  }

  window.__gameState = function () {
    function round(v) {
      if (typeof v !== 'number' || !isFinite(v)) return 0;
      var r = Math.round(v * 100) / 100;
      return r === 0 ? 0 : r;
    }
    var hearts = phase === 'lost' ? 0 : Math.max(0, Math.ceil((player.hp / Math.max(1, player.maxHp)) * 3));
    return {
      phase: phase,
      score: runScore(),
      hearts: hearts,
      fps: round(fps),
      hero: { x: 110, y: 380 },
      enemies: (phase === 'won' || state === 'victory' || state === 'reward') ? [] : [{ x: 280, y: 380 }],
      pickups: potionUsed ? [] : [{ x: 320, y: 80 }],
      world: { w: 390, h: 844 },
      heroOnScreen: true,
      state: state,
      stage: currentStage + 1,
      stageName: STAGES[currentStage].name,
      turn: turn,
      playerHp: round(player.hp),
      playerMaxHp: round(player.maxHp),
      playerBlock: round(player.block),
      energy: round(player.energy),
      energyMax: R.energyPerTurn,
      relics: relics.slice(),
      potionAvailable: !potionUsed,
      hand: hand.map(function (id) { return cardDef(id).name; }),
      handIds: hand.slice(),
      handSize: hand.length,
      handPage: handPage,
      bossHp: round(enemy.hp),
      bossMaxHp: round(enemy.maxHp),
      bossBlock: round(enemy.block),
      bossPoison: round(enemy.poison),
      bossVulnerable: round(enemy.vulnerable),
      deckSize: deck.length,
      rewardOpen: state === 'reward'
    };
  };

  /* AI Tactician for automated verification & playtest */
  var lastAutoAt = 0;
  window.__autoplay = function () {
    var now = Date.now();
    if (now - lastAutoAt < 140) return;
    lastAutoAt = now;

    if (modalOpen) {
      closeModal();
      return;
    }
    if (phase === 'title') {
      startGame();
      return;
    }
    if (phase === 'lost') {
      retryStage();
      return;
    }
    if (phase === 'won') {
      return;
    }
    if (state === 'reward' && rewardOptions.length) {
      // Score reward cards: prioritize 0-cost draw/energy, Shield Bash, Thunder Breaker, Venom Blade, Focus, Leech
      var bestIdx = 0;
      var bestVal = -999;
      var rewardPriority = {
        battle_trance: 95,
        shield_bash: 90,
        thunder_breaker: 88,
        venom_blade: 85,
        leech: 82,
        focus: 80,
        fortify: 76,
        execute: 74,
        twin: 70,
        thorn: 68,
        quick: 65,
        cleave: 62,
        bash: 60,
        mend: 58,
        mist: 55
      };
      for (var r = 0; r < rewardOptions.length; r++) {
        var rId = rewardOptions[r];
        var val = rewardPriority[rId] || 50;
        if (val > bestVal) {
          bestVal = val;
          bestIdx = r;
        }
      }
      chooseReward(bestIdx);
      return;
    }
    if (!isPlayerTurn()) return;

    // 1. Check if we should use Emerald Potion (🧪 翡翠秘药):
    // Use when HP is below 75% or when out of energy with cards in hand or on boss stage 2/3 turn 1-2 for tempo
    var incomingDmg = 0;
    if (enemy.intent && enemy.intent.damage) {
      incomingDmg = enemyAttackValue(enemy.intent.damage) * (enemy.intent.hits || 1);
    }
    var unblockedDmg = Math.max(0, incomingDmg - player.block);
    if (!potionUsed) {
      var needHeal = player.hp <= player.maxHp - R.potionHeal;
      var needTempo = player.energy === 0 && hand.length > 0;
      var dangerTurn = unblockedDmg >= Math.max(8, player.hp * 0.35);
      if (needHeal || needTempo || dangerTurn) {
        usePotion();
        return;
      }
    }

    // 2. Pick the highest-priority playable card in hand
    var playable = [];
    for (var i = 0; i < hand.length; i++) {
      var cid = hand[i];
      var def = cardDef(cid);
      if (def && def.cost <= player.energy) {
        playable.push({ index: i, id: cid, def: def });
      }
    }

    if (!playable.length) {
      endTurn();
      return;
    }

    // Evaluate each playable card tactically
    var bestCard = playable[0];
    var bestScore = -9999;
    for (var j = 0; j < playable.length; j++) {
      var item = playable[j];
      var c = item.def;
      var eff = c.effects || {};
      var sc = 0;

      // Always play 0-cost energy/draw cards first (战意激昂, 凝神, 疾刺)
      if (c.cost === 0) sc += 200;
      if (eff.energy) sc += eff.energy * 90;
      if (eff.draw) sc += eff.draw * 35;

      // Calculate lethal or direct attack value
      var estDmg = 0;
      if (eff.damage) {
        estDmg += attackValue(eff.damage) * (eff.hits || 1);
      }
      if (eff.shieldBash) {
        var newBlock = player.block + (eff.block ? blockValue(eff.block) : 0);
        estDmg += attackValue(newBlock);
      }
      var effectiveEnemyHp = enemy.hp + enemy.block;
      if (estDmg >= effectiveEnemyHp) {
        // Lethal! Play immediately!
        sc += 1000 + estDmg;
      }

      // Apply Vulnerable (雷霆破甲 / 重锤) BEFORE other attacks!
      if (eff.vulnerable && enemy.vulnerable === 0) {
        sc += 140;
      }
      // Strength buff early in turn
      if (eff.strength) {
        sc += 130;
      }
      // Poison (淬毒短刃) ticks every turn ignoring armor
      if (eff.poison) {
        sc += eff.poison * 18;
      }
      // If we already have block and have Shield Bash (圣盾猛击), huge combo!
      if (eff.shieldBash) {
        sc += 95 + player.block * 8;
      }
      // If we have Shield Bash in hand and haven't played it yet, playing a pure block card first boosts Shield Bash!
      var hasShieldBashInHand = hand.some(function (hid, hIdx) {
        return hid === 'shield_bash' && hIdx !== item.index;
      });
      if (eff.block && !eff.shieldBash && hasShieldBashInHand && player.energy >= c.cost + 1) {
        sc += 125;
      }

      // Defense valuation when boss is attacking
      if (eff.block) {
        var neededBlock = Math.max(0, incomingDmg - player.block);
        if (neededBlock > 0) {
          sc += Math.min(neededBlock, eff.block) * 9 + 40;
        } else {
          sc += eff.block * 2;
        }
      }
      if (eff.weak && incomingDmg > 0 && enemy.weak === 0) {
        sc += 75;
      }
      if (eff.thorns && incomingDmg > 0) {
        sc += 65 * (enemy.intent && enemy.intent.hits ? enemy.intent.hits : 1);
      }
      if (eff.heal) {
        var missingHp = player.maxHp - player.hp;
        sc += Math.min(missingHp, eff.heal) * 8;
      }

      // Add raw damage value
      sc += estDmg * 6;

      if (sc > bestScore) {
        bestScore = sc;
        bestCard = item;
      }
    }

    playCard(bestCard.index);
  };

  window.addEventListener('error', function (e) {
    postError(e && e.message ? e.message : 'Unknown error');
  });
  window.addEventListener('unhandledrejection', function (e) {
    var m = (e && e.reason && e.reason.message) ? e.reason.message : String(e && e.reason);
    postError(m);
  });

  /* ------------------------------------------------------------------ *
   * FPS loop + boot
   * ------------------------------------------------------------------ */
  function frame(now) {
    requestAnimationFrame(frame);
    if (!lastFrame) lastFrame = now;
    var dt = (now - lastFrame) / 1000;
    lastFrame = now;
    if (dt > 0 && dt < 0.4) {
      frameCount++;
      fpsAccum += dt;
      if (fpsAccum >= 0.6) {
        fps = Math.round(frameCount / fpsAccum);
        frameCount = 0;
        fpsAccum = 0;
      }
    }
  }
  requestAnimationFrame(frame);

  // Start with a title screen. `resetRun` is only called after a gesture.
  showTitle();
  renderRelicBar();
  renderBoss();
  renderHero();
  renderIntent();
  renderActions();
  renderHand();
  postPhase();
})();
</script>
