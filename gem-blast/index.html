  function drawLandscapeTipPanel(rect, lines, heading) {
    drawGlassPanel(rect.x, rect.y, rect.w, rect.h, Math.min(18, rect.w * 0.07), {
      top: 'rgba(45,31,77,0.84)',
      mid: 'rgba(22,16,44,0.84)',
      bottom: 'rgba(12,9,27,0.9)'
    });
    var pad = clamp(rect.w * 0.075, 10, 18);
    var headingSize = clamp(rect.w * 0.062, 11, 16);
    var lineSize = clamp(rect.w * 0.055, 10, 15);
    var y = rect.y + pad + headingSize * 0.6;
    drawTextLine(heading, rect.x + pad, y, headingSize, '700', 'rgba(255,224,163,0.7)', 'left', rect.w - pad * 2);
    y += headingSize * 1.65;
    for (var i = 0; i < lines.length; i++) {
      drawTextLine(lines[i], rect.x + pad, y, lineSize, '500', 'rgba(223,211,245,0.7)', 'left', rect.w - pad * 2);
      y += lineSize * 1.55;
    }
  }

  function drawTimerRing() {
    var t = layout.timer;
    var ratio = clamp(time / DURATION, 0, 1);
    var low = time <= 10 && phase === 'playing';
    var labelSize = clamp(t.r * 0.25, 11, 18);
    var numberSize = t.r * 0.66;
    ctx.save();
    var glow = ctx.createRadialGradient(t.cx, t.cy, t.r * 0.1, t.cx, t.cy, t.r * 1.5);
    glow.addColorStop(0, low ? 'rgba(255,104,132,0.16)' : 'rgba(111,206,255,0.10)');
    glow.addColorStop(1, 'rgba(12,10,28,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(t.cx - t.r * 1.5, t.cy - t.r * 1.5, t.r * 3, t.r * 3);

    ctx.beginPath();
    ctx.arc(t.cx, t.cy, t.r, 0, TAU);
    var inner = ctx.createRadialGradient(t.cx - t.r * 0.25, t.cy - t.r * 0.35, t.r * 0.1, t.cx, t.cy, t.r);
    inner.addColorStop(0, 'rgba(46,34,78,0.95)');
    inner.addColorStop(1, 'rgba(15,11,31,0.96)');
    ctx.fillStyle = inner;
    ctx.fill();

    ctx.lineWidth = Math.max(5, t.r * 0.11);
    ctx.strokeStyle = 'rgba(255,255,255,0.07)';
    ctx.beginPath();
    ctx.arc(t.cx, t.cy, t.r * 0.86, 0, TAU);
    ctx.stroke();

    var ringG = ctx.createLinearGradient(t.cx - t.r, t.cy - t.r, t.cx + t.r, t.cy + t.r);
    if (low) {
      ringG.addColorStop(0, '#ff8c9c');
      ringG.addColorStop(1, '#ffc56f');
    } else {
      ringG.addColorStop(0, '#87e9ff');
      ringG.addColorStop(0.55, '#9ca8ff');
      ringG.addColorStop(1, '#ffd286');
    }
    ctx.strokeStyle = ringG;
    ctx.lineCap = 'round';
    ctx.lineWidth = Math.max(5, t.r * 0.11);
    ctx.beginPath();
    ctx.arc(t.cx, t.cy, t.r * 0.86, -Math.PI / 2, -Math.PI / 2 + TAU * ratio);
    ctx.stroke();

    for (var i = 0; i < 12; i++) {
      var ang = -Math.PI / 2 + i * TAU / 12;
      var x1 = t.cx + Math.cos(ang) * t.r * 0.67;
      var y1 = t.cy + Math.sin(ang) * t.r * 0.67;
      var x2 = t.cx + Math.cos(ang) * t.r * 0.71;
      var y2 = t.cy + Math.sin(ang) * t.r * 0.71;
      ctx.strokeStyle = 'rgba(255,244,219,0.20)';
      ctx.lineWidth = Math.max(1, t.r * 0.018);
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    setFont('600', labelSize);
    ctx.fillStyle = 'rgba(235,228,255,0.52)';
    ctx.fillText('剩余时间', t.cx, t.cy - t.r * 0.42);

    setFont('800', fitSize(formatSeconds(time), '800', numberSize, t.r * 1.25));
    ctx.fillStyle = low ? '#ff95a0' : '#fff1c8';
    ctx.shadowColor = low ? 'rgba(255,91,116,0.4)' : 'rgba(255,210,125,0.3)';
    ctx.shadowBlur = numberSize * 0.32;
    ctx.fillText(formatSeconds(time), t.cx, t.cy + t.r * 0.06);
    ctx.shadowColor = 'transparent';
    setFont('600', labelSize);
    ctx.fillStyle = 'rgba(237,228,255,0.54)';
    ctx.fillText('秒', t.cx, t.cy + t.r * 0.43);
    ctx.restore();
  }

  function drawLandscapeHUD() {
    var L = layout;
    var veilL = ctx.createLinearGradient(0, 0, Math.max(1, L.boardX - 8), 0);
    veilL.addColorStop(0, 'rgba(4,2,13,0.54)');
    veilL.addColorStop(0.72, 'rgba(4,2,13,0.32)');
    veilL.addColorStop(1, 'rgba(4,2,13,0)');
    ctx.fillStyle = veilL;
    ctx.fillRect(0, 0, L.boardX - 8, world.h);
    var veilR = ctx.createLinearGradient(L.boardX + L.boardSize + 8, 0, world.w, 0);
    veilR.addColorStop(0, 'rgba(4,2,13,0)');
    veilR.addColorStop(0.28, 'rgba(4,2,13,0.32)');
    veilR.addColorStop(1, 'rgba(4,2,13,0.54)');
    ctx.fillStyle = veilR;
    ctx.fillRect(L.boardX + L.boardSize + 8, 0, world.w - L.boardX - L.boardSize - 8, world.h);

    drawGradientText(TITLE, L.title.x, L.title.y, L.sideW, L.title.size, '800', 'left');
    drawTextLine(Math.round(DURATION) + ' 秒 · 目标 ' + formatScore(TARGET) + ' 分', L.leftX, L.subtitleY, L.brandSubSize, '600', 'rgba(255,225,169,0.6)', 'left', L.sideW);

    drawStatCard(L.scoreCard, '当前得分', formatScore(score), '', 'score', false);
    drawGoalProgress(L.progress);

    var bestText = bestScore > 0 ? '最高分  ' + formatScore(bestScore) : '第一个目标  ' + formatScore(TARGET);
    drawTextLine(bestText, L.leftX, L.bestY, clamp(L.sideW * 0.058, 10, 14), '500', 'rgba(206,192,235,0.58)', 'left', L.sideW);

    drawLandscapeTipPanel(L.leftTip, [
      '三个同色连成一线',
      '连锁消除获得倍率',
      '达到目标立即获胜'
    ], '玩法');

    drawTimerRing();

    drawPill('目标  ' + formatScore(TARGET) + ' 分', L.rightX + L.sideW / 2, L.targetPillY, clamp(L.sideW * 0.06, 10, 14), {
      border: 'rgba(255,224,163,0.22)',
      top: 'rgba(255,231,176,0.07)',
      color: 'rgba(255,235,195,0.78)'
    });

    drawGlassPanel(L.comboCard.x, L.comboCard.y, L.comboCard.w, L.comboCard.h, Math.min(16, L.comboCard.h * 0.25), {
      top: 'rgba(54,32,76,0.86)',
      mid: 'rgba(29,18,49,0.86)',
      bottom: 'rgba(15,10,27,0.92)',
      border: 'rgba(255,190,220,0.20)'
    });
    var comboPad = clamp(L.comboCard.w * 0.08, 10, 18);
    drawTextLine('连锁加成', L.comboCard.x + comboPad, L.comboCard.y + L.comboCard.h * 0.33,
      clamp(L.comboCard.w * 0.07, 10, 15), '600', 'rgba(238,225,255,0.55)', 'left', L.comboCard.w - comboPad * 2);
    var comboVal = (combo > 1 && comboFlash > 0) ? '×' + combo : '×1';
    drawTextLine(comboVal, L.comboCard.x + comboPad, L.comboCard.y + L.comboCard.h * 0.68,
      clamp(L.comboCard.h * 0.42, 25, 38), '800', (combo > 1 && comboFlash > 0) ? '#ffd27e' : 'rgba(255,255,255,0.68)', 'left', L.comboCard.w - comboPad * 2);
    drawTextLine((combo > 1 && comboFlash > 0) ? '连击！' : '三消即享', L.comboCard.x + L.comboCard.w - comboPad,
      L.comboCard.y + L.comboCard.h * 0.66, clamp(L.comboCard.w * 0.064, 10, 14), '600',
      (combo > 1 && comboFlash > 0) ? 'rgba(255,179,210,0.8)' : 'rgba(202,187,231,0.45)', 'right', L.comboCard.w * 0.48);

    drawLandscapeTipPanel(L.rightHint, [
      '点击两颗相邻宝石',
      '或直接滑动交换',
      'P 暂停 · M 静音'
    ], '操作');

    drawTopButtons();
  }

  function drawHUD() {
    if (layout.portrait) drawPortraitHUD();
    else drawLandscapeHUD();
    if (phase === 'playing' && time <= 10) {
      var alpha = clamp((1 - time / 10) * 0.16, 0, 0.16) + 0.025 * Math.sin(timeGlobal * 8);
      var g = ctx.createRadialGradient(world.w / 2, world.h / 2, Math.min(world.w, world.h) * 0.28, world.w / 2, world.h / 2, Math.max(world.w, world.h) * 0.72);
      g.addColorStop(0, 'rgba(255,52,86,0)');
      g.addColorStop(1, 'rgba(255,43,77,' + alpha + ')');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, world.w, world.h);
    }
  }

  function drawTitleScreen() {
    var W = world.w, H = world.h;
    var portrait = layout.portrait;
    var dim = ctx.createLinearGradient(0, 0, 0, H);
    dim.addColorStop(0, 'rgba(5,3,15,0.65)');
    dim.addColorStop(0.5, 'rgba(4,2,12,0.72)');
    dim.addColorStop(1, 'rgba(2,1,8,0.82)');
    ctx.fillStyle = dim;
    ctx.fillRect(0, 0, W, H);

    var pw = Math.min(W - 40, portrait ? 660 : 700);
    var ph = portrait ? Math.min(H - 60, H * 0.70, 760) : Math.min(H - 48, 620);
    var px = (W - pw) / 2;
    var py = (H - ph) / 2;

    drawGlassPanel(px, py, pw, ph, Math.min(30, pw * 0.045), {
      top: 'rgba(53,35,91,0.90)',
      mid: 'rgba(26,17,53,0.88)',
      bottom: 'rgba(10,8,24,0.94)',
      border: 'rgba(255,225,164,0.30)'
    });

    ctx.save();
    var flourish = [
      [px + pw * 0.08, py + ph * 0.10],
      [px + pw * 0.92, py + ph * 0.10],
      [px + pw * 0.08, py + ph * 0.90],
      [px + pw * 0.92, py + ph * 0.90]
    ];
    for (var fi = 0; fi < flourish.length; fi++) {
      ctx.globalAlpha = 0.42;
      ctx.strokeStyle = 'rgba(255,226,162,0.6)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(flourish[fi][0], flourish[fi][1], 3, 0, TAU);
      ctx.stroke();
    }
    ctx.restore();

    drawGradientText('✦  ' + Math.round(DURATION) + ' 秒 · 三消挑战  ✦', W / 2, py + ph * 0.085, pw * 0.8, clamp(ph * 0.025, 12, 17), '700', 'center');

    var iconY = py + ph * 0.225;
    var iconSize = clamp(ph * 0.17, 70, 120);
    var iconCenter = W / 2;
    var clusterGlow = ctx.createRadialGradient(iconCenter, iconY, 4, iconCenter, iconY, iconSize * 1.8);
    clusterGlow.addColorStop(0, 'rgba(255,206,132,0.20)');
    clusterGlow.addColorStop(0.5, 'rgba(255,133,188,0.08)');
    clusterGlow.addColorStop(1, 'rgba(127,84,220,0)');
    ctx.fillStyle = clusterGlow;
    ctx.fillRect(iconCenter - iconSize * 2, iconY - iconSize * 1.5, iconSize * 4, iconSize * 3);
    ctx.save();
    ctx.translate(iconCenter - iconSize * 0.68, iconY + iconSize * 0.04);
    ctx.rotate(-0.13);
    drawGemSprite(2, 0, 0, iconSize * 0.84, 0, 0.96);
    ctx.restore();
    ctx.save();
    ctx.translate(iconCenter + iconSize * 0.68, iconY + iconSize * 0.02);
    ctx.rotate(0.12);
    drawGemSprite(0, 0, 0, iconSize * 0.84, 0, 0.96);
    ctx.restore();
    drawGemSprite(3, iconCenter, iconY - iconSize * 0.02, iconSize * 1.05, 0, 1);

    drawGradientText(TITLE, W / 2, py + ph * 0.375, pw - 70, clamp(pw * 0.135, 40, 76), '800', 'center');
    drawGoldDivider(W / 2, py + ph * 0.425, pw * 0.34, 0.8);
    drawTextLine('交换相邻宝石，三个同色即可消除', W / 2, py + ph * 0.466, clamp(ph * 0.032, 14, 22), '500', 'rgba(245,235,255,0.82)', 'center', pw - 70);

    var chipY = py + ph * 0.545;
    var chips = [N + ' × ' + N + ' 棋盘', Math.round(DURATION) + ' 秒倒计时', '目标 ' + formatScore(TARGET) + ' 分'];
    var chipSize = clamp(ph * 0.025, 11, 16);
    var chipWidths = [];
    var totalW = 0;
    for (var ci = 0; ci < chips.length; ci++) {
      setFont('600', chipSize);
      chipWidths[ci] = ctx.measureText(chips[ci]).width + chipSize * 1.5;
      totalW += chipWidths[ci];
    }
    var chipGap = chipSize * 0.7;
    totalW += chipGap * (chips.length - 1);
    var chipX = W / 2 - totalW / 2;
    for (ci = 0; ci < chips.length; ci++) {
      drawPill(chips[ci], chipX + chipWidths[ci] / 2, chipY, chipSize, {
        border: 'rgba(255,226,167,0.22)',
        color: 'rgba(255,239,210,0.82)',
        top: 'rgba(255,235,183,0.07)'
      });
      chipX += chipWidths[ci] + chipGap;
    }

    var btnW = Math.min(pw * 0.56, 340);
    var btnH = clamp(ph * 0.095, 50, 68);
    var btnX = W / 2 - btnW / 2;
    var btnY = py + ph * 0.625;
    ctx.save();
    ctx.shadowColor = 'rgba(255,132,171,0.35)';
    ctx.shadowBlur = 24;
    ctx.shadowOffsetY = 8;
    var btnG = ctx.createLinearGradient(btnX, btnY, btnX + btnW, btnY + btnH);
    btnG.addColorStop(0, '#ffe7a6');
    btnG.addColorStop(0.42, '#ffca77');
    btnG.addColorStop(0.72, '#ff9db4');
    btnG.addColorStop(1, '#ffdda0');
    fillRoundRect(ctx, btnX, btnY, btnW, btnH, btnH / 2, btnG);
    ctx.restore();
    ctx.save();
    roundRectPath(ctx, btnX, btnY, btnW, btnH, btnH / 2);
    ctx.clip();
    var btnShine = ctx.createLinearGradient(btnX, btnY, btnX + btnW, btnY + btnH);
    btnShine.addColorStop(0, 'rgba(255,255,255,0.45)');
    btnShine.addColorStop(0.4, 'rgba(255,255,255,0.08)');
    btnShine.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = btnShine;
    ctx.fillRect(btnX, btnY, btnW, btnH);
    ctx.restore();
    ctx.save();
    setFont('800', clamp(btnH * 0.38, 19, 27));
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#4b1e43';
    ctx.fillText('开始挑战', W / 2, btnY + btnH / 2 + 1);
    ctx.restore();

    drawTextLine('点击 / 轻触 / 按任意键开始', W / 2, py + ph * 0.775, clamp(ph * 0.024, 13, 17), '600', 'rgba(255,235,194,0.8)', 'center', pw - 50);
    drawTextLine('点击两颗相邻宝石交换 · 滑动交换 · P 暂停 · M 静音', W / 2, py + ph * 0.823, clamp(ph * 0.021, 11, 15), '500', 'rgba(220,207,244,0.55)', 'center', pw - 50);
    var bestLine = bestScore > 0 ? '最高分  ' + formatScore(bestScore) : '准备好刷新纪录了吗？';
    drawTextLine(bestLine, W / 2, py + ph * 0.872, clamp(ph * 0.023, 12, 16), '600', 'rgba(255,222,162,0.7)', 'center', pw - 50);
    drawGoldDivider(W / 2, py + ph * 0.918, pw * 0.22, 0.5);
  }

  function drawEndScreen() {
    var won = phase === 'won';
    var W = world.w, H = world.h;
    var dim = ctx.createLinearGradient(0, 0, 0, H);
    dim.addColorStop(0, won ? 'rgba(19,8,24,0.72)' : 'rgba(6,5,18,0.78)');
    dim.addColorStop(1, 'rgba(2,1,8,0.88)');
    ctx.fillStyle = dim;
    ctx.fillRect(0, 0, W, H);

    if (won) {
      for (var i = 0; i < confetti.length; i++) {
        var p = confetti[i];
        var a = Math.min(1, (p.life - p.age) * 1.5);
        ctx.save();
        ctx.globalAlpha = clamp(a, 0, 1) * 0.9;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      }
    }

    var pw = Math.min(W - 48, 590);
    var ph = layout.portrait ? Math.min(H - 64, H * 0.55, 570) : Math.min(H - 48, 520);
    var px = (W - pw) / 2;
    var py = (H - ph) / 2;

    drawGlassPanel(px, py, pw, ph, Math.min(28, pw * 0.05), {
      top: won ? 'rgba(65,41,90,0.94)' : 'rgba(39,31,70,0.94)',
      mid: won ? 'rgba(36,21,53,0.94)' : 'rgba(21,16,45,0.94)',
      bottom: 'rgba(9,7,22,0.96)',
      border: won ? 'rgba(255,222,148,0.44)' : 'rgba(171,190,255,0.30)'
    });

    var starCount = won ? 3 : clamp(Math.floor((score / TARGET) * 3), 0, 2);
    var starY = py + ph * 0.145;
    var starGap = Math.min(pw * 0.13, 82);
    for (var si = 0; si < 3; si++) {
      var sx = W / 2 + (si - 1) * starGap;
      var filled = si < starCount;
      drawStarPath(ctx, sx, starY, Math.min(pw * 0.075, 23), Math.min(pw * 0.034, 10), 5, 0);
      if (filled) {
        var sg = ctx.createLinearGradient(sx, starY - 30, sx, starY + 30);
        sg.addColorStop(0, '#fff7da');
        sg.addColorStop(0.45, '#ffd778');
        sg.addColorStop(1, '#f39c48');
        ctx.fillStyle = sg;
        ctx.shadowColor = 'rgba(255,197,101,0.55)';
        ctx.shadowBlur = 18;
        ctx.fill();
        ctx.shadowColor = 'transparent';
      } else {
        ctx.fillStyle = 'rgba(255,255,255,0.08)';
        ctx.fill();
      }
      ctx.strokeStyle = filled ? 'rgba(255,244,201,0.7)' : 'rgba(255,255,255,0.14)';
      ctx.lineWidth = 1.2;
      ctx.stroke();
    }

    var title = won ? '目标达成！' : '时间到！';
    drawGradientText(title, W / 2, py + ph * 0.29, pw - 60, clamp(ph * 0.105, 38, 54), '800', 'center');
    var sub = won ? '你把整个宝石工坊都点亮了' : '再快一点，下一局就属于你';
    drawTextLine(sub, W / 2, py + ph * 0.375, clamp(ph * 0.032, 13, 19), '500', won ? 'rgba(255,230,188,0.78)' : 'rgba(218,215,245,0.68)', 'center', pw - 60);

    drawTextLine('本局得分', W / 2, py + ph * 0.47, clamp(ph * 0.026, 11, 16), '600', 'rgba(224,213,243,0.5)', 'center', pw - 60);
    var scoreStr = formatScore(score);
    var scoreSize = fitSize(scoreStr, '800', clamp(ph * 0.17, 48, 78), pw - 80);
    ctx.save();
    setFont('800', scoreSize);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    var scoreGrad = ctx.createLinearGradient(W / 2 - 100, py + ph * 0.53, W / 2 + 100, py + ph * 0.63);
    scoreGrad.addColorStop(0, '#fff8df');
    scoreGrad.addColorStop(0.5, '#ffdc8c');
    scoreGrad.addColorStop(1, '#ffacd0');
    ctx.fillStyle = scoreGrad;
    ctx.shadowColor = 'rgba(255,181,105,0.32)';
    ctx.shadowBlur = 24;
    ctx.fillText(scoreStr, W / 2, py + ph * 0.55);
    ctx.restore();

    var ratio = clamp(score / TARGET, 0, 1);
    var meterW = pw * 0.58;
    var meterX = W / 2 - meterW / 2;
    var meterY = py + ph * 0.62;
    fillRoundRect(ctx, meterX, meterY, meterW, 9, 5, 'rgba(255,255,255,0.08)');
    fillRoundRect(ctx, meterX, meterY, meterW * ratio, 9, 5, won ? '#ffd378' : 'rgba(140,191,255,0.7)');
    drawTextLine('目标 ' + formatScore(TARGET) + ' 分', W / 2, meterY + 26, clamp(ph * 0.024, 11, 15), '500', 'rgba(227,216,246,0.55)', 'center', pw - 60);

    var extraLine;
    if (won) extraLine = '剩余 ' + formatSeconds(winTimeLeft) + ' 秒 · 最高分 ' + formatScore(bestScore);
    else extraLine = '还差 ' + formatScore(Math.max(0, TARGET - score)) + ' 分达成目标 · 最高分 ' + formatScore(bestScore);
    drawTextLine(extraLine, W / 2, py + ph * 0.73, clamp(ph * 0.022, 11, 15), '500', 'rgba(211,200,237,0.58)', 'center', pw - 60);

    var btnW = Math.min(pw * 0.54, 300);
    var btnH = clamp(ph * 0.10, 46, 64);
    var btnX = W / 2 - btnW / 2;
    var btnY = py + ph * 0.775;
    ctx.save();
    ctx.shadowColor = won ? 'rgba(255,187,103,0.3)' : 'rgba(150,167,255,0.24)';
    ctx.shadowBlur = 20;
    ctx.shadowOffsetY = 7;
    var bg2 = ctx.createLinearGradient(btnX, btnY, btnX + btnW, btnY + btnH);
    if (won) {
      bg2.addColorStop(0, '#ffe9ac');
      bg2.addColorStop(0.55, '#ffc875');
      bg2.addColorStop(1, '#ff9db6');
    } else {
      bg2.addColorStop(0, '#c7ddff');
      bg2.addColorStop(0.55, '#9abfff');
      bg2.addColorStop(1, '#d2b2ff');
    }
    fillRoundRect(ctx, btnX, btnY, btnW, btnH, btnH / 2, bg2);
    ctx.restore();
    ctx.save();
    setFont('800', clamp(btnH * 0.37, 17, 23));
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#371d3b';
    ctx.fillText('再来一局', W / 2, btnY + btnH / 2 + 1);
    ctx.restore();

    drawTextLine('点击任意处 / 按任意键重新开始', W / 2, py + ph * 0.925, clamp(ph * 0.022, 11, 15), '500', 'rgba(219,208,242,0.52)', 'center', pw - 60);
  }

  function drawPauseScreen() {
    var W = world.w, H = world.h;
    ctx.fillStyle = 'rgba(4,3,15,0.68)';
    ctx.fillRect(0, 0, W, H);
    var pw = Math.min(W - 64, 420);
    var ph = 260;
    var px = (W - pw) / 2;
    var py = (H - ph) / 2;
    drawGlassPanel(px, py, pw, ph, 26, {
      top: 'rgba(48,35,78,0.94)',
      mid: 'rgba(24,17,46,0.94)',
      bottom: 'rgba(11,8,26,0.95)',
      border: 'rgba(255,224,163,0.28)'
    });
    var iconY = py + 78;
    ctx.save();
    ctx.fillStyle = 'rgba(255,232,177,0.85)';
    roundRectPath(ctx, W / 2 - 19, iconY - 20, 13, 40, 5);
    ctx.fill();
    roundRectPath(ctx, W / 2 + 6, iconY - 20, 13, 40, 5);
    ctx.fill();
    ctx.restore();
    drawGradientText('已暂停', W / 2, py + 132, pw - 80, 42, '800', 'center');
    drawTextLine('休息一下，宝石不会跑掉', W / 2, py + 174, 15, '500', 'rgba(229,218,248,0.62)', 'center', pw - 60);
    drawTextLine('点击任意处或按 P 继续', W / 2, py + 214, 15, '600', 'rgba(255,228,168,0.78)', 'center', pw - 60);
  }

  /* ================================================================
   * 13. MAIN RENDER + LOOP
   * ================================================================ */
  function render() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    var s = dpr * worldScale;
    ctx.setTransform(s, 0, 0, s, 0, 0);

    drawBackground();

    ctx.save();
    if (shake > 0) {
      var mag = shake * 18 * shakePower;
      ctx.translate((Math.random() - 0.5) * mag, (Math.random() - 0.5) * mag);
    }
    drawBoard();
    drawEffects();
    ctx.restore();

    if (phase === 'title') {
      drawTitleScreen();
      return;
    }

    drawHUD();

    if (paused) {
      drawPauseScreen();
    } else if (phase === 'won' || phase === 'lost') {
      drawEndScreen();
    }
  }

  function frame(now) {
    requestAnimationFrame(frame);
    if (!lastFrame) lastFrame = now;
    var dt = Math.min(0.05, Math.max(0, (now - lastFrame) / 1000));
    lastFrame = now;
    fpsFrames++;
    fpsAcc += dt;
    if (fpsAcc >= 0.5) {
      fps = Math.round(fpsFrames / fpsAcc);
      fpsFrames = 0;
      fpsAcc = 0;
    }
    update(dt);
    render();
  }

  /* ================================================================
   * 14. HOST HOOKS + BOOT
   * ================================================================ */
  function emitPhase() {
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({
          source: 'dsh-game-studio',
          type: 'state',
          phase: phase,
          score: score
        }, '*');
      }
    } catch (e) {}
  }

  function postError(message) {
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({
          source: 'dsh-game-studio',
          type: 'error',
          message: String(message).slice(0, 300)
        }, '*');
      }
    } catch (e) {}
  }

  function renderSlots(size) {
    size = size || 256;
    var map = { hero: 0, enemy: 1, pickup: 3 };
    var out = {};
    for (var key in map) {
      var c = document.createElement('canvas');
      c.width = size;
      c.height = size;
      var g = c.getContext('2d');
      g.translate(size / 2, size / 2);
      drawCharacter(g, key, size * 0.86);
      out[key] = c.toDataURL('image/png');
    }
    return out;
  }
  window.__renderSlots = renderSlots;

  function postRenders() {
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({
          source: 'dsh-game-studio',
          type: 'renders',
          renders: renderSlots(256)
        }, '*');
      }
    } catch (e) { postError('character renders failed: ' + (e && e.message || e)); }
  }

  window.__gameState = function () {
    function round(n) {
      if (typeof n !== 'number' || isNaN(n)) return 0;
      var r = Math.round(n * 100) / 100;
      return r === 0 ? 0 : r;
    }
    var pos = layout ? cellCenter(cursor.r, cursor.c) : { x: world.w / 2, y: world.h / 2 };
    return {
      phase: phase,
      time: round(time),
      score: round(score),
      hearts: 3,
      fps: round(fps),
      hero: { x: round(pos.x), y: round(pos.y) },
      heroOnScreen: true,
      pickups: [],
      enemies: [],
      world: { w: round(world.w), h: round(world.h) },
      targetScore: TARGET,
      boardSize: N,
      paused: !!paused,
      timeUp: !!timeUp
    };
  };

  window.addEventListener('error', function (e) {
    postError(e && e.message ? e.message : 'Unknown error');
  });
  window.addEventListener('unhandledrejection', function (e) {
    var m = (e && e.reason && e.reason.message) ? e.reason.message : String(e && e.reason);
    postError(m);
  });

  buildGemSprites();
  board = generateBoard();
  time = DURATION;
  resize();
  requestAnimationFrame(frame);
  requestAnimationFrame(postRenders);
})();
</script>
</body></html>
