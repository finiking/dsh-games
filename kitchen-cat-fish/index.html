  /* 1. CANVAS + GAME CONFIG ------------------------------------------------ */

    canvas.style.width = '100vw';
    canvas.style.height = '100vh';
    canvas.style.touchAction = 'none';
    canvas.style.background = '#1f1712';
    document.body.appendChild(canvas);

  var ctx = canvas.getContext('2d');
  var TAU = Math.PI * 2;

  var TITLE = GAME.title || '厨房猫偷鱼记';
  document.title = TITLE;
  var SLOTS = GAME.slots || {};
  var ASSETS = GAME.assets || {};

  var DEFAULTS = {
    duration: 60,
    hearts: 3,
    quota: 18,
    heroSpeed: 315,
    enemySpeed: 124,
    enemySpeedGrowth: 1.6,
    enemySpawnEvery: 11,
    maxEnemies: 3,
    maxPickups: 6,
    heroSize: 108,
    enemySize: 86,
    pickupSize: 64,
    shield: { enabled: true, every: 8, seconds: 3.6 },
    seed: 17
  };
  function num(v, fallback) {
    var n = Number(v);
    return isFinite(n) ? n : fallback;
  }
  function resolveRules(src, def) {
    var out = {};
    for (var key in def) {
      if (key === 'shield') {
        var shield = src && src.shield && typeof src.shield === 'object' ? src.shield : {};
        out.shield = {
          enabled: typeof shield.enabled === 'boolean' ? shield.enabled : def.shield.enabled,
          every: Math.max(1, num(shield.every, def.shield.every)),
          seconds: Math.max(0.5, num(shield.seconds, def.shield.seconds))
        };
      } else if (typeof def[key] === 'number') {
        out[key] = num(src && src[key], def[key]);
      } else {
        out[key] = def[key];
      }
    }
    out.duration = Math.max(3, out.duration);
    out.hearts = Math.max(1, Math.round(out.hearts));
    out.quota = Math.max(1, Math.round(out.quota));
    out.maxPickups = Math.max(1, Math.round(out.maxPickups));
    out.maxEnemies = Math.max(1, Math.round(out.maxEnemies));
    out.heroSpeed = Math.max(80, out.heroSpeed);
    out.enemySpeed = Math.max(30, out.enemySpeed);
    out.enemySpawnEvery = Math.max(5, out.enemySpawnEvery);
    out.heroSize = Math.max(44, out.heroSize);
    out.enemySize = Math.max(38, out.enemySize);
    out.pickupSize = Math.max(28, out.pickupSize);
    return out;
  }
  var R = resolveRules(GAME.rules || {}, DEFAULTS);
  var TAU_CLAMP = 0;

  /* 2. SMALL HELPERS ------------------------------------------------------- */

  }

    return clamp(x, floorRect.x + margin, floorRect.x + floorRect.w - margin);

  var shield = 0;
  var shieldCount = 0;
  var invuln = 0;
  var shake = 0;
  var hurtFlash = 0;
  var restartGuard = 0;
  var spawnTimer = R.enemySpawnEvery;
  var clock = 0;
  var lastTime = 0;
  var fps = 0;
  var fpsAccum = 0;
  var fpsFrames = 0;
  var combo = 0;
  var comboTimer = 0;
  var maxCombo = 0;
  var endReason = '';
  var toast = null;
  var muted = false;
  var best = loadBest();

  var hero = {
    x: 0, y: 0, vx: 0, vy: 0,
    facing: 1, walk: 0, move: 0, stepTimer: 0
  };
  var enemies = [];
  var pickups = [];
  var particles = [];
  var floaters = [];
  var footprints = [];
  var joystick = null;
  var keys = Object.create(null);

  /* 5. CUSTOM ART SUPPORT -------------------------------------------------- */
  var images = { hero: null, enemy: null, pickup: null, background: null };
  var custom = { hero: false, enemy: false, pickup: false, background: false };

  function slotIsCustom(key) {
    return !!(SLOTS[key] && SLOTS[key].custom) && !!ASSETS[key];
  }
  function loadCustomArt() {
    ['hero', 'enemy', 'pickup', 'background'].forEach(function (key) {
      custom[key] = slotIsCustom(key);
      if (!custom[key]) return;
      var img = new Image();
      img.onload = function () {
        images[key] = img;
        if (key === 'background') rebuildBackground();
      };
      img.onerror = function () { images[key] = null; };
      img.src = ASSETS[key];
    });
  }

  /* 6. AUDIO --------------------------------------------------------------- */
  var audio = null;
  var master = null;
  function ensureAudio() {
    try {
      if (!audio) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        audio = new AC();
        master = audio.createGain();
        master.gain.value = muted ? 0 : 0.55;
        master.connect(audio.destination);
      }
      if (audio.state === 'suspended') {
        var p = audio.resume();
        if (p && p.catch) p.catch(function () {});
      }
    } catch (e) { audio = null; master = null; }
  }
  function tone(freq, dur, type, vol, slide, delay) {
    if (!audio || !master || muted) return;
    try {
      var t0 = audio.currentTime + (delay || 0);
      var osc = audio.createOscillator();
      var gain = audio.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(Math.max(30, freq), t0);
      if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(30, slide), t0 + dur);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.linearRampToValueAtTime(Math.max(0.0002, vol || 0.05), t0 + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(gain);
      gain.connect(master);
      osc.start(t0);
      osc.stop(t0 + dur + 0.03);
    } catch (e) { /* audio is decoration */ }
  }
  var sfx = {
    meow: function () {
      tone(620, 0.14, 'sine', 0.045, 720);
      tone(720, 0.22, 'sine', 0.04, 390, 0.14);
    },
    step: function () { tone(150, 0.035, 'triangle', 0.012, 110); },
    pickup: function (n) {
      var base = 660 + Math.min(4, n || 0) * 55;
      tone(base, 0.08, 'sine', 0.045, base * 1.25);
      tone(base * 1.5, 0.12, 'sine', 0.035, base * 1.8, 0.055);
    },
    shield: function () {
      tone(523, 0.14, 'sine', 0.04, 660);
      tone(784, 0.16, 'triangle', 0.035, 1046, 0.09);
      tone(1046, 0.24, 'sine', 0.03, 1310, 0.18);
    },
    alert: function () {
      tone(740, 0.065, 'square', 0.025, 740);
      tone(980, 0.065, 'square', 0.02, 980, 0.08);
    },
    charge: function () {
      tone(180, 0.22, 'sawtooth', 0.028, 520);
    },
    bump: function () {
      tone(150, 0.16, 'square', 0.07, 60);
      tone(70, 0.25, 'sine', 0.08, 42);
    },
    robotIn: function () {
      tone(392, 0.08, 'square', 0.03, 523);
      tone(523, 0.13, 'square', 0.03, 392, 0.1);
    },
    win: function () {
      [523, 659, 784, 1046].forEach(function (f, i) {
        tone(f, 0.24, 'sine', 0.045, f * 1.01, i * 0.11);
      });
    },
    lose: function () {
      tone(392, 0.22, 'triangle', 0.05, 294);
      tone(294, 0.32, 'triangle', 0.04, 196, 0.16);
    },
    click: function () { tone(480, 0.05, 'sine', 0.025, 620); }
  };
  function toggleMute() {
    muted = !muted;
    if (master && audio) {
      try { master.gain.setTargetAtTime(muted ? 0 : 0.55, audio.currentTime, 0.03); } catch (e) {}
    }
    if (!muted && phase !== 'title') sfx.click();
  }

  /* 7. BEST RECORD --------------------------------------------------------- */
  function loadBest() {
    try {
      var raw = window.localStorage.getItem('kitchenCatFish.best.v1');
      if (!raw) return { fish: 0, combo: 0, time: 0 };
      var parsed = JSON.parse(raw);
      return {
        fish: Math.max(0, Math.round(num(parsed.fish, 0))),
        combo: Math.max(0, Math.round(num(parsed.combo, 0))),
        time: Math.max(0, num(parsed.time, 0))
      };
    } catch (e) { return { fish: 0, combo: 0, time: 0 }; }
  }
  function saveBest() {
    try {
      window.localStorage.setItem('kitchenCatFish.best.v1', JSON.stringify(best));
    } catch (e) { /* storage can be unavailable in a sandbox */ }
  }

  /* 8. SCENE SETUP --------------------------------------------------------- */
  function pickSafePoint(minHero, minEnemy, minItem) {
    var bestPoint = null;
    var bestScore = -1;
    for (var i = 0; i < 60; i++) {
      var x = rand(floorRect.x + 70, floorRect.x + floorRect.w - 70);
      var y = rand(floorRect.y + 100, floorRect.y + floorRect.h - 70);
      var dh = dist(x, y, hero.x, hero.y);
      var score = dh;
      var ok = dh >= minHero;
      var j;
      for (j = 0; j < enemies.length; j++) {
        var de = dist(x, y, enemies[j].x, enemies[j].y);
        if (de < minEnemy) ok = false;
        score += Math.min(de, 300) * 0.4;
      }
      for (j = 0; j < pickups.length; j++) {
        var dp = dist(x, y, pickups[j].x, pickups[j].y);
        if (dp < minItem) ok = false;
        score += Math.min(dp, 220) * 0.2;
      }
      if (score > bestScore) { bestScore = score; bestPoint = { x: x, y: y }; }
      if (ok) return { x: x, y: y };
    }
    return bestPoint || {
      x: rand(floorRect.x + 70, floorRect.x + floorRect.w - 70),
      y: rand(floorRect.y + 100, floorRect.y + floorRect.h - 70)
    };
  }

  function spawnPickup(initial) {
    var p = pickSafePoint(initial ? 235 : 170, 105, 95);
    pickups.push({
      x: p.x,
      y: p.y,
      phase: rand(0, TAU),
      age: 0,
      bob: rand(0, TAU)
    });
  }

  function chooseWaypoint(e) {
    var point = pickSafePoint(0, 0, 0);
    e.tx = clamp(point.x, floorRect.x + 90, floorRect.x + floorRect.w - 90);
    e.ty = clamp(point.y, floorRect.y + 100, floorRect.y + floorRect.h - 80);
  }

  function spawnEnemy(initial) {
    if (enemies.length >= R.maxEnemies) return false;
    var point = null;
    var tries;
    for (tries = 0; tries < 55; tries++) {
      var x = rand(floorRect.x + 90, floorRect.x + floorRect.w - 90);
      var y = rand(floorRect.y + 100, floorRect.y + floorRect.h - 80);
      var dh = dist(x, y, hero.x, hero.y);
      var farEnough = dh > (initial ? 430 : 330);
      if (farEnough) {
        for (var j = 0; j < enemies.length; j++) {
          if (dist(x, y, enemies[j].x, enemies[j].y) < 160) { farEnough = false; break; }
        }
      }
      if (farEnough) { point = { x: x, y: y }; break; }
    }
    if (!point) {
      point = pickSafePoint(300, 110, 0);
    }
    var enemy = {
      x: point.x,
      y: point.y,
      vx: 0,
      vy: 0,
      mode: 'patrol',
      timer: 0,
      cooldown: rand(2.8, 5.4),
      tx: point.x,
      ty: point.y,
      chargeDX: 1,
      chargeDY: 0,
      aimX: hero.x,
      aimY: hero.y,
      flash: 0,
      alert: 0,
      stun: 0,
      wob: rand(0, TAU),
      dust: rand(0, 0.2),
      spawnFx: initial ? 0 : 1
    };
    chooseWaypoint(enemy);
    enemies.push(enemy);
    if (!initial) {
      addParticles(point.x, point.y, C.cyan, 12, 'spark');
      addFloater(point.x, point.y - 56, '新来的！', C.cyan, 22);
      sfx.robotIn();
      setToast('第 ' + enemies.length + ' 台扫地机器人出动了', '留意它冲撞前的红色预警', 3.1);
    }
    return true;
  }

  function setupScene() {
    time = R.duration;
    elapsed = 0;
    score = 0;
    hearts = R.hearts;
    shield = 0;
    shieldCount = 0;
    invuln = 0;
    shake = 0;
    hurtFlash = 0;
    restartGuard = 0;
    spawnTimer = R.enemySpawnEvery;
    paused = false;
    combo = 0;
    comboTimer = 0;
    maxCombo = 0;
    endReason = '';
    toast = null;
    joystick = null;
    enemies.length = 0;
    pickups.length = 0;
    particles.length = 0;
    floaters.length = 0;
    footprints.length = 0;

    hero.x = floorRect.x + floorRect.w * 0.5;
    hero.y = floorRect.y + floorRect.h * 0.58;
    hero.vx = 0;
    hero.vy = 0;
    hero.facing = 1;
    hero.walk = 0;
    hero.move = 0;
    hero.stepTimer = 0;

    var i;
    for (i = 0; i < R.maxPickups; i++) spawnPickup(true);
    var initialRobots = Math.min(2, R.maxEnemies);
    for (i = 0; i < initialRobots; i++) spawnEnemy(true);
    setToast('偷满 ' + R.quota + ' 条小鱼干！', '躲开扫地机器人，别被撞到', 3.2);
  }

  function startGame() {
    ensureAudio();
    sfx.meow();
    setupScene();
    phase = 'playing';
    emitPhase();
  }

  function endGame(won, reason) {
    if (phase !== 'playing') return;
    phase = won ? 'won' : 'lost';
    endReason = reason;
    paused = false;
    joystick = null;
    restartGuard = 0.55;
    if (won) {
      addConfetti();
      sfx.win();
    } else {
      addParticles(hero.x, hero.y, '#8b6e5d', 16, 'dust');
      sfx.lose();
    }
    var recordChanged = false;
    if (score > best.fish) { best.fish = score; recordChanged = true; }
    if (maxCombo > best.combo) { best.combo = maxCombo; recordChanged = true; }
    if (won) {
      var runSeconds = Math.max(0.1, Math.round((R.duration - time) * 10) / 10);
      if (!best.time || runSeconds < best.time) { best.time = runSeconds; recordChanged = true; }
    }
    if (recordChanged) saveBest();
    emitPhase();
  }

  /* 9. PARTICLES / TEXTS --------------------------------------------------- */
  function addParticles(x, y, color, count, kind) {
    for (var i = 0; i < count; i++) {
      var a = rand(0, TAU);
      var speed = kind === 'dust' ? rand(18, 80) : rand(45, 190);
      particles.push({
        x: x,
        y: y,
        vx: Math.cos(a) * speed,
        vy: Math.sin(a) * speed - (kind === 'spark' ? 25 : 8),
        age: 0,
        life: rand(0.35, 0.9),
        size: kind === 'dust' ? rand(5, 13) : rand(2, 6),
        color: color,
        kind: kind || 'dot',
        rot: rand(0, TAU),
        vr: rand(-5, 5)
      });
    }
    if (particles.length > 260) particles.splice(0, particles.length - 260);
  }
  function addRing(x, y, color, radius, life) {
    particles.push({
      x: x, y: y, vx: 0, vy: 0, age: 0,
      life: life || 0.45, size: radius, color: color,
      kind: 'ring', rot: 0, vr: 0
    });
  }
  function addFloater(x, y, text, color, size) {
    floaters.push({ x: x, y: y, text: text, color: color || C.cream, age: 0, life: 1.05, size: size || 22 });
    if (floaters.length > 12) floaters.shift();
  }
  function addConfetti() {
    var colors = [C.coral, C.gold, C.cyan, C.cream, C.mint];
    for (var i = 0; i < 52; i++) {
      particles.push({
        x: hero.x + rand(-110, 110),
        y: hero.y + rand(-90, 20),
        vx: rand(-220, 220),
        vy: rand(-350, -80),
        age: 0,
        life: rand(0.9, 1.8),
        size: rand(4, 10),
        color: colors[Math.floor(rand(0, colors.length))],
        kind: 'confetti',
        rot: rand(0, TAU),
        vr: rand(-7, 7)
      });
    }
  }
  function setToast(text, sub, life) {
    toast = { text: text, sub: sub || '', age: 0, life: life || 2.8 };
  }

  /* 10. INPUT -------------------------------------------------------------- */
  var MOVE_KEYS = ['arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'w', 'a', 's', 'd'];

  document.addEventListener('keydown', function (e) {
    var key = (e.key || '').toLowerCase();
    ensureAudio();
    if (key === 'arrowup' || key === 'arrowdown' || key === 'arrowleft' ||
        key === 'arrowright' || key === ' ' || key === 'spacebar') {
      e.preventDefault();
    }
    if (key === 'm') { toggleMute(); return; }
    if (phase === 'title') {
      startGame();
      if (MOVE_KEYS.indexOf(key) >= 0) keys[key] = true;
      return;
    }
    if (phase === 'won' || phase === 'lost') {
      if (restartGuard <= 0) {
        startGame();
        if (MOVE_KEYS.indexOf(key) >= 0) keys[key] = true;
      }
      return;
    }
    if (phase === 'playing' && (key === 'p' || key === 'escape')) {
      paused = !paused;
      joystick = null;
      sfx.click();
      return;
    }
    if (MOVE_KEYS.indexOf(key) >= 0) {
      keys[key] = true;
      e.preventDefault();
    }
  });
  document.addEventListener('keyup', function (e) {
    var key = (e.key || '').toLowerCase();
    if (MOVE_KEYS.indexOf(key) >= 0) keys[key] = false;
  });
  window.addEventListener('blur', function () {
    keys = Object.create(null);
    joystick = null;
    if (phase === 'playing') paused = true;
  });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      keys = Object.create(null);
      joystick = null;
      if (phase === 'playing') paused = true;
    }
  });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  function beginPointer(e) {
    ensureAudio();
    if (canvas.focus) canvas.focus();
    if (phase === 'title') {
      if (e) e.preventDefault();
      startGame();
      if (e) joystick = { id: e.pointerId, ox: e.clientX, oy: e.clientY, dx: 0, dy: 0 };
      return;
    }
    if (phase === 'won' || phase === 'lost') {
      if (e) e.preventDefault();
      if (restartGuard <= 0) {
        startGame();
        if (e) joystick = { id: e.pointerId, ox: e.clientX, oy: e.clientY, dx: 0, dy: 0 };
      }
      return;
    }
    if (paused) {
      if (e) e.preventDefault();
      paused = false;
      sfx.click();
      return;
    }
    if (phase === 'playing') {
      if (e) {
        joystick = { id: e.pointerId, ox: e.clientX, oy: e.clientY, dx: 0, dy: 0 };
        e.preventDefault();
      }
    }
  }
  canvas.addEventListener('pointerdown', beginPointer);
  canvas.addEventListener('pointermove', function (e) {
    if (!joystick || e.pointerId !== joystick.id) return;
    joystick.dx = e.clientX - joystick.ox;
    joystick.dy = e.clientY - joystick.oy;
    e.preventDefault();
  }, { passive: false });
  function releasePointer(e) {
    if (joystick && e.pointerId === joystick.id) joystick = null;
  }
  canvas.addEventListener('pointerup', releasePointer);
  canvas.addEventListener('pointercancel', releasePointer);
  canvas.addEventListener('pointerleave', function (e) {
    if (e.pointerType === 'mouse' && joystick && e.pointerId === joystick.id) joystick = null;
  });

  function readInput() {
    var x = 0, y = 0;
    if (keys['arrowleft'] || keys['a']) x -= 1;
    if (keys['arrowright'] || keys['d']) x += 1;
    if (keys['arrowup'] || keys['w']) y -= 1;
    if (keys['arrowdown'] || keys['s']) y += 1;
    if (joystick) {
      var jd = Math.sqrt(joystick.dx * joystick.dx + joystick.dy * joystick.dy);
      if (jd > 10) {
        var power = clamp((jd - 10) / 52, 0, 1);
        x += (joystick.dx / jd) * power;
        y += (joystick.dy / jd) * power;
      }
    }
    var len = Math.sqrt(x * x + y * y);
    if (len > 1) { x /= len; y /= len; }
    return { x: x, y: y, len: Math.min(1, len) };
  }

  /* 11. GAME UPDATE -------------------------------------------------------- */
  function update(dt) {
    if (restartGuard > 0) restartGuard = Math.max(0, restartGuard - dt);
    updateParticles(dt);
    updateFloaters(dt);
    updateFootprints(dt);
    if (toast) {
      toast.age += dt;
      if (toast.age >= toast.life) toast = null;
    }
    if (phase !== 'playing') return;

    if (paused) return;
    time = Math.max(0, time - dt);
    if (time <= 0) {
      endGame(false, 'time');
      return;
    }
    elapsed += dt;

    updateHero(dt);
    if (phase !== 'playing') return;
    updateRobots(dt);
    if (phase !== 'playing') return;

    if (comboTimer > 0) {
      comboTimer -= dt;
      if (comboTimer <= 0) combo = 0;
    }
    if (invuln > 0) invuln = Math.max(0, invuln - dt);
    if (shake > 0) shake = Math.max(0, shake - dt);
    if (hurtFlash > 0) hurtFlash = Math.max(0, hurtFlash - dt);
    if (shield > 0) shield = Math.max(0, shield - dt);

    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      if (enemies.length < R.maxEnemies) spawnEnemy(false);
      spawnTimer = R.enemySpawnEvery;
    }
  }

  function updateHero(dt) {
    var input = readInput();
    var moving = input.len > 0.02;
    if (input.x !== 0) hero.facing = input.x > 0 ? 1 : -1;

    var speed = R.heroSpeed;
    hero.vx = input.x * speed;
    hero.vy = input.y * speed;
    var prevX = hero.x, prevY = hero.y;
    hero.x += hero.vx * dt;
    hero.y += hero.vy * dt;
    clampHero();
    var displacement = dist(prevX, prevY, hero.x, hero.y);
    hero.move = lerp(hero.move, moving ? clamp(displacement / (speed * dt + 0.0001), 0, 1) : 0, 1 - Math.exp(-dt * 11));
    hero.walk += dt * (6.8 + hero.move * 6.5);
    if (moving) {
      hero.stepTimer -= dt;
      if (hero.stepTimer <= 0) {
        hero.stepTimer = 0.22;
        addFootprint(hero.x, hero.y + 34, hero.facing, hero.walk);
        if (phase === 'playing') sfx.step();
      }
    } else {
      hero.stepTimer = Math.min(hero.stepTimer, 0.08);
    }

    // Fish collection.
    var collectRadius = R.pickupSize * 0.42 + R.heroSize * 0.25;
    for (var i = pickups.length - 1; i >= 0; i--) {
      var p = pickups[i];
      p.age += dt;
      if (dist(p.x, p.y, hero.x, hero.y) < collectRadius) {
        collectPickup(i);
        if (phase !== 'playing') return;
      }
    }
  }

  function addFootprint(x, y, facing, walk) {
    if (footprints.length > 44) footprints.shift();
    footprints.push({
      x: x + Math.sin(walk) * 10 + (facing < 0 ? 7 : -7),
      y: y + Math.cos(walk * 2) * 3,
      rot: (facing < 0 ? -0.25 : 0.25) + Math.sin(walk) * 0.2,
      age: 0,
      life: 2.6
    });
  }

  function collectPickup(index) {
    var p = pickups[index];
    pickups.splice(index, 1);
    score += 1;
    if (comboTimer > 0) combo += 1; else combo = 1;
    comboTimer = 2.7;
    maxCombo = Math.max(maxCombo, combo);
    shieldCount += 1;
    sfx.pickup(combo);
    addParticles(p.x, p.y, C.gold, 15, 'scale');
    addRing(p.x, p.y, 'rgba(255,225,150,0.85)', 30, 0.4);
    addFloater(p.x, p.y - 28, '+1', C.cream, 23);

    if (R.shield.enabled && shieldCount >= R.shield.every) {
      shieldCount = 0;
      shield = R.shield.seconds;
      sfx.shield();
      addParticles(hero.x, hero.y, C.cyan, 18, 'spark');
      addRing(hero.x, hero.y, 'rgba(144,232,215,0.9)', R.heroSize * 0.7, 0.7);
      addFloater(hero.x, hero.y - 78, '毛线护盾！', C.cyan, 24);
      setToast('毛线护盾启动 ' + R.shield.seconds.toFixed(1) + ' 秒', '这段时间机器人的冲撞不会伤到你', 2.7);
    }
    if (score >= R.quota) {
      addParticles(p.x, p.y, C.goldPale, 24, 'spark');
      endGame(true, 'quota');
      return;
    }
    spawnPickup(false);
  }

  function steerEnemy(e, tx, ty, speed, dt) {
    var dx = tx - e.x, dy = ty - e.y;
    var d = Math.max(1, Math.sqrt(dx * dx + dy * dy));
    var desiredX = (dx / d) * speed;
    var desiredY = (dy / d) * speed;
    // Keep robots from stacking into a single angry puddle.
    var pushX = 0, pushY = 0;
    for (var i = 0; i < enemies.length; i++) {
      var other = enemies[i];
      if (other === e) continue;
      var sx = e.x - other.x, sy = e.y - other.y;
      var sd = Math.max(1, Math.sqrt(sx * sx + sy * sy));
      if (sd < 92) {
        var force = (92 - sd) * 2.4;
        pushX += (sx / sd) * force;
        pushY += (sy / sd) * force;
      }
    }
    desiredX += pushX;
    desiredY += pushY;
    var k = 1 - Math.exp(-dt * 4.2);
    e.vx = lerp(e.vx, desiredX, k);
    e.vy = lerp(e.vy, desiredY, k);
    e.x += e.vx * dt;
    e.y += e.vy * dt;
  }

  function clampRobot(e) {
    var left = floorRect.x + 44;
    var right = floorRect.x + floorRect.w - 44;
    var top = floorRect.y + 58;
    var bottom = floorRect.y + floorRect.h - 46;
    var hit = false;
    if (e.x < left) { e.x = left; e.vx = Math.abs(e.vx) * 0.4; hit = true; }
    if (e.x > right) { e.x = right; e.vx = -Math.abs(e.vx) * 0.4; hit = true; }
    if (e.y < top) { e.y = top; e.vy = Math.abs(e.vy) * 0.4; hit = true; }
    if (e.y > bottom) { e.y = bottom; e.vy = -Math.abs(e.vy) * 0.4; hit = true; }
    return hit;
  }

  function endCharge(e) {
    e.mode = 'recover';
    e.timer = 0.85;
    e.cooldown = Math.max(3.2, e.cooldown);
    addParticles(e.x, e.y, '#b9a795', 7, 'dust');
    if (dist(e.x, e.y, hero.x, hero.y) < 360) shake = Math.max(shake, 0.12);
  }

  function updateRobots(dt) {
    var growth = R.enemySpeedGrowth * elapsed;
    var patrolSpeed = R.enemySpeed + growth * 0.7;
    var chaseSpeed = R.enemySpeed * 1.32 + growth;
    var chargeSpeed = Math.max(430, R.enemySpeed * 3.9 + growth * 1.7);
    var hitRadius = R.enemySize * 0.32 + R.heroSize * 0.25;

    for (var i = 0; i < enemies.length; i++) {
      var e = enemies[i];
      e.wob += dt;
      e.flash = Math.max(0, e.flash - dt);
      e.alert = Math.max(0, e.alert - dt);
      e.cooldown = Math.max(0, e.cooldown - dt);
      e.spawnFx = Math.max(0, (e.spawnFx || 0) - dt * 1.6);
      if (e.mode === 'stunned') e.timer -= dt;

      var dx = hero.x - e.x, dy = hero.y - e.y;
      var d = Math.max(1, Math.sqrt(dx * dx + dy * dy));
      var nx = dx / d, ny = dy / d;

      var bob = Math.sin(e.wob * 3) * 1.2;
      // Vacuum dust puffs.
      e.dust = (e.dust || 0) - dt;
      if (e.dust <= 0 && (e.mode === 'patrol' || e.mode === 'chase' || e.mode === 'charge')) {
        e.dust = e.mode === 'charge' ? 0.035 : rand(0.16, 0.34);
        if (e.mode !== 'charge') {
          particles.push({
            x: e.x - nx * 24 + rand(-12, 12), y: e.y + 24 + rand(-6, 8),
            vx: rand(-10, 10), vy: rand(-22, -5),
            age: 0, life: rand(0.4, 0.8),
            size: rand(4, 9), color: 'rgba(190,170,145,0.55)',
            kind: 'dust', rot: 0, vr: 0
          });
        }
      }

      if (e.mode === 'stunned') {
        e.vx *= Math.exp(-dt * 5);
        e.vy *= Math.exp(-dt * 5);
        e.x += e.vx * dt;
        e.y += e.vy * dt;
        if (e.timer <= 0) {
          e.mode = 'chase';
          e.cooldown = Math.max(e.cooldown, 1.4);
        }
      } else if (e.mode === 'windup') {
        e.timer -= dt;
        e.vx *= Math.exp(-dt * 8);
        e.vy *= Math.exp(-dt * 8);
        e.x += e.vx * dt;
        e.y += e.vy * dt;
        if (e.timer <= 0) {
          e.mode = 'charge';
          e.timer = 0.52;
          e.flash = 0.2;
          e.chargeDX = nx;
          e.chargeDY = ny;
          sfx.charge();
          addRing(e.x, e.y, 'rgba(255,116,96,0.9)', 48, 0.35);
        }
      } else if (e.mode === 'charge') {
        e.timer -= dt;
        e.x += e.chargeDX * chargeSpeed * dt;
        e.y += e.chargeDY * chargeSpeed * dt;
        if (Math.random() < 0.7) {
          particles.push({
            x: e.x + rand(-18, 18), y: e.y + 20 + rand(-8, 8),
            vx: -e.chargeDX * rand(30, 90), vy: -e.chargeDY * rand(20, 60),
            age: 0, life: rand(0.25, 0.5), size: rand(3, 8),
            color: 'rgba(211,185,157,0.55)', kind: 'dust', rot: 0, vr: 0
          });
        }
        if (e.timer <= 0) endCharge(e);
        if (clampRobot(e)) endCharge(e);
      } else if (e.mode === 'recover') {
        e.timer -= dt;
        steerEnemy(e, hero.x, hero.y, chaseSpeed * 0.35, dt);
        if (clampRobot(e)) {
          e.vx *= 0.4;
          e.vy *= 0.4;
        }
        if (e.timer <= 0) e.mode = 'chase';
      } else if (e.mode === 'patrol') {
        var detect = hero.move > 0.35 ? 365 : 280;
        if (d < detect && invuln <= 0) {
          e.mode = 'chase';
          e.alert = 1.25;
          e.flash = 0.3;
          sfx.alert();
        } else {
          if (dist(e.x, e.y, e.tx, e.ty) < 34) chooseWaypoint(e);
          steerEnemy(e, e.tx, e.ty, patrolSpeed, dt);
          if (clampRobot(e)) chooseWaypoint(e);
        }
      } else if (e.mode === 'chase') {
        if (d > 610) {
          e.mode = 'patrol';
          chooseWaypoint(e);
        } else if (e.cooldown <= 0 && d < 360 && d > 110) {
          e.mode = 'windup';
          e.timer = 0.72;
          e.cooldown = 7.5;
          e.aimX = hero.x;
          e.aimY = hero.y;
          e.flash = 0.3;
          sfx.alert();
          addRing(e.x, e.y, 'rgba(255,180,100,0.7)', 40, 0.3);
        } else {
          steerEnemy(e, hero.x, hero.y, chaseSpeed, dt);
          if (clampRobot(e)) {
            // Nudge around walls instead of buzzing in place.
            e.vx += (e.x < floorRect.x + floorRect.w * 0.5 ? 25 : -25);
            chooseWaypoint(e);
          }
        }
      }

      // Final wall safety, and a simple separation pass.
      if (e.mode !== 'charge') clampRobot(e);
      var minGap = R.enemySize * 0.92;
      for (var j = 0; j < i; j++) {
        var other = enemies[j];
        var sx = e.x - other.x, sy = e.y - other.y;
        var sd = Math.sqrt(sx * sx + sy * sy);
        if (sd > 0 && sd < minGap) {
          var push = (minGap - sd) * 0.52;
          e.x += (sx / sd) * push;
          e.y += (sy / sd) * push;
          other.x -= (sx / sd) * push;
          other.y -= (sy / sd) * push;
        }
      }
      clampRobot(e);

      // Collision with the cat.
      if (e.mode !== 'stunned') {
        var hitDistance = dist(e.x, e.y, hero.x, hero.y);
        if (hitDistance < hitRadius) {
          var hx = hitDistance > 0.1 ? (hero.x - e.x) / hitDistance : 1;
          var hy = hitDistance > 0.1 ? (hero.y - e.y) / hitDistance : 0;
          hero.x += hx * 18;
          hero.y += hy * 18;
          clampHero();
          pushRobotAway(e, hx, hy);
          if (shield > 0) {
            e.mode = 'stunned';
            e.timer = 1.15;
            e.flash = 0.5;
            addParticles(e.x, e.y, C.cyan, 14, 'spark');
            addRing(hero.x, hero.y, 'rgba(142,232,214,0.8)', R.heroSize * 0.65, 0.5);
            addFloater(hero.x, hero.y - 62, '弹开！', C.cyan, 21);
            sfx.alert();
          } else if (invuln <= 0) {
            hurtHero(e);
            e.mode = 'stunned';
            e.timer = 1.3;
            e.flash = 0.6;
            e.cooldown = Math.max(e.cooldown, 2.5);
          } else {
            e.mode = 'stunned';
            e.timer = 0.45;
            e.flash = 0.2;
          }
        }
      }
    }
  }

  function pushRobotAway(e, nx, ny) {
    var separation = R.enemySize * 0.32 + R.heroSize * 0.25 + 8;
    e.x -= nx * separation;
    e.y -= ny * separation;
    e.vx = -nx * 230;
    e.vy = -ny * 230;
    clampRobot(e);
  }

  function hurtHero(e) {
    hearts -= 1;
    invuln = 1.55;
    shake = Math.max(shake, 0.45);
    hurtFlash = 0.35;
    combo = 0;
    comboTimer = 0;
    sfx.bump();
    addParticles(hero.x, hero.y - 10, '#ff9f86', 14, 'spark');
    addParticles(hero.x, hero.y + 20, '#b89a7d', 7, 'dust');
    addFloater(hero.x, hero.y - 70, '喵呜！', '#ffc3b0', 24);
    if (e) e.flash = 0.5;
    if (hearts <= 0) {
      hearts = 0;
      endGame(false, 'caught');
    }
  }

  function updateParticles(dt) {
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.age += dt;
      if (p.age >= p.life) { particles.splice(i, 1); continue; }
      if (p.kind === 'confetti') {
        p.vy += 620 * dt;
        p.vx *= Math.exp(-dt * 0.7);
      } else if (p.kind === 'dust') {
        p.vx *= Math.exp(-dt * 1.6);
        p.vy *= Math.exp(-dt * 1.6);
      } else {
        p.vx *= Math.exp(-dt * 2.3);
        p.vy *= Math.exp(-dt * 2.3);
      }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot += p.vr * dt;
    }
  }
  function updateFloaters(dt) {
    for (var i = floaters.length - 1; i >= 0; i--) {
      var f = floaters[i];
      f.age += dt;
      f.y -= dt * 34;
      if (f.age >= f.life) floaters.splice(i, 1);
    }
  }
  function updateFootprints(dt) {
    for (var i = footprints.length - 1; i >= 0; i--) {
      footprints[i].age += dt;
      if (footprints[i].age >= footprints[i].life) footprints.splice(i, 1);
    }
  }

  /* 12. DRAWING HELPERS ---------------------------------------------------- */
  function roundPath(g, x, y, w, h, r) {
    var radius = Math.min(r, Math.abs(w) * 0.5, Math.abs(h) * 0.5);
    g.beginPath();
    g.moveTo(x + radius, y);
    g.lineTo(x + w - radius, y);
    g.quadraticCurveTo(x + w, y, x + w, y + radius);
    g.lineTo(x + w, y + h - radius);
    g.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
    g.lineTo(x + radius, y + h);
    g.quadraticCurveTo(x, y + h, x, y + h - radius);
    g.lineTo(x, y + radius);
    g.quadraticCurveTo(x, y, x + radius, y);
    g.closePath();
  }
  function fillRound(g, x, y, w, h, r, color) {
    roundPath(g, x, y, w, h, r);
    g.fillStyle = color;
    g.fill();
  }
  function strokeRound(g, x, y, w, h, r, color, width) {
    roundPath(g, x, y, w, h, r);
    g.strokeStyle = color;
    g.lineWidth = width || 1;
    g.stroke();
  }
  function drawHeartPath(g, cx, cy, size) {
    var r = size * 0.5;
    g.beginPath();
    g.moveTo(cx, cy + r * 0.72);
    g.bezierCurveTo(cx - r * 1.35, cy - r * 0.15, cx - r * 0.72, cy - r * 1.2, cx, cy - r * 0.35);
    g.bezierCurveTo(cx + r * 0.72, cy - r * 1.2, cx + r * 1.35, cy - r * 0.15, cx, cy + r * 0.72);
    g.closePath();
  }
  function drawHeartIcon(g, cx, cy, size, filled) {
    g.save();
    drawHeartPath(g, cx, cy, size);
    if (filled) {
      g.fillStyle = C.coral;
      g.fill();
      g.strokeStyle = C.ink;
      g.lineWidth = Math.max(1.2, size * 0.075);
      g.stroke();
      drawHeartPath(g, cx, cy - size * 0.07, size * 0.5);
      g.fillStyle = 'rgba(255,221,188,0.42)';
      g.fill();
    } else {
      g.fillStyle = 'rgba(255,255,255,0.08)';
      g.fill();
      g.strokeStyle = 'rgba(255,240,216,0.28)';
      g.lineWidth = Math.max(1.1, size * 0.07);
      g.stroke();
    }
    g.restore();
  }
  function drawPawIcon(g, x, y, size, color, alpha) {
    g.save();
    g.translate(x, y);
    g.globalAlpha = alpha == null ? 1 : alpha;
    g.fillStyle = color;
    g.beginPath();
    g.ellipse(0, size * 0.2, size * 0.32, size * 0.26, 0, 0, TAU);
    g.fill();
    g.beginPath();
    g.moveTo(-size * 0.34 + size * 0.13, -size * 0.1);
    g.arc(-size * 0.34, -size * 0.1, size * 0.13, 0, TAU);
    g.moveTo(-size * 0.12 + size * 0.13, -size * 0.28);
    g.arc(-size * 0.12, -size * 0.28, size * 0.13, 0, TAU);
    g.moveTo(size * 0.12 + size * 0.13, -size * 0.28);
    g.arc(size * 0.12, -size * 0.28, size * 0.13, 0, TAU);
    g.moveTo(size * 0.34 + size * 0.13, -size * 0.1);
    g.arc(size * 0.34, -size * 0.1, size * 0.13, 0, TAU);
    g.fill();
    g.restore();
  }
  function drawClockIcon(g, cx, cy, size, color) {
    g.save();
    g.strokeStyle = color;
    g.lineWidth = Math.max(1.4, size * 0.085);
    g.beginPath();
    g.arc(cx, cy, size * 0.42, 0, TAU);
    g.stroke();
    g.beginPath();
    g.moveTo(cx, cy - size * 0.2);
    g.lineTo(cx, cy);
    g.lineTo(cx + size * 0.21, cy + size * 0.1);
    g.stroke();
    g.restore();
  }
  function drawFishIcon(g, x, y, size, fill, line, alpha) {
    g.save();
    g.translate(x, y);
    g.globalAlpha = alpha == null ? 1 : alpha;
    g.fillStyle = fill || C.gold;
    g.strokeStyle = line || C.ink;
    g.lineWidth = Math.max(1, size * 0.075);
    g.lineJoin = 'round';
    g.beginPath();
    g.moveTo(-size * 0.18, 0);
    g.bezierCurveTo(-size * 0.1, -size * 0.35, size * 0.27, -size * 0.35, size * 0.42, 0);
    g.bezierCurveTo(size * 0.27, size * 0.32, -size * 0.1, size * 0.33, -size * 0.18, 0);
    g.closePath();
    g.fill();
    g.stroke();
    g.beginPath();
    g.moveTo(-size * 0.16, 0);
    g.lineTo(-size * 0.48, -size * 0.28);
    g.lineTo(-size * 0.4, 0);
    g.lineTo(-size * 0.48, size * 0.28);
    g.closePath();
    g.fill();
    g.stroke();
    g.fillStyle = line || C.ink;
    g.beginPath();
    g.arc(size * 0.25, -size * 0.06, size * 0.045, 0, TAU);
    g.fill();
    g.beginPath();
    g.strokeStyle = 'rgba(91,60,36,0.55)';
    g.lineWidth = Math.max(0.8, size * 0.04);
    g.arc(size * 0.11, 0.01, size * 0.15, -1.1, 1.1);
    g.stroke();
    g.restore();
  }
  function drawRobotIcon(g, x, y, size, color) {
    g.save();
    g.translate(x, y);
    g.fillStyle = color;
    g.strokeStyle = C.ink;
    g.lineWidth = Math.max(1, size * 0.055);
    g.beginPath();
    g.arc(0, size * 0.05, size * 0.33, Math.PI, TAU);
    g.lineTo(size * 0.33, size * 0.28);
    g.arc(0, size * 0.28, size * 0.33, 0, Math.PI);
    g.closePath();
    g.fill();
    g.stroke();
    g.fillStyle = C.cream;
    g.beginPath();
    g.ellipse(0, size * 0.03, size * 0.22, size * 0.13, 0, 0, TAU);
    g.fill();
    g.fillStyle = C.ink;
    g.beginPath();
    g.arc(-size * 0.08, size * 0.03, size * 0.04, 0, TAU);
    g.arc(size * 0.08, size * 0.03, size * 0.04, 0, TAU);
    g.fill();
    g.beginPath();
    g.strokeStyle = C.ink;
    g.lineWidth = Math.max(1, size * 0.04);
    g.moveTo(0, size * 0.05);
    g.lineTo(0, -size * 0.19);
    g.stroke();
    g.beginPath();
    g.arc(0, -size * 0.23, size * 0.055, 0, TAU);
    g.fillStyle = color;
    g.fill();
    g.stroke();
    g.restore();
  }
  function drawYarnIcon(g, x, y, size, color) {
    g.save();
    g.translate(x, y);
    g.strokeStyle = color;
    g.lineWidth = Math.max(1.2, size * 0.09);
    g.beginPath();
    g.arc(0, 0, size * 0.34, 0, TAU);
    g.stroke();
    g.beginPath();
    g.arc(size * 0.03, 0, size * 0.25, 0.5, Math.PI * 1.7);
    g.stroke();
    g.beginPath();
    g.moveTo(-size * 0.25, -size * 0.22);
    g.quadraticCurveTo(size * 0.35, size * 0.1, size * 0.25, size * 0.28);
    g.stroke();
    g.restore();
  }

  /* 13. KITCHEN BACKDROP --------------------------------------------------- */
  function rebuildBackground() {
    if (!floorRect.w) computeLayout();
    if (custom.background && images.background) {
      var full = document.createElement('canvas');
      full.width = 1280;
      full.height = 720;
      var fg = full.getContext('2d');
      var img = images.background;
      var iw = img.naturalWidth || img.width || 1280;
      var ih = img.naturalHeight || img.height || 720;
      var scale = Math.max(full.width / iw, full.height / ih);
      fg.drawImage(img, (full.width - iw * scale) / 2, (full.height - ih * scale) / 2, iw * scale, ih * scale);
      bgCanvas = full;
      return;
    }
    var dprBg = 2;
    var c = document.createElement('canvas');
    c.width = Math.round(world.w * dprBg);
    c.height = Math.round(world.h * dprBg);
    var g = c.getContext('2d');
    g.scale(dprBg, dprBg);
    paintKitchen(g, world.w, world.h);
    bgCanvas = c;
  }

  function paintKitchen(g, w, h) {
    var f = floorRect;
    var ink = C.ink;

    // Base wood/plaster.
    var bgGrad = g.createLinearGradient(0, 0, 0, h);
    bgGrad.addColorStop(0, '#253129');
    bgGrad.addColorStop(0.28, '#4d5645');
    bgGrad.addColorStop(0.3, '#3b2c23');
    bgGrad.addColorStop(1, '#2b201a');
    g.fillStyle = bgGrad;
    g.fillRect(0, 0, w, h);

    // A quiet strip of wooden wainscot outside the floor.
    g.save();
    g.fillStyle = 'rgba(54,37,27,0.72)';
    g.fillRect(0, f.y, w, h - f.y);
    for (var wx = 10; wx < w; wx += 70) {
      g.strokeStyle = 'rgba(255,215,160,0.045)';
      g.lineWidth = 1;
      g.beginPath();
      g.moveTo(wx, f.y);
      g.lineTo(wx, h);
      g.stroke();
    }
    g.restore();

    // Wallpaper above the counter: a soft, mostly hidden botanical stripe.
    g.save();
    g.beginPath();
    g.rect(0, 0, w, f.y);
    g.clip();
    var wallGrad = g.createLinearGradient(0, 0, 0, f.y);
    wallGrad.addColorStop(0, '#435747');
    wallGrad.addColorStop(1, '#73816c');
    g.fillStyle = wallGrad;
    g.fillRect(0, 0, w, f.y);
    for (var sx = 20; sx < w; sx += 54) {
      g.strokeStyle = 'rgba(240,224,184,0.055)';
      g.lineWidth = 14;
      g.beginPath();
      g.moveTo(sx, 0);
      g.lineTo(sx + 8, f.y);
      g.stroke();
    }
    // A hanging little pendant in the top-right corner.
    g.strokeStyle = 'rgba(31,25,19,0.55)';
    g.lineWidth = 2;
    g.beginPath();
    g.moveTo(w - 52, 0);
    g.lineTo(w - 52, Math.max(12, f.y - 154));
    g.stroke();
    var lampY = Math.max(14, f.y - 147);
    g.fillStyle = 'rgba(242,193,107,0.13)';
    g.beginPath();
    g.arc(w - 52, lampY, 46, 0, TAU);
    g.fill();
    g.fillStyle = '#d2a45f';
    g.strokeStyle = 'rgba(45,31,22,0.65)';
    g.lineWidth = 2;
    g.beginPath();
    g.ellipse(w - 52, lampY, 18, 9, 0, 0, TAU);
    g.fill();
    g.stroke();
    g.restore();

    // Floor opening.
    g.save();
    g.beginPath();
    g.rect(f.x, f.y, f.w, f.h);
    g.clip();

    g.fillStyle = '#e5dac1';
    g.fillRect(f.x, f.y, f.w, f.h);
    var tile = clamp(Math.round(Math.min(w, h) / 10.8), 56, 82);
    var cols = Math.ceil(f.w / tile) + 1;
    var rows = Math.ceil(f.h / tile) + 1;
    for (var row = 0; row < rows; row++) {
      for (var col = 0; col < cols; col++) {
        var tx = f.x + col * tile - tile * 0.35;
        var ty = f.y + row * tile - tile * 0.35;
        var odd = (row + col) % 2 === 0;
        var n = hash01(row * 37 + col * 91 + R.seed);
        if (odd) {
          g.fillStyle = n > 0.5 ? '#e2e8da' : '#dfe6d7';
        } else {
          g.fillStyle = n > 0.5 ? '#f0e7d4' : '#ede3d0';
        }
        g.fillRect(tx, ty, tile + 1, tile + 1);
        if (n > 0.82) {
          g.fillStyle = 'rgba(113,94,71,0.08)';
          g.beginPath();
          g.arc(tx + tile * 0.35, ty + tile * 0.62, 1.3, 0, TAU);
          g.arc(tx + tile * 0.68, ty + tile * 0.37, 0.9, 0, TAU);
          g.fill();
        }
        if (n < 0.12) {
          g.strokeStyle = 'rgba(112,93,71,0.1)';
          g.lineWidth = 1;
          g.beginPath();
          g.moveTo(tx + tile * 0.65, ty + tile * 0.25);
          g.quadraticCurveTo(tx + tile * 0.55, ty + tile * 0.48, tx + tile * 0.72, ty + tile * 0.64);
          g.stroke();
        }
      }
    }
    // Grout lines.
    g.strokeStyle = 'rgba(91,77,57,0.085)';
    g.lineWidth = 1.2;
    for (var gx = f.x - tile * 0.35; gx < f.x + f.w + tile; gx += tile) {
      g.beginPath();
      g.moveTo(gx, f.y);
      g.lineTo(gx, f.y + f.h);
      g.stroke();
    }
    for (var gy = f.y - tile * 0.35; gy < f.y + f.h + tile; gy += tile) {
      g.beginPath();
      g.moveTo(f.x, gy);
      g.lineTo(f.x + f.w, gy);
      g.stroke();
    }

    // Rug.
    var rugR = Math.min(f.w * 0.3, f.h * 0.32, 205);
    drawRug(g, f.x + f.w * 0.5, f.y + f.h * 0.55, rugR);

    // Floor props.
    drawCatBowl(g, f.x + 80, f.y + f.h - 62);
    drawToyMouse(g, f.x + f.w - 82, f.y + f.h - 74);
    drawCrumbTrail(g, f);

    // Moonlight from the left and warm pools from above.
    var light1 = g.createRadialGradient(f.x + f.w * 0.18, f.y + f.h * 0.1, 10, f.x + f.w * 0.18, f.y + f.h * 0.1, f.w * 0.48);
    light1.addColorStop(0, 'rgba(194,225,205,0.15)');
    light1.addColorStop(0.7, 'rgba(194,225,205,0.03)');
    light1.addColorStop(1, 'rgba(194,225,205,0)');
    g.fillStyle = light1;
    g.fillRect(f.x, f.y, f.w, f.h);
    var light2 = g.createRadialGradient(f.x + f.w * 0.68, f.y + f.h * 0.2, 20, f.x + f.w * 0.68, f.y + f.h * 0.2, f.w * 0.52);
    light2.addColorStop(0, 'rgba(255,207,126,0.16)');
    light2.addColorStop(0.55, 'rgba(255,207,126,0.05)');
    light2.addColorStop(1, 'rgba(255,207,126,0)');
    g.fillStyle = light2;
    g.fillRect(f.x, f.y, f.w, f.h);

    // Soft edge shadow on the tiles.
    var edgeGrad = g.createLinearGradient(0, f.y, 0, f.y + 34);
    edgeGrad.addColorStop(0, 'rgba(50,37,27,0.36)');
    edgeGrad.addColorStop(1, 'rgba(50,37,27,0)');
    g.fillStyle = edgeGrad;
    g.fillRect(f.x, f.y, f.w, 34);
    var sideGrad = g.createLinearGradient(f.x, 0, f.x + 24, 0);
    sideGrad.addColorStop(0, 'rgba(50,37,27,0.18)');
    sideGrad.addColorStop(1, 'rgba(50,37,27,0)');
    g.fillStyle = sideGrad;
    g.fillRect(f.x, f.y, 24, f.h);
    g.restore();

    // Perimeter trim.
    g.strokeStyle = 'rgba(28,20,16,0.55)';
    g.lineWidth = 9;
    g.strokeRect(f.x - 4.5, f.y - 4.5, f.w + 9, f.h + 9);
    g.strokeStyle = 'rgba(225,206,168,0.16)';
    g.lineWidth = 2;
    g.beginPath();
    g.moveTo(f.x, f.y - 6);
    g.lineTo(f.x + f.w, f.y - 6);
    g.stroke();

    // Counter along the top.
    drawCounter(g, w, h, f);
  }

  function drawRug(g, cx, cy, r) {
    if (r < 40) return;
    g.save();
    g.globalAlpha = 0.96;
    // Shadow.
    g.fillStyle = 'rgba(51,35,25,0.2)';
    g.beginPath();
    g.ellipse(cx, cy + 12, r * 1.03, r * 0.88, 0, 0, TAU);
    g.fill();
    // Fringe.
    g.strokeStyle = '#b98061';
    g.lineWidth = Math.max(2, r * 0.018);
    g.lineCap = 'round';
    var count = 58;
    for (var i = 0; i < count; i++) {
      var a = (i / count) * TAU;
      var r1 = r * 0.94;
      var r2 = r * 1.02 + (i % 3) * 2;
      g.beginPath();
      g.moveTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1 * 0.9);
      g.lineTo(cx + Math.cos(a) * r2, cy + Math.sin(a) * r2 * 0.9);
      g.stroke();
    }
    var rings = [
      [1.0, '#a95f4d'],
      [0.9, '#e8c48d'],
      [0.77, '#c17b64'],
      [0.59, '#829b88'],
      [0.38, '#efdab0']
    ];
    rings.forEach(function (ring) {
      g.fillStyle = ring[1];
      g.beginPath();
      g.ellipse(cx, cy, r * ring[0], r * ring[0] * 0.9, 0, 0, TAU);
      g.fill();
    });
    // Braided stitch rings.
    g.strokeStyle = 'rgba(80,51,35,0.22)';
    g.lineWidth = Math.max(1, r * 0.011);
    [0.95, 0.84, 0.68, 0.49].forEach(function (rr, idx) {
      g.setLineDash(idx % 2 ? [4, 8] : [10, 7]);
      g.beginPath();
      g.ellipse(cx, cy, r * rr, r * rr * 0.9, 0, 0, TAU);
      g.stroke();
    });
    g.setLineDash([]);
    // Small woven ticks.
    g.strokeStyle = 'rgba(255,239,202,0.2)';
    for (var j = 0; j < 40; j++) {
      var aa = (j / 40) * TAU + 0.08;
      var rr = r * 0.86;
      g.beginPath();
      g.moveTo(cx + Math.cos(aa) * rr * 0.94, cy + Math.sin(aa) * rr * 0.84);
      g.lineTo(cx + Math.cos(aa) * rr * 1.02, cy + Math.sin(aa) * rr * 0.92);
      g.stroke();
    }
    // Paw print at the heart of the rug.
    drawPawIcon(g, cx, cy, r * 0.37, 'rgba(123,84,55,0.4)', 1);
    drawPawIcon(g, cx + r * 0.02, cy - r * 0.015, r * 0.33, 'rgba(255,235,194,0.28)', 1);
    g.restore();
  }

  function drawCounter(g, w, h, f) {
    var top = f.y - kitchen.counterH;
    var counterGrad = g.createLinearGradient(0, top, 0, f.y);
    counterGrad.addColorStop(0, '#d2aa74');
    counterGrad.addColorStop(0.58, '#e1bd8a');
    counterGrad.addColorStop(1, '#cba06e');
    g.fillStyle = counterGrad;
    g.fillRect(0, top, w, kitchen.counterH);

    // Under-counter shadow.
    var shadow = g.createLinearGradient(0, f.y, 0, f.y + 28);
    shadow.addColorStop(0, 'rgba(35,24,17,0.38)');
    shadow.addColorStop(1, 'rgba(35,24,17,0)');
    g.fillStyle = shadow;
    g.fillRect(0, f.y, w, 28);

    // Counter edge.
    g.strokeStyle = 'rgba(63,43,28,0.38)';
    g.lineWidth = 3;
    g.beginPath();
    g.moveTo(0, f.y - 3);
    g.lineTo(w, f.y - 3);
    g.stroke();
    g.strokeStyle = 'rgba(255,231,188,0.32)';
    g.lineWidth = 1.5;
    g.beginPath();
    g.moveTo(0, top + 2);
    g.lineTo(w, top + 2);
    g.stroke();

    // Backsplash tiles, tucked behind the backsplash line.
    g.save();
    g.beginPath();
    g.rect(0, 0, w, top);
    g.clip();
    g.fillStyle = '#b7c8ba';
    g.fillRect(0, 0, w, top);
    g.strokeStyle = 'rgba(67,89,74,0.16)';
    g.lineWidth = 1;
    var ts = 28;
    for (var bx = 0; bx < w; bx += ts) {
      g.beginPath(); g.moveTo(bx, 0); g.lineTo(bx, top); g.stroke();
    }
    for (var by = 0; by < top; by += ts) {
      g.beginPath(); g.moveTo(0, by); g.lineTo(w, by); g.stroke();
    }
    g.fillStyle = 'rgba(239,225,190,0.2)';
    for (var i = 0; i < 36; i++) {
      var xx = hash01(i * 3.7) * w;
      var yy = hash01(i * 8.1 + 2) * top;
      g.beginPath();
      g.arc(xx, yy, 1 + hash01(i) * 2, 0, TAU);
      g.fill();
    }
    g.restore();

    // A soft shadow under the upper cabinets.
    g.fillStyle = 'rgba(39,49,38,0.15)';
    g.fillRect(0, top - 5, w, 5);

    // Cabinet doors and a little window, kept mostly above the gameplay.
    drawCounterCabinets(g, w, top);

    // Sink.
    var sink = kitchen.sinkX;
    var sinkY = top + kitchen.counterH * 0.52;
    drawSink(g, sink, sinkY);

    // Cutting board + lemon.
    drawBoard(g, kitchen.boardX, sinkY + 2);

    // Stove and copper pot.
    drawStove(g, kitchen.potX, top + kitchen.counterH * 0.5);
    drawPot(g, kitchen.potX, top + kitchen.counterH * 0.47);

    // Jar/utensils.
    drawJars(g, kitchen.jarX, top + kitchen.counterH * 0.38);

    // A tea towel hanging over the counter edge.
    g.save();
    var towelX = f.x + f.w * 0.53;
    g.translate(towelX, f.y - 2);
    g.rotate(0.03);
    fillRound(g, -28, 0, 56, 44, 5, 'rgba(233,227,205,0.9)');
    g.strokeStyle = 'rgba(95,78,57,0.3)';
    g.lineWidth = 1.4;
    g.beginPath();
    g.moveTo(-23, 12); g.lineTo(23, 12);
    g.moveTo(-23, 21); g.lineTo(23, 21);
    g.stroke();
    g.strokeStyle = 'rgba(138,96,75,0.45)';
    g.beginPath();
    g.moveTo(-28, 0); g.lineTo(-28, 44);
    g.moveTo(28, 0); g.lineTo(28, 44);
    g.stroke();
    g.restore();
  }

  // A few cheerful little kitchen wall details are drawn dynamically so
  // the title screen feels alive even when the game is paused.

  /* 14. CHARACTERS --------------------------------------------------------- */
  function drawCat(g, x, y, size, opt) {
    opt = opt || {};
    var sc = size / 100;
    var facing = opt.facing == null ? 1 : opt.facing;
    var walk = opt.walk || 0;
    var move = opt.move || 0;
    var t = opt.time || 0;
    var blink = !!opt.blink;
    var ink = C.ink;
    var catFill = C.cat;

    g.save();
    g.fillStyle = 'rgba(54,37,25,0.23)';
    g.beginPath();
    g.ellipse(x, y + 46 * sc, 43 * sc, 12.5 * sc, 0, 0, TAU);
    g.fill();
    g.translate(x, y);
    g.scale(facing * sc, sc);
    g.translate(0, Math.sin(walk * 2) * 2.4 * move + Math.sin(t * 2.1) * 0.7);
    g.lineJoin = 'round';
    g.lineCap = 'round';

    // Tail: curls out to the left with a happy little tip.
    var sway = Math.sin(t * 2.35) * 3 + move * Math.sin(walk * 1.5) * 3;
    g.strokeStyle = ink;
    g.lineWidth = 14;
    g.beginPath();
    g.moveTo(-26, 17);
    g.bezierCurveTo(-42, 35, -58, 34 + sway * 0.35, -64, 16 + sway * 0.65);
    g.bezierCurveTo(-68, 5 + sway, -59, -3 + sway, -49, -5 + sway);
    g.stroke();
    g.strokeStyle = '#e8c68f';
    g.lineWidth = 8.5;
    g.beginPath();
    g.moveTo(-26, 17);
    g.bezierCurveTo(-42, 35, -58, 34 + sway * 0.35, -64, 16 + sway * 0.65);
    g.bezierCurveTo(-68, 5 + sway, -59, -3 + sway, -49, -5 + sway);
    g.stroke();
    g.strokeStyle = 'rgba(166,111,64,0.7)';
    g.lineWidth = 3.4;
    g.beginPath();
    g.moveTo(-45, 30);
    g.lineTo(-50, 24);
    g.moveTo(-58, 27 + sway * 0.4);
    g.lineTo(-59, 20 + sway * 0.5);
    g.moveTo(-63, 11 + sway * 0.7);
    g.lineTo(-57, 8 + sway * 0.8);
    g.stroke();
    // A soft cream tip.
    g.fillStyle = '#f7e8c8';
    g.beginPath();
    g.ellipse(-49, -5 + sway, 5.2, 4.1, 0.4, 0, TAU);
    g.fill();

    // Back feet.
    var pawLiftL = Math.sin(walk) * 3.2 * move;

  function drawCatPaw(g, x, y, rx, ry, ink, fill) {
    g.fillStyle = fill;

    g.moveTo(x + 2, y + ry * 0.42);
    g.lineTo(x + 2, y + ry * 0.85);
    g.stroke();

  function drawRobot(g, x, y, size, opt) {
    opt = opt || {};
    var sc = size / 100;
    var t = opt.time || 0;
    var mode = opt.mode || 'patrol';
    var vx = opt.vx || 0, vy = opt.vy || 0;
    var flash = opt.flash || 0;
    var lean = clamp(vx / 950, -0.14, 0.14);
    if (mode === 'windup' || mode === 'charge') lean = Math.sin(t * 35) * 0.035;
    var stateColor = mode === 'windup' || mode === 'charge' || mode === 'stunned' && flash > 0
      ? C.red : mode === 'chase' || mode === 'recover' ? C.amber : C.cyan;
    var angry = mode === 'chase' || mode === 'windup' || mode === 'charge';

    g.save();
    g.fillStyle = 'rgba(47,32,23,0.28)';
    g.beginPath();
    g.ellipse(x, y + 38 * sc, 38 * sc, 11 * sc, 0, 0, TAU);
    g.fill();
    g.translate(x, y);
    g.scale(sc, sc);
    g.rotate(lean);
    g.lineJoin = 'round';
    g.lineCap = 'round';

    // Rotating side brooms, behind the body.
    drawBroom(g, -35, 21, t * 8.2, stateColor, 0.55);
    drawBroom(g, 35, 21, -t * 7.1, stateColor, 0.42);

    // Wheels.
    g.fillStyle = '#17191d';
    g.strokeStyle = 'rgba(16,13,11,0.8)';
    g.lineWidth = 3;
    g.beginPath();
    g.ellipse(-30, 28, 9, 14, 0.2, 0, TAU);
    g.ellipse(30, 28, 9, 14, -0.2, 0, TAU);
    g.fill();
    g.stroke();

    // Body.
    var bodyGrad = g.createLinearGradient(0, -39, 0, 35);
    bodyGrad.addColorStop(0, '#5b5e68');
    bodyGrad.addColorStop(0.29, '#3d404a');
    bodyGrad.addColorStop(1, '#202229');
    g.fillStyle = bodyGrad;
    g.strokeStyle = C.ink;
    g.lineWidth = 4.2;
    g.beginPath();
    g.ellipse(0, 0, 39, 36, 0, 0, TAU);
    g.fill();
    g.stroke();
    // Bumper rim.
    g.strokeStyle = 'rgba(218,207,193,0.65)';
    g.lineWidth = 7;
    g.beginPath();
    g.arc(0, 0, 34.5, Math.PI * 0.18, Math.PI * 0.82);
    g.stroke();
    g.strokeStyle = 'rgba(255,238,205,0.2)';
    g.lineWidth = 1.5;
    g.beginPath();
    g.arc(0, 0, 39, -2.65, 2.65);
    g.stroke();
    // Top hatch ring.
    g.strokeStyle = 'rgba(255,235,201,0.18)';
    g.lineWidth = 2;
    g.beginPath();
    g.arc(0, -6, 27, -2.5, 2.5);
    g.stroke();
    g.strokeStyle = 'rgba(19,17,15,0.4)';
    g.lineWidth = 1.5;
    g.beginPath();
    g.arc(0, 0, 30, -0.4, 1.2);
    g.stroke();

    // Face visor.
    g.fillStyle = '#121a1b';
    g.strokeStyle = 'rgba(255,225,177,0.24)';
    g.lineWidth = 2;
    roundPath(g, -25, -12, 50, 19, 9);
    g.fill();
    g.stroke();
    // Glowing eyes.
    var glow = 0.72 + Math.sin(t * 4.2) * 0.2 + (flash > 0 ? 0.2 : 0);
    g.save();
    g.shadowColor = stateColor;
    g.shadowBlur = 12;
    g.fillStyle = stateColor;
    g.globalAlpha = clamp(glow, 0.5, 1);
    g.beginPath();
    g.ellipse(-10, -3, 4.4, 4.2, 0, 0, TAU);
    g.ellipse(10, -3, 4.4, 4.2, 0, 0, TAU);
    g.fill();
    g.restore();
    g.fillStyle = '#fff9df';
    g.globalAlpha = 0.8;
    g.beginPath();
    g.arc(-11.3, -4.4, 1.2, 0, TAU);
    g.arc(8.7, -4.4, 1.2, 0, TAU);
    g.fill();
    g.globalAlpha = 1;
    if (angry) {
      g.strokeStyle = stateColor;
      g.lineWidth = 2.2;
      g.beginPath();
      g.moveTo(-15, -10); g.lineTo(-6.5, -8);
      g.moveTo(15, -10); g.lineTo(6.5, -8);
      g.stroke();
    }
    // Suction mouth.
    g.fillStyle = '#15171a';
    g.beginPath();
    g.moveTo(-13, 19);
    g.quadraticCurveTo(0, 27, 13, 19);
    g.quadraticCurveTo(0, 23, -13, 19);
    g.fill();
    g.strokeStyle = 'rgba(222,206,184,0.32)';
    g.lineWidth = 1.4;
    g.beginPath();
    g.arc(0, 19, 12, 0.15, Math.PI - 0.15);
    g.stroke();
    // Little status lamp.
    g.fillStyle = mode === 'charge' ? C.red : mode === 'windup' ? C.red : stateColor;
    g.save();
    g.shadowColor = stateColor;
    g.shadowBlur = 9;
    g.beginPath();
    g.arc(0, -29, 2.8, 0, TAU);
    g.fill();
    g.restore();
    // A tiny fish-bone decal on the casing.
    g.strokeStyle = 'rgba(236,214,173,0.36)';
    g.lineWidth = 1.3;
    g.beginPath();
    g.moveTo(-11, 11);
    g.quadraticCurveTo(0, 6, 11, 11);
    g.stroke();
    g.beginPath();
    g.arc(0, 11, 1.7, 0, TAU);

    g.restore();
  }

  function drawBroom(g, x, y, angle, color, alpha) {
    g.save();
    g.translate(x, y);
    g.rotate(angle);
    g.globalAlpha = alpha;
    g.strokeStyle = color;
    g.lineWidth = 1.8;
    for (var i = 0; i < 3; i++) {
      var a = (i / 3) * TAU;
      g.beginPath();
      g.moveTo(0, 0);
      g.lineTo(Math.cos(a) * 14, Math.sin(a) * 14);
      g.stroke();
    }
    g.fillStyle = 'rgba(222,209,188,0.55)';
    g.beginPath();
    g.arc(0, 0, 3.5, 0, TAU);
    g.fill();
    g.restore();
  }

  function drawFish(g, x, y, size, opt) {
    opt = opt || {};
    var t = opt.time || 0;
    var sc = size / 100;
    var wobble = opt.wobble == null ? 0 : opt.wobble;
    var alpha = opt.alpha == null ? 1 : opt.alpha;
    g.save();
    g.globalAlpha = alpha;
    // Warm aura.
    var aura = g.createRadialGradient(x, y, 2, x, y, size * 0.75);
    aura.addColorStop(0, 'rgba(255,219,130,0.3)');
    aura.addColorStop(0.5, 'rgba(255,203,95,0.1)');
    aura.addColorStop(1, 'rgba(255,203,95,0)');
    g.fillStyle = aura;
    g.fillRect(x - size * 0.8, y - size * 0.8, size * 1.6, size * 1.6);
    // Shadow.
    g.fillStyle = 'rgba(61,40,24,0.2)';
    g.beginPath();
    g.ellipse(x, y + 20 * sc, 26 * sc, 6 * sc, 0, 0, TAU);
    g.fill();
    g.translate(x, y);
    g.rotate(-0.12 + Math.sin(t * 1.7 + wobble) * 0.08);
    g.scale(sc, sc);
    g.translate(0, Math.sin(t * 2.6 + wobble) * 2.2);
    g.lineJoin = 'round';
    g.lineCap = 'round';

    // Tail.
    var tailSwing = Math.sin(t * 3.2 + wobble) * 4;
    g.fillStyle = '#dd9d3d';
    g.strokeStyle = 'rgba(80,51,27,0.82)';
    g.lineWidth = 3;
    g.beginPath();
    g.moveTo(-28, 0);
    g.quadraticCurveTo(-46, -22 + tailSwing, -54, -15 + tailSwing);
    g.quadraticCurveTo(-43, 0, -54, 16 + tailSwing);
    g.quadraticCurveTo(-43, 23 + tailSwing, -28, 5);
    g.closePath();
    g.fill();
    g.stroke();
    // Body.
    var bodyGrad = g.createLinearGradient(-20, -22, 25, 22);
    bodyGrad.addColorStop(0, '#f7d58b');
    bodyGrad.addColorStop(0.45, '#efb94c');
    bodyGrad.addColorStop(1, '#dc9731');
    g.fillStyle = bodyGrad;
    g.strokeStyle = 'rgba(80,51,27,0.85)';
    g.lineWidth = 3.2;
    g.beginPath();
    g.moveTo(-28, 0);
    g.bezierCurveTo(-12, -29, 28, -26, 44, -2);
    g.bezierCurveTo(46, 0, 46, 1, 44, 3);
    g.bezierCurveTo(24, 28, -12, 27, -28, 5);
    g.bezierCurveTo(-32, 3, -32, 2, -28, 0);
    g.closePath();
    g.fill();
    g.stroke();
    // Back / dorsal fin.
    g.fillStyle = '#d79332';
    g.strokeStyle = 'rgba(80,51,27,0.65)';
    g.lineWidth = 2;
    g.beginPath();
    g.moveTo(-8, -21);
    g.lineTo(3, -31);
    g.lineTo(10, -22);
    g.lineTo(19, -28);
    g.lineTo(22, -18);
    g.closePath();
    g.fill();
    g.stroke();
    // Dried-fish texture.
    g.strokeStyle = 'rgba(127,78,27,0.35)';
    g.lineWidth = 1.4;
    g.beginPath();
    g.moveTo(-12, -13); g.quadraticCurveTo(-2, -2, -7, 12);
    g.moveTo(2, -16); g.quadraticCurveTo(12, -4, 5, 11);
    g.moveTo(16, -14); g.quadraticCurveTo(24, -5, 18, 4);
    g.stroke();
    // Gills.
    g.strokeStyle = 'rgba(112,69,25,0.52)';
    g.lineWidth = 2.2;
    g.beginPath();
    g.arc(23, -1, 12, -1.2, 1.2);
    g.stroke();
    // Belly highlight.
    g.strokeStyle = 'rgba(255,241,184,0.65)';
    g.lineWidth = 3;
    g.beginPath();
    g.moveTo(-22, 8);
    g.bezierCurveTo(-5, 20, 11, 22, 31, 8);
    g.stroke();
    // Eye.
    g.fillStyle = '#4a3324';
    g.beginPath();
    g.arc(30, -7, 3.3, 0, TAU);
    g.fill();
    g.fillStyle = 'rgba(255,255,238,0.9)';
    g.beginPath();
    g.arc(31, -8.2, 1.3, 0, TAU);
    g.fill();
    // Mouth.
    g.fillStyle = '#7e4e2b';
    g.beginPath();
    g.arc(44, 0, 3.2, 0.2, Math.PI * 1.75);
    g.fill();
    // Shine.
    g.strokeStyle = 'rgba(255,249,218,0.7)';
    g.lineWidth = 2.2;
    g.beginPath();
    g.moveTo(-13, -15);
    g.quadraticCurveTo(2, -21, 17, -15);
    g.stroke();
    g.restore();

    // Sparkles.
    g.save();
    var sparkle = 0.45 + Math.sin(t * 3.3 + wobble) * 0.35;
    g.globalAlpha = alpha * sparkle;
    drawSparkle(g, x + size * 0.42, y - size * 0.36, size * 0.1, C.cream);
    g.globalAlpha = alpha * (0.3 + Math.sin(t * 2.2 + wobble + 1) * 0.18);
    drawSparkle(g, x - size * 0.4, y + size * 0.2, size * 0.07, C.goldPale);
    g.restore();
