  function drawSparkle(g, x, y, size, color) {
    g.save();
    g.translate(x, y);
    g.fillStyle = color;
    g.beginPath();
    g.moveTo(0, -size);
    g.quadraticCurveTo(size * 0.18, -size * 0.18, size, 0);
    g.quadraticCurveTo(size * 0.18, size * 0.18, 0, size);
    g.quadraticCurveTo(-size * 0.18, size * 0.18, -size, 0);
    g.quadraticCurveTo(-size * 0.18, -size * 0.18, 0, -size);
    g.fill();
    g.restore();
  }

  function drawCustomSprite(key, x, y, size, bob, alpha) {
    var img = images[key];
    if (!img) return;
    // Shadow.
    ctx.save();
    ctx.globalAlpha = alpha == null ? 1 : alpha;
    ctx.fillStyle = 'rgba(20,30,20,0.26)';
    ctx.beginPath();
    ctx.ellipse(x, y + size * 0.31, size * 0.33, size * 0.09, 0, 0, TAU);
    ctx.fill();
    var iw = img.naturalWidth || img.width || size;
    var ih = img.naturalHeight || img.height || size;
    var aspect = iw / ih;
    var dw, dh;
    if (aspect >= 1) { dw = size; dh = size / aspect; }
    else { dh = size; dw = size * aspect; }
    ctx.drawImage(img, x - dw / 2, y + (bob || 0) - dh / 2, dw, dh);
    ctx.restore();
  }

  /* 15. SCENE RENDERING ---------------------------------------------------- */
  function drawBackground() {
    if (custom.background && images.background && bgCanvas) {
      var img = images.background;
      var iw = img.naturalWidth || img.width || world.w;
      var ih = img.naturalHeight || img.height || world.h;
      var cover = Math.max(world.w / iw, world.h / ih);
      ctx.drawImage(img, (world.w - iw * cover) / 2, (world.h - ih * cover) / 2, iw * cover, ih * cover);
      var veil = ctx.createLinearGradient(0, 0, 0, world.h);
      veil.addColorStop(0, 'rgba(27,20,15,0.2)');
      veil.addColorStop(1, 'rgba(27,20,15,0.32)');
      ctx.fillStyle = veil;
      ctx.fillRect(0, 0, world.w, world.h);
      return;
    }
    if (bgCanvas) {
      ctx.drawImage(bgCanvas, 0, 0, world.w, world.h);
    } else {
      ctx.fillStyle = '#32241d';
      ctx.fillRect(0, 0, world.w, world.h);
    }
    // Moving light motes and faint lamp flicker.
    ctx.save();
    var lightGrad = ctx.createRadialGradient(
      floorRect.x + floorRect.w * 0.5, floorRect.y + 42, 10,
      floorRect.x + floorRect.w * 0.5, floorRect.y + 42, floorRect.w * 0.45
    );
    lightGrad.addColorStop(0, 'rgba(255,219,144,0.09)');
    lightGrad.addColorStop(1, 'rgba(255,219,144,0)');
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.65 + Math.sin(clock * 1.4) * 0.06;
    ctx.fillStyle = lightGrad;
    ctx.fillRect(floorRect.x, floorRect.y, floorRect.w, floorRect.h * 0.6);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    // Dust motes in the lamplight.
    for (var i = 0; i < 22; i++) {
      var seed = i * 31.7;
      var x = floorRect.x + 40 + hash01(seed + 1) * (floorRect.w - 80) + Math.sin(clock * 0.25 + i) * 12;
      var y = floorRect.y + 40 + ((hash01(seed + 7) * floorRect.h + clock * (4 + i % 4) * 0.6) % Math.max(20, floorRect.h - 50));
      var a = 0.06 + hash01(seed + 4) * 0.08;
      ctx.fillStyle = 'rgba(255,234,183,' + a.toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(x, y, 1 + hash01(seed + 8) * 1.8, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawSteam() {
    if (custom.background) return;
    var px = kitchen.potX;
    var py = kitchen.potY - 16;
    ctx.save();
    ctx.lineCap = 'round';
    for (var i = 0; i < 3; i++) {
      var t = clock * 0.55 + i * 1.7;
      var alpha = 0.1 + (Math.sin(t) + 1) * 0.03;
      ctx.strokeStyle = 'rgba(255,249,226,' + alpha.toFixed(3) + ')';
      ctx.lineWidth = 5 - i;
      ctx.beginPath();
      ctx.moveTo(px + (i - 1) * 9, py);
      ctx.bezierCurveTo(
        px + (i - 1) * 9 + Math.sin(t) * 14,
        py - 25,
        px + (i - 1) * 9 - Math.cos(t * 0.8) * 18,
        py - 48,
        px + (i - 1) * 5 + Math.sin(t * 1.3) * 10,
        py - 74
      );
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawFootprints() {
    for (var i = 0; i < footprints.length; i++) {
      var f = footprints[i];
      var alpha = (1 - f.age / f.life) * 0.15;
      ctx.save();
      ctx.translate(f.x, f.y);
      ctx.rotate(f.rot);
      ctx.fillStyle = 'rgba(77,56,40,' + alpha.toFixed(3) + ')';
      ctx.beginPath();
      ctx.ellipse(0, 0, 4.4, 5.2, 0, 0, TAU);
      ctx.arc(-5, -5.2, 1.8, 0, TAU);
      ctx.arc(-0.8, -7, 1.9, 0, TAU);
      ctx.arc(3.8, -5.5, 1.8, 0, TAU);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawPickups() {
    for (var i = 0; i < pickups.length; i++) {
      var p = pickups[i];
      var bob = Math.sin(clock * 2.7 + p.bob) * 4.2;
      var pulse = 1 + Math.sin(clock * 3 + p.phase) * 0.035;
      if (custom.pickup && images.pickup) {
        drawCustomSprite('pickup', p.x, p.y + bob, R.pickupSize * pulse, 0, 1);
      } else {
        drawFish(ctx, p.x, p.y + bob, R.pickupSize * pulse, {
          time: clock,
          wobble: p.phase
        });
      }
    }
  }

  function drawActors() {
    var list = [];
    for (var i = 0; i < enemies.length; i++) {
      list.push({ kind: 'robot', y: enemies[i].y + 26, e: enemies[i] });
    }
    list.push({ kind: 'hero', y: hero.y + 38 });
    list.sort(function (a, b) { return a.y - b.y; });
    for (var j = 0; j < list.length; j++) {
      if (list[j].kind === 'hero') drawHero();
      else drawRobotEntity(list[j].e);
    }
  }

  function drawHero() {
    var blink = false;
    var cycle = clock % 4.9;
    if (cycle > 4.72 && cycle < 4.86) blink = true;
    var alpha = 1;
    if (invuln > 0) alpha = Math.floor(invuln * 12) % 2 === 0 ? 0.4 : 1;
    ctx.save();
    ctx.globalAlpha = alpha;
    if (custom.hero && images.hero) {
      drawCustomSprite('hero', hero.x, hero.y - 8, R.heroSize * 1.06, Math.sin(hero.walk * 2) * 1.7 * hero.move, alpha);
    } else {
      drawCat(ctx, hero.x, hero.y, R.heroSize, {
        facing: hero.facing,
        walk: hero.walk,
        move: hero.move,
        time: clock,
        blink: blink
      });
    }
    ctx.restore();
    if (shield > 0) drawShield(hero.x, hero.y);
    if (invuln > 0 && hearts > 0) {
      ctx.save();
      ctx.globalAlpha = 0.7;
      drawRingDashed(hero.x, hero.y + 2, R.heroSize * 0.62 + Math.sin(clock * 10) * 2, 'rgba(255,221,186,0.5)');
      ctx.restore();
    }
  }

  function drawShield(x, y) {
    ctx.save();
    var t = clock;
    var r = R.heroSize * 0.7;
    ctx.globalAlpha = 0.34 + Math.sin(t * 3) * 0.04;
    var bubble = ctx.createRadialGradient(x, y, r * 0.35, x, y, r);
    bubble.addColorStop(0, 'rgba(144,232,215,0)');
    bubble.addColorStop(0.72, 'rgba(144,232,215,0.08)');
    bubble.addColorStop(0.93, 'rgba(144,232,215,0.26)');
    bubble.addColorStop(1, 'rgba(200,255,239,0.05)');
    ctx.fillStyle = bubble;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = 'rgba(178,249,230,0.72)';
    ctx.lineWidth = 2.4;
    ctx.setLineDash([13, 9]);
    ctx.lineDashOffset = -t * 30;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, TAU);
    ctx.stroke();
    ctx.setLineDash([]);
    // Little loops of yarn orbiting the cat.
    for (var i = 0; i < 3; i++) {
      var a = t * 1.35 + i * TAU / 3;
      var ox = x + Math.cos(a) * r * 0.92;
      var oy = y + Math.sin(a) * r * 0.56;
      ctx.fillStyle = 'rgba(165,245,225,0.85)';
      ctx.beginPath();
      ctx.arc(ox, oy, 5, 0, TAU);
      ctx.fill();
      ctx.strokeStyle = 'rgba(84,151,132,0.8)';
      ctx.lineWidth = 1.3;
      ctx.beginPath();
      ctx.arc(ox, oy, 8, a * 2, a * 2 + Math.PI * 1.2);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawRingDashed(x, y, r, color) {
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.setLineDash([7, 6]);
    ctx.lineDashOffset = clock * 20;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, TAU);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  function drawRobotEntity(e) {
    // Charge telegraph: a dashed warning line, drawn before the body.
    if (e.mode === 'windup') {
      var pulse = 0.45 + Math.sin(clock * 20) * 0.2;
      ctx.save();
      ctx.strokeStyle = 'rgba(255,105,82,' + pulse.toFixed(3) + ')';
      ctx.lineWidth = 3;
      ctx.setLineDash([11, 9]);
      ctx.lineDashOffset = -clock * 40;
      ctx.beginPath();
      ctx.moveTo(e.x, e.y);
      ctx.lineTo(e.x + e.chargeDX * 280, e.y + e.chargeDY * 280);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.arc(e.x + e.chargeDX * 280, e.y + e.chargeDY * 280, 15, 0, TAU);
      ctx.strokeStyle = 'rgba(255,125,100,0.55)';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();
    }
    if (e.mode === 'charge') {
      ctx.save();
      ctx.strokeStyle = 'rgba(255,123,96,0.46)';
      ctx.lineWidth = 3;
      for (var si = 0; si < 3; si++) {
        var back = 35 + si * 22;
        ctx.beginPath();
        ctx.moveTo(e.x - e.chargeDX * back + rand(-8, 8), e.y - e.chargeDY * back + rand(-8, 8));
        ctx.lineTo(e.x - e.chargeDX * (back + 40) + rand(-7, 7), e.y - e.chargeDY * (back + 40) + rand(-7, 7));
        ctx.stroke();
      }
      ctx.restore();
    }
    if (custom.enemy && images.enemy) {
      ctx.save();
      if (e.mode === 'windup' || e.mode === 'charge') {
        ctx.shadowColor = 'rgba(255,104,80,0.8)';
        ctx.shadowBlur = 20;
      }
      drawCustomSprite('enemy', e.x, e.y, R.enemySize, Math.sin(e.wob * 4) * 1.5, 1);
      ctx.restore();
    } else {
      drawRobot(ctx, e.x, e.y, R.enemySize, {
        time: clock + e.wob,
        mode: e.mode,
        vx: e.vx,
        vy: e.vy,
        flash: e.flash
      });
    }
    // Alert bubble.
    if (e.mode === 'windup' || (e.alert > 0 && e.mode !== 'charge')) {
      var windup = e.mode === 'windup';
      var bob = Math.sin(clock * (windup ? 16 : 6)) * (windup ? 1.5 : 2.5);
      var bx = e.x + 25;
      var by = e.y - R.enemySize * 0.58 + bob;
      ctx.save();
      ctx.translate(bx, by);
      var scale = windup ? 1.05 + Math.sin(clock * 16) * 0.08 : 0.95;
      ctx.scale(scale, scale);
      ctx.fillStyle = windup ? '#ff8d75' : C.cream;
      ctx.strokeStyle = C.ink;
      ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.arc(0, 0, 12, 0, TAU);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = C.ink;
      setFont(ctx, 17, '800');
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('!', 0, 1);
      ctx.restore();
    }
    if (e.mode === 'stunned') {
      for (var s = 0; s < 3; s++) {
        var a = clock * 4 + s * TAU / 3;
        drawSparkle(ctx, e.x + Math.cos(a) * 31, e.y - 36 + Math.sin(a) * 9, 4.5, C.goldPale);
      }
    }
  }

  function drawParticles() {
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      var a = 1 - p.age / p.life;
      if (a <= 0) continue;
      ctx.save();
      ctx.globalAlpha = clamp(a, 0, 1);
      if (p.kind === 'confetti') {
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size * 0.5, -p.size * 0.25, p.size, p.size * 0.55);
      } else if (p.kind === 'ring') {
        var rr = lerp(p.size * 0.4, p.size * 1.5, easeOut(clamp(p.age / p.life, 0, 1)));
        ctx.strokeStyle = p.color;
        ctx.lineWidth = 3 * a + 0.5;
        ctx.beginPath();
        ctx.arc(p.x, p.y, rr, 0, TAU);
        ctx.stroke();
      } else if (p.kind === 'star') {
        drawSparkle(ctx, p.x, p.y, p.size, p.color);
      } else if (p.kind === 'scale') {
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.ellipse(0, 0, p.size, p.size * 0.5, 0, 0, TAU);
        ctx.fill();
      } else if (p.kind === 'dust') {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * (0.45 + (1 - a) * 0.8), 0, TAU);
        ctx.fill();
      } else {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, TAU);
        ctx.fill();
      }
      ctx.restore();
    }
  }

  function drawFloaters() {
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (var i = 0; i < floaters.length; i++) {
      var f = floaters[i];
      var a = clamp(1 - f.age / f.life, 0, 1);
      var scale = 1 + Math.sin(clamp(f.age / f.life, 0, 1) * Math.PI) * 0.12;
      ctx.save();
      ctx.translate(f.x, f.y);
      ctx.scale(scale, scale);
      ctx.globalAlpha = a;
      setFont(ctx, f.size, '800');
      ctx.lineWidth = 4;
      ctx.strokeStyle = 'rgba(54,37,26,0.72)';
      ctx.strokeText(f.text, 0, 0);
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, 0, 0);
      ctx.restore();
    }
    ctx.restore();
  }

  function drawJoystick() {
    if (!joystick || phase !== 'playing' || paused) return;
    var r = 48;
    ctx.save();
    var dx = joystick.dx, dy = joystick.dy;
    var d = Math.sqrt(dx * dx + dy * dy);
    if (d > r) { dx = dx / d * r; dy = dy / d * r; }
    ctx.globalAlpha = 0.7;
    ctx.strokeStyle = 'rgba(247,236,215,0.42)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(joystick.ox, joystick.oy, r, 0, TAU);
    ctx.stroke();
    ctx.fillStyle = 'rgba(247,236,215,0.14)';
    ctx.beginPath();
    ctx.arc(joystick.ox, joystick.oy, r, 0, TAU);
    ctx.fill();
    ctx.fillStyle = 'rgba(247,236,215,0.5)';
    ctx.beginPath();
    ctx.arc(joystick.ox + dx, joystick.oy + dy, 18, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  function drawScreenVignette() {
    var cw = view.cssW, ch = view.cssH;
    var g = ctx.createRadialGradient(cw / 2, ch * 0.47, Math.min(cw, ch) * 0.2, cw / 2, ch * 0.5, Math.max(cw, ch) * 0.72);
    g.addColorStop(0, 'rgba(20,12,8,0)');
    g.addColorStop(0.65, 'rgba(20,12,8,0.08)');
    g.addColorStop(1, 'rgba(20,12,8,0.4)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, cw, ch);
    if (hurtFlash > 0) {
      ctx.fillStyle = 'rgba(255,84,72,' + (hurtFlash * 0.55).toFixed(3) + ')';
      ctx.fillRect(0, 0, cw, ch);
    }
    var danger = 0;
    if (phase === 'playing') {
      for (var i = 0; i < enemies.length; i++) {
        var e = enemies[i];
        if ((e.mode === 'windup' || e.mode === 'charge') && dist(e.x, e.y, hero.x, hero.y) < 430) {
          danger = Math.max(danger, e.mode === 'windup' ? 1 : 0.65);
        }
      }
    }
    if (danger > 0) {
      var edge = ctx.createRadialGradient(cw / 2, ch / 2, Math.min(cw, ch) * 0.24, cw / 2, ch / 2, Math.max(cw, ch) * 0.7);
      edge.addColorStop(0, 'rgba(255,88,68,0)');
      edge.addColorStop(1, 'rgba(255,80,60,' + (0.16 * danger).toFixed(3) + ')');
      ctx.fillStyle = edge;
      ctx.fillRect(0, 0, cw, ch);
    }
  }

  /* 16. HUD ---------------------------------------------------------------- */
  function drawHUD() {
    if (phase === 'title') return;
    var cw = view.cssW, ch = view.cssH;
    var s = clamp(cw / 580, 0.78, 1.08);
    var panelW = Math.min(cw - 20, 760);
    var panelH = 56 * s;
    var x = (cw - panelW) / 2;
    var y = 12;
    ctx.save();
    // Panel shadow and body.
    fillRound(ctx, x + 2, y + 6, panelW, panelH, 17 * s, 'rgba(13,9,7,0.3)');
    fillRound(ctx, x, y, panelW, panelH, 17 * s, 'rgba(34,26,21,0.86)');
    strokeRound(ctx, x, y, panelW, panelH, 17 * s, 'rgba(246,231,200,0.2)', 1.4);
    // Inner warm highlight.
    ctx.strokeStyle = 'rgba(255,245,220,0.06)';
    ctx.lineWidth = 1;
    roundPath(ctx, x + 4, y + 4, panelW - 8, panelH - 8, 13 * s);
    ctx.stroke();

    // Hearts.
    var heartSize = 22 * s;
    var heartX = x + 21 * s;
    var heartY = y + panelH * 0.5;
    for (var i = 0; i < R.hearts; i++) {
      drawHeartIcon(ctx, heartX + i * 26 * s, heartY, heartSize, i < hearts);
    }
    // Divider.
    var dividerX = x + 104 * s;
    ctx.strokeStyle = 'rgba(247,232,204,0.14)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(dividerX, y + 13 * s);
    ctx.lineTo(dividerX, y + panelH - 13 * s);
    ctx.stroke();

    // Fish progress in the middle.
    var centerX = x + panelW * 0.5;
    var fishSize = 24 * s;
    var fishX = centerX - 59 * s;
    drawFishIcon(ctx, fishX, y + panelH * 0.41, fishSize, C.gold, C.ink);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    setFont(ctx, 19 * s, '800');
    ctx.fillStyle = C.cream;
    ctx.fillText(score + ' / ' + R.quota, fishX + 21 * s, y + panelH * 0.39);
    // Progress bar.
    var barW = 112 * s;
    var barH = 4.5 * s;
    var barX = centerX - barW / 2;
    var barY = y + panelH * 0.69;
    fillRound(ctx, barX, barY, barW, barH, barH / 2, 'rgba(246,233,208,0.16)');
    var progress = clamp(score / R.quota, 0, 1);
    if (progress > 0) {
      var grad = ctx.createLinearGradient(barX, barY, barX + barW, barY);
      grad.addColorStop(0, C.gold);
      grad.addColorStop(1, '#ffe0a0');
      fillRound(ctx, barX, barY, Math.max(barH, barW * progress), barH, barH / 2, grad);
    }
    // Divider.
    var divider2X = x + panelW - 104 * s;
    ctx.strokeStyle = 'rgba(247,232,204,0.14)';
    ctx.beginPath();
    ctx.moveTo(divider2X, y + 13 * s);
    ctx.lineTo(divider2X, y + panelH - 13 * s);
    ctx.stroke();

    // Timer.
    var warn = time <= 10 && phase === 'playing';
    var timerColor = warn ? C.red : C.cream;
    var clockX = x + panelW - 87 * s;
    drawClockIcon(ctx, clockX, heartY, 22 * s, timerColor);
    ctx.textAlign = 'right';
    setFont(ctx, 19 * s, '800');
    ctx.fillStyle = timerColor;
    var timeLabel = formatTime(time);
    if (warn) {
      var pulse = 1 + Math.sin(clock * 9) * 0.05;
      ctx.save();
      ctx.translate(x + panelW - 15 * s, heartY);
      ctx.scale(pulse, pulse);
      ctx.fillText(timeLabel, 0, 1);
      ctx.restore();
    } else {
      ctx.fillText(timeLabel, x + panelW - 15 * s, heartY + 1);
    }

    // Shield pill.
    var underY = y + panelH + 9 * s;
    if (shield > 0) {
      var pw = 142 * s;
      fillRound(ctx, x, underY, pw, 27 * s, 13.5 * s, 'rgba(58,104,88,0.91)');
      strokeRound(ctx, x, underY, pw, 27 * s, 13.5 * s, 'rgba(183,247,226,0.55)', 1.2);
      drawYarnIcon(ctx, x + 18 * s, underY + 13.5 * s, 18 * s, '#c8ffef');
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      setFont(ctx, 13 * s, '700');
      ctx.fillStyle = '#e8fff7';
      ctx.fillText('毛线护盾 ' + shield.toFixed(1) + 's', x + 32 * s, underY + 14 * s);
      underY += 34 * s;
    }
    // Combo pill.
    if (combo >= 2 && comboTimer > 0 && phase === 'playing') {
      var comboW = 114 * s;
      var combX = x + panelW - comboW;
      var pop = 1 + Math.max(0, comboTimer - 2.45) * 0.5;
      ctx.save();
      ctx.translate(combX + comboW / 2, y + panelH + 9 * s + 13.5 * s);
      ctx.scale(pop, pop);
      fillRound(ctx, -comboW / 2, -13.5 * s, comboW, 27 * s, 13.5 * s, 'rgba(166,82,63,0.95)');
      strokeRound(ctx, -comboW / 2, -13.5 * s, comboW, 27 * s, 13.5 * s, 'rgba(255,203,154,0.55)', 1.2);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      setFont(ctx, 13.5 * s, '800');
      ctx.fillStyle = '#ffe9c8';
      ctx.fillText('连偷 ×' + combo, 0, 1);
      ctx.restore();
    }
    ctx.restore();
  }

  function drawToast() {
    if (!toast || phase !== 'playing') return;
    var cw = view.cssW, ch = view.cssH;
    var alpha = Math.min(1, Math.min(toast.age / 0.22, (toast.life - toast.age) / 0.3));
    if (alpha <= 0) return;
    var s = clamp(cw / 640, 0.76, 1.05);
    ctx.save();
    ctx.globalAlpha = clamp(alpha, 0, 1);
    setFont(ctx, 15.5 * s, '700');
    var subSize = 11.5 * s;
    setFont(ctx, subSize, '500');
    var textW = ctx.measureText(toast.sub || '').width;
    setFont(ctx, 15.5 * s, '700');
    textW = Math.max(textW, ctx.measureText(toast.text).width);
    var w = Math.min(cw - 32, Math.max(220 * s, textW + 42 * s));
    var h = toast.sub ? 48 * s : 34 * s;
    var x = (cw - w) / 2;
    var y = ch - h - 24 * s;
    if (joystick) y -= 45;
    fillRound(ctx, x, y + 3, w, h, 12 * s, 'rgba(14,10,8,0.22)');
    fillRound(ctx, x, y, w, h, 12 * s, 'rgba(37,28,22,0.88)');
    strokeRound(ctx, x, y, w, h, 12 * s, 'rgba(243,224,188,0.24)', 1.2);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    setFont(ctx, 15.5 * s, '700');
    ctx.fillStyle = C.cream;
    ctx.fillText(toast.text, cw / 2, y + (toast.sub ? h * 0.33 : h * 0.52));
    if (toast.sub) {
      setFont(ctx, subSize, '500');
      ctx.fillStyle = 'rgba(237,218,184,0.72)';
      ctx.fillText(toast.sub, cw / 2, y + h * 0.68);
    }
    ctx.restore();
  }

  function formatTime(t) {
    var total = Math.max(0, Math.ceil(t));
    var m = Math.floor(total / 60);
    var sec = total - m * 60;
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }
  function trimSeconds(value) {
    return String(Math.round(value * 10) / 10).replace(/\.0$/, '');
  }

  /* 17. OVERLAYS ----------------------------------------------------------- */
  function drawTitleOverlay() {
    var cw = view.cssW, ch = view.cssH;
    var W = Math.min(cw - 28, 560);
    var u = clamp(Math.min(W / 560, (ch - 28) / 560), 0.58, 1.12);
    var cardW = 560 * u;
    var cardH = 560 * u;
    var x = (cw - cardW) / 2;
    var y = (ch - cardH) / 2;

    // Warm dim + texture.
    var dim = ctx.createLinearGradient(0, 0, 0, ch);
    dim.addColorStop(0, 'rgba(24,18,14,0.62)');
    dim.addColorStop(0.55, 'rgba(24,17,13,0.48)');
    dim.addColorStop(1, 'rgba(19,13,10,0.64)');
    ctx.fillStyle = dim;
    ctx.fillRect(0, 0, cw, ch);
    var halo = ctx.createRadialGradient(cw * 0.5, ch * 0.45, 20, cw * 0.5, ch * 0.45, Math.max(cw, ch) * 0.65);
    halo.addColorStop(0, 'rgba(255,214,139,0.07)');
    halo.addColorStop(1, 'rgba(255,214,139,0)');
    ctx.fillStyle = halo;
    ctx.fillRect(0, 0, cw, ch);

    // A full-colour mascot in the breathing room outside the card.
    drawTitleMascot(cw, ch, x, y, cardW, cardH);

    // Card shadow and paper.
    ctx.save();
    fillRound(ctx, x + 7 * u, y + 10 * u, cardW, cardH, 28 * u, 'rgba(9,6,5,0.35)');
    var paper = ctx.createLinearGradient(x, y, x, y + cardH);
    paper.addColorStop(0, '#fbf2df');
    paper.addColorStop(0.68, '#f7ecd7');
    paper.addColorStop(1, '#f0dfc2');
    fillRound(ctx, x, y, cardW, cardH, 28 * u, paper);
    strokeRound(ctx, x, y, cardW, cardH, 28 * u, C.ink, 4.2 * u);
    ctx.save();
    roundPath(ctx, x + 3 * u, y + 3 * u, cardW - 6 * u, cardH - 6 * u, 25 * u);
    ctx.clip();
    // Subtle paper texture: tiny warm flecks and paw prints.
    for (var i = 0; i < 26; i++) {
      ctx.fillStyle = 'rgba(153,112,74,' + (0.03 + (i % 3) * 0.012) + ')';
      ctx.beginPath();
      ctx.arc(x + hash01(i * 4.1) * cardW, y + hash01(i * 9.3 + 2) * cardH, 1 + hash01(i) * 2.4, 0, TAU);
      ctx.fill();
    }
    drawPawIcon(ctx, x + 38 * u, y + 52 * u, 38 * u, 'rgba(156,111,76,0.1)', 1);
    drawPawIcon(ctx, x + cardW - 43 * u, y + cardH - 44 * u, 48 * u, 'rgba(156,111,76,0.09)', 1);
    drawPawIcon(ctx, x + cardW - 30 * u, y + 34 * u, 27 * u, 'rgba(156,111,76,0.09)', 1);
    ctx.restore();

    // Small top badge.
    var badgeW = 236 * u, badgeH = 28 * u;
    fillRound(ctx, x + (cardW - badgeW) / 2, y + 28 * u, badgeW, badgeH, 14 * u, C.coral);
    strokeRound(ctx, x + (cardW - badgeW) / 2, y + 28 * u, badgeW, badgeH, 14 * u, C.ink, 2 * u);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    setFont(ctx, 14 * u, '700');
    ctx.fillStyle = '#fff0d7';
    ctx.fillText('深 夜 厨 房  ·  偷 吃 行 动', x + cardW / 2, y + 42.5 * u);

    // Title.
    var titleSize = fitFont(ctx, TITLE, cardW - 82 * u, 61 * u, '800', true);
    setFont(ctx, titleSize, '800', true);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = C.ink;
    ctx.fillText(TITLE, x + cardW / 2, y + 108 * u);
    // Brush underline.
    ctx.strokeStyle = 'rgba(223,126,104,0.8)';
    ctx.lineWidth = 4.5 * u;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x + cardW / 2 - 82 * u, y + 142 * u);
    ctx.quadraticCurveTo(x + cardW / 2, y + 151 * u, x + cardW / 2 + 82 * u, y + 141 * u);
    ctx.stroke();
    // Subtitle.
    setFont(ctx, 17 * u, '500');
    ctx.fillStyle = C.inkSoft;
    ctx.fillText('趁铲屎官睡着，60 秒内把小鱼干偷个够。', x + cardW / 2, y + 169 * u);
    ctx.strokeStyle = 'rgba(91,66,49,0.16)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x + 62 * u, y + 192 * u);
    ctx.lineTo(x + cardW - 62 * u, y + 192 * u);
    ctx.stroke();

    // Three objective rows.
    var rowX = x + 72 * u;
    var iconX = x + 92 * u;
    var textX = x + 120 * u;
    var rows = [
      { icon: 'fish', title: '偷满 ' + R.quota + ' 条小鱼干', color: C.gold },
      { icon: 'robot', title: '躲开扫地机器人的冲撞', color: C.mintDeep },
      { icon: 'shield', title: '每偷 ' + R.shield.every + ' 条获得毛线护盾', color: C.cyan }
    ];
    for (var r = 0; r < rows.length; r++) {
      var ry = y + (232 + r * 49) * u;
      fillRound(ctx, iconX - 17 * u, ry - 17 * u, 34 * u, 34 * u, 11 * u, 'rgba(255,249,233,0.64)');
      strokeRound(ctx, iconX - 17 * u, ry - 17 * u, 34 * u, 34 * u, 11 * u, 'rgba(91,66,49,0.13)', 1.2 * u);
      if (rows[r].icon === 'fish') drawFishIcon(ctx, iconX, ry, 27 * u, C.gold, C.ink);
      else if (rows[r].icon === 'robot') drawRobotIcon(ctx, iconX, ry + 2 * u, 27 * u, C.mintDeep);
      else drawYarnIcon(ctx, iconX, ry, 24 * u, C.mintDeep);
      ctx.textAlign = 'left';
      setFont(ctx, 17 * u, '650');
      ctx.fillStyle = C.ink;
      ctx.fillText(rows[r].title, textX, ry + 1);
    }

    // Best record.
    ctx.textAlign = 'center';
    setFont(ctx, 12.5 * u, '500');
    ctx.fillStyle = C.inkSoft;
    if (best.time > 0) {
      var recordText = '最快通关：' + trimSeconds(best.time) + ' 秒';
      if (best.combo > 0) recordText += '  ·  最高连偷 ×' + best.combo;
      fitFont(ctx, recordText, cardW - 100 * u, 12.5 * u, '500');
      ctx.fillText(recordText, x + cardW / 2, y + 382 * u);
    } else {
      ctx.fillText('第一次来？脚步轻一点，扫地机器人可没睡。', x + cardW / 2, y + 382 * u);
    }

    // Start button.
    var btnW = 232 * u, btnH = 54 * u;
    var btnX = x + (cardW - btnW) / 2;
    var btnY = y + 401 * u;
    var pulse = 1 + Math.sin(clock * 3.1) * 0.018;
    ctx.save();
    ctx.translate(btnX + btnW / 2, btnY + btnH / 2);
    ctx.scale(pulse, pulse);
    fillRound(ctx, -btnW / 2 + 3 * u, -btnH / 2 + 5 * u, btnW, btnH, 16 * u, 'rgba(89,48,38,0.32)');
    fillRound(ctx, -btnW / 2, -btnH / 2, btnW, btnH, 16 * u, C.coral);
    strokeRound(ctx, -btnW / 2, -btnH / 2, btnW, btnH, 16 * u, C.ink, 2.8 * u);
    // Glint.
    ctx.strokeStyle = 'rgba(255,236,203,0.4)';
    ctx.lineWidth = 1.6 * u;
    ctx.beginPath();
    ctx.moveTo(-btnW / 2 + 24 * u, -btnH / 2 + 10 * u);
    ctx.quadraticCurveTo(0, -btnH / 2 + 4 * u, btnW / 2 - 24 * u, -btnH / 2 + 10 * u);
    ctx.stroke();
    setFont(ctx, 21 * u, '800');
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff8e8';
    ctx.fillText('开 饭 ！', 0, 1 * u);
    ctx.restore();

    // Input hints.
    setFont(ctx, 13.5 * u, '650');
    ctx.fillStyle = C.ink;
    ctx.fillText('点击任意处 / 按任意键开始', x + cardW / 2, y + 478 * u);
    fitFont(ctx, 'WASD / 方向键 / 拖动移动   ·   P 暂停   ·   M 静音', cardW - 66 * u, 11 * u, '500');
    ctx.fillStyle = 'rgba(109,81,65,0.8)';
    ctx.fillText('WASD / 方向键 / 拖动移动   ·   P 暂停   ·   M 静音', x + cardW / 2, y + 506 * u);
    // Footer paw.
    drawPawIcon(ctx, x + cardW / 2, y + 533 * u, 16 * u, 'rgba(109,81,65,0.45)', 1);
    ctx.restore();
  }

  function drawTitleMascot(cw, ch, cardX, cardY, cardW, cardH) {
    var below = ch - (cardY + cardH);
    var blinkCycle = clock % 5.3;
    var blinking = blinkCycle > 5.12 && blinkCycle < 5.26;
    ctx.save();
    if (below > 120) {
      var size = Math.min(132, below * 0.7, cardW * 0.38);
      var mx = cw * 0.5;
      var my = cardY + cardH + below * 0.43;
      // A soft halo so the mascot sits in its own little pool of light.
      var glow = ctx.createRadialGradient(mx, my - size * 0.15, 4, mx, my - size * 0.15, size * 1.3);
      glow.addColorStop(0, 'rgba(255,219,151,0.12)');
      glow.addColorStop(1, 'rgba(255,219,151,0)');
      ctx.fillStyle = glow;
      ctx.fillRect(mx - size * 1.4, my - size * 1.5, size * 2.8, size * 2.8);
      drawFish(ctx, mx + size * 0.82, my + size * 0.23, size * 0.6, {
        time: clock, wobble: 1.7
      });
      drawCat(ctx, mx, my, size, {
        facing: 1,
        walk: 1.8,
        move: 0.18,
        time: clock,
        blink: blinking
      });
    } else if (cardX > 120) {
      var sideSize = Math.min(122, cardX - 42, cardH * 0.3);
      var sx = cardX - sideSize * 0.76;
      var sy = cardY + cardH * 0.61;
      drawCat(ctx, sx, sy, sideSize, {
        facing: 1,
        walk: 1.2,
        move: 0.1,
        time: clock,
        blink: blinking
      });
    } else if (cw - (cardX + cardW) > 120) {
      var rightSize = Math.min(118, cw - (cardX + cardW) - 30, cardH * 0.28);
      drawCat(ctx, cardX + cardW + rightSize * 0.76, cardY + cardH * 0.61, rightSize, {
        facing: -1,
        walk: 1.2,
        move: 0.1,
        time: clock,
        blink: blinking
      });
    }
    ctx.restore();
  }

  function drawEndOverlay() {
    if (phase !== 'won' && phase !== 'lost') return;
    var cw = view.cssW, ch = view.cssH;
    var W = Math.min(cw - 32, 480);
    var u = clamp(Math.min(W / 480, (ch - 24) / 420), 0.64, 1.12);
    var cardW = 480 * u;
    var cardH = 420 * u;
    var x = (cw - cardW) / 2;
    var y = (ch - cardH) / 2;
    var won = phase === 'won';

    ctx.fillStyle = 'rgba(21,15,11,0.6)';
    ctx.fillRect(0, 0, cw, ch);
    var halo = ctx.createRadialGradient(cw / 2, ch / 2, 20, cw / 2, ch / 2, Math.max(cw, ch) * 0.6);
    halo.addColorStop(0, won ? 'rgba(255,217,132,0.1)' : 'rgba(255,103,84,0.06)');
    halo.addColorStop(1, 'rgba(255,217,132,0)');
    ctx.fillStyle = halo;
    ctx.fillRect(0, 0, cw, ch);

    // Screen-space confetti makes the victory land even before the card.
    if (won) {
      var confettiColors = [C.coral, C.gold, C.cyan, C.cream, C.mint];
      for (var ci = 0; ci < 30; ci++) {
        var bx = (hash01(ci * 7.1 + 2) * (cw + 60) + clock * (10 + (ci % 5) * 7)) % (cw + 60) - 30;
        var by = (hash01(ci * 3.7 + 5) * (ch + 40) + clock * (16 + (ci % 4) * 10)) % (ch + 40) - 20;
        ctx.save();
        ctx.translate(bx, by);
        ctx.rotate(clock * (ci % 2 ? 1.4 : -1.1) + ci);
        ctx.globalAlpha = 0.55 + (ci % 3) * 0.12;
        ctx.fillStyle = confettiColors[ci % confettiColors.length];
        ctx.fillRect(-3.5, -1.7, 7, 3.4);
        ctx.restore();
      }
    }

    ctx.save();
    fillRound(ctx, x + 6 * u, y + 9 * u, cardW, cardH, 24 * u, 'rgba(8,5,4,0.38)');
    var paper = ctx.createLinearGradient(x, y, x, y + cardH);
    paper.addColorStop(0, '#fbf2df');
    paper.addColorStop(1, '#efdfc2');
    fillRound(ctx, x, y, cardW, cardH, 24 * u, paper);
    strokeRound(ctx, x, y, cardW, cardH, 24 * u, C.ink, 4 * u);

    // A little result medallion.
    var mx = x + cardW / 2;
    var my = y + 62 * u;
    ctx.fillStyle = won ? 'rgba(238,182,78,0.22)' : 'rgba(223,126,104,0.17)';
    ctx.beginPath();
    ctx.arc(mx, my, 34 * u, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = won ? C.gold : C.coral;
    ctx.lineWidth = 2.5 * u;
    ctx.beginPath();
    ctx.arc(mx, my, 34 * u, 0, TAU);
    ctx.stroke();
    if (won) {
      drawFishIcon(ctx, mx, my + 1 * u, 42 * u, C.gold, C.ink);
    } else if (endReason === 'time') {
      drawClockIcon(ctx, mx, my + 1 * u, 44 * u, C.coralDeep);
    } else {
      drawRobotIcon(ctx, mx, my + 4 * u, 41 * u, C.coral);
    }
    // Verdict.
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    var verdict = won ? '满载而归！' : (endReason === 'time' ? '时间到啦…' : '被逮住啦…');
    fitFont(ctx, verdict, cardW - 90 * u, 42 * u, '800', true);
    ctx.fillStyle = won ? '#a76b19' : C.coralDeep;
    ctx.fillText(verdict, mx, y + 122 * u);
    // Reason.
    setFont(ctx, 15.5 * u, '500');
    ctx.fillStyle = C.inkSoft;
    var reason = won
      ? '今天的夜宵，稳稳到手。'
      : (endReason === 'time' ? '还差 ' + Math.max(0, R.quota - score) + ' 条小鱼干，下次快一点！' : '扫地机器人把你逮了个正着。');
    fitFont(ctx, reason, cardW - 56 * u, 15.5 * u, '500');
    ctx.fillText(reason, mx, y + 152 * u);
    ctx.strokeStyle = 'rgba(91,66,49,0.14)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x + 48 * u, y + 174 * u);
    ctx.lineTo(x + cardW - 48 * u, y + 174 * u);
    ctx.stroke();

    // Big fish count.
    setFont(ctx, 52 * u, '800', true);
    ctx.fillStyle = C.ink;
    ctx.fillText(score + ' / ' + R.quota, mx, y + 220 * u);
    setFont(ctx, 13 * u, '600');
    ctx.fillStyle = C.inkSoft;
    ctx.fillText('条 小 鱼 干', mx, y + 247 * u);

    // Stats.
    var statY = y + 285 * u;
    var statW = cardW * 0.25;
    var stats = [
      ['用时', trimSeconds(Math.max(0, R.duration - time)) + ' 秒'],
      ['本局连偷', '×' + maxCombo],
      ['最快通关', best.time > 0 ? trimSeconds(best.time) + ' 秒' : '—']
    ];
    for (var i = 0; i < 3; i++) {
      var sx = x + cardW * (0.17 + i * 0.33);
      setFont(ctx, 11 * u, '600');
      ctx.fillStyle = 'rgba(109,81,65,0.72)';
      ctx.fillText(stats[i][0], sx, statY);
      setFont(ctx, 17 * u, '800');
      ctx.fillStyle = C.ink;
      ctx.fillText(stats[i][1], sx, statY + 21 * u);
    }

    // Restart button.
    var btnW = 218 * u, btnH = 48 * u;
    var btnX = x + (cardW - btnW) / 2;
    var btnY = y + 322 * u;
    var pulse = 1 + Math.sin(clock * 3.4) * 0.014;
    ctx.save();
    ctx.translate(btnX + btnW / 2, btnY + btnH / 2);
    ctx.scale(pulse, pulse);
    fillRound(ctx, -btnW / 2 + 3 * u, -btnH / 2 + 5 * u, btnW, btnH, 15 * u, 'rgba(89,48,38,0.3)');
    fillRound(ctx, -btnW / 2, -btnH / 2, btnW, btnH, 15 * u, won ? '#b58234' : C.coral);
    strokeRound(ctx, -btnW / 2, -btnH / 2, btnW, btnH, 15 * u, C.ink, 2.5 * u);
    setFont(ctx, 18.5 * u, '800');
    ctx.fillStyle = '#fff7e5';
    ctx.fillText('再 偷 一 次', 0, 1 * u);
    ctx.restore();

    setFont(ctx, 12 * u, '500');
    ctx.fillStyle = 'rgba(109,81,65,0.78)';
    if (restartGuard > 0) {
      ctx.fillText('稍等片刻…', mx, y + 392 * u);
    } else {
      ctx.fillText('点击任意处 / 按任意键重开', mx, y + 392 * u);
    }
    ctx.restore();
  }

  function drawPauseOverlay() {
    if (!paused || phase !== 'playing') return;
    var cw = view.cssW, ch = view.cssH;
    ctx.fillStyle = 'rgba(17,12,9,0.52)';
    ctx.fillRect(0, 0, cw, ch);
    var W = Math.min(cw - 40, 330);
    var u = clamp(W / 330, 0.72, 1.05);
    var x = (cw - W) / 2;
    var y = ch / 2 - 95 * u;
    fillRound(ctx, x - 4 * u, y + 6 * u, W, 190 * u, 20 * u, 'rgba(11,7,5,0.3)');
    fillRound(ctx, x, y, W, 190 * u, 20 * u, '#fbf1de');
    strokeRound(ctx, x, y, W, 190 * u, 20 * u, C.ink, 3.5 * u);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    setFont(ctx, 36 * u, '800', true);
    ctx.fillStyle = C.ink;
    ctx.fillText('暂停中', cw / 2, y + 65 * u);
    setFont(ctx, 13 * u, '500');
    ctx.fillStyle = C.inkSoft;
    ctx.fillText('伸个懒腰，机器人也在充电。', cw / 2, y + 104 * u);
    setFont(ctx, 13.5 * u, '700');
    ctx.fillStyle = C.coralDeep;
    ctx.fillText('点击继续 · 按 P 恢复', cw / 2, y + 146 * u);
    drawPawIcon(ctx, cw / 2, y + 174 * u, 14 * u, 'rgba(109,81,65,0.35)', 1);
  }

  /* 18. MAIN RENDER LOOP --------------------------------------------------- */
  function render() {
    var cw = view.cssW, ch = view.cssH;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#17100c';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    var shakeX = 0, shakeY = 0;
    if (shake > 0) {
      var amount = shake * 11;
      shakeX = (Math.random() * 2 - 1) * amount;
      shakeY = (Math.random() * 2 - 1) * amount;
    }
    ctx.setTransform(
      view.dpr * view.fit, 0, 0, view.dpr * view.fit,
      view.dpr * (view.ox + shakeX), view.dpr * (view.oy + shakeY)
    );
    drawBackground();
    drawFootprints();
    drawPickups();
    drawActors();
    drawParticles();
    drawSteam();
    drawFloaters();
    // Light edge darkening is drawn in screen space below.

    ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
    drawScreenVignette();
    drawHUD();
    drawToast();
    drawJoystick();
    if (phase === 'title') {
      drawTitleOverlay();
    } else {
      drawPauseOverlay();
      drawEndOverlay();
    }
  }

  function frame(now) {
    requestAnimationFrame(frame);
    if (!lastTime) lastTime = now;
    var dt = clamp((now - lastTime) / 1000, 0, 0.05);
    lastTime = now;
    fpsFrames += 1;
    fpsAccum += dt;
    if (fpsAccum >= 0.5) {
      fps = Math.round(fpsFrames / fpsAccum);
      fpsFrames = 0;
      fpsAccum = 0;
    }
    if (!paused) {
      clock += dt;
      update(dt);
    }
    render();
  }

  /* 19. RESIZE + BOOT ------------------------------------------------------ */
  function resize() {
    var cssW = window.innerWidth || document.documentElement.clientWidth || 1280;
    var cssH = window.innerHeight || document.documentElement.clientHeight || 720;
    view.cssW = cssW;
    view.cssH = cssH;
    view.dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.round(cssW * view.dpr);
    canvas.height = Math.round(cssH * view.dpr);
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';
    canvas.style.touchAction = 'none';
    canvas.style.webkitTapHighlightColor = 'transparent';
    canvas.style.outline = 'none';
    var landscape = cssW >= cssH;
    world.w = landscape ? 1280 : 720;
    world.h = landscape ? 720 : 1280;
    computeLayout();
    view.fit = Math.min(cssW / world.w, cssH / world.h);
    view.ox = (cssW - world.w * view.fit) / 2;
    view.oy = (cssH - world.h * view.fit) / 2;
    clampHero();
    for (var i = 0; i < enemies.length; i++) {
      enemies[i].x = floorClampX(enemies[i].x, R.enemySize * 0.56);
      enemies[i].y = floorClampY(enemies[i].y, R.enemySize * 0.7);
    }
    for (var j = 0; j < pickups.length; j++) {
      pickups[j].x = floorClampX(pickups[j].x, R.pickupSize * 0.7);
      pickups[j].y = floorClampY(pickups[j].y, R.pickupSize * 0.8);
    }
    rebuildBackground();
  }

  function emitPhase() {
    post({ type: 'state', phase: phase, score: score });
  }
  function round(v) {
    if (typeof v !== 'number' || !isFinite(v)) return 0;
    var r = Math.round(v * 100) / 100;
    return r === 0 ? 0 : r;
  }
  window.__gameState = function () {
    return {
      phase: phase,
      paused: paused,
      time: round(time),
      elapsed: round(elapsed),
      score: round(score),
      quota: R.quota,
      hearts: round(hearts),
      shield: round(shield),
      combo: combo,
      comboTime: round(comboTimer),
      best: best.fish,
      hero: { x: round(hero.x), y: round(hero.y) },
      enemies: enemies.map(function (e) {
        return { x: round(e.x), y: round(e.y), mode: e.mode };
      }),
      pickups: pickups.map(function (p) {
        return { x: round(p.x), y: round(p.y) };
      }),
      world: { w: round(world.w), h: round(world.h) },
      fps: round(fps)
    };
  };

  /* 20. SIDEBAR / PLAYTEST CHARACTER RENDERS ------------------------------ */
  function slotThumbnail(size, slot) {
    var c = document.createElement('canvas');
    c.width = size;
    c.height = size;
    var g = c.getContext('2d');
    if (slot === 'background') {
      // Paint a dedicated square kitchen vignette so the sidebar preview
      // shows the counter, floor and rug rather than a bare tile crop.
      var savedFloor = floorRect;
      var savedKitchen = kitchen;
      var preview = document.createElement('canvas');
      preview.width = 768;
      preview.height = 768;
      var pg = preview.getContext('2d');
      floorRect = { x: 28, y: 190, w: 712, h: 540 };
      kitchen = {
        counterY: 94,
        counterH: 96,
        potX: floorRect.x + floorRect.w * 0.68,
        potY: floorRect.y - 46,
        sinkX: floorRect.x + floorRect.w * 0.17,
        boardX: floorRect.x + floorRect.w * 0.43,
        jarX: floorRect.x + floorRect.w * 0.86
      };
      try {
        paintKitchen(pg, preview.width, preview.height);
        g.drawImage(preview, 0, 0, size, size);
      } finally {
        floorRect = savedFloor;
        kitchen = savedKitchen;
      }
      return c.toDataURL('image/png');
    }
    if (slot === 'hero') {
      drawCat(g, size * 0.5, size * 0.54, size * 0.83, {
        facing: 1, walk: 1.2, move: 0.3, time: 1.3, blink: false
      });
    } else if (slot === 'enemy') {
      drawRobot(g, size * 0.5, size * 0.52, size * 0.82, {
        time: 2.1, mode: 'chase', vx: 50, vy: 0, flash: 0
      });
    } else if (slot === 'pickup') {
      drawFish(g, size * 0.5, size * 0.5, size * 0.9, { time: 2.4, wobble: 0.8 });
    }
    return c.toDataURL('image/png');
  }
  window.__renderSlots = function (size) {
    var s = Math.max(96, Math.min(512, Math.round(Number(size) || 256)));
    var out = {};
    var slots = ['hero', 'enemy', 'pickup', 'background'];
    for (var i = 0; i < slots.length; i++) {
      var key = slots[i];
      if (!slotIsCustom(key)) {
        try { out[key] = slotThumbnail(s, key); } catch (e) { /* skip */ }
      }
    }
    return out;
  };
  var rendersPosted = false;
  function publishRenders() {
    if (rendersPosted) return;
    rendersPosted = true;
    try {
      var renders = window.__renderSlots(256);
      post({ type: 'renders', renders: renders });
    } catch (e) { /* sidebar can fall back to bundled art */ }
  }

  // Boot.
  loadCustomArt();
  resize();
  setupScene();
  phase = 'title';
  window.addEventListener('resize', resize);
  requestAnimationFrame(frame);
  if (document.readyState === 'complete') {
    setTimeout(publishRenders, 160);
  } else {
    window.addEventListener('load', function () { setTimeout(publishRenders, 160); });
  }
})();
</script>
